<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AI Senior Engineer</title>
<style>
:root{--paper:#f5f4ef;--white:#fff;--ink:#23272b;--muted:#6b6b63;--line:#dbd6c9;--navy:#1d3557;--navysoft:#2a466e;--green:#3a6b4c;--greenbg:#e7efe8;--amber:#a8791f;--amberbg:#f5eedc;--red:#a8412f;--redbg:#f5e4df;--bluebg:#eef1f5}
*{box-sizing:border-box}
html,body{margin:0;background:#e4e0d4;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1000px;min-height:100vh;margin:auto;background:var(--paper)}
.top{background:#fbfaf7;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:10}
.top .brand{font-weight:800;font-size:14px}
.top .brand small{display:block;color:var(--muted);font-size:9.5px;font-weight:600;letter-spacing:.04em;margin-top:1px}
.top button{border:1px solid var(--line);background:#fff;padding:8px 12px;font-weight:700;color:var(--navy);border-radius:6px;font-size:12.5px}
main{padding:20px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.panel h2{font-size:16px;margin:0 0 6px}
.muted{color:var(--muted);font-size:12.5px;line-height:1.5}
.label{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.primary{background:var(--navy);color:#fff;border:0;padding:12px 16px;font-weight:700;border-radius:7px;font-size:13.5px}
.primary:disabled{background:#c9c4b6;cursor:not-allowed}
.secondary{background:#fff;color:var(--navy);border:1px solid var(--line);padding:10px 14px;font-weight:700;border-radius:7px;font-size:13px}
.ghost{background:none;border:0;color:var(--muted);font-weight:700;padding:4px 0;font-size:13px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.hero{background:var(--navy);color:#f5f4ef;padding:26px 20px;border-radius:14px;margin-bottom:16px}
.hero .label{color:#9fb3cc}
.hero h1{margin:8px 0 6px;font-size:21px}
.hero p{margin:0;color:#c3cedd;font-size:13px;line-height:1.55}
.dashbtn{width:100%;display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);background:#fff;border-radius:10px;text-align:left;margin-bottom:8px}
.dashbtn .ic{width:36px;height:36px;border-radius:8px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.dashbtn b{display:block;font-size:13.5px}
.dashbtn span{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.type{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 8px;font-weight:600;font-size:12.5px}
.type.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
.field{margin-top:12px}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);background:#fff;border-radius:7px;outline:none;font-size:14px}
.field textarea{min-height:70px;resize:vertical}
.tabs{display:flex;overflow-x:auto;border-top:1px solid var(--line)}
.tabs button{flex-shrink:0;padding:10px 13px;border-bottom:2px solid transparent;color:var(--muted);font-weight:700;font-size:11.5px;background:none;border-left:0;border-right:0;border-top:0}
.tabs button.on{border-bottom:2px solid var(--navy);color:var(--navy)}
.status{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;font-size:10px;font-weight:800;border-radius:5px;white-space:nowrap}
.status .dot{width:6px;height:6px;border-radius:50%}
.s-green{color:var(--green);background:var(--greenbg)}.s-green .dot{background:var(--green)}
.s-amber{color:var(--amber);background:var(--amberbg)}.s-amber .dot{background:var(--amber)}
.s-red{color:var(--red);background:var(--redbg)}.s-red .dot{background:var(--red)}
.readiness{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;font-size:10.5px;font-weight:800;border-radius:6px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric-card{padding:11px;border:1px solid var(--line);background:#fff;border-radius:8px;text-align:left}
.metric-card .n{font-size:19px;font-weight:800;font-family:ui-monospace,Menlo,monospace}
.metric-card .n small{font-size:11px;font-weight:600;color:var(--muted)}
.fact{border:1px solid var(--line);background:#fff;border-radius:9px;margin-bottom:7px;overflow:hidden}
.fact-head{width:100%;display:flex;align-items:center;justify-content:space-between;padding:11px 13px;background:none;border:0;text-align:left}
.fact-head b{font-size:13px;display:block}
.fact-head span{font-size:11px;color:var(--muted);display:block;margin-top:1px}
.fact-body{padding:0 13px 13px;border-top:1px solid var(--line)}
.why{display:flex;gap:8px;padding:10px 11px;margin-top:10px;background:#efede4;border-left:2px solid var(--navysoft);border-radius:3px}
.why b{color:var(--navysoft);font-size:13px}
.why p{margin:0;font-size:11.5px;color:#454540;line-height:1.5}
.rec{padding:8px 10px;background:var(--paper);border-radius:6px;font-size:11.5px;margin-top:6px}
.rec b{font-weight:600}
.rec .meta{color:var(--muted);margin-top:2px}
.rec .cm{color:var(--muted);margin-top:2px;font-style:italic}
.notice{padding:13px;border-left:3px solid var(--navy);background:var(--bluebg);margin-bottom:14px;border-radius:4px;font-size:12.5px;line-height:1.5}
.warning{padding:13px;border-left:3px solid var(--amber);background:var(--amberbg);margin-bottom:14px;border-radius:4px;font-size:12.5px;line-height:1.5}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border:1px solid var(--line);background:#fff;padding:12px 13px;border-radius:8px;margin-top:8px}
.row b{font-size:13px;display:block}
.row p{margin:3px 0 0;color:var(--muted);font-size:11.5px;line-height:1.4}
.row>div:first-child{flex:1;min-width:0}
.drop{border:1.5px dashed #9ba7b8;background:#fafbfc;border-radius:10px;padding:18px;text-align:center;margin-top:10px}
.drop input{display:none}
.drop label{display:inline-block;background:var(--navy);color:#fff;padding:9px 14px;border-radius:6px;font-weight:700;font-size:13px}
.filerow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);padding:10px 11px;border-radius:8px;margin-top:7px}
.filerow .ext{font-size:9.5px;font-weight:800;color:var(--navy);background:var(--bluebg);padding:4px 6px;border-radius:5px;flex-shrink:0}
.filerow b{font-size:12.5px;display:block}
.filerow small{display:block;color:var(--muted);margin-top:1px;font-size:11px}
.filerow button{margin-left:auto;background:var(--redbg);color:var(--red);border:0;width:22px;height:22px;border-radius:5px;font-weight:800;flex-shrink:0}
.step{border:1px solid var(--line);background:#fff;border-radius:9px;padding:13px 15px;margin-bottom:9px}
.step.primary-step{border-color:var(--navy);background:var(--bluebg)}
.step .tag{font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--muted);margin-bottom:5px}
.step.primary-step .tag{color:var(--navy)}
.step .title{font-size:13.5px;font-weight:700;margin-bottom:4px}
.step .why-h{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.05em;margin-top:8px;margin-bottom:3px}
.step .why-h.action-h{color:var(--navysoft)}
.step .reason{font-size:12px;color:#3a4555;margin-top:2px}
.step ol{padding-left:16px;margin:0}
.step ol li{font-size:12.5px;color:var(--ink);margin-top:3px;line-height:1.4}
.group{margin-top:16px}
.group-h{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.group-h .dot{width:7px;height:7px;border-radius:50%}
.group-h span{font-size:11px;font-weight:700;letter-spacing:.04em}
.group-item{font-size:12.5px;padding-left:14px;margin-top:3px}
.checklist-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;margin-top:7px;width:100%;text-align:left}
.checklist-item .box{width:17px;height:17px;border:1.5px solid var(--line);border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px}
.checklist-item.done .box{background:var(--green);border-color:var(--green)}
.checklist-item span.lbl{font-size:13px}
.checklist-item .auto{margin-left:auto;font-size:9px;color:var(--navysoft);font-weight:700;letter-spacing:.04em}
.footer{padding:18px 20px;color:var(--muted);font-size:10.5px;text-align:center}
@media(max-width:640px){.types{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* =========================================================
   ΓΝΩΣΤΙΚΟ ΜΟΝΤΕΛΟ
========================================================= */
const SOURCE_STATUS = {
  "Δήλωση ιδιοκτήτη":"declared", "Δήλωση χρήστη":"declared",
  "Οικοδομική άδεια":"confirmed", "Αρχιτεκτονικά σχέδια":"confirmed",
  "Τοπογραφικό":"confirmed", "Τίτλοι":"confirmed", "Τακτοποιήσεις":"confirmed",
  "Μελέτη":"confirmed", "Αυτοψία":"confirmed",
  "Φωτογραφία":"needs_check", "Εκτίμηση AI":"needs_check"
};
const SOURCES = Object.keys(SOURCE_STATUS);
const DOC_TYPES = ["Οικοδομική άδεια","Αρχιτεκτονικά σχέδια","Τοπογραφικό","Τίτλοι","Τακτοποιήσεις","Μελέτες","Λοιπά"];
const REQUIRED_DOCS = {
  "ΠΕΑ": ["Οικοδομική άδεια","Αρχιτεκτονικά σχέδια","Τοπογραφικό"],
  "Τοπογραφικό": ["Τίτλοι","Τοπογραφικό"]
};
const STATUS_UI = {
  confirmed:{cls:"s-green",t:"ΕΠΙΒΕΒΑΙΩΜΕΝΟ"},
  declared:{cls:"s-amber",t:"ΔΗΛΩΘΗΚΕ"},
  needs_check:{cls:"s-amber",t:"ΠΡΟΣ ΕΛΕΓΧΟ"},
  missing:{cls:"s-red",t:"ΛΕΙΠΕΙ"}
};
const READY_UI = {
  not_ready:{t:"Δεν είναι έτοιμο",cls:"s-red"},
  under_review:{t:"Υπό έλεγχο",cls:"s-amber"},
  ready:{t:"Έτοιμο για τελικό έλεγχο",cls:"s-green"}
};
const CATEGORY_LABEL = {property:"Στοιχεία ακινήτου",envelope:"Κέλυφος",mep:"Η/Μ Εγκαταστάσεις",legal:"Νομιμότητα",survey:"Επιτόπια στοιχεία",result:"Αποτέλεσμα"};
 
function today(){ return new Date().toISOString().slice(0,10); }
function fdef(id,label,category,reason){ return {id,label,category,reason,records:[]}; }
function curRec(f){ return f.records.length ? f.records[f.records.length-1] : null; }
function fStatus(f){ const r=curRec(f); if(!r) return "missing"; return SOURCE_STATUS[r.source]||"needs_check"; }
function esc(s){ return String(s||"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
function ext(n){ return (n.split(".").pop()||"").toUpperCase(); }
 
function PEA_FACTS(){ return [
  fdef("year","Έτος κατασκευής","property","Δεν χρειάζεται να το γνωρίζεις με απόλυτη βεβαιότητα τώρα. Καταγράφεται ως δήλωση και επιβεβαιώνεται αργότερα."),
  fdef("use","Χρήση κτιρίου","property","Επηρεάζει τον τύπο υπολογισμού ΠΕΑ."),
  fdef("area","Επιφάνεια (τ.μ.)","property","Απαραίτητο στοιχείο για τον ενεργειακό υπολογισμό."),
  fdef("floors","Όροφοι","property","Βοηθητικό στοιχείο φακέλου."),
  fdef("wallType","Τύπος τοιχοποιίας","envelope","Επηρεάζει άμεσα την ενεργειακή κατάταξη."),
  fdef("insulation","Μόνωση τοιχοποιίας","envelope","Σε παλαιότερα κτίρια μπορεί να διαφέρει από ό,τι υποθέτουμε. Επιβεβαιώνεται στην αυτοψία."),
  fdef("openings","Τύπος κουφωμάτων","envelope","Επηρεάζει θερμικές απώλειες."),
  fdef("glazing","Υαλοπίνακες","envelope","Συμπληρωματικό στοιχείο κελύφους."),
  fdef("heating","Σύστημα θέρμανσης","mep","Απαιτούμενο για τον ενεργειακό υπολογισμό."),
  fdef("cooling","Σύστημα ψύξης","mep","Απαιτούμενο για τον ενεργειακό υπολογισμό."),
  fdef("dhw","Ζεστό νερό χρήσης","mep","Απαιτούμενο στοιχείο ΠΕΑ."),
  fdef("permitExists","Οικοδομική άδεια — ύπαρξη","legal","Δεν χρειάζεται να το έχεις τώρα — αν δεν το γνωρίζεις, καταγράφεται προς έλεγχο."),
  fdef("plansExist","Αρχιτεκτονικά σχέδια — ύπαρξη","legal","Η ύπαρξη σχεδίων δεν σημαίνει αυτόματα πλήρη νομιμότητα."),
  fdef("deviations","Αποκλίσεις από σχέδια","legal","Απλώς καταγράφουμε τι έχει παρατηρηθεί — δεν αποφασίζουμε τώρα."),
  fdef("energyClass","Εκτιμώμενη ενεργειακή κλάση","result","Προκαταρκτική εκτίμηση — δεν αντικαθιστά τον επίσημο υπολογισμό.")
];}
function TOPO_FACTS(){ return [
  fdef("purpose","Σκοπός τοπογραφικού","property","Ο σκοπός καθορίζει ποια στοιχεία είναι πραγματικά κρίσιμα."),
  fdef("oldDiagram","Παλαιότερο τοπογραφικό διάγραμμα","legal","Αν δεν υπάρχει, δεν είναι πρόβλημα από μόνο του — απλώς αλλάζει το επόμενο βήμα."),
  fdef("titles","Τίτλοι ιδιοκτησίας","legal","Βοηθούν στον προσδιορισμό ορίων."),
  fdef("access","Πρόσβαση στο ακίνητο","property","Επηρεάζει τον προγραμματισμό."),
  fdef("boundaries","Όρια ιδιοκτησίας","survey","Επιβεβαιώνονται στην επιτόπια αποτύπωση."),
  fdef("neighboring","Όμορες ιδιοκτησίες","survey","Βοηθά στην αποφυγή διαφορών με γείτονες."),
  fdef("easements","Δουλείες / περιορισμοί","legal","Ελέγχονται στα έγγραφα."),
  fdef("fieldSurvey","Επιτόπια αποτύπωση / μετρήσεις","result","Απαιτεί επιτόπια παρουσία — το τελευταίο βήμα.")
];}
function SKELETON(labels){ return labels.map((l,i)=>fdef("s"+i,l,"property","Το περιεχόμενο αυτού του τύπου εργασίας θα αναπτυχθεί πλήρως σε επόμενη έκδοση.")); }
const FACTS_BY_TYPE = {
  "ΠΕΑ": PEA_FACTS,
  "Τοπογραφικό": TOPO_FACTS,
  "ΗΤΚ": ()=>SKELETON(["Ιδιοκτησία","Τίτλοι","Άδεια","Σχέδια","Αυθαίρετα","Επιφάνειες","Αυτοψία","Δικαιολογητικά"]),
  "Αυθαίρετο": ()=>SKELETON(["Υφιστάμενη κατάσταση","Άδεια","Αποκλίσεις","Πολεοδομικά δεδομένα","Έλεγχος","Πιθανή υπαγωγή"]),
  "Αυτοψία": ()=>SKELETON(["Σκοπός","Checklist","Φωτογραφίες","Μετρήσεις","Παρατηρήσεις","Συμπεράσματα"])
};
const FULLY_MODELED = ["ΠΕΑ","Τοπογραφικό"];
const AUTOPSY_CHECKLIST = [
  {key:"exteriorViews",label:"Εξωτερικές όψεις"},
  {key:"walls",label:"Τοιχοποιίες",links:["wallType","insulation"]},
  {key:"openings",label:"Ανοίγματα",links:["openings"]},
  {key:"humidity",label:"Υγρασίες"},
  {key:"roof",label:"Στέγη / δώμα"},
  {key:"common",label:"Κοινόχρηστοι χώροι"},
  {key:"interior",label:"Εσωτερικοί χώροι"},
  {key:"deviations",label:"Αποκλίσεις από σχέδια",links:["deviations"]}
];
 
/* =========================================================
   REASONING ENGINE
========================================================= */
function nbaPEA(facts,autopsy,documents){
  const get=id=>facts.find(f=>f.id===id);
  const st=id=>get(id)?fStatus(get(id)):"missing";
  const val=id=>{const r=get(id)&&curRec(get(id));return r?r.value:null;};
  const checklistDone=AUTOPSY_CHECKLIST.every(c=>autopsy.checklist[c.key]);
  const autopsyComplete=autopsy.started&&checklistDone&&autopsy.photos.length>=5;
  const required=REQUIRED_DOCS["ΠΕΑ"]||[];
  const receivedTypes=documents.map(d=>d.type);
  const missingDocs=required.filter(t=>!receivedTypes.includes(t));
  const steps=[];
  if(!autopsyComplete){
    const reasons=[];
    if(!autopsy.started) reasons.push("Δεν έχει επιβεβαιωθεί η πραγματική κατάσταση του ακινήτου.");
    if(autopsy.photos.length===0) reasons.push("Δεν υπάρχει φωτογραφική τεκμηρίωση.");
    if(st("insulation")!=="confirmed") reasons.push("Η ύπαρξη μόνωσης δεν έχει επιβεβαιωθεί.");
    if(st("year")==="declared") reasons.push("Υπάρχει δηλωμένο κτίριο του "+(val("year")||"—")+" (μη επιβεβαιωμένο).");
    if(autopsy.started&&!checklistDone) reasons.push("Η αυτοψία έχει ξεκινήσει αλλά δεν έχει ολοκληρωθεί το checklist.");
    steps.push({title:autopsy.started?"Ολοκλήρωσε την αυτοψία":"Πραγματοποίησε αυτοψία",
      reasons:reasons.length?reasons:["Απαιτείται για επιβεβαίωση των δηλωμένων στοιχείων."],
      actions:["Πραγματοποίησε επιτόπια επίσκεψη στο ακίνητο","Συμπλήρωσε το checklist αυτοψίας (καρτέλα Αυτοψία)","Ανέβασε τουλάχιστον 5 φωτογραφίες τεκμηρίωσης","Επιβεβαίωσε ιδιαίτερα την κατάσταση της μόνωσης"]});
  }
  if(missingDocs.length>0||st("permitExists")!=="confirmed"){
    const reasons=["Η νομιμότητα δεν έχει αξιολογηθεί πλήρως."];
    if(st("plansExist")==="declared") reasons.push("Η ύπαρξη σχεδίων έχει δηλωθεί αλλά δεν έχει τεκμηριωθεί.");
    if(missingDocs.length) reasons.push("Λείπουν: "+missingDocs.join(", ")+".");
    steps.push({title:"Συγκέντρωσε την οικοδομική άδεια και τα διαθέσιμα σχέδια",reasons,
      actions:["Ζήτησε από τον ιδιοκτήτη την οικοδομική άδεια","Ζήτησε τα διαθέσιμα αρχιτεκτονικά σχέδια","Ανέβασέ τα στην καρτέλα Έγγραφα","Αν δεν βρεθούν, προγραμμάτισε αυτοψία για τεκμηρίωση"]});
  }
  if(st("deviations")!=="confirmed"){
    steps.push({title:"Σύγκρινε υφιστάμενη κατάσταση με εγκεκριμένα σχέδια",
      reasons:["Δεν έχει ελεγχθεί αν υπάρχουν αποκλίσεις από τα εγκεκριμένα σχέδια."],
      actions:["Παράθεσε τα εγκεκριμένα σχέδια δίπλα στην πραγματική κάτοψη","Σημείωσε κάθε απόκλιση στο πεδίο «Αποκλίσεις από σχέδια»"]});
  }
  const mepMissing=["heating","cooling","dhw"].filter(id=>st(id)==="missing");
  if(mepMissing.length){
    steps.push({title:"Συμπλήρωσε στοιχεία Η/Μ εγκαταστάσεων",
      reasons:["Λείπουν: "+mepMissing.map(id=>get(id).label).join(", ")+"."],
      actions:mepMissing.map(id=>"Κατέγραψε: "+get(id).label)});
  }
  if(!steps.length) steps.push({title:"Ο φάκελος είναι έτοιμος για τελικό έλεγχο",reasons:["Όλα τα κρίσιμα στοιχεία έχουν καταγραφεί ή επιβεβαιωθεί."],actions:["Κάνε τελικό οπτικό έλεγχο του φακέλου","Προχώρησε σε παράδοση"]});
  return {steps:steps.slice(0,3),autopsyComplete,missingDocs};
}
function nbaTopo(facts,autopsy,documents){
  const get=id=>facts.find(f=>f.id===id);
  const st=id=>get(id)?fStatus(get(id)):"missing";
  const val=id=>{const r=get(id)&&curRec(get(id));return r?r.value:null;};
  const required=REQUIRED_DOCS["Τοπογραφικό"]||[];
  const receivedTypes=documents.map(d=>d.type);
  const missingDocs=required.filter(t=>!receivedTypes.includes(t));
  const steps=[];
  if(st("oldDiagram")!=="confirmed"&&st("titles")!=="confirmed"){
    const reasons=[];
    if(st("oldDiagram")==="missing") reasons.push("Δεν υπάρχει διαθέσιμο παλαιότερο τοπογραφικό αρχείο — δεν είναι πρόβλημα από μόνο του.");
    reasons.push("Ο σκοπός είναι: "+(val("purpose")||"μη καθορισμένος")+".");
    reasons.push("Πριν ξεκινήσεις νέα αποτύπωση, καλό είναι να συγκεντρωθούν τα υπάρχοντα στοιχεία.");
    steps.push({title:"Ζήτησε τίτλους ιδιοκτησίας και ό,τι παλαιό διάγραμμα διαθέτει ο πελάτης",reasons,
      actions:["Επικοινώνησε με τον πελάτη για τίτλους ιδιοκτησίας","Ρώτησε αν υπάρχει παλαιότερο τοπογραφικό ή αρχείο","Καταχώρησέ τα στην καρτέλα Knowledge μόλις τα λάβεις"]});
  } else if(st("titles")!=="confirmed"){
    steps.push({title:"Ζήτησε τους τίτλους ιδιοκτησίας πριν προχωρήσεις",
      reasons:["Οι τίτλοι βοηθούν στον προσδιορισμό ορίων.","Χωρίς τίτλους αυξάνεται ο κίνδυνος λάθους στα όρια."],
      actions:["Ζήτησε τους τίτλους από τον πελάτη","Έλεγξε τα όρια που αναφέρονται σε αυτούς"]});
  }
  if(missingDocs.length){
    steps.push({title:"Συγκέντρωσε τα απαιτούμενα έγγραφα",reasons:["Λείπουν: "+missingDocs.join(", ")+"."],actions:missingDocs.map(t=>"Ζήτησε: "+t)});
  }
  if(st("fieldSurvey")!=="confirmed"){
    steps.push({title:"Προγραμμάτισε επιτόπια αποτύπωση",
      reasons:["Υπάρχουν τα βασικά στοιχεία.","Απαιτείται επιτόπια μέτρηση για την ολοκλήρωση του τοπογραφικού."],
      actions:["Προγραμμάτισε ραντεβού για επιτόπια μέτρηση","Επιβεβαίωσε την πρόσβαση στο ακίνητο","Πάρε μαζί τον απαραίτητο εξοπλισμό μέτρησης"]});
  }
  if(!steps.length) steps.push({title:"Ο φάκελος είναι έτοιμος για τελικό έλεγχο",reasons:["Όλα τα κρίσιμα στοιχεία έχουν καταγραφεί ή επιβεβαιωθεί."],actions:["Κάνε τελικό οπτικό έλεγχο του φακέλου","Προχώρησε σε παράδοση"]});
  return {steps:steps.slice(0,3),autopsyComplete:true,missingDocs};
}
function nbaGeneric(facts){
  const missing=facts.filter(f=>fStatus(f)==="missing");
  const unconfirmed=facts.filter(f=>fStatus(f)==="declared"||fStatus(f)==="needs_check");
  const steps=[];
  if(missing.length) steps.push({title:"Συμπλήρωσε τα βασικά στοιχεία που λείπουν",reasons:["Λείπουν: "+missing.slice(0,3).map(f=>f.label).join(", ")+(missing.length>3?"…":"")+"."]});
  if(unconfirmed.length) steps.push({title:"Επιβεβαίωσε τα δηλωμένα στοιχεία",reasons:["Προς έλεγχο: "+unconfirmed.slice(0,3).map(f=>f.label).join(", ")+(unconfirmed.length>3?"…":"")+"."]});
  if(!steps.length) steps.push({title:"Ο φάκελος είναι έτοιμος για τελικό έλεγχο",reasons:["Όλα τα καταγεγραμμένα στοιχεία έχουν επιβεβαιωθεί."]});
  return {steps:steps.slice(0,3),autopsyComplete:true,missingDocs:[]};
}
function computeNextSteps(workType,facts,autopsy,documents){
  if(workType==="ΠΕΑ") return nbaPEA(facts,autopsy,documents);
  if(workType==="Τοπογραφικό") return nbaTopo(facts,autopsy,documents);
  return nbaGeneric(facts);
}
function computeReadiness(workType,facts,autopsy,documents){
  const {autopsyComplete,missingDocs}=computeNextSteps(workType,facts,autopsy,documents);
  const total=facts.length;
  const confirmed=facts.filter(f=>fStatus(f)==="confirmed").length;
  const missing=facts.filter(f=>fStatus(f)==="missing").length;
  const needsCheck=facts.filter(f=>fStatus(f)==="needs_check").length;
  const declared=facts.filter(f=>fStatus(f)==="declared").length;
  const recorded=total-missing;
  const blocked=FULLY_MODELED.includes(workType)?(!autopsyComplete||missingDocs.length>0):false;
  let level="not_ready";
  if(!blocked&&confirmed===total) level="ready";
  else if(!blocked) level="under_review";
  return {total,confirmed,missing,needsCheck,declared,recorded,level};
}

function toggleFact(id){ state.openFactId = state.openFactId===id ? null : id; if(!state.factDraft[id]) state.factDraft[id]={value:"",source:SOURCES[0],file:"",comment:""}; render(); }
function setFactDraft(id,key,v){ if(!state.factDraft[id]) state.factDraft[id]={value:"",source:SOURCES[0],file:"",comment:""}; state.factDraft[id][key]=v; }
function setFactSource(id,v){ setFactDraft(id,"source",v); render(); }
function submitFact(id){
  const d=state.factDraft[id]; if(!d||!d.value.trim()) return;
  const f=state.case.facts.find(x=>x.id===id);
  if(f.id==="year"){ const n=parseInt(d.value,10); if(isNaN(n)||n<1800||n>new Date().getFullYear()) return; }
  f.records.push({value:d.value.trim(),source:d.source,file:d.file.trim()||null,date:today(),comment:d.comment.trim()});
  state.factDraft[id]={value:"",source:SOURCES[0],file:"",comment:""};
  saveDraft(); render();
}

function addDocumentFiles(input){
  const files=Array.from(input.files||[]);
  files.forEach(f=>state.case.documents.push({type:state.docType,fileName:f.name,size:f.size,date:today()}));
  input.value=""; saveDraft(); render();
}
function removeDocument(i){ state.case.documents.splice(i,1); saveDraft(); render(); }
 
function startAutopsy(){ state.case.autopsy.started=true; saveDraft(); render(); }
function toggleChecklist(key){
  const a=state.case.autopsy;
  const nowChecked=!a.checklist[key];
  a.checklist[key]=nowChecked;
  const item=AUTOPSY_CHECKLIST.find(c=>c.key===key);
  if(nowChecked&&item.links){
    item.links.forEach(fid=>{
      const f=state.case.facts.find(x=>x.id===fid); if(!f) return;
      const cur=curRec(f);
      f.records.push({value:cur?cur.value:"Επιβεβαιώθηκε κατά αυτοψία",source:"Αυτοψία",file:null,date:today(),comment:"Αυτόματη επιβεβαίωση από checklist αυτοψίας"});
    });
  }
  saveDraft(); render();
}

function renderCase(){
  const c=state.case, wt=c.caseData.workType;
  const isFull=FULLY_MODELED.includes(wt);
  const readiness=computeReadiness(wt,c.facts,c.autopsy,c.documents);
  const nba=computeNextSteps(wt,c.facts,c.autopsy,c.documents);
  const tabs=[["overview","Overview"],["knowledge","Knowledge"],["documents","Έγγραφα"],["autopsy","Αυτοψία"],["review","Review"]];
  let body="";
  if(!isFull && state.tab!=="overview"){
    body+='<div class="warning">Ο τύπος εργασίας «'+esc(wt)+'» βρίσκεται σε σκελετική μορφή· θα αναπτυχθεί πλήρως σε επόμενη έκδοση.</div>';
  }
  if(state.tab==="overview") body+=renderOverview(c,readiness,nba);
  else if(state.tab==="knowledge") body+=renderKnowledge(c);
  else if(state.tab==="documents") body+=renderDocuments(c);
  else if(state.tab==="autopsy") body+=renderAutopsy(c);
  else if(state.tab==="review") body+=renderReview(c,readiness,nba);
 
  return '<div style="border-bottom:1px solid var(--line);background:#fbfaf7">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 20px 0"><button class="ghost" onclick="goDashboard()">← Dashboard</button>'+readinessBadge(readiness.level)+'</div>'

function renderKnowledge(c){
  const cats=[...new Set(c.facts.map(f=>f.category))];
  let html='<p class="muted" style="margin-bottom:14px">Κάθε στοιχείο κρατά πλήρες ιστορικό. Νέα καταχώρηση δεν διαγράφει την προηγούμενη.</p>';
  cats.forEach(cat=>{
    html+='<div class="label" style="color:var(--navysoft);margin:14px 0 6px">'+(CATEGORY_LABEL[cat]||cat)+'</div>';
    c.facts.filter(f=>f.category===cat).forEach(f=>{ html+=renderFactRow(f); });
  });
  return html;
}
function renderFactRow(f){
  const cur=curRec(f);
  const status=fStatus(f);
  const open=state.openFactId===f.id;
  const draft=state.factDraft[f.id]||{value:"",source:SOURCES[0],file:"",comment:""};
  const yearErr = f.id==="year" && draft.value && (isNaN(parseInt(draft.value,10))||parseInt(draft.value,10)<1800||parseInt(draft.value,10)>new Date().getFullYear());
  let html='<div class="fact"><button class="fact-head" onclick="toggleFact(\''+f.id+'\')"><span><b>'+esc(f.label)+'</b><span>'+(cur?esc(cur.value)+' · '+esc(cur.source):"Δεν έχει καταγραφεί")+'</span></span><span style="display:flex;align-items:center;gap:8px">'+statusChip(status)+'<span class="muted">'+(open?"▲":"▼")+'</span></span></button>';
  if(open){
    html+='<div class="fact-body">';
    html+='<div class="why"><b>?</b><p>'+esc(f.reason)+'</p></div>';
    if(f.records.length){
      html+=[...f.records].slice().reverse().map(r=>'<div class="rec"><b>'+esc(r.value)+'</b><div class="meta">'+esc(r.source)+(r.file?' · '+esc(r.file):'')+' · '+r.date+'</div>'+(r.comment?'<div class="cm">'+esc(r.comment)+'</div>':'')+'</div>').join('');
    }
    html+='<div class="label" style="margin-top:12px;margin-bottom:6px">Νέα καταχώρηση</div>';
    html+='<div class="field" style="margin-top:0"><input value="'+esc(draft.value)+'" oninput="setFactDraft(\''+f.id+'\',\'value\',this.value)" placeholder="Τιμή" style="border-color:'+(yearErr?'var(--red)':'var(--line)')+'"></div>';
    if(yearErr) html+='<p style="font-size:11.5px;color:var(--red);margin:-6px 0 8px">Βάλε ένα έγκυρο έτος (π.χ. 1972)</p>';
    html+='<div class="field"><select onchange="setFactSource(\''+f.id+'\',this.value)">'+SOURCES.map(s=>'<option '+(draft.source===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div>';
    html+='<div class="field"><input value="'+esc(draft.file)+'" oninput="setFactDraft(\''+f.id+'\',\'file\',this.value)" placeholder="Αρχείο (προαιρετικό, π.χ. adeia_1972.pdf)"></div>';
    html+='<div class="field"><input value="'+esc(draft.comment)+'" oninput="setFactDraft(\''+f.id+'\',\'comment\',this.value)" placeholder="Σχόλιο (προαιρετικό)"></div>';
    html+='<button class="primary" '+(!draft.value.trim()||yearErr?'disabled':'')+' onclick="submitFact(\''+f.id+'\')">✓ Καταχώρηση</button>';
    html+='</div>';
  }
  html+='</div>';
  return html;
}
 
function renderDocuments(c){
  const wt=c.caseData.workType;
  const required=REQUIRED_DOCS[wt]||[];
  const receivedTypes=c.documents.map(d=>d.type);
  let html='';
  if(required.length){
    html+='<div class="label" style="margin-bottom:6px">Απαιτούμενα για '+esc(wt)+'</div>';
    required.forEach(t=>{ const got=receivedTypes.includes(t); html+='<div class="row"><div><b>'+esc(t)+'</b></div>'+statusChip(got?"confirmed":"missing",got?"ΠΑΡΕΛΗΦΘΗ":"ΛΕΙΠΕΙ")+'</div>'; });
  }
  html+='<div class="label" style="margin:18px 0 8px">Προσθήκη εγγράφου</div>';
  html+='<div class="field" style="margin-top:0"><select onchange="setDocType(this.value)">'+DOC_TYPES.map(t=>'<option '+(state.docType===t?'selected':'')+'>'+t+'</option>').join('')+'</select></div>';
  html+='<div class="drop"><p><b>Επιλεγμένος τύπος: '+esc(state.docType)+'</b><br><span class="muted">PDF, DWG, DXF, JPG, PNG</span></p><label for="docInput">+ Προσθήκη αρχείων</label><input id="docInput" type="file" multiple accept=".pdf,.dwg,.dxf,.jpg,.jpeg,.png" onchange="addDocumentFiles(this)"></div>';
  html+='<div class="label" style="margin:18px 0 8px">Παραληφθέντα ('+c.documents.length+')</div>';
  if(!c.documents.length) html+='<p class="muted">Κανένα έγγραφο ακόμα.</p>';
  c.documents.forEach((d,i)=>{ html+='<div class="filerow"><span class="ext">'+ext(d.fileName)+'</span><div style="flex:1;min-width:0"><b>'+esc(d.fileName)+'</b><small>'+esc(d.type)+' · '+d.date+'</small></div><button onclick="removeDocument('+i+')">×</button></div>'; });
  return html;
}
 
function renderAutopsy(c){
  const a=c.autopsy;
  if(!a.started){
    return '<div class="panel" style="text-align:center"><p class="muted" style="margin-bottom:14px">Η αυτοψία δεν έχει ξεκινήσει.</p><button class="primary" onclick="startAutopsy()">▶ Έναρξη αυτοψίας</button></div>';
  }
  const doneCount=AUTOPSY_CHECKLIST.filter(x=>a.checklist[x.key]).length;
  let html='<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span class="label">Checklist</span><span style="font-family:ui-monospace,Menlo,monospace"><b>'+doneCount+'</b><span class="muted">/'+AUTOPSY_CHECKLIST.length+'</span></span></div>'
    + '<div style="height:5px;background:var(--line);border-radius:3px"><div style="height:5px;width:'+Math.round(doneCount/AUTOPSY_CHECKLIST.length*100)+'%;background:var(--navy);border-radius:3px"></div></div></div>';
  AUTOPSY_CHECKLIST.forEach(item=>{
    const checked=a.checklist[item.key];
    html+='<button class="checklist-item '+(checked?'done':'')+'" onclick="toggleChecklist(\''+item.key+'\')"><span class="box">'+(checked?'✓':'')+'</span><span class="lbl">'+item.label+'</span>'+(item.links?'<span class="auto">auto</span>':'')+'</button>';
  });
  html+='<div class="row" style="align-items:center;margin-top:14px"><div><b>📷 Φωτογραφίες</b></div></div>';
  html+='<div class="drop"><label for="photoInput">+ Προσθήκη φωτογραφιών</label><input id="photoInput" type="file" multiple accept="image/*" onchange="addAutopsyPhotos(this)"></div>';
  a.photos.forEach((p,i)=>{ html+='<div class="filerow"><span class="ext">IMG</span><div style="flex:1;min-width:0"><b>'+esc(p.name)+'</b><small>'+Math.round(p.size/1024)+' KB</small></div><button onclick="removeAutopsyPhoto('+i+')">×</button></div>'; });
  html+='<div class="field"><label>Παρατηρήσεις αυτοψίας</label><textarea oninput="setAutopsyNotes(this.value)" onblur="persistNotesBlur()">'+esc(a.notes)+'</textarea></div>';
  return html;
}
 
function renderReview(c,readiness,nba){
  const confirmed=c.facts.filter(f=>fStatus(f)==="confirmed");
  const declared=c.facts.filter(f=>fStatus(f)==="declared"||fStatus(f)==="needs_check");
  const missing=c.facts.filter(f=>fStatus(f)==="missing");
  let html='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h2 style="margin:0;font-size:16px">Senior Review</h2>'+readinessBadge(readiness.level)+'</div>';
  html+='<p class="muted" style="margin-bottom:14px">Δεν γίνεται συνολική βαθμολογία. Εμφανίζονται τα κενά και το επόμενο βήμα.</p>';
  nba.steps.forEach((s,i)=>{
    html+='<div class="step '+(i===0?'primary-step':'')+'"><div class="tag">'+(i===0?"ΕΠΟΜΕΝΟ ΚΡΙΣΙΜΟ ΒΗΜΑ":"ΜΕΤΑ ("+(i+1)+")")+'</div><div class="title">'+esc(s.title)+'</div>';
    html+='<div class="why-h">ΓΙΑΤΙ</div>'+s.reasons.map(r=>'<div class="reason">• '+esc(r)+'</div>').join('');
    if(s.actions&&s.actions.length){ html+='<div class="why-h action-h">ΣΧΕΔΙΟ ΔΡΑΣΗΣ</div><ol>'+s.actions.map(a=>'<li>'+esc(a)+'</li>').join('')+'</ol>'; }
    html+='</div>';
  });
  function group(title,tone,list){
    if(!list.length) return "";
    const dotColor = tone==="confirmed"?"var(--green)":tone==="declared"?"var(--amber)":"var(--red)";
    let g='<div class="group"><div class="group-h"><span class="dot" style="background:'+dotColor+'"></span><span style="color:'+dotColor+'">'+title+' ('+list.length+')</span></div>';
    g+=list.map(f=>{ const r=curRec(f); return '<div class="group-item">— <b>'+esc(f.label)+':</b> '+esc(r?r.value:"—")+'</div>'; }).join('');
    g+='</div>';
    return g;
  }
  html+=group("Επιβεβαιωμένα","confirmed",confirmed)+group("Δηλωμένα / προς έλεγχο","declared",declared)+group("Λείπουν","missing",missing);
  return html;
}

   RENDER ROOT
========================================================= */
function render(){
  const root=document.getElementById("root");
  let body;
  if(state.screen==="dashboard") body=renderDashboard();
  else if(state.screen==="new") body=renderNew();
  else body=renderCase();
  root.innerHTML = top() + body + '<div class="footer">AI Senior Engineer · Prototype · Δεν παράγει αυτόματα τεχνικό ή νομικό συμπέρασμα.</div>';
}
render();
</script>
