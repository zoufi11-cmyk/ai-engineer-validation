<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="theme-color" content="#0B1C2E"/>
<title>AI Senior Engineer — Case Operating System</title>
<style>
:root{
  --bg:#F3F5F8;--card:#fff;--ink:#152033;--muted:#64748B;--line:#E2E8F0;
  --navy:#0B1C2E;--blue:#2563EB;--soft:#EFF6FF;
  --ok:#059669;--okBg:#ECFDF5;--warn:#D97706;--warnBg:#FFFBEB;
  --bad:#DC2626;--badBg:#FEF2F2;--grey:#94A3B8;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;display:flex;justify-content:center}
#app{width:100%;max-width:440px;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:none;background:none}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--blue);outline-offset:0}

.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{font-weight:800;font-size:13px;color:var(--navy);line-height:1.25}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.scroll{flex:1;overflow:auto;padding:16px 16px 28px}
.foot{padding:12px 16px;border-top:1px solid var(--line);background:#fff;position:sticky;bottom:0}

.btn{width:100%;padding:14px;background:var(--navy);color:#fff;font-weight:700;border-radius:12px;font-size:15px}
.btn.ghost{background:#fff;color:var(--muted);border:1px solid var(--line)}
.btn.blue{background:var(--blue)}
.btn.ok{background:var(--ok)}
.btn.warn{background:var(--warn);color:#fff}
.btn.sm{padding:9px 12px;font-size:13px;width:auto;border-radius:10px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:11px}
.card.tap{cursor:pointer}
.card.tap:active{border-color:var(--blue)}
.h1{font-size:21px;font-weight:800;margin-bottom:4px}
.h2{font-size:16px;font-weight:800;margin-bottom:6px}
.muted{color:var(--muted);font-size:13px;line-height:1.5}
.label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}

.four{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.four .q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px}
.four .q .k{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.four .q .v{font-size:13px;font-weight:700;margin-top:4px;line-height:1.35}

.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.chip.ok{background:var(--okBg);color:var(--ok)}
.chip.warn{background:var(--warnBg);color:var(--warn)}
.chip.bad{background:var(--badBg);color:var(--bad)}
.chip.info{background:var(--soft);color:var(--blue)}
.chip.grey{background:#F1F5F9;color:var(--grey)}

.choice{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;font-weight:600;font-size:14px}
.choice.on{background:var(--navy);border-color:var(--navy);color:#fff}
.choice.inline{display:inline-block;width:auto;padding:8px 12px;margin:0 6px 6px 0;font-size:13px}

.nsa{background:var(--soft);border:1px solid #BFDBFE;border-radius:var(--r);padding:14px;margin:10px 0}
.nsa .t{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--blue);margin-bottom:5px}
.nsa .a{font-weight:800;font-size:15px;line-height:1.35}
.nsa .why{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.45}

.ai{background:#F8FAFC;border:1px solid var(--line);border-radius:var(--r);padding:13px;margin:10px 0}
.ai .t{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.ai p{font-size:13.5px;line-height:1.5;color:#334155}

.hero{background:var(--navy);color:#F8FAFC;padding:26px 18px 22px}
.hero .tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#93A4B8;font-weight:700}
.hero h1{font-size:21px;font-weight:800;margin:8px 0 6px}
.hero p{color:#A8B8CC;font-size:13.5px;line-height:1.5}

.item{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.4}
.item:last-child{border-bottom:none}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.back{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:12px;display:inline-flex}
.warnbox{background:var(--warnBg);border:1px solid #FCD34D;border-radius:var(--r);padding:13px;margin:10px 0;font-size:13.5px;line-height:1.45}
.warnbox b{color:var(--warn)}
.okbox{background:var(--okBg);border:1px solid #A7F3D0;border-radius:var(--r);padding:13px;margin:10px 0;font-size:13.5px;line-height:1.45}
.badbox{background:var(--badBg);border:1px solid #FECACA;border-radius:var(--r);padding:13px;margin:10px 0;font-size:13.5px;line-height:1.45}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;z-index:50;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.steps{display:flex;gap:4px;margin-bottom:14px}
.steps i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--navy)}
.steps i.done{background:var(--ok)}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.check input{width:18px;height:18px;margin-top:2px;flex-shrink:0}
.flow{font-size:12px;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
/* Safe storage (sandbox-friendly) */
const mem={};
const store=(function(){
  try{const k='__t';localStorage.setItem(k,'1');localStorage.removeItem(k);return localStorage;}
  catch(e){return{getItem:k=>mem[k]??null,setItem:(k,v)=>{mem[k]=String(v)},removeItem:k=>{delete mem[k]}};}
})();
const KEY='ase-cos-v1';

let S={screen:'home',cases:[],cur:null,draft:{},comm:{},assets:{},toast:null};

function uid(){return 'c_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function load(){try{const r=store.getItem(KEY);if(r){const p=JSON.parse(r);S.cases=p.cases||[]}}catch(e){}}
function save(){try{store.setItem(KEY,JSON.stringify({cases:S.cases}))}catch(e){}}
function cur(){return S.cases.find(c=>c.id===S.cur)||null}
function toast(m){S.toast=m;render();setTimeout(()=>{S.toast=null;render()},1800)}
function go(sc){S.screen=sc;render()}
function openCase(id){S.cur=id;S.screen='case';render()}

/* ========== CASE STATE MACHINE (quiet front of strong engine) ========== */
function buildHome(c){
  const st=c.statement||'';
  const assets=c.assets||{};
  const known=[],missing=[],issues=[],blocked=[];
  if(c.clientName) known.push('Πελάτης: '+c.clientName);
  if(c.phone) known.push('Τηλ.: '+c.phone);
  if(c.region) known.push('Περιοχή: '+c.region);
  if(c.workType) known.push('Εργασία: '+c.workType);
  if(c.purpose) known.push('Σκοπός: '+c.purpose);
  if(st) known.push('Ισχυρισμός πελάτη (καταγεγραμμένος)');

  function assetLine(key,label){
    if(assets[key]==='HAS') known.push(label+' — δηλωμένο διαθέσιμο');
    else if(assets[key]==='DOES_NOT_HAVE') missing.push(label);
    else missing.push(label+' (UNKNOWN)');
  }
  if(Object.keys(assets).length){
    assetLine('title','Τίτλος');
    assetLine('kaek','ΚΑΕΚ');
    assetLine('topo','Τοπογραφικό');
    assetLine('permit','Οικοδομική άδεια');
    assetLine('plans','Σχέδια');
    assetLine('e9','Ε9');
  } else if(st){
    missing.push('Τίτλος / ΚΑΕΚ / σχέδια / άδεια (δεν ρωτήθηκε ακόμη)');
  }

  if(st){
    const low=st.toLowerCase();
    if(/δασικ|forest/.test(low)) issues.push('Αναφερόμενος δασικός χαρακτηρισμός — προς διερεύνηση');
    if(/δημ[οό]σι|ελληνικ[όο]\s*δημ/.test(low)) issues.push('Αναφερόμενη εμφάνιση ως Ελληνικό Δημόσιο — προς διερεύνηση');
    if(/αυθα[ιί]ρ|χωρ[ιί]ς\s*άδεια|παράνομ/.test(low)) issues.push('Αναφερόμενη μη νομιμότητα — προς έλεγχο');
    if(/νομ[ιί]μ/.test(low)&&/πιστε[υύ]|νομ[ιί]ζω|θα\s*ε[ιί]ναι/.test(low)) issues.push('Νομιμότητα δηλωμένη από πελάτη — δεν είναι verified');
    if(/παλι[οό].*τοπογραφ|τοπογραφ.*παλι/.test(low)||assets.topo==='HAS') issues.push('Παλαιότητα τοπογραφικού / σχεδίων — προς έλεγχο καταλληλότητας');
  }
  if(c.fieldNotes){
    const fl=c.fieldNotes.toLowerCase();
    if(/διαφορ|απ[οό]κλι|δεν\s*συμφων|αλλαγ/.test(fl))
      issues.push('Αυτοψία: απόκλιση υφιστάμενης κατάστασης από σχέδια — Conflict ανοιχτό');
  }

  let stage='Νέα υπόθεση';
  let next='Επικοινώνησε με τον πελάτη';
  let nextWhy='Χρειάζονται βασικά στοιχεία και περιγραφή του τι ζητείται — όχι φόρμα 40 πεδίων.';
  let protect=null;

  if(st && !Object.keys(assets).length){
    stage='Επικοινωνία ολοκληρώθηκε';
    next='Συλλογή διαθέσιμων στοιχείων';
    nextWhy='Ο πελάτης περιέγραψε. Ρώτα τι έχει ήδη (έχει / δεν έχει / δεν γνωρίζει).';
  }
  if(Object.keys(assets).length){
    stage='Αρχικά στοιχεία καταγεγραμμένα';
    next='Παραλαβή / οργάνωση εγγράφων στον φάκελο';
    nextWhy='Documents inform. Δεν θεωρούνται ακόμη verified.';
  }
  if((c.docs||[]).length){
    stage='Έγγραφα στον φάκελο';
    next='Προετοιμασία & αυτοψία';
    nextWhy='Field confirms. Σύγκρινε υφιστάμενη κατάσταση με σχέδια όπου χρειάζεται.';
  }
  if(c.fieldDone){
    stage='Αυτοψία καταχωρήθηκε';
    next='Αξιολόγηση ευρημάτων — απόφαση μηχανικού';
    nextWhy='Evidence & observations υπάρχουν. Η κρίση είναι δική σου (Decision = Engineer).';
  }
  if(c.decision){
    stage='Απόφαση μηχανικού καταχωρήθηκε';
    next='Έλεγχος gates ολοκλήρωσης';
    nextWhy='Audit: ποιος / πότε / γιατί. Μην καλείς «ολοκληρωμένο» χωρίς πραγματικές προϋποθέσεις.';
  }
  if(c.completed){
    stage='Ολοκληρωμένη';
    next='—';
    nextWhy='Close-out με ιστορικό. Νέα εργασία στο ίδιο ακίνητο = νέα Case πάνω σε Property memory.';
  }

  /* Protect engineer: premature structural work etc. */
  if(c.workType==='Νέα οικοδομή' && !c.placementValidated && c.prematureDesign){
    protect='Πριν οριστικοποιήσεις στατικά / ξυλότυπους: η θέση του κτιρίου και οι πολεοδομικοί περιορισμοί δεν έχουν ακόμη πλήρως επικυρωθεί. Προκαταρκτικά σκίτσα OK — τελικά σχέδια όχι ακόμη.';
    blocked.push('Οριστικοποίηση στατικών πριν validation θέσης');
  }

  return{stage,known,missing,issues,blocked,next,nextWhy,protect,st};
}

function aiLine(c,h){
  if(c.completed) return 'Η υπόθεση έκλεισε με audit trail. Δεν προτείνω αλλαγές χωρίς νέο αίτημα.';
  if(h.protect) return h.protect+' Εσύ αποφασίζεις αν συνεχίζεις προκαταρκτικά ή σταματάς.';
  if(!c.statement) return 'Ξεκίνα από επικοινωνία. Κατέγραψε τι λέει ο πελάτης ως statement — όχι ως fact.';
  if(!Object.keys(c.assets||{}).length) return 'Ισχυρισμοί καταγράφηκαν. Επόμενο μικρό βήμα: τι έγγραφα έχει ήδη; UNKNOWN ≠ DOES_NOT_HAVE.';
  if(h.issues.some(i=>/απ[οό]κλι|Conflict/.test(i))) return 'Υπάρχει ασυμφωνία πηγών / πραγματικότητας. Conflict ≠ winner. Μην επιλέξεις «σωστό» m² χωρίς έλεγχο.';
  if(h.issues.length) return 'Υπάρχουν θέματα προς διερεύνηση — όχι ετυμηγορίες. Documents inform · field confirms · engineer decides.';
  return 'Προχωράς οργανωμένα. Evidence collected ≠ requirement satisfied. Ρώτα μόνο ό,τι αλλάζει το επόμενο βήμα.';
}

function stageSteps(c){
  const steps=['Νέα','Επικοινωνία','Στοιχεία','Έγγραφα','Αυτοψία','Απόφαση','Κλείσιμο'];
  let idx=0;
  if(c.statement) idx=1;
  if(Object.keys(c.assets||{}).length) idx=2;
  if((c.docs||[]).length) idx=3;
  if(c.fieldDone) idx=4;
  if(c.decision) idx=5;
  if(c.completed) idx=6;
  return{steps,idx};
}

/* ========== RENDER ========== */
function render(){
  const root=document.getElementById('app');
  let html='';
  if(S.screen==='home') html=viewHome();
  else if(S.screen==='new') html=viewNew();
  else if(S.screen==='comm') html=viewComm();
  else if(S.screen==='assets') html=viewAssets();
  else if(S.screen==='case') html=viewCase();
  else if(S.screen==='docs') html=viewDocs();
  else if(S.screen==='field') html=viewField();
  else if(S.screen==='review') html=viewReview();
  else if(S.screen==='done') html=viewDone();
  else if(S.screen==='about') html=viewAbout();
  else if(S.screen==='demo') html=viewDemo();
  root.innerHTML=html+(S.toast?`<div class="toast">${S.toast}</div>`:'');
  bind();
}

function top(title,right=''){
  return `<div class="top"><div class="brand">AI Senior Engineer<small>${title}</small></div><div>${right}</div></div>`;
}

function viewHome(){
  const list=[...S.cases].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  return `<div class="hero">
    <div class="tag">Case Operating System</div>
    <h1>Οι υποθέσεις μου</h1>
    <p>Strong engine. Quiet interface.<br>AI recommends · Engineer decides · Persistence remembers.</p>
  </div>
  <div class="scroll">
    <button data-go="new" class="card tap" style="border-color:var(--navy);width:100%;display:flex;gap:12px;align-items:center">
      <div style="width:42px;height:42px;background:var(--navy);color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800">+</div>
      <div style="text-align:left"><div style="font-weight:800">Νέα υπόθεση</div><div class="muted">Λίγα πεδία · μετά επικοινωνία</div></div>
    </button>
    <button data-go="demo" class="btn ghost" style="margin-bottom:12px">Γέμισε demo υπόθεση ΗΤΚ (Παπαδόπουλος)</button>
    <div class="sec">Αποθηκευμένες</div>
    ${list.length?list.map(c=>{
      const h=buildHome(c);
      const chip=c.completed?'ok':(h.protect||h.issues.length?'warn':'info');
      const label=c.completed?'ΟΛΟΚΛΗΡΩΜΕΝΗ':(h.protect?'ΠΡΟΣΟΧΗ':(h.issues.length?'ΕΛΕΓΧΟΣ':'ΕΝΕΡΓΗ'));
      return `<button data-open="${c.id}" class="card tap" style="width:100%;text-align:left">
        <div class="row">
          <div style="min-width:0">
            <div style="font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.clientName||'Χωρίς όνομα'}</div>
            <div class="muted">${c.workType||'—'} · ${c.region||'—'}</div>
            <div class="muted" style="margin-top:3px">${h.stage}</div>
          </div>
          <span class="chip ${chip}">${label}</span>
        </div>
        ${h.next!=='—'?`<div class="muted" style="margin-top:8px">→ ${h.next}</div>`:''}
      </button>`;
    }).join(''):`<div class="empty">Δεν υπάρχουν υποθέσεις ακόμη.</div>`}
    <button data-go="about" class="card tap" style="width:100%;margin-top:8px">
      <div style="font-weight:700;font-size:13px">Τι είναι το προϊόν;</div>
      <div class="muted">DNA · τι δεν είμαστε · North Star</div>
    </button>
  </div>`;
}

function viewNew(){
  const d=S.draft;
  const ok=d.clientName&&d.workType;
  const types=['ΗΤΚ','ΠΕΑ','ΕΕΔΜΚ','Τοπογραφικό','Νέα οικοδομή','Ιδιοκτησιακό / χωρικό','Άλλο'];
  return `${top('Νέα υπόθεση')}
  <div class="scroll">
    <button data-go="home" class="back">← Υποθέσεις</button>
    <div class="h2">Δημιουργία Case</div>
    <p class="muted" style="margin-bottom:12px">Case-first. Όχι giant form. Progressive disclosure.</p>
    <div class="label">Πελάτης *</div>
    <input id="fName" value="${d.clientName||''}" placeholder="Ονοματεπώνυμο"/>
    <div style="height:8px"></div>
    <div class="label">Τηλέφωνο</div>
    <input id="fPhone" value="${d.phone||''}" placeholder="Προαιρετικό"/>
    <div style="height:8px"></div>
    <div class="label">Περιοχή</div>
    <input id="fRegion" value="${d.region||''}" placeholder="π.χ. Αχαρνές"/>
    <div style="height:10px"></div>
    <div class="label">Είδος εργασίας *</div>
    ${types.map(t=>`<button data-type="${t}" class="choice ${d.workType===t?'on':''}">${t}</button>`).join('')}
    <div class="ai"><div class="t">AI Senior · recommendation</div>
    <p>Μετά τη δημιουργία: επικοινωνία με πελάτη. Δεν ζητάμε ΚΑΕΚ / άδεια πριν καταλάβουμε την υπόθεση.</p></div>
  </div>
  <div class="foot"><button data-create class="btn" ${ok?'':'disabled'}>Αποθήκευση & συνέχεια →</button></div>`;
}

function viewComm(){
  const c=cur();if(!c) return viewHome();
  const text=S.comm.text!=null?S.comm.text:(c.statement||'');
  return `${top('Επικοινωνία')}
  <div class="scroll">
    <button data-open="${c.id}" class="back">← Υπόθεση</button>
    <div class="h2">Τι είπε ο πελάτης;</div>
    <p class="muted" style="margin-bottom:10px"><b>client_statement ≠ fact.</b> «Φαίνεται δασικό» δεν γίνεται «είναι δασικό».</p>
    <textarea id="commText" rows="5" placeholder="π.χ. Μονοκατοικία του ’85. Έχω συμβόλαιο και παλιά σχέδια. Νομίζω ότι είναι νόμιμο. Η συμβολαιογράφος θέλει ΗΤΚ.">${text}</textarea>
    <div class="label" style="margin-top:12px">Σκοπός (προαιρετικά)</div>
    <input id="fPurpose" value="${c.purpose||S.comm.purpose||''}" placeholder="π.χ. Μεταβίβαση, Exoikonomo, πώληση…"/>
    <div class="ai" style="margin-top:12px"><div class="t">Αποθήκευση</div>
    <p>client_statement · known · missing · potential_issue · next_action<br>
    <b>engineer_decision = null</b> μέχρι πραγματική απόφαση.</p></div>
  </div>
  <div class="foot"><button data-save-comm class="btn" ${String(text).trim()?'':'disabled'}>Αποθήκευση επικοινωνίας →</button></div>`;
}

function viewAssets(){
  const c=cur();if(!c) return viewHome();
  const a=S.assets;
  const keys=[
    ['title','Τίτλος / συμβόλαιο'],
    ['kaek','ΚΑΕΚ'],
    ['topo','Τοπογραφικό'],
    ['permit','Οικοδομική άδεια'],
    ['plans','Αρχιτεκτονικά σχέδια'],
    ['e9','Ε9']
  ];
  const filled=keys.every(([k])=>a[k]);
  return `${top('Διαθέσιμα στοιχεία')}
  <div class="scroll">
    <button data-open="${c.id}" class="back">← Υπόθεση</button>
    <div class="h2">Τι έχει ήδη ο πελάτης;</div>
    <p class="muted" style="margin-bottom:12px">HAS / DOES_NOT_HAVE / UNKNOWN. UNKNOWN ≠ «δεν υπάρχει».</p>
    ${keys.map(([k,lab])=>`
      <div class="card">
        <div style="font-weight:700;margin-bottom:8px">${lab}</div>
        <button data-asset="${k}" data-val="HAS" class="choice inline ${a[k]==='HAS'?'on':''}">Έχει</button>
        <button data-asset="${k}" data-val="DOES_NOT_HAVE" class="choice inline ${a[k]==='DOES_NOT_HAVE'?'on':''}">Δεν έχει</button>
        <button data-asset="${k}" data-val="UNKNOWN" class="choice inline ${a[k]==='UNKNOWN'?'on':''}">Δεν γνωρίζει</button>
      </div>`).join('')}
  </div>
  <div class="foot"><button data-save-assets class="btn" ${filled?'':'disabled'}>Αποθήκευση →</button></div>`;
}

function viewCase(){
  const c=cur();if(!c) return viewHome();
  const h=buildHome(c);
  const {steps,idx}=stageSteps(c);
  return `${top(c.clientName||'Υπόθεση', c.completed?`<span class="chip ok">DONE</span>`:`<span class="chip info">ACTIVE</span>`)}
  <div class="scroll">
    <button data-go="home" class="back">← Υποθέσεις</button>
    <div class="steps">${steps.map((_,i)=>`<i class="${i<idx?'done':(i===idx?'on':'')}"></i>`).join('')}</div>
    <div class="card">
      <div class="label">Case</div>
      <div style="font-weight:800">${c.workType||'—'}${c.purpose?' · '+c.purpose:''}</div>
      <div class="muted" style="margin-top:4px">${c.region||'—'}${c.phone?' · '+c.phone:''}</div>
    </div>

    <div class="four">
      <div class="q"><div class="k">Πού βρίσκομαι</div><div class="v">${h.stage}</div></div>
      <div class="q"><div class="k">Τι κάνω τώρα</div><div class="v">${h.next}</div></div>
      <div class="q"><div class="k">Τι έχω</div><div class="v">${h.known.length?h.known.length+' στοιχεία':'Λίγα'}</div></div>
      <div class="q"><div class="k">Τι λείπει</div><div class="v">${h.missing.length?h.missing.length+' ανοιχτά':'—'}</div></div>
    </div>

    ${h.protect?`<div class="warnbox"><b>⚠ Προστασία μηχανικού</b><br>${h.protect}</div>`:''}

    ${h.next!=='—'?`<div class="nsa">
      <div class="t">Next Safe Action</div>
      <div class="a">${h.next}</div>
      <div class="why">${h.nextWhy}</div>
    </div>`:''}

    <div class="ai"><div class="t">AI Senior · recommendation only</div><p>${aiLine(c,h)}</p></div>

    ${h.st?`<div class="card"><div class="label">Client statement (όχι fact)</div>
      <div style="font-size:14px;line-height:1.45">«${h.st}»</div></div>`:''}

    ${h.known.length?`<div class="card"><div class="label">Τι έχω</div>${h.known.map(x=>`<div class="item">🟢 ${x}</div>`).join('')}</div>`:''}
    ${h.missing.length?`<div class="card"><div class="label">Τι λείπει</div>${h.missing.map(x=>`<div class="item">⚪ ${x}</div>`).join('')}</div>`:''}
    ${h.issues.length?`<div class="card" style="background:var(--warnBg);border-color:#FCD34D"><div class="label">Προς διερεύνηση ≠ verdict</div>${h.issues.map(x=>`<div class="item">🟡 ${x}</div>`).join('')}</div>`:''}
    ${h.blocked.length?`<div class="card" style="background:var(--badBg)"><div class="label">Blocked (dependency)</div>${h.blocked.map(x=>`<div class="item">🔴 ${x}</div>`).join('')}</div>`:''}

    <div class="sec">Ενέργειες</div>
    ${!c.statement?`<button data-go="comm" class="btn" style="margin-bottom:8px">Επικοινωνία με πελάτη</button>`:''}
    ${c.statement&&!Object.keys(c.assets||{}).length?`<button data-go="assets" class="btn" style="margin-bottom:8px">Συλλογή διαθέσιμων στοιχείων</button>`:''}
    <button data-go="docs" class="btn ghost" style="margin-bottom:8px">Έγγραφα / φάκελος</button>
    <button data-go="field" class="btn ghost" style="margin-bottom:8px">Αυτοψία / Field</button>
    <button data-go="review" class="btn ghost" style="margin-bottom:8px">Finding · Decision · Gate</button>
    ${c.workType==='Νέα οικοδομή'&&!c.completed?`<button data-premature class="btn ghost" style="margin-bottom:8px">⚠ Προσομοίωση: «άρχισα ξυλότυπους»</button>`:''}
    ${!c.completed?`<button data-go="done" class="btn ghost">Ολοκλήρωση / Close-out</button>`:''}
  </div>`;
}

function viewDocs(){
  const c=cur();if(!c) return viewHome();
  const docs=c.docs||[];
  return `${top('Έγγραφα')}
  <div class="scroll">
    <button data-open="${c.id}" class="back">← Υπόθεση</button>
    <div class="h2">Τεχνικός φάκελος</div>
    <p class="muted" style="margin-bottom:10px">Document exists ≠ document applicable / correct. Upload ≠ verified.</p>
    <div class="card" style="border-style:dashed;text-align:center">
      <input type="file" id="fileIn" multiple accept=".pdf,.jpg,.jpeg,.png,.dwg,.dxf"/>
      <div class="muted" style="margin-top:6px">PDF · εικόνες · CAD</div>
    </div>
    ${docs.length?docs.map((d,i)=>`<div class="card row">
      <div style="min-width:0"><div style="font-weight:700">${d.name}</div>
      <div class="muted">${d.kb} KB · ${d.kind} · προς έλεγχο</div></div>
      <button data-rm="${i}" style="color:var(--muted);font-size:18px">×</button>
    </div>`).join(''):`<div class="card muted">Κενός φάκελος.</div>`}
    <div class="ai"><div class="t">Background completion model</div>
    <p>Η επίσημη διαδικασία (π.χ. πλατφόρμα ΗΤΚ) μένει στο παρασκήνιο. Εσύ βλέπεις guidance → work → evidence → validation — όχι ερωτηματολόγιο φόρμας.</p></div>
  </div>
  <div class="foot"><button data-open="${c.id}" class="btn ghost">Πίσω</button></div>`;
}

function viewField(){
  const c=cur();if(!c) return viewHome();
  const notes=c.fieldNotes||'';
  const checks=c.fieldChecks||{};
  const items=[
    'Ταυτοποίηση κτιρίου / θέση',
    'Εξωτερική κατάσταση',
    'Χρήσεις χώρων',
    'Σύγκριση με διαθέσιμα σχέδια',
    'Κρίσιμες μετρήσεις',
    'Αποκλίσεις / παρατηρήσεις',
    'Φωτογραφική τεκμηρίωση'
  ];
  return `${top('Αυτοψία')}
  <div class="scroll">
    <button data-open="${c.id}" class="back">← Υπόθεση</button>
    <div class="h2">Field Workspace</div>
    <p class="muted" style="margin-bottom:10px">Photo ≠ completed inspection. Evidence collected ≠ requirement satisfied.</p>
    <div class="card">
      ${items.map((it,i)=>`
        <label class="check"><input type="checkbox" data-chk="${i}" ${checks[i]?'checked':''}/> <span>${it}</span></label>
      `).join('')}
    </div>
    <div class="label">Παρατηρήσεις / υφιστάμενη κατάσταση</div>
    <textarea id="fieldNotes" rows="4" placeholder="π.χ. Η κάτοψη δείχνει αποθήκη· στην πράξη χρησιμοποιείται ως δωμάτιο. Άνοιγμα ανατολικής όψης διαφορετικό.">${notes}</textarea>
    <div class="label" style="margin-top:10px">Φωτογραφίες</div>
    <input type="file" id="photoIn" accept="image/*" multiple/>
    <div class="muted" style="margin-top:4px">${(c.photos||[]).length} στον φάκελο</div>
    <div class="ai" style="margin-top:10px"><div class="t">AI Senior</div>
    <p>Κατέγραψε αποκλίσεις ως observations. Μην τις βαφτίσεις «αυθαίρετο» πριν την απόφασή σου.</p></div>
  </div>
  <div class="foot"><button data-save-field class="btn">Αποθήκευση αυτοψίας →</button></div>`;
}

function viewReview(){
  const c=cur();if(!c) return viewHome();
  const h=buildHome(c);
  return `${top('Finding · Decision')}
  <div class="scroll">
    <button data-open="${c.id}" class="back">← Υπόθεση</button>
    <div class="h2">Έλεγχος μηχανικού</div>
    <p class="muted" style="margin-bottom:10px">Evidence → Finding → <b>Engineer Decision</b>. Conflict ≠ winner.</p>

    ${h.issues.length?`<div class="card" style="background:var(--warnBg);border-color:#FCD34D">
      <div class="label">Conflicts / issues</div>
      ${h.issues.map(x=>`<div class="item">🟡 ${x}</div>`).join('')}
    </div>`:`<div class="card muted">Δεν έχουν επισημανθεί ανοιχτά issues ακόμη.</div>`}

    <div class="card">
      <div class="label">Finding (τεχνική διαπίστωση ≠ legal verdict)</div>
      <textarea id="findingText" rows="3" placeholder="π.χ. Διαπιστώθηκε διαφοροποίηση χρήσης πίσω χώρου σε σχέση με διαθέσιμη κάτοψη.">${c.finding||''}</textarea>
    </div>

    <div class="label">Απόφαση μηχανικού (υποχρεωτική αιτιολογία)</div>
    <textarea id="decText" rows="4" placeholder="Τι αποφασίζεις, με βάση ποια στοιχεία, τι επηρεάζει downstream…">${c.decision||''}</textarea>

    <div class="ai" style="margin-top:10px"><div class="t">AI recommends · you decide</div>
    <p>${aiLine(c,h)}</p></div>
  </div>
  <div class="foot"><button data-save-dec class="btn">Καταχώριση απόφασης →</button></div>`;
}

function viewDone(){
  const c=cur();if(!c) return viewHome();
  const can=!!c.decision;
  return `${top('Close-out')}
  <div class="scroll">
    <button data-open="${c.id}" class="back">← Υπόθεση</button>
    <div class="h2">Ολοκλήρωση</div>
    <p class="muted" style="margin-bottom:10px">No fake completion. Gate = πραγματικές προϋποθέσεις.</p>
    <div class="card">
      <div class="item">${c.statement?'🟢':'⚪'} Client communication</div>
      <div class="item">${Object.keys(c.assets||{}).length?'🟢':'⚪'} Document availability</div>
      <div class="item">${(c.docs||[]).length?'🟢':'⚪'} Documents in folder</div>
      <div class="item">${c.fieldDone?'🟢':'⚪'} Field / αυτοψία</div>
      <div class="item">${c.finding?'🟢':'⚪'} Finding (αν υπήρχε)</div>
      <div class="item">${c.decision?'🟢':'⚪'} Engineer decision + reason</div>
    </div>
    ${!can?`<div class="badbox"><b>Gate FAIL</b><br>Χωρίς τεκμηριωμένη απόφαση μηχανικού δεν κλείνει η υπόθεση.</div>`
      :`<div class="okbox"><b>Gate PASS (demo)</b><br>Σε production: verified rules + required evidence + no blocking conflict χωρίς decision.</div>`}
    <div class="ai"><div class="t">Close-out</div>
    <p>Physical work / files ≠ complete. Final inspection, evidence, submissions, handover όπου εφαρμόζονται.</p></div>
  </div>
  <div class="foot"><button data-complete class="btn ok" ${can?'':'disabled'}>Ολοκλήρωση υπόθεσης</button></div>`;
}

function viewAbout(){
  return `${top('Προϊόν')}
  <div class="scroll">
    <button data-go="home" class="back">← Αρχική</button>
    <div class="h1">Case Operating System</div>
    <p class="muted" style="margin-bottom:12px">για πολιτικούς μηχανικούς</p>
    <div class="card">
      <div class="h2">North Star</div>
      <p style="font-size:14px;line-height:1.55">AI recommends · Engineer decides · Persistence remembers · Evidence supports · Audit proves · Interface shows the <b>next safe step</b>.</p>
    </div>
    <div class="card">
      <div class="h2">Δεν είμαστε</div>
      <div class="item">✗ Chatbot-first</div>
      <div class="item">✗ Αυτόνομος μηχανικός</div>
      <div class="item">✗ Νομική μηχανή που αποφασίζει</div>
      <div class="item">✗ Fake progress / fake completion</div>
    </div>
    <div class="card">
      <div class="h2">DNA</div>
      <div class="item">Case-first · Evidence-first · Persistence-first</div>
      <div class="item">Evidence ≠ truth · Conflict ≠ winner</div>
      <div class="item">Finding ≠ verdict · Decision = Engineer</div>
      <div class="item">Documents inform · Field confirms</div>
      <div class="item">Protect from premature work</div>
      <div class="item">Strong engine · Quiet interface</div>
    </div>
    <div class="card">
      <div class="h2">Αλυσίδα</div>
      <div class="flow">Case → Evidence → Conflict → Finding → Decision → Gate → Audit</div>
    </div>
    <div class="ai"><div class="t">Αυτό το HTML</div>
    <p>Επίδειξη φιλοσοφίας & ροής. Production: Domain → Application → PostgreSQL → API → Mobile. Hard gate: No PG PASS → No Mobile v0.1.</p></div>
  </div>`;
}

function viewDemo(){
  return `${top('Demo')}
  <div class="scroll">
    <button data-go="home" class="back">← Αρχική</button>
    <div class="h2">Demo ΗΤΚ</div>
    <p class="muted">Δημιουργεί υπόθεση Παπαδόπουλος / Αχαρνές / ΗΤΚ με έτοιμη επικοινωνία για να τρέξεις γρήγορα τη ροή.</p>
    <button data-seed class="btn" style="margin-top:12px">Δημιουργία demo υπόθεσης</button>
  </div>`;
}

/* ========== BIND ========== */
function bind(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    if(b.dataset.go==='new') S.draft={};
    if(b.dataset.go==='comm'){S.comm={text:(cur()||{}).statement||'',purpose:(cur()||{}).purpose||''};}
    if(b.dataset.go==='assets') S.assets=Object.assign({},(cur()||{}).assets||{});
    go(b.dataset.go);
  });
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openCase(b.dataset.open));
  document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{S.draft.workType=b.dataset.type;render()});

  const fName=document.getElementById('fName');
  if(fName) fName.oninput=e=>{S.draft.clientName=e.target.value;syncCreate()};
  const fPhone=document.getElementById('fPhone');
  if(fPhone) fPhone.oninput=e=>{S.draft.phone=e.target.value};
  const fRegion=document.getElementById('fRegion');
  if(fRegion) fRegion.oninput=e=>{S.draft.region=e.target.value};
  function syncCreate(){const ok=S.draft.clientName&&S.draft.workType;const btn=document.querySelector('[data-create]');if(btn)btn.disabled=!ok}

  const create=document.querySelector('[data-create]');
  if(create) create.onclick=()=>{
    if(!(S.draft.clientName&&S.draft.workType)) return;
    const id=uid(),now=Date.now();
    S.cases.push({
      id,clientName:S.draft.clientName.trim(),phone:(S.draft.phone||'').trim(),region:(S.draft.region||'').trim(),
      workType:S.draft.workType,purpose:'',statement:'',assets:{},docs:[],photos:[],
      fieldNotes:'',fieldChecks:{},fieldDone:false,finding:'',decision:'',
      completed:false,placementValidated:false,prematureDesign:false,createdAt:now,updatedAt:now
    });
    save();S.cur=id;S.draft={};S.comm={text:''};S.screen='comm';toast('Case αποθηκεύτηκε');render();
  };

  const ct=document.getElementById('commText');
  if(ct) ct.oninput=e=>{S.comm.text=e.target.value;const btn=document.querySelector('[data-save-comm]');if(btn)btn.disabled=!e.target.value.trim()};
  const fp=document.getElementById('fPurpose');
  if(fp) fp.oninput=e=>{S.comm.purpose=e.target.value};
  const sc=document.querySelector('[data-save-comm]');
  if(sc) sc.onclick=()=>{
    const c=cur();if(!c) return;
    c.statement=(S.comm.text||'').trim();
    c.purpose=(S.comm.purpose||c.purpose||'').trim();
    c.updatedAt=Date.now();save();toast('Statement καταγράφηκε (όχι fact)');openCase(c.id);
  };

  document.querySelectorAll('[data-asset]').forEach(b=>b.onclick=()=>{S.assets[b.dataset.asset]=b.dataset.val;render()});
  const sa=document.querySelector('[data-save-assets]');
  if(sa) sa.onclick=()=>{
    const c=cur();if(!c) return;c.assets=Object.assign({},S.assets);c.updatedAt=Date.now();save();toast('Availability αποθηκεύτηκε');openCase(c.id);
  };

  const fi=document.getElementById('fileIn');
  if(fi) fi.onchange=e=>{
    const c=cur();if(!c) return;
    Array.from(e.target.files||[]).forEach(f=>{
      let kind='Άλλο';
      if(/\.pdf$/i.test(f.name)) kind='PDF';
      else if(/\.(dwg|dxf)$/i.test(f.name)) kind='CAD';
      else if(/\.(jpe?g|png)$/i.test(f.name)) kind='Εικόνα';
      c.docs=c.docs||[];c.docs.push({name:f.name,kb:Math.max(1,Math.round(f.size/1024)),kind});
    });
    c.updatedAt=Date.now();save();toast('Έγγραφα στον φάκελο');render();
  };
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const c=cur();if(!c)return;c.docs.splice(+b.dataset.rm,1);c.updatedAt=Date.now();save();render()});

  document.querySelectorAll('[data-chk]').forEach(b=>b.onchange=e=>{const c=cur();if(!c)return;c.fieldChecks=c.fieldChecks||{};c.fieldChecks[b.dataset.chk]=e.target.checked});
  const fn=document.getElementById('fieldNotes');
  if(fn) fn.oninput=e=>{const c=cur();if(c)c.fieldNotes=e.target.value};
  const pi=document.getElementById('photoIn');
  if(pi) pi.onchange=e=>{const c=cur();if(!c)return;c.photos=c.photos||[];Array.from(e.target.files||[]).forEach(f=>c.photos.push({name:f.name}));c.updatedAt=Date.now();save();toast('Φωτογραφίες');render()};
  const sf=document.querySelector('[data-save-field]');
  if(sf) sf.onclick=()=>{const c=cur();if(!c)return;c.fieldDone=true;c.updatedAt=Date.now();save();toast('Αυτοψία καταχωρήθηκε');openCase(c.id)};

  const sd=document.querySelector('[data-save-dec]');
  if(sd) sd.onclick=()=>{
    const c=cur();if(!c) return;
    const t=(document.getElementById('decText')||{}).value||'';
    const f=(document.getElementById('findingText')||{}).value||'';
    if(!t.trim()){toast('Απαιτείται αιτιολογία απόφασης');return;}
    c.decision=t.trim();c.finding=(f||'').trim();c.updatedAt=Date.now();save();toast('Decision + audit (demo)');openCase(c.id);
  };

  const cp=document.querySelector('[data-complete]');
  if(cp) cp.onclick=()=>{const c=cur();if(!c||!c.decision)return;c.completed=true;c.updatedAt=Date.now();save();toast('Case closed');openCase(c.id)};

  const pr=document.querySelector('[data-premature]');
  if(pr) pr.onclick=()=>{const c=cur();if(!c)return;c.prematureDesign=true;c.updatedAt=Date.now();save();toast('Προστασία ενεργοποιήθηκε');render()};

  const seed=document.querySelector('[data-seed]');
  if(seed) seed.onclick=()=>{
    const id=uid(),now=Date.now();
    S.cases.push({
      id,clientName:'Κωνσταντίνος Παπαδόπουλος',phone:'6912345678',region:'Αχαρνές',
      workType:'ΗΤΚ',purpose:'Μεταβίβαση',
      statement:'Μονοκατοικία περίπου 1985. Έχω συμβόλαιο, παλιό τοπογραφικό και σχέδια. Νομίζω ότι είναι νόμιμο. Η συμβολαιογράφος θέλει ΗΤΚ.',
      assets:{},docs:[],photos:[],fieldNotes:'',fieldChecks:{},fieldDone:false,finding:'',decision:'',
      completed:false,placementValidated:false,prematureDesign:false,createdAt:now,updatedAt:now
    });
    save();S.cur=id;toast('Demo ΗΤΚ έτοιμο');openCase(id);
  };
}

load();
render();
})();
</script>
</body>
</html>
