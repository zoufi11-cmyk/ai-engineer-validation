<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="theme-color" content="#1D3557"/>
<title>AI Senior Engineer</title>
<style>
:root{
  --paper:#F5F4EF;--ink:#23272B;--muted:#6B6B63;--line:#DBD6C9;
  --navy:#1D3557;--soft:#2A466E;
  --ok:#3A6B4C;--okBg:#E7EFE8;--warn:#A8791F;--warnBg:#F5EEDC;
  --bad:#A8412F;--badBg:#F5E4DF;--info:#EEF1F5;
  --conflict:#4A3B6B;--conflictBg:#EDE8F5;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#e5e3db;color:var(--ink);min-height:100dvh;display:flex;justify-content:center}
#app{width:100%;max-width:430px;min-height:100dvh;background:var(--paper);box-shadow:0 0 40px rgba(0,0,0,.08);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:none;background:none}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);background:#fff;font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:#FBFAF7;position:sticky;top:0;z-index:5}
.brand{font-weight:800;color:var(--navy);font-size:14px}
.brand small{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.scroll{flex:1;overflow:auto;padding:16px 18px}
.foot{padding:14px 16px;border-top:1px solid var(--line);background:#FBFAF7}
.btn{width:100%;padding:14px;background:var(--navy);color:#fff;font-weight:700}
.btn.ghost{background:#fff;color:var(--muted);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--bad);border:1px solid var(--line)}
.card{border:1px solid var(--line);background:#fff;padding:14px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;font-size:10px;font-weight:700;white-space:nowrap}
.label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.row{display:flex;gap:8px}
.muted{color:var(--muted);font-size:13px;line-height:1.45}
.h1{font-size:20px;font-weight:800;margin:6px 0 8px}
.h2{font-size:16px;font-weight:800;margin-bottom:6px}
.nsa{border:1px solid var(--navy);background:var(--info);padding:14px;margin:12px 0}
.nsa .t{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);font-weight:700;margin-bottom:6px}
.hero{background:var(--navy);color:#F5F4EF;padding:28px 18px 22px}
.hero p{color:#C3CEDD;font-size:13.5px;margin-top:8px;line-height:1.5}
.tabs{display:flex;gap:6px;margin:10px 0 14px;flex-wrap:wrap}
.tab{padding:8px 10px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:700;color:var(--muted)}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.choice{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);background:#fff;margin-bottom:8px;font-weight:600}
.choice.on{background:var(--navy);border-color:var(--navy);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{flex:1;padding:10px;border:1px solid var(--line);background:#FBFAF7;text-align:center;font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--navy);color:#fff;padding:10px 14px;font-size:13px;z-index:50;max-width:90%}
.progress{display:flex;gap:4px;margin:10px 0 14px;font-size:10px;color:var(--muted);flex-wrap:wrap}
.progress span{padding:4px 6px;border:1px solid var(--line);background:#fff}
.progress span.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.quote{padding:12px;background:#EFEDE4;border-left:2px solid var(--soft);font-size:12.5px;color:#454540;line-height:1.5;margin:10px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
const KEY='ai-senior-sim-v2';
const TYPES=['ΠΕΑ','Νέα Άδεια','Άδεια Μικρής Κλίμακας','Τοπογραφικό','Αυθαίρετο','ΗΤΚ'];

const Q={
'ΠΕΑ':[
  {id:'year',t:'Ποιο είναι το έτος κατασκευής;',type:'text',ph:'π.χ. 1972',why:'Δήλωση — επιβεβαιώνεται με έγγραφα ή αυτοψία.'},
  {id:'plans',t:'Υπάρχουν διαθέσιμα αρχιτεκτονικά σχέδια;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Χωρίς κάτοψη αυξάνεται ο κίνδυνος απόκλισης.'},
  {id:'permit',t:'Υπάρχει οικοδομική άδεια;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Βασικό δικαιολογητικό — DECLARED ≠ VERIFIED.'},
  {id:'use',t:'Ποια είναι η δηλωμένη χρήση;',type:'choice',opts:['Κατοικία','Επαγγελματική','Μικτή','Δεν γνωρίζω'],why:'Επηρεάζει απαιτήσεις και πιθανές ασυμφωνίες.'},
  {id:'site',t:'Έχει γίνει αυτοψία;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Η πραγματική κατάσταση επιβεβαιώνεται επιτόπου.'}
],
'Νέα Άδεια':[
  {id:'stage',t:'Σε ποιο στάδιο βρίσκεται το έργο;',type:'choice',opts:['Αρχική διερεύνηση','Έλεγχος οικοπέδου','Συγκέντρωση στοιχείων','Μελέτες','Υποβολή'],why:'Το στάδιο καθορίζει τι χρειάζεται τώρα — όχι generic checklist.'},
  {id:'plot',t:'Το ακίνητο είναι οικόπεδο ή αγροτεμάχιο;',type:'choice',opts:['Οικόπεδο','Αγροτεμάχιο','Δεν γνωρίζω'],why:'Επηρεάζει πολεοδομικό καθεστώς.'},
  {id:'topo',t:'Υπάρχει διαθέσιμο τοπογραφικό;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Συχνά προαπαιτούμενο — ύπαρξη ≠ επαλήθευση.'},
  {id:'titles',t:'Υπάρχουν τίτλοι ιδιοκτησίας;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Απαραίτητοι για ταυτοποίηση ακινήτου.'},
  {id:'arch',t:'Έχει ανατεθεί αρχιτεκτονική μελέτη;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Καθορίζει συντονισμό και επόμενο deliverable.'}
],
'Άδεια Μικρής Κλίμακας':[
  {id:'work',t:'Τι είδους εργασία αφορά;',type:'choice',opts:['Αλλαγή διαρρύθμισης','Θερμομόνωση','Αλλαγή καυστήρα','Σκαλωσιές / χρωματισμοί','Άλλο'],why:'Καθορίζει εύρος και δικαιολογητικά.'},
  {id:'exist_permit',t:'Υπάρχει παλαιότερη άδεια / νομιμοποίηση;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Ελέγχεται η υφιστάμενη νομιμότητα.'},
  {id:'plans',t:'Υπάρχουν σχέδια υφιστάμενης κατάστασης;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Βοηθούν πριν την αυτοψία.'},
  {id:'site',t:'Έχει γίνει αυτοψία;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Σύγκριση σχεδίων με πραγματικότητα.'}
],
'Τοπογραφικό':[
  {id:'purpose',t:'Για ποιο σκοπό χρειάζεται;',type:'choice',opts:['Συμβόλαιο','Οικοδομική άδεια','Κτηματολόγιο','Τακτοποίηση','Άλλο'],why:'Ο σκοπός καθορίζει απαιτήσεις.'},
  {id:'old',t:'Υπάρχει παλαιότερο διάγραμμα;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Μπορεί να μειώσει λάθη στα όρια.'},
  {id:'titles',t:'Υπάρχουν τίτλοι;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Κρίσιμοι για όρια.'},
  {id:'kaek',t:'Υπάρχει ΚΑΕΚ;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Σύνδεση με Κτηματολόγιο.'}
],
'Αυθαίρετο':[
  {id:'known',t:'Έχει εντοπιστεί απόκλιση από εγκεκριμένα;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Αφετηρία ελέγχου — όχι αυτόματη τακτοποίηση.'},
  {id:'photos',t:'Υπάρχουν φωτογραφίες υφιστάμενης κατάστασης;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Evidence για σύγκριση.'},
  {id:'plans',t:'Υπάρχουν παλαιά σχέδια / άδεια;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Βάση σύγκρισης.'},
  {id:'year',t:'Γνωστό έτος / περίοδος κατασκευής απόκλισης;',type:'text',ph:'π.χ. 1995 ή άγνωστο',why:'Επηρεάζει νομικό πλαίσιο — προς επαλήθευση.'}
],
'ΗΤΚ':[
  {id:'permit',t:'Υπάρχει οικοδομική άδεια στο φάκελο;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Κρίσιμο στοιχείο ΗΤΚ.'},
  {id:'plans',t:'Υπάρχουν σχέδια;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Αντιστοίχιση με υφιστάμενη κατάσταση.'},
  {id:'topo',t:'Υπάρχει τοπογραφικό;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Συχνά απαιτούμενο.'},
  {id:'site',t:'Έχει γίνει αυτοψία / αποτύπωση;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Επιβεβαίωση πραγματικότητας.'}
],
'default':[
  {id:'goal',t:'Τι θέλεις να πετύχεις;',type:'text',ph:'Σύντομη περιγραφή',why:'Ορίζει τον στόχο της υπόθεσης.'},
  {id:'docs',t:'Υπάρχουν διαθέσιμα έγγραφα;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Ο φάκελος ξεκινά από ό,τι υπάρχει.'},
  {id:'site',t:'Χρειάζεται αυτοψία;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Επιβεβαίωση πραγματικής κατάστασης.'}
]
};

const DEMOS=[
  {
    id:'demo_pea',
    customer:'Δημήτρης Παπαδόπουλος',
    phone:'69xxxxxxxx',
    address:'Αιγάλεω',
    workType:'ΠΕΑ',
    answers:{year:'1972',plans:'Όχι',permit:'Δεν γνωρίζω',use:'Κατοικία',site:'Όχι'},
    docs:[{name:'foto_facade.jpg',kb:420,kind:'Εικόνα'}]
  },
  {
    id:'demo_permit',
    customer:'Μαρία Κωνσταντίνου',
    phone:'',
    address:'Μαλεσίνα',
    workType:'Νέα Άδεια',
    answers:{stage:'Έλεγχος οικοπέδου',plot:'Οικόπεδο',topo:'Ναι',titles:'Δεν γνωρίζω',arch:'Όχι'},
    docs:[{name:'topo_2008.pdf',kb:1200,kind:'PDF'}]
  }
];

let state={
  screen:'home',
  cases:[],
  currentId:null,
  draft:{},
  qIndex:0,
  tab:'overview',
  toast:null
};

function uid(){return 'EEDEMK-'+new Date().getFullYear()+'-'+Math.random().toString(36).slice(2,6).toUpperCase()}
function load(){try{const r=localStorage.getItem(KEY); if(r) state.cases=JSON.parse(r)||[]}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state.cases))}catch(e){}}
function cur(){return state.cases.find(c=>c.id===state.currentId)||null}
function qs(type){return Q[type]||Q.default}

/** Evidence status from answer */
function fromAnswer(v){
  if(v==='Ναι') return 'declared';
  if(v==='Όχι') return 'missing';
  if(v==='Δεν γνωρίζω') return 'needs_check';
  if(v && String(v).trim()) return 'declared';
  return 'missing';
}

function chip(s){
  const m={
    verified:{c:'var(--ok)',bg:'var(--okBg)',t:'ΕΠΑΛΗΘΕΥΜΕΝΟ'},
    declared:{c:'var(--warn)',bg:'var(--warnBg)',t:'ΔΗΛΩΘΗΚΕ'},
    needs_check:{c:'var(--warn)',bg:'var(--warnBg)',t:'ΠΡΟΣ ΕΛΕΓΧΟ'},
    missing:{c:'var(--bad)',bg:'var(--badBg)',t:'ΛΕΙΠΕΙ'},
    conflict:{c:'var(--conflict)',bg:'var(--conflictBg)',t:'ΑΣΥΜΦΩΝΙΑ'},
    not_done:{c:'var(--bad)',bg:'var(--badBg)',t:'ΔΕΝ ΕΧΕΙ ΓΙΝΕΙ'},
    outdated:{c:'var(--warn)',bg:'var(--warnBg)',t:'ΠΑΡΩΧΗΜΕΝΟ'},
    active:{c:'var(--navy)',bg:'var(--info)',t:'ΕΝΕΡΓΗ'},
    hold:{c:'var(--warn)',bg:'var(--warnBg)',t:'HOLD'},
    proceed:{c:'var(--ok)',bg:'var(--okBg)',t:'PROCEED'}
  };
  const x=m[s]||m.needs_check;
  return `<span class="chip" style="background:${x.bg};color:${x.c}"><span style="width:6px;height:6px;background:${x.c};display:inline-block"></span>${x.t}</span>`;
}

function toast(msg){state.toast=msg; render(); setTimeout(()=>{state.toast=null; render()},1600)}

/**
 * Core reasoning: evidence table + critical gaps + decision + next safe action
 * Philosophy: DECLARED ≠ VERIFIED · missing can continue if not blocking · conflicts escalate
 */
function compute(c){
  const a=c.answers||{};
  const docs=c.docs||[];
  const type=c.workType;
  const evidence=[];
  const gaps=[];
  const conflicts=[];
  const candidates=[];

  evidence.push({name:'Πελάτης', value:c.customer||'—', status:'declared', critical:false});
  evidence.push({name:'Διεύθυνση', value:c.address||'—', status:'declared', critical:false});
  evidence.push({name:'Διαδικασία', value:type||'—', status:'declared', critical:false});

  // Document boosts: if relevant file uploaded, mark related item needs_check (not verified — human must confirm)
  const hasPdf=docs.some(d=>d.kind==='PDF');
  const hasCad=docs.some(d=>d.kind==='CAD');
  const hasImg=docs.some(d=>d.kind==='Εικόνα');

  if(type==='Νέα Άδεια'){
    const topo=fromAnswer(a.topo);
    const titles=fromAnswer(a.titles);
    const arch=fromAnswer(a.arch);
    evidence.push({name:'Στάδιο έργου', value:a.stage||'—', status:a.stage?'declared':'missing', critical:true});
    evidence.push({name:'Είδος ακινήτου', value:a.plot||'—', status:a.plot?fromAnswer(a.plot==='Δεν γνωρίζω'?'Δεν γνωρίζω':'Ναι'):'missing', critical:false});
    evidence.push({name:'Τοπογραφικό', value:a.topo||'—', status: topo==='declared' && hasPdf ? 'needs_check' : topo, critical:true, note: topo==='declared' && hasPdf ? 'Αρχείο στον φάκελο — δεν έχει επαληθευτεί' : ''});
    evidence.push({name:'Τίτλοι', value:a.titles||'—', status:titles, critical:true});
    evidence.push({name:'Αρχιτεκτονική μελέτη', value:a.arch||'—', status:arch, critical:false});

    if(!a.stage){ gaps.push({name:'Στάδιο έργου', level:'critical'}); candidates.push({p:1,title:'Όρισε το στάδιο του έργου', why:'Χωρίς στάδιο δεν προτεραιοποιούνται σωστά τα βήματα.', decision:'REQUIRES_VERIFICATION'}); }
    if(topo==='missing'){ gaps.push({name:'Τοπογραφικό', level:'critical'}); candidates.push({p:1,title:'Εξασφάλισε κατάλληλο τοπογραφικό', why:'Συχνά προαπαιτείται πριν μελέτες/υποβολή. Ύπαρξη ≠ επαλήθευση.', decision:'REQUIRES_VERIFICATION'}); }
    if(topo==='declared' || (topo==='needs_check')){ candidates.push({p:2,title:'Επαλήθευσε το τοπογραφικό πριν το χρησιμοποιήσεις ως βάση', why:'Υπάρχει δήλωση/αρχείο — δεν θεωρείται VERIFIED χωρίς έλεγχο μηχανικού.', decision:'REQUIRES_VERIFICATION'}); }
    if(titles==='missing'){ gaps.push({name:'Τίτλοι', level:'critical'}); candidates.push({p:2,title:'Συγκέντρωσε τίτλους ιδιοκτησίας', why:'Χρειάζονται για ταυτοποίηση ακινήτου.', decision:'REQUIRES_VERIFICATION'}); }
    if(arch==='missing'){ candidates.push({p:4,title:'Ανάθεσε ή επιβεβαίωσε αρχιτεκτονική μελέτη', why:'Επόμενο deliverable — δεν μπλοκάρει πάντα το τρέχον στάδιο.', decision:'REQUIRES_VERIFICATION'}); }
  }
  else if(type==='ΠΕΑ'){
    const plans=fromAnswer(a.plans);
    const permit=fromAnswer(a.permit);
    const site=fromAnswer(a.site);
    evidence.push({name:'Έτος κατασκευής', value:a.year||'—', status:a.year?'declared':'missing', critical:true});
    evidence.push({name:'Σχέδια', value:a.plans||'—', status:plans, critical:true});
    evidence.push({name:'Οικοδομική άδεια', value:a.permit||'—', status:permit, critical:true});
    evidence.push({name:'Χρήση', value:a.use||'—', status:a.use?fromAnswer(a.use==='Δεν γνωρίζω'?'Δεν γνωρίζω':'Ναι'):'missing', critical:true});
    evidence.push({name:'Αυτοψία', value:a.site||'—', status:site==='declared'?'declared':(site==='missing'?'not_done':site), critical:true});

    if(plans==='missing'){ gaps.push({name:'Σχέδια', level:'critical'}); candidates.push({p:1,title:'Συγκέντρωσε σχέδια ή προγραμμάτισε αποτύπωση', why:'Χωρίς κάτοψη αυξάνεται ο κίνδυνος λάθους στον φάκελο ΠΕΑ.', decision:'REQUIRES_VERIFICATION'}); }
    if(permit==='missing'){ gaps.push({name:'Οικοδομική άδεια', level:'critical'}); candidates.push({p:2,title:'Εντόπισε οικοδομική άδεια ή κατάσταση νομιμότητας', why:'DECLARED από ιδιοκτήτη δεν αρκεί — απαιτείται τεκμηρίωση.', decision:'REQUIRES_VERIFICATION'}); }
    if(permit==='needs_check'){ candidates.push({p:2,title:'Επαλήθευσε αν υπάρχει άδεια (μη θεωρήσεις τη δήλωση δεδομένη)', why:'Δεν γνωρίζω → needs verification, όχι proceed.', decision:'REQUIRES_VERIFICATION'}); }
    if(site!=='declared'){ candidates.push({p:3,title:'Ολοκλήρωσε αυτοψία πριν τελική αξιολόγηση', why:'Η πραγματική κατάσταση δεν έχει επιβεβαιωθεί.', decision:'REQUIRES_VERIFICATION'}); }
    if(!a.year){ gaps.push({name:'Έτος', level:'important'}); candidates.push({p:3,title:'Καταχώρισε έτος κατασκευής', why:'Χρειάζεται για ενεργειακή αξιολόγηση.', decision:'REQUIRES_VERIFICATION'}); }
    // soft conflict example: old building + no plans
    if(a.year && +a.year<1980 && plans==='missing'){
      conflicts.push({title:'Παλαιό κτίριο χωρίς σχέδια', detail:'Κτίριο προ 1980 χωρίς επιβεβαιωμένα σχέδια — αυξημένος κίνδυνος απόκλισης υφιστάμενης κατάστασης.'});
    }
  }
  else if(type==='Τοπογραφικό'){
    const old=fromAnswer(a.old);
    const titles=fromAnswer(a.titles);
    const kaek=fromAnswer(a.kaek);
    evidence.push({name:'Σκοπός', value:a.purpose||'—', status:a.purpose?'declared':'missing', critical:true});
    evidence.push({name:'Παλαιό διάγραμμα', value:a.old||'—', status:old, critical:true});
    evidence.push({name:'Τίτλοι', value:a.titles||'—', status:titles, critical:true});
    evidence.push({name:'ΚΑΕΚ', value:a.kaek||'—', status:kaek, critical:true});
    if(old==='missing'){ gaps.push({name:'Παλαιό τοπογραφικό', level:'important'}); candidates.push({p:1,title:'Ζήτησε παλαιά διαγράμματα από πελάτη', why:'Μειώνει λάθη στα όρια πριν νέα αποτύπωση.', decision:'REQUIRES_VERIFICATION'}); }
    if(titles==='missing'){ gaps.push({name:'Τίτλοι', level:'critical'}); candidates.push({p:1,title:'Συγκέντρωσε τίτλους ιδιοκτησίας', why:'Απαραίτητοι για προσδιορισμό ορίων.', decision:'REQUIRES_VERIFICATION'}); }
    if(kaek==='missing'||kaek==='needs_check'){ candidates.push({p:3,title:'Έλεγξε/εντόπισε ΚΑΕΚ όπου εφαρμόζεται', why:'Σύνδεση με Κτηματολόγιο.', decision:'REQUIRES_VERIFICATION'}); }
  }
  else if(type==='Άδεια Μικρής Κλίμακας'){
    const plans=fromAnswer(a.plans);
    const site=fromAnswer(a.site);
    evidence.push({name:'Είδος εργασίας', value:a.work||'—', status:a.work?'declared':'missing', critical:true});
    evidence.push({name:'Παλαιά άδεια/νομιμοποίηση', value:a.exist_permit||'—', status:fromAnswer(a.exist_permit), critical:true});
    evidence.push({name:'Σχέδια υφιστάμενης', value:a.plans||'—', status:plans, critical:true});
    evidence.push({name:'Αυτοψία', value:a.site||'—', status:site==='missing'||!a.site?'not_done':fromAnswer(a.site), critical:true});
    if(!a.work){ gaps.push({name:'Είδος εργασίας', level:'critical'}); candidates.push({p:1,title:'Όρισε το είδος εργασίας', why:'Καθορίζει το εύρος της άδειας μικρής κλίμακας.', decision:'REQUIRES_VERIFICATION'}); }
    if(plans==='missing'){ gaps.push({name:'Σχέδια', level:'important'}); candidates.push({p:2,title:'Συγκέντρωσε σχέδια υφιστάμενης κατάστασης', why:'Βοηθά πριν αυτοψία και υποβολή.', decision:'REQUIRES_VERIFICATION'}); }
    if(site!=='declared'){ candidates.push({p:2,title:'Προγραμμάτισε αυτοψία', why:'Σύγκριση πραγματικότητας με διαθέσιμα στοιχεία.', decision:'REQUIRES_VERIFICATION'}); }
  }
  else if(type==='Αυθαίρετο'){
    const known=fromAnswer(a.known);
    const photos=fromAnswer(a.photos);
    const plans=fromAnswer(a.plans);
    evidence.push({name:'Απόκλιση από εγκεκριμένα', value:a.known||'—', status:known, critical:true});
    evidence.push({name:'Φωτογραφίες', value:a.photos||'—', status:photos, critical:true});
    evidence.push({name:'Παλαιά σχέδια/άδεια', value:a.plans||'—', status:plans, critical:true});
    evidence.push({name:'Χρόνος κατασκευής', value:a.year||'—', status:a.year?'declared':'missing', critical:true});
    if(known==='declared'){ conflicts.push({title:'Δηλωμένη απόκλιση', detail:'Υπάρχει δήλωση απόκλισης — απαιτείται έλεγχος πραγματικής χρήσης/κατάστασης πριν οποιαδήποτε πρόταση τακτοποίησης.'}); }
    candidates.push({p:1,title:'Μην προτείνεις αυτόματη τακτοποίηση — έλεγξε χρήση, χρόνο και σχέδια', why:'Ν.4495/2017 ως πλαίσιο αναφοράς· η τεχνική κρίση ανήκει στον μηχανικό. Decision: ESCALATE / VERIFY.', decision:'ESCALATE'});
    if(photos==='missing'){ gaps.push({name:'Φωτογραφίες', level:'important'}); }
    if(plans==='missing'){ gaps.push({name:'Σχέδια', level:'important'}); }
  }
  else if(type==='ΗΤΚ'){
    const permit=fromAnswer(a.permit);
    const plans=fromAnswer(a.plans);
    const topo=fromAnswer(a.topo);
    const site=fromAnswer(a.site);
    evidence.push({name:'Οικοδομική άδεια', value:a.permit||'—', status:permit, critical:true});
    evidence.push({name:'Σχέδια', value:a.plans||'—', status:plans, critical:true});
    evidence.push({name:'Τοπογραφικό', value:a.topo||'—', status:topo, critical:true});
    evidence.push({name:'Αυτοψία/αποτύπωση', value:a.site||'—', status:site==='missing'||!a.site?'not_done':site, critical:true});
    if(plans==='missing'||plans==='needs_check'){ gaps.push({name:'Σχέδια', level:'critical'}); candidates.push({p:1,title:'Έλεγχος αντιστοίχισης σχεδίων με υφιστάμενη κατάσταση', why:'Κρίσιμο για ΗΤΚ πριν ολοκλήρωση φακέλου.', decision:'REQUIRES_VERIFICATION'}); }
    if(permit==='missing'){ gaps.push({name:'Άδεια', level:'critical'}); candidates.push({p:1,title:'Εντόπισε οικοδομική άδεια', why:'Βασικό στοιχείο ΗΤΚ.', decision:'REQUIRES_VERIFICATION'}); }
    if(site!=='declared'){ candidates.push({p:2,title:'Ολοκλήρωσε αυτοψία / αποτύπωση', why:'Επιβεβαίωση πραγματικής κατάστασης.', decision:'REQUIRES_VERIFICATION'}); }
  }
  else {
    evidence.push({name:'Στόχος', value:a.goal||'—', status:a.goal?'declared':'missing', critical:true});
    evidence.push({name:'Έγγραφα', value:a.docs||'—', status:fromAnswer(a.docs), critical:false});
  }

  evidence.push({name:'Αρχεία στον φάκελο', value:docs.length?docs.length+' αρχείο/α':'Κανένα', status:docs.length?'declared':'missing', critical:false});
  if(!docs.some(()=>false) && docs.length===0){
    candidates.push({p:5,title:'Συγκέντρωσε διαθέσιμα έγγραφα στον τεχνικό φάκελο', why:'Ο φάκελος προετοιμάζει την αυτοψία. Δεν αντικαθιστά επαλήθευση.', decision:'REQUIRES_VERIFICATION'});
  }
  if(hasCad){
    candidates.push({p:4,title:'Έλεγξε περιεχόμενο CAD (ανθρώπινος έλεγχος)', why:'CAD → needs_review. Δεν γίνεται αυτόματα VERIFIED.', decision:'REQUIRES_VERIFICATION'});
  }

  // Always keep a lower-priority site reminder if not covered
  if(!candidates.some(x=>/αυτοψία/i.test(x.title)) && type!=='Τοπογραφικό'){
    candidates.push({p:8,title:'Όταν έχεις βασικά στοιχεία, προγραμμάτισε αυτοψία', why:'Η πραγματική κατάσταση επιβεβαιώνεται επιτόπου. Λείποντα στοιχεία μπορούν να μείνουν ως εκκρεμότητα αν δεν μπλοκάρουν το τρέχον στάδιο.', decision:'REQUIRES_VERIFICATION'});
  }

  candidates.sort((x,y)=>x.p-y.p);
  const primary=candidates[0]||{title:'Ο φάκελος μπορεί να προχωρήσει σε τελικό έλεγχο μηχανικού', why:'Δεν εντοπίζονται κρίσιμα κενά υψηλής προτεραιότητας. Η τελική κρίση παραμένει στον μηχανικό.', decision:'PROCEED'};
  const secondary=candidates.slice(1,3);

  const criticalCount=gaps.filter(g=>g.level==='critical').length;
  let decision='REQUIRES_VERIFICATION';
  if(conflicts.length) decision='ESCALATE';
  else if(criticalCount===0 && primary.decision==='PROCEED') decision='PROCEED';
  else if(criticalCount>0) decision='REQUIRES_VERIFICATION';

  const counts={
    verified:evidence.filter(e=>e.status==='verified').length,
    declared:evidence.filter(e=>e.status==='declared').length,
    needs:evidence.filter(e=>e.status==='needs_check').length,
    missing:evidence.filter(e=>e.status==='missing'||e.status==='not_done').length,
    conflict:conflicts.length
  };

  return {evidence, gaps, conflicts, primary, secondary, decision, counts, criticalCount};
}

function top(title, right=''){
  return `<div class="top"><div class="brand">AI Senior Engineer<small>${title}</small></div><div>${right}</div></div>`;
}

function render(){
  const root=document.getElementById('app');
  let html='';
  if(state.screen==='home') html=viewHome();
  else if(state.screen==='new') html=viewNew();
  else if(state.screen==='intake') html=viewIntake();
  else if(state.screen==='case') html=viewCase();
  else if(state.screen==='files') html=viewFiles();
  else if(state.screen==='review') html=viewReview();
  root.innerHTML=html+(state.toast?`<div class="toast">${state.toast}</div>`:'');
  bind();
}

function bind(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    state.screen=b.dataset.go;
    if(b.dataset.go==='new') state.draft={};
    render();
  });
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{
    state.currentId=b.dataset.open; state.screen='case'; state.tab='overview'; render();
  });
  document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>{
    const demo=DEMOS.find(x=>x.id===b.dataset.demo);
    if(!demo) return;
    const id=uid();
    const now=Date.now();
    state.cases.push({
      id,
      customer:demo.customer,
      phone:demo.phone||'',
      address:demo.address,
      workType:demo.workType,
      answers:{...demo.answers},
      docs:(demo.docs||[]).map(x=>({...x})),
      createdAt:now,
      updatedAt:now
    });
    save();
    state.currentId=id;
    state.screen='case';
    state.tab='overview';
    toast('Demo υπόθεση φορτώθηκε');
    render();
  });
  document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{state.draft.workType=b.dataset.type; render()});
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab; render()});

  const cust=document.getElementById('customer');
  const phone=document.getElementById('phone');
  const addr=document.getElementById('address');
  const refreshCreate=()=>{
    const ok=state.draft.customer&&state.draft.address&&state.draft.workType;
    const btn=document.querySelector('[data-create]');
    if(btn) btn.disabled=!ok;
  };
  if(cust) cust.oninput=e=>{state.draft.customer=e.target.value; refreshCreate()};
  if(phone) phone.oninput=e=>{state.draft.phone=e.target.value};
  if(addr) addr.oninput=e=>{state.draft.address=e.target.value; refreshCreate()};

  const create=document.querySelector('[data-create]');
  if(create) create.onclick=()=>{
    if(!(state.draft.customer&&state.draft.address&&state.draft.workType)) return;
    const id=uid();
    const now=Date.now();
    state.cases.push({
      id,
      customer:state.draft.customer.trim(),
      phone:(state.draft.phone||'').trim(),
      address:state.draft.address.trim(),
      workType:state.draft.workType,
      answers:{},
      docs:[],
      createdAt:now,
      updatedAt:now
    });
    save();
    state.currentId=id;
    state.qIndex=0;
    state.screen='intake';
    state.draft={};
    toast('Η υπόθεση αποθηκεύτηκε');
    render();
  };

  const ans=document.getElementById('ans');
  if(ans) ans.oninput=e=>{
    const c=cur(); if(!c) return;
    c.answers=c.answers||{};
    c.answers[qs(c.workType)[state.qIndex].id]=e.target.value;
    c.updatedAt=Date.now(); save();
    const btn=document.querySelector('[data-next-q]');
    if(btn) btn.disabled=!e.target.value.trim();
  };

  document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{
    const c=cur(); if(!c) return;
    c.answers=c.answers||{};
    c.answers[qs(c.workType)[state.qIndex].id]=b.dataset.opt;
    c.updatedAt=Date.now(); save(); render();
  });

  const nq=document.querySelector('[data-next-q]');
  if(nq) nq.onclick=()=>{
    const c=cur(); if(!c) return;
    const list=qs(c.workType);
    if(state.qIndex<list.length-1){ state.qIndex++; render(); }
    else { state.screen='case'; state.tab='overview'; toast('Φάκελος έτοιμος'); render(); }
  };
  const bq=document.querySelector('[data-back-q]');
  if(bq) bq.onclick=()=>{
    if(state.qIndex>0){ state.qIndex--; render(); }
    else { state.screen='case'; render(); }
  };

  const fi=document.getElementById('fileInput');
  if(fi) fi.onchange=e=>{
    const c=cur(); if(!c) return;
    Array.from(e.target.files||[]).forEach(f=>{
      let kind='Άλλο';
      if(/\.pdf$/i.test(f.name)) kind='PDF';
      else if(/\.(dwg|dxf)$/i.test(f.name)) kind='CAD';
      else if(/\.(jpe?g|png)$/i.test(f.name)) kind='Εικόνα';
      c.docs.push({name:f.name, kb:Math.max(1,Math.round(f.size/1024)), kind});
    });
    c.updatedAt=Date.now(); save(); toast('Αρχεία στον φάκελο (προς έλεγχο)'); render();
  };
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
    const c=cur(); if(!c) return;
    c.docs.splice(+b.dataset.rm,1);
    c.updatedAt=Date.now(); save(); render();
  });
  const del=document.querySelector('[data-del]');
  if(del) del.onclick=()=>{
    if(!confirm('Διαγραφή υπόθεσης;')) return;
    state.cases=state.cases.filter(x=>x.id!==state.currentId);
    save(); state.currentId=null; state.screen='home'; render();
  };
}

load();
render();
})();
</script>
</body>
</html>
