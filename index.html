<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="theme-color" content="#0B1C2E"/>
<title>AI Senior Engineer — Case Operating System</title>
<style>
:root{
  --bg:#F4F6F8;--card:#fff;--ink:#1A2332;--muted:#6B7A8F;--line:#E2E8F0;
  --navy:#0B1C2E;--blue:#2563EB;--soft:#EFF6FF;
  --ok:#059669;--okBg:#ECFDF5;--warn:#D97706;--warnBg:#FFFBEB;
  --bad:#DC2626;--badBg:#FEF2F2;--info:#EEF2FF;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;display:flex;justify-content:center}
#app{width:100%;max-width:430px;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:none;background:none}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--blue);outline-offset:0}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.brand{font-weight:800;font-size:14px;color:var(--navy)}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.scroll{flex:1;overflow:auto;padding:16px}
.foot{padding:14px 16px;border-top:1px solid var(--line);background:#fff;position:sticky;bottom:0}

/* Buttons */
.btn{width:100%;padding:14px;background:var(--navy);color:#fff;font-weight:700;border-radius:12px;font-size:15px}
.btn.ghost{background:#fff;color:var(--muted);border:1px solid var(--line)}
.btn.blue{background:var(--blue)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:10px 14px;font-size:13px;width:auto}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.tap{cursor:pointer;transition:border-color .15s}
.card.tap:active{border-color:var(--blue)}
.h1{font-size:22px;font-weight:800;margin-bottom:4px}
.h2{font-size:16px;font-weight:800;margin-bottom:6px}
.muted{color:var(--muted);font-size:13px;line-height:1.5}
.label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}

/* Four questions strip */
.four{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.four .q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.four .q .k{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.four .q .v{font-size:13px;font-weight:700;margin-top:4px;line-height:1.35}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.chip.ok{background:var(--okBg);color:var(--ok)}
.chip.warn{background:var(--warnBg);color:var(--warn)}
.chip.bad{background:var(--badBg);color:var(--bad)}
.chip.info{background:var(--info);color:var(--blue)}
.chip.neutral{background:#F1F5F9;color:var(--muted)}

/* Choice buttons */
.choice{display:block;width:100%;text-align:left;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;font-weight:600;font-size:14px}
.choice.on{background:var(--navy);border-color:var(--navy);color:#fff}
.choice.sm{padding:10px 12px;font-size:13px;display:inline-block;width:auto;margin-right:6px}

/* Next action */
.nsa{background:var(--soft);border:1px solid #BFDBFE;border-radius:var(--r);padding:14px;margin:12px 0}
.nsa .t{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.nsa .a{font-weight:800;font-size:15px;line-height:1.35}
.nsa .why{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.45}

/* AI panel */
.ai{background:#F8FAFC;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.ai .t{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.ai p{font-size:13.5px;line-height:1.5;color:#334155}

/* Hero */
.hero{background:var(--navy);color:#F8FAFC;padding:28px 18px 24px}
.hero .tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#93A4B8;font-weight:700}
.hero h1{font-size:22px;font-weight:800;margin:8px 0 6px}
.hero p{color:#A8B8CC;font-size:13.5px;line-height:1.5}

/* Lists */
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.item:last-child{border-bottom:none}

/* Progress steps */
.steps{display:flex;gap:4px;margin-bottom:16px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--navy)}
.steps span.done{background:var(--ok)}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;z-index:50;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,.2)}

/* Empty */
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.empty .icon{font-size:36px;margin-bottom:10px}

/* Section header */
.sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 8px}

.back{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:12px;display:inline-flex;align-items:center;gap:4px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
/* ========== SAFE STORAGE ========== */
const mem={};
const store=(function(){
  try{
    const k='__ase_t';
    localStorage.setItem(k,'1');localStorage.removeItem(k);
    return localStorage;
  }catch(e){
    return{
      getItem:k=>mem[k]??null,
      setItem:(k,v)=>{mem[k]=String(v)},
      removeItem:k=>{delete mem[k]}
    };
  }
})();

const KEY='ase-full-v1';

/* ========== STATE ========== */
let S={
  screen:'home',
  cases:[],
  cur:null,
  draft:{},
  comm:{},
  assets:{},
  toast:null,
  tab:'home'
};

function uid(){return 'c_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function load(){try{const r=store.getItem(KEY);if(r){const p=JSON.parse(r);S.cases=p.cases||[]}}catch(e){}}
function save(){try{store.setItem(KEY,JSON.stringify({cases:S.cases}))}catch(e){}}
function cur(){return S.cases.find(c=>c.id===S.cur)||null}
function toast(m){S.toast=m;render();setTimeout(()=>{S.toast=null;render()},1800)}
function go(sc){S.screen=sc;render()}
function openCase(id){S.cur=id;S.screen='case';S.tab='home';render()}

/* ========== DOMAIN LOGIC (client-side simulation of Case OS) ========== */
function buildHome(c){
  const st=c.statement||'';
  const assets=c.assets||{};
  const known=[];
  const missing=[];
  const issues=[];

  if(c.clientName) known.push('Πελάτης: '+c.clientName);
  if(c.phone) known.push('Τηλέφωνο: '+c.phone);
  if(c.region) known.push('Περιοχή: '+c.region);
  if(c.workType) known.push('Εργασία: '+c.workType);
  if(st) known.push('Περιγραφή από πελάτη (ισχυρισμός)');

  if(assets.title==='HAS') known.push('Τίτλος — έχει δηλωθεί διαθέσιμος');
  else if(assets.title==='DOES_NOT_HAVE') missing.push('Τίτλος');
  else if(assets.title==='UNKNOWN'||!assets.title) missing.push('Τίτλος (άγνωστο αν υπάρχει)');

  if(assets.kaek==='HAS') known.push('ΚΑΕΚ — έχει δηλωθεί διαθέσιμος');
  else if(assets.kaek==='DOES_NOT_HAVE') missing.push('ΚΑΕΚ');
  else if(assets.kaek==='UNKNOWN'||!assets.kaek) missing.push('ΚΑΕΚ (άγνωστο)');

  if(assets.topo==='HAS') known.push('Τοπογραφικό — έχει δηλωθεί διαθέσιμο');
  else if(assets.topo==='DOES_NOT_HAVE') missing.push('Τοπογραφικό');
  else if(assets.topo==='UNKNOWN'||!assets.topo) missing.push('Τοπογραφικό (άγνωστο)');

  if(assets.other==='HAS') known.push('Άλλα έγγραφα — υπάρχουν');

  /* potential issues from client claims — NEVER as facts */
  if(st){
    const low=st.toLowerCase();
    if(/δασικ|forest/.test(low)) issues.push('Αναφερόμενος δασικός χαρακτηρισμός — προς διερεύνηση');
    if(/δημ[οό]σι|public|ελληνικ/.test(low)) issues.push('Αναφερόμενη εμφάνιση ως Ελληνικό Δημόσιο — προς διερεύνηση');
    if(/κατοχυρ|ιδιοκτησ|ownership/.test(low)) issues.push('Ιδιοκτησιακό ζήτημα — προς διερεύνηση');
  }

  /* stage & next action */
  let stage='Νέα υπόθεση';
  let next='Επικοινώνησε με τον πελάτη';
  let nextWhy='Χρειάζονται βασικά στοιχεία και περιγραφή του ζητήματος.';

  if(st && Object.keys(assets).length===0){
    stage='Επικοινωνία ολοκληρώθηκε';
    next='Συλλογή διαθέσιμων στοιχείων';
    nextWhy='Ο πελάτης περιέγραψε το ζήτημα. Τώρα ρώτα τι έγγραφα έχει ήδη.';
  }
  if(Object.keys(assets).length>0){
    stage='Συλλογή αρχικών στοιχείων';
    next='Έλεγχος διαθέσιμων εγγράφων';
    nextWhy='Έχεις εικόνα τι υπάρχει. Επόμενο: δες τα έγγραφα — χωρίς να αποφασίσεις ακόμη.';
  }
  if(c.docs && c.docs.length>0){
    stage='Έγγραφα στον φάκελο';
    next='Προετοιμασία αυτοψίας / επιτόπιου ελέγχου';
    nextWhy='Τα έγγραφα ενημερώνουν. Η πραγματική κατάσταση επιβεβαιώνεται επιτόπου όπου χρειάζεται.';
  }
  if(c.fieldDone){
    stage='Αυτοψία καταχωρήθηκε';
    next='Αξιολόγηση ευρημάτων από τον μηχανικό';
    nextWhy='Οι παρατηρήσεις είναι καταγεγραμμένες. Η κρίση ανήκει σε εσένα.';
  }
  if(c.decision){
    stage='Απόφαση μηχανικού καταχωρήθηκε';
    next='Ολοκλήρωση υπόθεσης (όταν πληρούνται οι προϋποθέσεις)';
    nextWhy='Υπάρχει τεκμηριωμένη απόφαση. Έλεγξε αν λείπει κάτι κρίσιμο.';
  }
  if(c.completed){
    stage='Ολοκληρωμένη';
    next='—';
    nextWhy='Η υπόθεση έχει κλείσει με audit trail.';
  }

  return{stage,known,missing,issues,next,nextWhy,st};
}

function aiText(c,h){
  if(c.completed) return 'Η υπόθεση ολοκληρώθηκε. Το ιστορικό παραμένει διαθέσιμο. Δεν προτείνω αλλαγές χωρίς νέο αίτημα.';
  if(!c.statement) return 'Ξεκίνα με επικοινωνία με τον πελάτη. Κατέγραψε τι λέει — χωρίς να το μετατρέψεις σε γεγονός.';
  if(!Object.keys(c.assets||{}).length) return 'Ο πελάτης ανέφερε στοιχεία. Αυτά είναι ισχυρισμοί. Επόμενο ασφαλές βήμα: ρώτα τι έγγραφα έχει ήδη (τίτλος, ΚΑΕΚ, τοπογραφικό).';
  if(h.issues.length) return 'Υπάρχουν θέματα προς διερεύνηση (όχι ετυμηγορίες). Μην επιλέξεις «νικητή» μεταξύ πηγών πριν τον έλεγχο. Εσύ αποφασίζεις μετά τα στοιχεία.';
  return 'Από όσα έχουν καταγραφεί, προχωράς οργανωμένα. Documents inform · field confirms. Η τελική κρίση είναι δική σου.';
}

/* ========== RENDER ========== */
function render(){
  const root=document.getElementById('app');
  let html='';
  if(S.screen==='home') html=viewHome();
  else if(S.screen==='new') html=viewNew();
  else if(S.screen==='comm') html=viewComm();
  else if(S.screen==='assets') html=viewAssets();
  else if(S.screen==='case') html=viewCase();
  else if(S.screen==='docs') html=viewDocs();
  else if(S.screen==='field') html=viewField();
  else if(S.screen==='review') html=viewReview();
  else if(S.screen==='done') html=viewDone();
  else if(S.screen==='dna') html=viewDna();
  root.innerHTML=html+(S.toast?`<div class="toast">${S.toast}</div>`:'');
  bind();
}

function topBar(title,right=''){
  return `<div class="top"><div class="brand">AI Senior Engineer<small>${title}</small></div><div>${right}</div></div>`;
}

/* ---- HOME ---- */
function viewHome(){
  const list=[...S.cases].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  return `<div class="hero">
    <div class="tag">Case Operating System</div>
    <h1>Οι υποθέσεις μου</h1>
    <p>Οργάνωσε την υπόθεση. Ξέρε πού είσαι, τι έχεις, τι λείπει και τι κάνεις μετά — χωρίς το σύστημα να αποφασίζει αντί σου.</p>
  </div>
  <div class="scroll">
    <button data-go="new" class="card tap" style="border-color:var(--navy);display:flex;gap:12px;align-items:center;width:100%">
      <div style="width:40px;height:40px;background:var(--navy);color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800">+</div>
      <div style="text-align:left"><div style="font-weight:800">Νέα υπόθεση</div><div class="muted">Πελάτης · περιοχή · είδος εργασίας</div></div>
    </button>
    <div class="sec">Αποθηκευμένες</div>
    ${list.length?list.map(c=>{
      const h=buildHome(c);
      const chip=c.completed?'ok':(h.issues.length?'warn':'info');
      const chipT=c.completed?'ΟΛΟΚΛΗΡΩΜΕΝΗ':(h.issues.length?'ΧΡΕΙΑΖΕΤΑΙ ΕΛΕΓΧΟ':'ΕΝΕΡΓΗ');
      return `<button data-open="${c.id}" class="card tap" style="width:100%;text-align:left">
        <div class="row">
          <div style="min-width:0">
            <div style="font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.clientName||'Χωρίς όνομα'}</div>
            <div class="muted">${c.workType||'—'} · ${c.region||c.address||'—'}</div>
            <div class="muted" style="margin-top:4px">${h.stage}</div>
          </div>
          <span class="chip ${chip}">${chipT}</span>
        </div>
        ${h.next!=='—'?`<div class="muted" style="margin-top:8px">→ ${h.next}</div>`:''}
      </button>`;
    }).join(''):`<div class="empty"><div class="icon">📋</div>Δεν υπάρχουν ακόμη υποθέσεις.<br>Ξεκίνα με «Νέα υπόθεση».</div>`}
    <button data-go="dna" class="card tap" style="width:100%;margin-top:8px">
      <div style="font-weight:700;font-size:13px">Τι είναι το προϊόν;</div>
      <div class="muted">Case OS · DNA · τι δεν είμαστε</div>
    </button>
  </div>`;
}

/* ---- NEW CASE ---- */
function viewNew(){
  const d=S.draft;
  const ok=d.clientName&&d.workType;
  return `${topBar('Νέα υπόθεση')}
  <div class="scroll">
    <button data-go="home" class="back">← Υποθέσεις</button>
    <div class="h2">Δημιουργία υπόθεσης</div>
    <p class="muted" style="margin-bottom:14px">Λίγα πεδία στην αρχή. Τα υπόλοιπα έρχονται όταν χρειάζονται.</p>
    <div class="label">Πελάτης / Όνομα *</div>
    <input id="fName" value="${d.clientName||''}" placeholder="Ονοματεπώνυμο ή προσωρινό"/>
    <div style="height:10px"></div>
    <div class="label">Τηλέφωνο</div>
    <input id="fPhone" value="${d.phone||''}" placeholder="Προαιρετικό"/>
    <div style="height:10px"></div>
    <div class="label">Περιοχή / Διεύθυνση</div>
    <input id="fRegion" value="${d.region||''}" placeholder="π.χ. Αχαρνές, αγροτεμάχιο…"/>
    <div style="height:12px"></div>
    <div class="label">Είδος εργασίας *</div>
    <div style="margin-top:6px">
      ${['ΗΤΚ','ΠΕΑ','Τοπογραφικό','Ιδιοκτησιακό / χωρικό','Άλλο'].map(t=>
        `<button data-type="${t}" class="choice ${d.workType===t?'on':''}" style="margin-bottom:8px">${t}</button>`
      ).join('')}
    </div>
    <div class="ai"><div class="t">AI Senior</div><p>Δημιούργησε την υπόθεση και μετά μίλησε με τον πελάτη. Δεν ζητάμε ΚΑΕΚ ή σχέδια πριν καταλάβουμε τι συμβαίνει.</p></div>
  </div>
  <div class="foot"><button data-create class="btn" ${ok?'':'disabled'}>Αποθήκευση & συνέχεια →</button></div>`;
}

/* ---- CLIENT COMMUNICATION ---- */
function viewComm(){
  const c=cur();if(!c) return viewHome();
  const text=S.comm.text||c.statement||'';
  return `${topBar('Επικοινωνία με πελάτη')}
  <div class="scroll">
    <button data-open="${c.id}" class="back">← Υπόθεση</button>
    <div class="h2">Τι είπε ο πελάτης;</div>
    <p class="muted" style="margin-bottom:12px">Καταγράφουμε <b>ισχυρισμό</b>, όχι γεγονός. Το σύστημα δεν θα μετατρέψει αυτόματα «φαίνεται δασικό» σε «είναι δασικό».</p>
    <textarea id="commText" rows="5" placeholder="π.χ. Έχω αγροτεμάχιο με ελιές. Φαίνεται δασικό και εμφανίζεται ως Ελληνικό Δημόσιο. Θέλω να το κατοχυρώσω.">${text}</textarea>
    <div class="ai" style="margin-top:12px"><div class="t">Πώς αποθηκεύεται</div>
      <p><b>client_statement</b> — τι ανέφερε<br>
      <b>potential_issue</b> — θέμα προς διερεύνηση<br>
      <b>engineer_decision</b> — παραμένει κενό</p>
    </div>
  </div>
  <div class="foot"><button data-save-comm class="btn" ${text.trim()?'':'disabled'}>Αποθήκευση επικοινωνίας →</button></div>`;
}

/* ---- ASSETS (available documents) ---- */
function viewAssets(){
  const c=cur();if(!c) return viewHome();
  const a=S.assets;
  const keys=['title','kaek','topo','other'];
  const labels={title:'Τίτλος / έγγραφο ιδιοκτησίας',kaek:'ΚΑΕΚ',topo:'Τοπογραφικό',other:'Άλλα έγγραφα'};
  const filled=keys.every(k=>a[k]);
  return `${topBar('Διαθέσιμα στοιχεία')}
  <div class="scroll">
    <button data-open="${c.id}" class="back">← Υπόθεση</button>
    <div class="h2">Τι έχει ήδη ο πελάτης;</div>
    <p class="muted" style="margin-bottom:14px">Όχι «ανέβασε τα πάντα». Μόνο: έχει / δεν έχει / δεν γνωρίζει.</p>
    ${keys.map(k=>`
      <div class="card">
        <div style="font-weight:700;margin-bottom:10px">${labels[k]}</div>
        <div>
          <button data-asset="${k}" data-val="HAS" class="choice sm ${a[k]==='HAS'?'on':''}">Έχει</button>
          <button data-asset="${k}" data-val="DOES_NOT_HAVE" class="choice sm ${a[k]==='DOES_NOT_HAVE'?'on':''}">Δεν έχει</button>
          <button data-asset="${k}" data-val="UNKNOWN" class="choice sm ${a[k]==='UNKNOWN'?'on':''}">Δεν γνωρίζει</button>
        </div>
      </div>
    `).join('')}
    <div class="ai"><div class="t">Σημαντικό</div><p>«Δεν γνωρίζει» ≠ «δεν υπάρχει». Το UNKNOWN μένει UNKNOWN μέχρι να ξεκαθαρίσει.</p></div>
  </div>
  <div class="foot"><button data-save-assets class="btn" ${filled?'':'disabled'}>Αποθήκευση →</button></div>`;
}

/* ---- CASE HOME ---- */
function viewCase(){
  const c=cur();if(!c) return viewHome();
  const h=buildHome(c);
  return `${topBar(c.clientName||'Υπόθεση', c.completed?`<span class="chip ok">ΟΛΟΚΛΗΡΩΜΕΝΗ</span>`:`<span class="chip info">ΕΝΕΡΓΗ</span>`)}
  <div class="scroll">
    <button data-go="home" class="back">← Υποθέσεις</button>
    <div class="card">
      <div class="label">Εργασία</div>
      <div style="font-weight:800">${c.workType||'—'}</div>
      <div class="label" style="margin-top:10px">Περιοχή</div>
      <div>${c.region||c.address||'—'}</div>
      ${c.phone?`<div class="label" style="margin-top:10px">Τηλέφωνο</div><div>${c.phone}</div>`:''}
    </div>

    <div class="four">
      <div class="q"><div class="k">Πού βρίσκομαι</div><div class="v">${h.stage}</div></div>
      <div class="q"><div class="k">Τι κάνω τώρα</div><div class="v">${h.next==='—'?'—':h.next}</div></div>
      <div class="q"><div class="k">Τι έχω</div><div class="v">${h.known.length?h.known.length+' στοιχεία':'Λίγα / τίποτα ακόμη'}</div></div>
      <div class="q"><div class="k">Τι λείπει</div><div class="v">${h.missing.length?h.missing.length+' ανοιχτά':'—'}</div></div>
    </div>

    ${h.next!=='—'||!c.completed?`<div class="nsa">
      <div class="t">Επόμενο ασφαλές βήμα</div>
      <div class="a">${h.next}</div>
      <div class="why">${h.nextWhy}</div>
    </div>`:''}

    <div class="ai"><div class="t">AI Senior · recommendation only</div><p>${aiText(c,h)}</p></div>

    ${h.st?`<div class="card"><div class="label">Ισχυρισμός πελάτη (όχι γεγονός)</div>
      <div style="font-size:14px;line-height:1.45">«${h.st}»</div></div>`:''}

    ${h.known.length?`<div class="card"><div class="label">Τι έχω</div>
      ${h.known.map(x=>`<div class="item">🟢 ${x}</div>`).join('')}</div>`:''}

    ${h.missing.length?`<div class="card"><div class="label">Τι λείπει</div>
      ${h.missing.map(x=>`<div class="item">⚪ ${x}</div>`).join('')}</div>`:''}

    ${h.issues.length?`<div class="card" style="border-color:#FCD34D;background:var(--warnBg)"><div class="label">Προς διερεύνηση (όχι ετυμηγορία)</div>
      ${h.issues.map(x=>`<div class="item">🟡 ${x}</div>`).join('')}</div>`:''}

    <div class="sec">Ενέργειες</div>
    ${!c.statement?`<button data-go="comm" class="btn" style="margin-bottom:8px">Επικοινωνία με πελάτη</button>`:''}
    ${c.statement&&!Object.keys(c.assets||{}).length?`<button data-go="assets" class="btn" style="margin-bottom:8px">Συλλογή διαθέσιμων στοιχείων</button>`:''}
    <button data-go="docs" class="btn ghost" style="margin-bottom:8px">Τεχνικός φάκελος / έγγραφα</button>
    <button data-go="field" class="btn ghost" style="margin-bottom:8px">Αυτοψία / Field</button>
    <button data-go="review" class="btn ghost" style="margin-bottom:8px">Έλεγχος & απόφαση μηχανικού</button>
    ${!c.completed?`<button data-go="done" class="btn ghost">Ολοκλήρωση</button>`:''}
  </div>`;
}

/* ---- DOCS ---- */
function viewDocs(){
  const c=cur();if(!c) return viewHome();
  const docs=c.docs||[];
  return `${topBar('Τεχνικός φάκελος')}
  <div class="scroll">
    <button data-open="${c.id}" class="back">← Υπόθεση</button>
    <div class="h2">Έγγραφα</div>
    <p class="muted" style="margin-bottom:12px">Upload ≠ verified. Τα έγγραφα ενημερώνουν τη διαδικασία· δεν αντικαθιστούν την κρίση σου.</p>
    <div class="card" style="border-style:dashed;text-align:center">
      <input type="file" id="fileIn" multiple accept=".pdf,.jpg,.jpeg,.png,.dwg,.dxf,.doc,.docx"/>
      <div class="muted" style="margin-top:8px">PDF · εικόνες · CAD</div>
    </div>
    ${docs.length?docs.map((d,i)=>`<div class="card row">
      <div style="min-width:0"><div style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${d.name}</div>
      <div class="muted">${d.kb} KB · ${d.kind} · προς έλεγχο</div></div>
      <button data-rm="${i}" style="color:var(--muted);font-size:18px">×</button>
    </div>`).join(''):`<div class="card muted">Δεν έχουν προστεθεί αρχεία ακόμη.</div>`}
    <div class="ai"><div class="t">Κανόνας</div><p>Documents inform → Field confirms. Αν Ε9 και σχέδιο διαφωνούν, δεν επιλέγουμε νικητή αυτόματα.</p></div>
  </div>
  <div class="foot"><button data-open="${c.id}" class="btn ghost">Πίσω στην υπόθεση</button></div>`;
}

/* ---- FIELD ---- */
function viewField(){
  const c=cur();if(!c) return viewHome();
  const notes=c.fieldNotes||'';
  const checks=c.fieldChecks||{};
  const items=['Εξωτερική κατάσταση','Πρόσβαση / θέση','Χρήσεις χώρων','Διαρρύθμιση','Κρίσιμες μετρήσεις','Σύγκριση με σχέδια','Φωτογραφική τεκμηρίωση'];
  return `${topBar('Αυτοψία')}
  <div class="scroll">
    <button data-open="${c.id}" class="back">← Υπόθεση</button>
    <div class="h2">Field / Αυτοψία</div>
    <p class="muted" style="margin-bottom:12px">Ο μηχανικός πηγαίνει στο ακίνητο. Καταγράφει πραγματική κατάσταση — όχι chatbot checklist χωρίς νόημα.</p>
    <div class="card">
      <div class="label">Checklist</div>
      ${items.map((it,i)=>`
        <label style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px">
          <input type="checkbox" data-chk="${i}" ${checks[i]?'checked':''} style="width:18px;height:18px"/>
          ${it}
        </label>
      `).join('')}
    </div>
    <div class="label">Σημειώσεις / παρατηρήσεις</div>
    <textarea id="fieldNotes" rows="4" placeholder="Τι είδες; Τι διαφέρει από τα σχέδια;">${notes}</textarea>
    <div class="label" style="margin-top:12px">Φωτογραφίες (προσομοίωση)</div>
    <input type="file" id="photoIn" accept="image/*" multiple/>
    <div class="muted" style="margin-top:6px">${(c.photos||[]).length} φωτογραφία/ες στον φάκελο</div>
    <div class="ai" style="margin-top:12px"><div class="t">AI Senior</div><p>Κατέγραψε αποκλίσεις ως παρατηρήσεις. Μην τις βαφτίσεις «αυθαίρετο» πριν την αξιολόγησή σου.</p></div>
  </div>
  <div class="foot"><button data-save-field class="btn">Αποθήκευση αυτοψίας →</button></div>`;
}

/* ---- REVIEW / DECISION ---- */
function viewReview(){
  const c=cur();if(!c) return viewHome();
  const h=buildHome(c);
  return `${topBar('Έλεγχος & απόφαση')}
  <div class="scroll">
    <button data-open="${c.id}" class="back">← Υπόθεση</button>
    <div class="h2">Έλεγχος μηχανικού</div>
    <p class="muted" style="margin-bottom:12px">Εδώ παίρνεις εσύ την απόφαση. Το AI μόνο οργανώνει και προτείνει.</p>

    ${h.issues.length?`<div class="card" style="background:var(--warnBg);border-color:#FCD34D">
      <div class="label">Ανοιχτά προς διερεύνηση</div>
      ${h.issues.map(x=>`<div class="item">🟡 ${x}</div>`).join('')}
    </div>`:''}

    <div class="card">
      <div class="label">Παράδειγμα ασυμφωνίας (demo)</div>
      <div class="item">Ε9 / δήλωση: —</div>
      <div class="item">Σχέδιο: —</div>
      <div class="item">Αυτοψία: ${(c.fieldNotes||'').slice(0,80)||'—'}</div>
      <div class="muted" style="margin-top:8px">Conflict ≠ winner. Δεν επιλέγουμε αυτόματα σωστό εμβαδόν.</div>
    </div>

    <div class="label">Απόφαση μηχανικού (υποχρεωτική αιτιολογία)</div>
    <textarea id="decText" rows="4" placeholder="Τι αποφασίζεις και γιατί…">${c.decision||''}</textarea>

    <div class="ai" style="margin-top:12px"><div class="t">AI Senior</div><p>${aiText(c,h)}<br><br><b>Εσύ αποφασίζεις.</b></p></div>
  </div>
  <div class="foot"><button data-save-dec class="btn">Καταχώριση απόφασης →</button></div>`;
}

/* ---- COMPLETION ---- */
function viewDone(){
  const c=cur();if(!c) return viewHome();
  const h=buildHome(c);
  const can=!!c.decision;
  return `${topBar('Ολοκλήρωση')}
  <div class="scroll">
    <button data-open="${c.id}" class="back">← Υπόθεση</button>
    <div class="h2">Ολοκλήρωση υπόθεσης</div>
    <p class="muted" style="margin-bottom:12px">Δεν κλείνει επειδή πάτησες κουμπί. Χρειάζεται απόφαση μηχανικού και εικόνα φακέλου.</p>
    <div class="card">
      <div class="item">${c.statement?'🟢':'⚪'} Επικοινωνία με πελάτη</div>
      <div class="item">${Object.keys(c.assets||{}).length?'🟢':'⚪'} Διαθέσιμα στοιχεία</div>
      <div class="item">${(c.docs||[]).length?'🟢':'⚪'} Έγγραφα στον φάκελο</div>
      <div class="item">${c.fieldDone?'🟢':'⚪'} Αυτοψία</div>
      <div class="item">${c.decision?'🟢':'⚪'} Απόφαση μηχανικού</div>
    </div>
    ${!can?`<div class="card" style="background:var(--badBg);border-color:#FECACA">
      <b style="color:var(--bad)">Δεν μπορεί ακόμη να ολοκληρωθεί</b>
      <div class="muted" style="margin-top:6px">Λείπει τεκμηριωμένη απόφαση μηχανικού.</div>
    </div>`:`<div class="card" style="background:var(--okBg);border-color:#A7F3D0">
      <b style="color:var(--ok)">Προϋποθέσεις για κλείσιμο: OK (demo)</b>
      <div class="muted" style="margin-top:6px">Σε παραγωγή θα ελέγχονται gates workflow ΗΤΚ.</div>
    </div>`}
    <div class="ai"><div class="t">AI Senior</div><p>Μετά το κλείσιμο το ιστορικό μένει. Νέα εργασία στο ίδιο ακίνητο μπορεί να αξιοποιήσει μνήμη — όχι τυφλά VERIFIED.</p></div>
  </div>
  <div class="foot"><button data-complete class="btn ok" ${can?'':'disabled'}>Ολοκλήρωση υπόθεσης</button></div>`;
}

/* ---- DNA / ABOUT ---- */
function viewDna(){
  return `${topBar('Το προϊόν')}
  <div class="scroll">
    <button data-go="home" class="back">← Αρχική</div>
    <div class="h1">AI Senior Engineer</div>
    <p class="muted" style="margin-bottom:16px">Case Operating System για πολιτικούς μηχανικούς.</p>
    <div class="card">
      <div class="h2">Υπόσχεση</div>
      <p style="font-size:14px;line-height:1.55">Ανοίγεις υπόθεση και ξέρεις <b>πού είσαι, τι έχεις, τι λείπει, τι ελέγχεις, τι κάνεις μετά</b> — χωρίς το σύστημα να αποφασίζει ή να υπογράφει αντί σου.</p>
    </div>
    <div class="card">
      <div class="h2">Δεν είμαστε</div>
      <div class="item">✗ Chatbot</div>
      <div class="item">✗ Document generator</div>
      <div class="item">✗ Νομική μηχανή που αποφασίζει</div>
      <div class="item">✗ Αυτόνομος μηχανικός</div>
    </div>
    <div class="card">
      <div class="h2">DNA</div>
      <div class="item">Case-first · Engineer-first</div>
      <div class="item">Evidence ≠ truth</div>
      <div class="item">Conflict ≠ winner</div>
      <div class="item">Finding ≠ verdict</div>
      <div class="item">Decision = Engineer</div>
      <div class="item">AI = recommendation only</div>
      <div class="item">Documents inform · Field confirms</div>
      <div class="item">Progressive disclosure</div>
    </div>
    <div class="card">
      <div class="h2">Πρώτο vertical</div>
      <p class="muted">ΗΤΚ ως live proof. ΠΕΑ / Τοπογραφικό / Άδειες αργότερα — ίδια μηχανή, όχι νέα apps.</p>
    </div>
    <div class="ai"><div class="t">Source of truth</div><p>Στο πραγματικό προϊόν: PostgreSQL → Application → Domain. Αυτό το HTML είναι επίδειξη φιλοσοφίας, όχι production backend.</p></div>
  </div>`;
}

/* ========== BIND ========== */
function bind(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    if(b.dataset.go==='new') S.draft={};
    if(b.dataset.go==='comm') S.comm={text:(cur()||{}).statement||''};
    if(b.dataset.go==='assets') S.assets=Object.assign({},(cur()||{}).assets||{});
    go(b.dataset.go);
  });
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openCase(b.dataset.open));
  document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{S.draft.workType=b.dataset.type;render()});

  const fName=document.getElementById('fName');
  if(fName) fName.oninput=e=>{S.draft.clientName=e.target.value;const ok=S.draft.clientName&&S.draft.workType;const btn=document.querySelector('[data-create]');if(btn)btn.disabled=!ok};
  const fPhone=document.getElementById('fPhone');
  if(fPhone) fPhone.oninput=e=>{S.draft.phone=e.target.value};
  const fRegion=document.getElementById('fRegion');
  if(fRegion) fRegion.oninput=e=>{S.draft.region=e.target.value};

  const create=document.querySelector('[data-create]');
  if(create) create.onclick=()=>{
    if(!(S.draft.clientName&&S.draft.workType)) return;
    const id=uid();const now=Date.now();
    S.cases.push({
      id,
      clientName:S.draft.clientName.trim(),
      phone:(S.draft.phone||'').trim(),
      region:(S.draft.region||'').trim(),
      workType:S.draft.workType,
      statement:'',
      assets:{},
      docs:[],
      photos:[],
      fieldNotes:'',
      fieldChecks:{},
      fieldDone:false,
      decision:'',
      completed:false,
      createdAt:now,
      updatedAt:now
    });
    save();S.cur=id;S.draft={};S.screen='comm';S.comm={text:''};toast('Η υπόθεση αποθηκεύτηκε');render();
  };

  const ct=document.getElementById('commText');
  if(ct) ct.oninput=e=>{S.comm.text=e.target.value;const btn=document.querySelector('[data-save-comm]');if(btn)btn.disabled=!e.target.value.trim()};
  const sc=document.querySelector('[data-save-comm]');
  if(sc) sc.onclick=()=>{
    const c=cur();if(!c) return;
    c.statement=(S.comm.text||'').trim();
    c.updatedAt=Date.now();
    save();toast('Επικοινωνία καταγράφηκε (ισχυρισμός)');openCase(c.id);
  };

  document.querySelectorAll('[data-asset]').forEach(b=>b.onclick=()=>{
    S.assets[b.dataset.asset]=b.dataset.val;render();
  });
  const sa=document.querySelector('[data-save-assets]');
  if(sa) sa.onclick=()=>{
    const c=cur();if(!c) return;
    c.assets=Object.assign({},S.assets);
    c.updatedAt=Date.now();
    save();toast('Διαθέσιμα στοιχεία καταγράφηκαν');openCase(c.id);
  };

  const fi=document.getElementById('fileIn');
  if(fi) fi.onchange=e=>{
    const c=cur();if(!c) return;
    Array.from(e.target.files||[]).forEach(f=>{
      let kind='Άλλο';
      if(/\.pdf$/i.test(f.name)) kind='PDF';
      else if(/\.(dwg|dxf)$/i.test(f.name)) kind='CAD';
      else if(/\.(jpe?g|png)$/i.test(f.name)) kind='Εικόνα';
      c.docs=c.docs||[];
      c.docs.push({name:f.name,kb:Math.max(1,Math.round(f.size/1024)),kind});
    });
    c.updatedAt=Date.now();save();toast('Αρχεία στον φάκελο');render();
  };
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
    const c=cur();if(!c) return;c.docs.splice(+b.dataset.rm,1);c.updatedAt=Date.now();save();render();
  });

  document.querySelectorAll('[data-chk]').forEach(b=>b.onchange=e=>{
    const c=cur();if(!c) return;c.fieldChecks=c.fieldChecks||{};c.fieldChecks[b.dataset.chk]=e.target.checked;
  });
  const fn=document.getElementById('fieldNotes');
  if(fn) fn.oninput=e=>{const c=cur();if(c) c.fieldNotes=e.target.value};
  const pi=document.getElementById('photoIn');
  if(pi) pi.onchange=e=>{
    const c=cur();if(!c) return;
    c.photos=c.photos||[];
    Array.from(e.target.files||[]).forEach(f=>c.photos.push({name:f.name}));
    c.updatedAt=Date.now();save();toast('Φωτογραφίες προστέθηκαν');render();
  };
  const sf=document.querySelector('[data-save-field]');
  if(sf) sf.onclick=()=>{
    const c=cur();if(!c) return;
    c.fieldDone=true;c.updatedAt=Date.now();save();toast('Αυτοψία καταχωρήθηκε');openCase(c.id);
  };

  const sd=document.querySelector('[data-save-dec]');
  if(sd) sd.onclick=()=>{
    const c=cur();if(!c) return;
    const t=(document.getElementById('decText')||{}).value||'';
    if(!t.trim()){toast('Απαιτείται αιτιολογία');return;}
    c.decision=t.trim();c.updatedAt=Date.now();save();toast('Απόφαση μηχανικού καταχωρήθηκε');openCase(c.id);
  };

  const cp=document.querySelector('[data-complete]');
  if(cp) cp.onclick=()=>{
    const c=cur();if(!c||!c.decision) return;
    c.completed=true;c.updatedAt=Date.now();save();toast('Η υπόθεση ολοκληρώθηκε');openCase(c.id);
  };
}

load();
render();
})();
</script>
</body>
</html>
