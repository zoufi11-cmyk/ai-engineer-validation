<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#1D3557"/>
<title>AI Senior Engineer</title>
<style>
:root{--paper:#F5F4EF;--ink:#23272B;--muted:#6B6B63;--line:#DBD6C9;--navy:#1D3557;--soft:#2A466E;--ok:#3A6B4C;--okBg:#E7EFE8;--warn:#A8791F;--warnBg:#F5EEDC;--bad:#A8412F;--badBg:#F5E4DF;--info:#EEF1F5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#e5e3db;color:var(--ink);min-height:100dvh;display:flex;justify-content:center}
#root{width:100%;max-width:430px;min-height:100dvh;background:var(--paper);box-shadow:0 0 40px rgba(0,0,0,.08);display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
const T={paper:"#F5F4EF",ink:"#23272B",muted:"#6B6B63",line:"#DBD6C9",navy:"#1D3557",soft:"#2A466E",ok:"#3A6B4C",okBg:"#E7EFE8",warn:"#A8791F",warnBg:"#F5EEDC",bad:"#A8412F",badBg:"#F5E4DF",info:"#EEF1F5"};
const KEY="ai-senior-cases-v1";

const WORK_TYPES=["Άδεια Μικρής Κλίμακας","ΠΕΑ","Νέα Οικοδομική Άδεια","Τοπογραφικό","Αυθαίρετο","Αυτοψία"];

let screen="home";
let cases=[];          // αποθηκευμένες υποθέσεις
let currentId=null;    // ενεργή υπόθεση
let draft={customer:"",phone:"",address:"",workType:""};

function uid(){return "c_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw) cases=JSON.parse(raw)||[];
  }catch(e){cases=[]}
}

function save(){
  try{localStorage.setItem(KEY,JSON.stringify(cases))}catch(e){}
}

function getCurrent(){
  return cases.find(c=>c.id===currentId)||null;
}

function statusLabel(s){
  const m={
    collection:"Συλλογή στοιχείων",
    review:"Έλεγχος",
    inspection:"Αυτοψία",
    submission:"Υποβολή",
    done:"Ολοκλήρωση"
  };
  return m[s]||"Συλλογή στοιχείων";
}

function chipStatus(s){
  const m={
    collection:{c:T.warn,bg:T.warnBg},
    review:{c:T.warn,bg:T.warnBg},
    inspection:{c:T.soft,bg:T.info},
    submission:{c:T.ok,bg:T.okBg},
    done:{c:T.ok,bg:T.okBg}
  };
  const x=m[s]||m.collection;
  return `<span style="display:inline-flex;align-items:center;gap:5px;padding:3px 7px;background:${x.bg};color:${x.c};font-size:10px;font-weight:700">${statusLabel(s)}</span>`;
}

function topbar(title, right){
  return `<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid ${T.line};background:#FBFAF7">
    <div style="font-weight:700;font-size:14px;color:${T.navy}">${title}</div>
    <div>${right||""}</div>
  </div>`;
}

function render(){
  const root=document.getElementById("root");
  if(screen==="home") root.innerHTML=viewHome();
  else if(screen==="new") root.innerHTML=viewNew();
  else if(screen==="case") root.innerHTML=viewCase();
  else if(screen==="files") root.innerHTML=viewFiles();
  else if(screen==="folder") root.innerHTML=viewFolder();
  bind();
}

/* ========== HOME ========== */
function viewHome(){
  const list=cases.slice().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  return `
  <div style="background:${T.navy};padding:28px 20px 22px">
    <div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#9FB3CC">AI Senior Engineer</div>
    <h1 style="color:#F5F4EF;font-size:22px;font-weight:700;margin-top:8px">Υποθέσεις</h1>
    <p style="color:#C3CEDD;font-size:13.5px;margin-top:8px;line-height:1.5">Οργάνωσε. Εντόπισε κενά. Προχώρα στο επόμενο ασφαλές βήμα.</p>
  </div>
  <div style="flex:1;padding:16px 20px;overflow:auto">
    <button data-go="new" style="width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid ${T.navy};background:#fff;margin-bottom:18px">
      <div style="width:36px;height:36px;background:${T.navy};color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700">+</div>
      <div style="text-align:left">
        <div style="font-weight:700;font-size:14.5px">Νέα υπόθεση</div>
        <div style="font-size:12px;color:${T.muted};margin-top:2px">Πελάτης · Διεύθυνση · Τύπος εργασίας</div>
      </div>
    </button>

    <div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:${T.muted};margin-bottom:10px">Αποθηκευμένες</div>
    ${list.length===0
      ? `<div style="padding:16px;border:1px dashed ${T.line};background:#FBFAF7;font-size:13px;color:${T.muted}">Δεν υπάρχουν ακόμα υποθέσεις.</div>`
      : list.map(c=>`
        <button data-open="${c.id}" style="width:100%;text-align:left;padding:14px;border:1px solid ${T.line};background:#fff;margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
            <div style="min-width:0">
              <div style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.customer||"Χωρίς όνομα"}</div>
              <div style="font-size:12.5px;color:${T.muted};margin-top:3px">${c.workType||"—"} · ${c.address||"—"}</div>
            </div>
            ${chipStatus(c.lifecycle||"collection")}
          </div>
        </button>
      `).join("")
    }
  </div>`;
}

/* ========== NEW CASE ========== */
function viewNew(){
  const ok=draft.customer.trim()&&draft.address.trim()&&draft.workType;
  return `
  ${topbar("Νέα υπόθεση")}
  <div style="flex:1;padding:16px 20px;overflow:auto">
    <button data-go="home" style="color:${T.muted};font-size:13px;font-weight:600;margin-bottom:12px">← Πίσω</button>
    <p style="font-size:13px;color:${T.muted};margin-bottom:16px">Ό,τι καταχωρείται θεωρείται δήλωση μέχρι να τεκμηριωθεί.</p>

    <div style="margin-bottom:12px">
      <div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:${T.muted}">Πελάτης *</div>
      <input id="customer" value="${draft.customer}" placeholder="Ονοματεπώνυμο" style="width:100%;margin-top:6px;padding:12px;border:1px solid ${T.line};background:#fff;font-size:14px"/>
    </div>
    <div style="margin-bottom:12px">
      <div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:${T.muted}">Τηλέφωνο</div>
      <input id="phone" value="${draft.phone}" placeholder="Προαιρετικό" style="width:100%;margin-top:6px;padding:12px;border:1px solid ${T.line};background:#fff;font-size:14px"/>
    </div>
    <div style="margin-bottom:12px">
      <div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:${T.muted}">Διεύθυνση *</div>
      <input id="address" value="${draft.address}" placeholder="Οδός, αριθμός, περιοχή" style="width:100%;margin-top:6px;padding:12px;border:1px solid ${T.line};background:#fff;font-size:14px"/>
    </div>
    <div style="margin-bottom:8px">
      <div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:${T.muted}">Τύπος εργασίας *</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
        ${WORK_TYPES.map(t=>`
          <button data-type="${t}" style="padding:11px 8px;border:1px solid ${draft.workType===t?T.navy:T.line};background:${draft.workType===t?T.navy:"#fff"};color:${draft.workType===t?"#fff":T.ink};font-weight:600;font-size:12.5px;text-align:center">${t}</button>
        `).join("")}
      </div>
    </div>
  </div>
  <div style="padding:14px 16px;border-top:1px solid ${T.line};background:#FBFAF7">
    <button data-create ${ok?"":"disabled"} style="width:100%;padding:14px;background:${ok?T.navy:"#C9C4B6"};color:#fff;font-weight:600">Αποθήκευση & συνέχεια →</button>
  </div>`;
}

/* ========== CASE OVERVIEW ========== */
function viewCase(){
  const c=getCurrent();
  if(!c) return viewHome();
  const docs=c.documents||[];
  return `
  ${topbar(c.customer||"Υπόθεση", chipStatus(c.lifecycle||"collection"))}
  <div style="flex:1;padding:16px 20px;overflow:auto">
    <button data-go="home" style="color:${T.muted};font-size:13px;font-weight:600;margin-bottom:12px">← Υποθέσεις</button>

    <div style="padding:14px;border:1px solid ${T.line};background:#fff;margin-bottom:12px">
      <div style="font-size:12px;color:${T.muted}">Τύπος</div>
      <div style="font-weight:700;font-size:15px;margin-top:2px">${c.workType||"—"}</div>
      <div style="font-size:12px;color:${T.muted};margin-top:10px">Διεύθυνση</div>
      <div style="font-size:14px;margin-top:2px">${c.address||"—"}</div>
      ${c.phone?`<div style="font-size:12px;color:${T.muted};margin-top:10px">Τηλέφωνο</div><div style="font-size:14px;margin-top:2px">${c.phone}</div>`:""}
    </div>

    <div style="padding:14px;border:1px solid ${T.navy};background:${T.info};margin-bottom:14px">
      <div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:${T.navy};margin-bottom:6px">Επόμενο ασφαλές βήμα</div>
      <div style="font-weight:700;font-size:14.5px;line-height:1.35">${nextAction(c)}</div>
      <div style="font-size:12.5px;color:#3A4555;margin-top:6px">${nextWhy(c)}</div>
    </div>

    <button data-go="files" style="width:100%;padding:14px;border:1px solid ${T.line};background:#fff;margin-bottom:8px;text-align:left">
      <div style="font-weight:700;font-size:14px">Έγγραφα / Technical Folder</div>
      <div style="font-size:12.5px;color:${T.muted};margin-top:3px">${docs.length} αρχείο/α · συγκέντρωση στοιχείων πριν την αυτοψία</div>
    </button>

    <button data-go="folder" style="width:100%;padding:14px;border:1px solid ${T.line};background:#fff;margin-bottom:8px;text-align:left">
      <div style="font-weight:700;font-size:14px">Κατάσταση φακέλου</div>
      <div style="font-size:12.5px;color:${T.muted};margin-top:3px">Τι έχουμε · τι λείπει · τι θέλει έλεγχο</div>
    </button>

    <div style="margin-top:16px;padding:12px;background:#EFEDE4;font-size:12.5px;color:#454540;line-height:1.5">
      Τα έγγραφα λειτουργούν ως τεχνικός φάκελος εργασίας. Δεν αναλύονται αυτόματα. Σκοπός: να φτάσεις στην αυτοψία πιο προετοιμασμένος.
    </div>
  </div>
  <div style="padding:14px 16px;border-top:1px solid ${T.line};background:#FBFAF7;display:flex;gap:8px">
    <button data-delete style="padding:12px 14px;border:1px solid ${T.line};color:${T.bad};font-weight:600">Διαγραφή</button>
    <button data-go="home" style="flex:1;padding:12px;background:${T.navy};color:#fff;font-weight:600">Λίστα</button>
  </div>`;
}

/* ========== FILES ========== */
function viewFiles(){
  const c=getCurrent();
  if(!c) return viewHome();
  const docs=c.documents||[];
  const pdfs=docs.filter(d=>/\.pdf$/i.test(d.name)).length;
  const cads=docs.filter(d=>/\.(dwg|dxf)$/i.test(d.name)).length;
  const imgs=docs.filter(d=>/\.(jpe?g|png)$/i.test(d.name)).length;

  return `
  ${topbar("Έγγραφα", chipStatus(c.lifecycle||"collection"))}
  <div style="flex:1;padding:16px 20px;overflow:auto">
    <button data-go="case" style="color:${T.muted};font-size:13px;font-weight:600;margin-bottom:12px">← Υπόθεση</button>
    <h2 style="font-size:18px;font-weight:700">Technical Folder</h2>
    <p style="font-size:13px;color:${T.muted};margin:6px 0 14px">Συγκέντρωσε ό,τι υπάρχει ήδη (σχέδια, μελέτες, τοπογραφικό, άδειες). Βοηθά πριν την αυτοψία.</p>

    <div style="border:1px dashed ${T.line};padding:16px;background:#fff;text-align:center;margin-bottom:14px">
      <input type="file" id="fileInput" multiple accept=".pdf,.dwg,.dxf,.jpg,.jpeg,.png"/>
      <p style="font-size:12px;color:${T.muted};margin-top:8px">PDF · DWG/DXF · JPG/PNG</p>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:14px">
      <div style="flex:1;padding:10px;border:1px solid ${T.line};background:#FBFAF7;text-align:center;font-size:12px"><b>${pdfs}</b><br>PDF</div>
      <div style="flex:1;padding:10px;border:1px solid ${T.line};background:#FBFAF7;text-align:center;font-size:12px"><b>${cads}</b><br>CAD</div>
      <div style="flex:1;padding:10px;border:1px solid ${T.line};background:#FBFAF7;text-align:center;font-size:12px"><b>${imgs}</b><br>Εικόνες</div>
    </div>

    ${docs.length===0
      ? `<div style="padding:12px;background:${T.warnBg};font-size:13px">Δεν έχουν προστεθεί αρχεία ακόμα.</div>`
      : docs.map((d,i)=>`
        <div style="display:flex;justify-content:space-between;padding:12px;border:1px solid ${T.line};background:#fff;margin-bottom:6px">
          <div style="min-width:0">
            <div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${d.name}</div>
            <div style="font-size:11px;color:${T.muted}">${d.kb} KB · ${d.kind}</div>
          </div>
          <button data-remove="${i}" style="color:${T.muted};padding:0 6px">×</button>
        </div>
      `).join("")
    }

    ${cads>0?`<div style="margin-top:12px;padding:12px;background:${T.warnBg};font-size:12.5px"><b>CAD:</b> Καταχωρήθηκαν στον φάκελο. Απαιτείται ανθρώπινος έλεγχος περιεχομένου.</div>`:""}
  </div>
  <div style="padding:14px 16px;border-top:1px solid ${T.line};background:#FBFAF7">
    <button data-go="folder" style="width:100%;padding:14px;background:${T.navy};color:#fff;font-weight:600">Κατάσταση φακέλου →</button>
  </div>`;
}

/* ========== FOLDER STATUS ========== */
function viewFolder(){
  const c=getCurrent();
  if(!c) return viewHome();
  const docs=c.documents||[];
  const hasAny=docs.length>0;
  const hasCad=docs.some(d=>d.kind==="CAD");
  const hasPdf=docs.some(d=>d.kind==="PDF");

  const items=[
    {name:"Στοιχεία πελάτη",value:c.customer||"—",status:"declared",hint:"Δηλώθηκε κατά τη δημιουργία"},
    {name:"Διεύθυνση ακινήτου",value:c.address||"—",status:"declared",hint:"Δηλώθηκε κατά τη δημιουργία"},
    {name:"Τύπος εργασίας",value:c.workType||"—",status:"declared",hint:"Καθορίζει τη διαδικασία"},
    {name:"Έγγραφα στον φάκελο",value:hasAny?`${docs.length} αρχείο/α`:"Κανένα",status:hasAny?"declared":"missing",hint:hasAny?"Υπάρχει υλικό για προετοιμασία":"Στοιχείο που λείπει από τον φάκελο"},
    {name:"CAD σχέδια",value:hasCad?"Υπάρχουν — προς έλεγχο":"Δεν υπάρχουν",status:hasCad?"needs_check":"missing",hint:hasCad?"Απαιτείται ανθρώπινος έλεγχος":"Μπορεί να ζητηθούν από ιδιοκτήτη/μηχανικό"},
    {name:"PDF τεκμήρια",value:hasPdf?"Υπάρχουν":"Δεν υπάρχουν",status:hasPdf?"declared":"needs_check",hint:hasPdf?"Στον φάκελο εργασίας":"Π.χ. άδεια, μελέτες, παλιά σχέδια"},
    {name:"Αυτοψία",value:"Δεν έχει γίνει",status:"not_done",hint:"Διαδικασία που δεν έχει γίνει ακόμα"}
  ];

  const counts={
    declared:items.filter(i=>i.status==="declared").length,
    needs:items.filter(i=>i.status==="needs_check").length,
    missing:items.filter(i=>i.status==="missing").length,
    notDone:items.filter(i=>i.status==="not_done").length,
    total:items.length
  };

  function chip(s){
    const m={declared:{c:T.warn,bg:T.warnBg,t:"ΔΗΛΩΘΗΚΕ"},needs_check:{c:T.warn,bg:T.warnBg,t:"ΠΡΟΣ ΕΛΕΓΧΟ"},missing:{c:T.bad,bg:T.badBg,t:"ΛΕΙΠΕΙ"},not_done:{c:T.bad,bg:T.badBg,t:"ΔΕΝ ΕΧΕΙ ΓΙΝΕΙ"}};
    const x=m[s]||m.needs_check;
    return `<span style="display:inline-flex;align-items:center;gap:5px;padding:3px 7px;background:${x.bg};color:${x.c};font-size:10px;font-weight:700"><span style="width:6px;height:6px;background:${x.c}"></span>${x.t}</span>`;
  }

  return `
  ${topbar("Κατάσταση φακέλου", chipStatus(c.lifecycle||"collection"))}
  <div style="flex:1;padding:16px 20px;overflow:auto">
    <button data-go="case" style="color:${T.muted};font-size:13px;font-weight:600;margin-bottom:12px">← Υπόθεση</button>
    <p style="font-size:13px;color:${T.muted};margin-bottom:14px">Τι έχουμε, τι λείπει, τι θέλει έλεγχο. Δεν αποτελεί ένδειξη τελικής ορθότητας.</p>

    <div style="padding:14px;border:1px solid ${T.line};background:#FBFAF7;margin-bottom:14px">
      <div style="display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13.5px">
        <span>Δηλωμένα</span><strong>${counts.declared}/${counts.total}</strong>
        <span>Προς έλεγχο</span><strong>${counts.needs}/${counts.total}</strong>
        <span>Λείπουν</span><strong style="color:${T.bad}">${counts.missing}/${counts.total}</strong>
        <span>Δεν έχουν γίνει</span><strong style="color:${T.bad}">${counts.notDone}/${counts.total}</strong>
      </div>
    </div>

    ${items.map(it=>`
      <div style="padding:12px;border:1px solid ${T.line};background:#fff;margin-bottom:6px">
        <div style="display:flex;justify-content:space-between;gap:10px">
          <div>
            <div style="font-weight:700;font-size:13.5px">${it.name}</div>
            <div style="font-size:13px;margin-top:2px">${it.value}</div>
            <div style="font-size:11px;color:${T.muted};margin-top:3px">${it.hint}</div>
          </div>
          ${chip(it.status)}
        </div>
      </div>
    `).join("")}

    <div style="margin-top:14px;padding:14px;border:1px solid ${T.navy};background:${T.info}">
      <div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:${T.navy};margin-bottom:6px">Επόμενο ασφαλές βήμα</div>
      <div style="font-weight:700;font-size:14.5px">${nextAction(c)}</div>
      <div style="font-size:12.5px;color:#3A4555;margin-top:6px">${nextWhy(c)}</div>
    </div>
  </div>
  <div style="padding:14px 16px;border-top:1px solid ${T.line};background:#FBFAF7">
    <button data-go="case" style="width:100%;padding:14px;background:${T.navy};color:#fff;font-weight:600">Επιστροφή στην υπόθεση</button>
  </div>`;
}

/* ========== LOGIC ========== */
function nextAction(c){
  const docs=c.documents||[];
  if(docs.length===0) return "Συγκέντρωσε διαθέσιμα έγγραφα από πελάτη / μηχανικό";
  if(docs.some(d=>d.kind==="CAD")) return "Έλεγξε το περιεχόμενο των CAD αρχείων";
  if((c.lifecycle||"collection")==="collection") return "Ολοκλήρωσε τον φάκελο και προγραμμάτισε αυτοψία";
  return "Προχώρα στο επόμενο στάδιο της διαδικασίας";
}
function nextWhy(c){
  const docs=c.documents||[];
  if(docs.length===0) return "Χωρίς υλικό στον φάκελο η αυτοψία γίνεται λιγότερο στοχευμένη.";
  if(docs.some(d=>d.kind==="CAD")) return "Τα CAD έχουν καταχωρηθεί, αλλά απαιτούν ανθρώπινο έλεγχο πριν θεωρηθούν επαρκή.";
  return "Υπάρχει βάση υλικού. Το επόμενο κρίσιμο βήμα είναι επιβεβαίωση στην πράξη.";
}

function fileKind(name){
  if(/\.pdf$/i.test(name)) return "PDF";
  if(/\.(dwg|dxf)$/i.test(name)) return "CAD";
  if(/\.(jpe?g|png)$/i.test(name)) return "Εικόνα";
  return "Άλλο";
}

function bind(){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{screen=b.dataset.go;render()});
  document.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{draft.workType=b.dataset.type;render()});
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{currentId=b.dataset.open;screen="case";render()});

  const cust=document.getElementById("customer"); if(cust) cust.oninput=e=>draft.customer=e.target.value;
  const phone=document.getElementById("phone"); if(phone) phone.oninput=e=>draft.phone=e.target.value;
  const addr=document.getElementById("address"); if(addr) addr.oninput=e=>draft.address=e.target.value;

  // live enable create button
  const createBtn=document.querySelector("[data-create]");
  if(createBtn){
    const refresh=()=>{
      const ok=draft.customer.trim()&&draft.address.trim()&&draft.workType;
      createBtn.disabled=!ok;
      createBtn.style.background=ok?T.navy:"#C9C4B6";
    };
    if(cust) cust.oninput=e=>{draft.customer=e.target.value;refresh()};
    if(phone) phone.oninput=e=>{draft.phone=e.target.value};
    if(addr) addr.oninput=e=>{draft.address=e.target.value;refresh()};
    createBtn.onclick=()=>{
      if(!(draft.customer.trim()&&draft.address.trim()&&draft.workType)) return;
      const id=uid();
      const now=Date.now();
      cases.push({
        id,
        customer:draft.customer.trim(),
        phone:draft.phone.trim(),
        address:draft.address.trim(),
        workType:draft.workType,
        lifecycle:"collection",
        documents:[],
        createdAt:now,
        updatedAt:now
      });
      save();
      draft={customer:"",phone:"",address:"",workType:""};
      currentId=id;
      screen="case";
      render();
    };
  }

  const fi=document.getElementById("fileInput");
  if(fi){
    fi.onchange=e=>{
      const c=getCurrent();
      if(!c) return;
      const list=Array.from(e.target.files||[]);
      list.forEach(f=>{
        c.documents.push({
          name:f.name,
          kb:Math.max(1,Math.round(f.size/1024)),
          kind:fileKind(f.name)
        });
      });
      c.updatedAt=Date.now();
      save();
      render();
    };
  }

  document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{
    const c=getCurrent();
    if(!c) return;
    c.documents.splice(+b.dataset.remove,1);
    c.updatedAt=Date.now();
    save();
    render();
  });

  const del=document.querySelector("[data-delete]");
  if(del) del.onclick=()=>{
    if(!confirm("Διαγραφή αυτής της υπόθεσης;")) return;
    cases=cases.filter(c=>c.id!==currentId);
    save();
    currentId=null;
    screen="home";
    render();
  };
}

load();
render();
})();
</script>
</body>
</html>
