<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<meta name="theme-color" content="#1D3557"/>
<title>AI Senior Engineer — Product v4</title>
<style>
:root{--paper:#F5F4EF;--ink:#23272B;--muted:#6B6B63;--line:#DBD6C9;--navy:#1D3557;--soft:#2A466E;--ok:#3A6B4C;--okBg:#E7EFE8;--warn:#A8791F;--warnBg:#F5EEDC;--bad:#A8412F;--badBg:#F5E4DF;--info:#EEF1F5;--conf:#4A3B6B;--confBg:#EDE8F5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#e5e3db;color:var(--ink);min-height:100dvh;display:flex;justify-content:center}
#app{width:100%;max-width:440px;min-height:100dvh;background:var(--paper);box-shadow:0 0 40px rgba(0,0,0,.08);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:none;background:none}button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);background:#fff;font-size:14px}textarea{min-height:68px;resize:vertical}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);background:#FBFAF7;position:sticky;top:0;z-index:8}
.brand{font-weight:800;color:var(--navy);font-size:13px}.brand small{display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.save-ind{font-size:10px;color:var(--ok);font-weight:600}
.scroll{flex:1;overflow:auto;padding:14px 16px}.foot{padding:12px 14px;border-top:1px solid var(--line);background:#FBFAF7}
.btn{width:100%;padding:13px;background:var(--navy);color:#fff;font-weight:700;font-size:14px}
.btn.ghost{background:#fff;color:var(--muted);border:1px solid var(--line)}.btn.ok{background:var(--ok)}.btn.danger{background:#fff;color:var(--bad);border:1px solid var(--line)}
.btn.sm{padding:7px 10px;font-size:12px;width:auto}
.card{border:1px solid var(--line);background:#fff;padding:12px;margin-bottom:9px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;font-size:9px;font-weight:700}
.label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.muted{color:var(--muted);font-size:12.5px;line-height:1.45}.h1{font-size:19px;font-weight:800;margin:4px 0 6px}.h2{font-size:15px;font-weight:800;margin-bottom:6px}
.nsa{border:1px solid var(--navy);background:var(--info);padding:12px;margin:10px 0}.nsa .t{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);font-weight:700;margin-bottom:5px}
.hero{background:var(--navy);color:#F5F4EF;padding:22px 16px 16px}.hero p{color:#C3CEDD;font-size:13px;margin-top:6px;line-height:1.4}
.tabs{display:flex;gap:4px;margin:8px 0 12px;flex-wrap:wrap}.tab{padding:6px 8px;border:1px solid var(--line);background:#fff;font-size:11px;font-weight:700;color:var(--muted)}.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.choice{display:block;width:100%;text-align:left;padding:11px 12px;border:1px solid var(--line);background:#fff;margin-bottom:7px;font-weight:600;font-size:13px}.choice.on{background:var(--navy);border-color:var(--navy);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{flex:1;padding:8px;border:1px solid var(--line);background:#FBFAF7;text-align:center;font-size:11px}
.row{display:flex;gap:7px;flex-wrap:wrap}.quote{padding:10px;background:#EFEDE4;border-left:2px solid var(--soft);font-size:12px;color:#454540;line-height:1.45;margin:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:var(--navy);color:#fff;padding:9px 12px;font-size:12px;z-index:50;max-width:92%}
.steps{display:flex;gap:2px;flex-wrap:wrap;margin:6px 0 10px}.steps span{padding:3px 5px;border:1px solid var(--line);background:#fff;font-size:8px;color:var(--muted)}.steps span.on{background:var(--navy);color:#fff;border-color:var(--navy)}.steps span.done{background:var(--okBg);color:var(--ok);border-color:var(--ok)}
.log{font-family:ui-monospace,Menlo,monospace;font-size:10px;line-height:1.4;white-space:pre-wrap;background:#1a1d21;color:#d6d8db;padding:10px;max-height:200px;overflow:auto}
.check{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:13px}.check input{width:auto;margin-top:2px}
.act-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
const KEY='ai-senior-v4';
const PROCESSES=['ΠΕΑ','ΗΤΚ','ΕΕΔΜΚ','Νέα Άδεια','Τοπογραφικό'];
const STAGES=['case','intake','documents','evidence','check','regulation','decision','review'];
const SL={case:'CASE',intake:'INTAKE',documents:'DOCS',evidence:'EVIDENCE',check:'CHECK',regulation:'REG',decision:'DECISION',review:'REVIEW'};
const ST={verified:{c:'var(--ok)',bg:'var(--okBg)',t:'VERIFIED'},declared:{c:'var(--warn)',bg:'var(--warnBg)',t:'DECLARED'},needs_verification:{c:'var(--warn)',bg:'var(--warnBg)',t:'NEEDS VERIF.'},missing:{c:'var(--bad)',bg:'var(--badBg)',t:'MISSING'},conflict:{c:'var(--conf)',bg:'var(--confBg)',t:'CONFLICT'},outdated:{c:'var(--warn)',bg:'var(--warnBg)',t:'OUTDATED'},blocked:{c:'var(--bad)',bg:'var(--badBg)',t:'BLOCKED'},not_done:{c:'var(--bad)',bg:'var(--badBg)',t:'NOT DONE'}};
function chip(s){const x=ST[s]||ST.needs_verification;return `<span class="chip" style="background:${x.bg};color:${x.c}">${x.t}</span>`}
function dchip(s){const m={PROCEED:{c:'var(--ok)',bg:'var(--okBg)'},REQUIRES_VERIFICATION:{c:'var(--warn)',bg:'var(--warnBg)'},BLOCKED:{c:'var(--bad)',bg:'var(--badBg)'},STOP:{c:'var(--bad)',bg:'var(--badBg)'},ESCALATE:{c:'var(--conf)',bg:'var(--confBg)'}};const x=m[s]||m.REQUIRES_VERIFICATION;return `<span class="chip" style="background:${x.bg};color:${x.c}">${s}</span>`}

/** Adaptive intake by process + prior answers. KAEC only when path requires it. */
function nextQuestions(c){
  const p=c.process, a=c.answers||{}, sub=c.subtype||'';
  const q=[];
  if(p==='ΠΕΑ'){
    q.push({id:'building',t:'Τι ακίνητο αφορά το ΠΕΑ;',type:'choice',opts:['Μονοκατοικία','Διαμέρισμα','Επαγγελματικός χώρος','Άλλο'],why:'Κατηγοριοποίηση υπόθεσης.'});
    q.push({id:'year',t:'Έτος κατασκευής (αν γνωστό);',type:'text',ph:'π.χ. 1972',why:'DECLARED μέχρι τεκμηρίωση.'});
    q.push({id:'permit',t:'Υπάρχει οικοδομική άδεια;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'DECLARED ≠ VERIFIED.'});
    q.push({id:'plans',t:'Υπάρχουν διαθέσιμα αρχιτεκτονικά σχέδια;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'OLD ≠ AUTOMATICALLY INVALID.'});
    if(a.plans==='Ναι'){
      q.push({id:'plans_when',t:'Πόσο πρόσφατα είναι περίπου;',type:'choice',opts:['Πρόσφατα','Παλαιότερα','Άγνωστο'],why:'Η ηλικία μόνη της δεν επιβάλλει νέα σχέδια.'});
      q.push({id:'mods',t:'Έχουν γίνει μεταβολές από τότε;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Μεταβολές → έλεγχος υφιστάμενης.'});
      if(a.mods==='Ναι') q.push({id:'mods_type',t:'Τι είδους μεταβολές;',type:'choice',opts:['Ανοίγματα','Διαρρύθμιση','Χρήση','Προσθήκη/αφαίρεση','Άλλο'],why:'Καταγραφή απόκλισης.'});
    }
    q.push({id:'site_needed',t:'Χρειάζεται αυτοψία (επίσκεψη στο ακίνητο);',type:'choice',opts:['Ναι','Αργότερα'],why:'Αυτοψία = φυσικός έλεγχος, όχι συλλογή PDF.'});
  }
  else if(p==='ΗΤΚ'){
    q.push({id:'htk_goal',t:'Τι ζητά ο πελάτης για ΗΤΚ;',type:'choice',opts:['Νέα ΗΤΚ','Ενημέρωση / συμπλήρωση','Μεταβίβαση / συμβόλαιο','Δεν γνωρίζω ακριβώς'],why:'Process classification.'});
    q.push({id:'permit',t:'Υπάρχει οικοδομική άδεια στον φάκελο;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Κρίσιμο evidence.'});
    q.push({id:'plans',t:'Υπάρχουν σχέδια;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Αντιστοίχιση με υφιστάμενη.'});
    q.push({id:'topo',t:'Υπάρχει τοπογραφικό;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Συχνά απαιτούμενο.'});
    // KAEC when identity of property matters for HTK path
    if(a.permit==='Ναι'||a.plans==='Ναι'||a.topo==='Ναι'){
      q.push({id:'kaek',t:'Υπάρχει ΚΑΕΚ (αν εφαρμόζεται);',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω','Δεν εφαρμόζεται ακόμη'],why:'Ζητείται όταν η διαδικασία ταυτοποίησης το απαιτεί — όχι στην πρώτη οθόνη.'});
    }
    q.push({id:'site_needed',t:'Χρειάζεται αυτοψία / αποτύπωση;',type:'choice',opts:['Ναι','Αργότερα'],why:'Πραγματική κατάσταση.'});
  }
  else if(p==='ΕΕΔΜΚ'){
    q.push({id:'work',t:'Είδος εργασίας;',type:'choice',opts:['Διαρρύθμιση','Θερμομόνωση/κουφώματα','Καυστήρας','Χρωματισμοί/σκαλωσιές','Άλλο'],why:'Εύρος ΕΕΔΜΚ.'});
    q.push({id:'permit_exist',t:'Υπάρχει παλαιά άδεια/νομιμοποίηση;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Νομιμότητα υφιστάμενου.'});
    q.push({id:'plans',t:'Υπάρχουν σχέδια υφιστάμενης;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Χωρίς hard rule 5ετίας.'});
    if(a.plans==='Ναι'){
      q.push({id:'plans_when',t:'Πόσο παλιά είναι περίπου;',type:'choice',opts:['Πρόσφατα','5–15 έτη','>15 / άγνωστο'],why:'Συνδυάζεται με μεταβολές.'});
      q.push({id:'mods',t:'Υπάρχουν μεταβολές από τα σχέδια;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Μεταβολές → σύγκριση.'});
    }
    q.push({id:'site_needed',t:'Χρειάζεται αυτοψία;',type:'choice',opts:['Ναι','Αργότερα'],why:'Φυσικός έλεγχος.'});
  }
  else if(p==='Τοπογραφικό'){
    if(!sub){
      q.push({id:'topo_subtype',t:'Τι ακριβώς χρειάζεται;',type:'choice',opts:['Νέο τοπογραφικό','Διόρθωση τοπογραφικού','Έλεγχος υφιστάμενου','Ενημέρωση στοιχείων','Άλλο'],why:'Process classification πριν γενικές ερωτήσεις.'});
    } else if(sub==='Διόρθωση τοπογραφικού'||a.topo_subtype==='Διόρθωση τοπογραφικού'){
      q.push({id:'old_topo',t:'Υπάρχει το υφιστάμενο τοπογραφικό;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Upstream evidence για διόρθωση.'});
      q.push({id:'kaek',t:'Υπάρχει ΚΑΕΚ;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Ζητείται στο rule path διόρθωσης — όχι στην αρχική οθόνη όλων των υποθέσεων.'});
      q.push({id:'ktima',t:'Χρειάζονται κτηματολογικά στοιχεία;',type:'choice',opts:['Αντίγραφο Κτηματολογικού Φύλλου','Απόσπασμα Διαγράμματος','Και τα δύο / άγνωστο','Όχι ακόμη'],why:'Δεν μαντεύει — καταγράφει τι εξετάζεται. Η ακριβής απαίτηση από process rule + official source.'});
      q.push({id:'deviation',t:'Έχει διαπιστωθεί απόκλιση;',type:'choice',opts:['Ναι','Όχι','Υπό έλεγχο'],why:'Καθορίζει αν χρειάζεται νέα αποτύπωση.'});
    } else {
      q.push({id:'purpose',t:'Σκοπός τοπογραφικού;',type:'choice',opts:['Συμβόλαιο','Οικοδομική άδεια','Κτηματολόγιο','Άλλο'],why:'Επηρεάζει deliverables.'});
      q.push({id:'old_topo',t:'Υπάρχει παλαιότερο διάγραμμα;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Μπορεί να μειώσει λάθη.'});
      q.push({id:'titles',t:'Υπάρχουν τίτλοι;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Όρια/ιδιοκτησία.'});
      if(a.purpose==='Κτηματολόγιο'||a.purpose==='Συμβόλαιο'){
        q.push({id:'kaek',t:'Υπάρχει ΚΑΕΚ;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Όταν ο σκοπός το απαιτεί.'});
      }
    }
  }
  else if(p==='Νέα Άδεια'){
    q.push({id:'stage',t:'Στάδιο έργου;',type:'choice',opts:['Διερεύνηση','Έλεγχος οικοπέδου','Στοιχεία','Μελέτες','Υποβολή'],why:'Όχι «υπάρχει άδεια;» σε νέα έκδοση.'});
    q.push({id:'plot',t:'Οικόπεδο ή αγροτεμάχιο;',type:'choice',opts:['Οικόπεδο','Αγροτεμάχιο','Δεν γνωρίζω'],why:'Πολεοδομικό καθεστώς.'});
    q.push({id:'topo',t:'Υπάρχει τοπογραφικό;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Συχνά προαπαιτούμενο.'});
    q.push({id:'titles',t:'Υπάρχουν τίτλοι;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Ταυτοποίηση.'});
  }
  else {
    q.push({id:'goal',t:'Τι θέλεις να πετύχεις;',type:'text',ph:'Περιγραφή',why:'Στόχος υπόθεσης.'});
    q.push({id:'docs_have',t:'Υπάρχουν έγγραφα;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Φάκελος.'});
  }
  return q;
}

let state={screen:'home',cases:[],currentId:null,draft:{},qIndex:0,tab:'overview',toast:null,lastSave:null,filter:'all'};

function uid(p){return ((p||'CASE').replace(/\s/g,'').slice(0,6).toUpperCase())+'-'+new Date().getFullYear()+'-'+String(Math.floor(Math.random()*900)+100)}
function load(){try{const r=localStorage.getItem(KEY);if(r)state.cases=JSON.parse(r)||[]}catch(e){}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state.cases));state.lastSave=Date.now()}catch(e){}}
function cur(){return state.cases.find(c=>c.id===state.currentId)||null}
function toast(m){state.toast=m;render();setTimeout(()=>{state.toast=null;render()},1400)}
function log(c,msg){c.audit=c.audit||[];c.audit.push({t:new Date().toISOString(),msg});c.updatedAt=Date.now();persist()}
function autosave(c){c.updatedAt=Date.now();persist();state.lastSave=Date.now()}
function ansSt(v){if(v==='Ναι')return 'declared';if(v==='Όχι')return 'missing';if(!v)return 'missing';return 'needs_verification'}

function buildEvidence(c){
  const a=c.answers||{}, conf=c.confirmations||{}, insp=c.inspection||{}, docs=c.docs||[], items=[];
  function add(id,name,proposed,critical,source,note){let status=conf[id]||proposed;items.push({id,name,status,proposed,critical:!!critical,source:source||'',note:note||''})}
  add('customer','Πελάτης','declared',false,'Case','');
  add('address','Ακίνητο','declared',false,'Case','');
  if(a.year) add('year','Έτος', 'declared',true,'Δήλωση','');
  if(a.building) add('building','Τύπος ακινήτου','declared',false,'Δήλωση',a.building);
  if(a.permit!==undefined) add('permit','Οικοδομική άδεια',ansSt(a.permit),true,'Δήλωση',a.permit==='Ναι'?'DECLARED — όχι VERIFIED':'');
  if(a.permit_exist!==undefined) add('permit_exist','Παλαιά άδεια',ansSt(a.permit_exist),true,'Δήλωση','');
  if(a.plans!==undefined) add('plans','Σχέδια',ansSt(a.plans),true,'Δήλωση','');
  if(a.plans==='Ναι'){
    if(a.plans_when) add('plans_when','Ηλικία σχεδίων','declared',false,'Δήλωση',a.plans_when);
    if(a.mods==='Ναι'){ add('mods','Μεταβολές','conflict',true,'Δήλωση','Μεταβολές → σύγκριση με πραγματικότητα'); if(a.mods_type) add('mods_type','Είδος μεταβολών','declared',false,'Δήλωση',a.mods_type); }
    else if(a.mods==='Όχι') add('mods','Μεταβολές','declared',true,'Δήλωση','Προς επιβεβαίωση');
    else if(a.mods) add('mods','Μεταβολές','needs_verification',true,'Δήλωση','');
    if(a.mods==='Ναι') add('plans_fit','Καταλληλότητα σχεδίων','conflict',true,'Rule path','Παλαιά/υπάρχοντα + μεταβολές → έλεγχος· όχι αυτόματα νέα σχέδια λόγω ηλικίας.');
    else if(a.plans==='Ναι'&&a.mods==='Όχι') add('plans_fit','Καταλληλότητα σχεδίων','needs_verification',true,'Rule path','Σχέδια υπάρχουν· OLD ≠ INVALID.');
  } else if(a.plans==='Όχι') add('plans_fit','Καταλληλότητα σχεδίων','missing',true,'—','Αποτύπωση/ισοδύναμο όπου απαιτείται');
  if(a.topo!==undefined) add('topo','Τοπογραφικό',ansSt(a.topo),true,'Δήλωση','');
  if(a.old_topo!==undefined) add('old_topo','Υφιστάμενο τοπογραφικό',ansSt(a.old_topo),true,'Δήλωση','');
  if(a.titles!==undefined) add('titles','Τίτλοι',ansSt(a.titles),true,'Δήλωση','');
  if(a.kaek!==undefined) add('kaek','ΚΑΕΚ',ansSt(a.kaek),true,'Δήλωση — όταν το path το ζήτησε','');
  if(a.ktima) add('ktima','Κτηματολογικά',a.ktima==='Όχι ακόμη'?'needs_verification':'declared',true,'Δήλωση',a.ktima);
  if(a.deviation==='Ναι') add('deviation','Απόκλιση τοπογραφικού','conflict',true,'Δήλωση','Διαπιστωμένη απόκλιση');
  if(a.work) add('work','Εργασία ΕΕΔΜΚ','declared',true,'Δήλωση',a.work);
  if(a.htk_goal) add('htk_goal','Στόχος ΗΤΚ','declared',true,'Δήλωση',a.htk_goal);
  if(a.stage) add('stage','Στάδιο νέας άδειας','declared',true,'Δήλωση',a.stage);
  if(a.topo_subtype||c.subtype) add('topo_subtype','Υποτύπος τοπογραφικού','declared',true,'Classification',a.topo_subtype||c.subtype);
  if(docs.length) add('docs','Αρχεία','declared',false,'Upload',docs.length+' · UPLOAD ≠ VERIFIED');
  else add('docs','Αρχεία','missing',false,'—','');
  if(insp.done) add('inspection','Αυτοψία',insp.conflict?'conflict':'needs_verification',true,'Επί τόπου',insp.notes||'');
  else if(a.site_needed==='Ναι') add('inspection','Αυτοψία','not_done',true,'—','Εκκρεμεί επίσκεψη');
  return items;
}

function compute(c){
  const ev=buildEvidence(c), gaps=[], conflicts=[], deps=[];
  ev.forEach(e=>{
    if(e.status==='conflict') conflicts.push({id:e.id,title:e.name,detail:e.note||'',why:'CONFLICT ≠ PROCEED',need:'Επανέλεγχος / τεκμηρίωση / αυτοψία'});
    if((e.status==='missing'||e.status==='not_done')&&e.critical) gaps.push({id:e.id,name:e.name,level:'critical',why:'Κρίσιμο',need:'Συλλογή/επιβεβαίωση'});
    else if(e.status==='needs_verification'&&e.critical) gaps.push({id:e.id,name:e.name,level:'important',why:'Unverified',need:'Επιβεβαίωση'});
    else if(e.status==='missing') gaps.push({id:e.id,name:e.name,level:'minor',why:'Δευτερεύον',need:'Προαιρετικό'});
  });
  const insp=ev.find(e=>e.id==='inspection'), fit=ev.find(e=>e.id==='plans_fit'), perm=ev.find(e=>e.id==='permit'||e.id==='permit_exist');
  const oldT=ev.find(e=>e.id==='old_topo'), kaek=ev.find(e=>e.id==='kaek');
  if(insp&&(insp.status==='not_done'||insp.status==='missing')) deps.push({from:'Αυτοψία',to:'Τελική αξιολόγηση',blocked:true});
  if(fit&&(fit.status==='missing'||fit.status==='conflict')) deps.push({from:'Σχέδια',to:'Υποβολή/κρίση',blocked:true});
  if(oldT&&(oldT.status==='missing')) deps.push({from:'Υφιστάμενο τοπογραφικό',to:'Διόρθωση',blocked:true});
  if(kaek&&(kaek.status==='missing'||kaek.status==='needs_verification')&&(c.process==='Τοπογραφικό'||c.process==='ΗΤΚ')) deps.push({from:'ΚΑΕΚ',to:'Κτηματολογικός έλεγχος',blocked:false});

  const candidates=[];
  if(conflicts.length) candidates.push({p:1,title:'Επανέλεγχος ασυμφωνιών πριν proceed',why:conflicts.map(x=>x.title).join(', '),decision:'ESCALATE'});
  if(fit&&fit.status==='conflict') candidates.push({p:1,title:'Σύγκρινε σχέδια με υφιστάμενη (αυτοψία/μετρήσεις)',why:'Μεταβολές + σχέδια → έλεγχος· ηλικία μόνη της δεν επιβάλλει νέα σχέδια.',decision:'REQUIRES_VERIFICATION'});
  if(fit&&fit.status==='missing') candidates.push({p:1,title:'Εξασφάλισε σχέδια ή αποτύπωση',why:'Χωρίς βάση δεν είναι ασφαλής κρίσιμη απόφαση.',decision:'REQUIRES_VERIFICATION'});
  if(fit&&fit.status==='needs_verification') candidates.push({p:2,title:'Επαλήθευσε καταλληλότητα σχεδίων',why:'OLD ≠ AUTOMATICALLY INVALID.',decision:'REQUIRES_VERIFICATION'});
  if(c.process==='Τοπογραφικό'&&(c.subtype==='Διόρθωση τοπογραφικού'||(c.answers||{}).topo_subtype==='Διόρθωση τοπογραφικού')){
    if(oldT&&oldT.status==='missing') candidates.push({p:1,title:'Ζήτησε το υφιστάμενο τοπογραφικό',why:'Upstream για διόρθωση.',decision:'REQUIRES_VERIFICATION'});
    if(kaek&&(kaek.status==='missing'||kaek.status==='needs_verification')) candidates.push({p:2,title:'Εξασφάλισε ΚΑΕΚ / κτηματολογικά στοιχεία που απαιτεί το rule path',why:'Δεν μαντεύει επίσημο έγγραφο — καταγράφει ανάγκη verification από applicable source.',decision:'REQUIRES_VERIFICATION'});
    if((c.answers||{}).deviation==='Ναι') candidates.push({p:2,title:'Αξιολόγησε αν απαιτείται νέα αποτύπωση μετά τη διαπιστωμένη απόκλιση',why:'Decision guidance — όχι αυτόματο proceed.',decision:'REQUIRES_VERIFICATION'});
  }
  if(perm&&(perm.status==='missing'||perm.status==='needs_verification')) candidates.push({p:2,title:'Εντόπισε/επιβεβαίωσε άδεια από έγγραφο',why:'DECLARED ≠ VERIFIED.',decision:'REQUIRES_VERIFICATION'});
  if(insp&&insp.status==='not_done') candidates.push({p:3,title:'Προγραμμάτισε αυτοψία στο ακίνητο',why:'Φυσικός έλεγχος vs φάκελος.',decision:'REQUIRES_VERIFICATION'});
  if(!c.regulationVerified) candidates.push({p:4,title:'Επιβεβαίωσε ισχύον κανονιστικό πλαίσιο (versioned KB)',why:'OUTDATED ≠ CURRENT AUTHORITY.',decision:'REQUIRES_VERIFICATION'});
  if(!(c.docs||[]).length) candidates.push({p:5,title:'Πρόσθεσε έγγραφα στον φάκελο',why:'UPLOAD ≠ VERIFIED.',decision:'REQUIRES_VERIFICATION'});
  candidates.push({p:9,title:'Senior Review με rationale',why:'Completion gate — όχι «πάτησε Complete».',decision:'REQUIRES_VERIFICATION'});
  candidates.sort((a,b)=>a.p-b.p);
  const primary=candidates[0], secondary=candidates.slice(1,3);
  const crit=gaps.filter(g=>g.level==='critical');
  let decision='REQUIRES_VERIFICATION';
  if(conflicts.length) decision='ESCALATE';
  else if(crit.length&&deps.some(d=>d.blocked)) decision='BLOCKED';
  else if(crit.length) decision='REQUIRES_VERIFICATION';
  else if(c.regulationVerified&&!crit.length&&!conflicts.length&&c.review&&c.review.verdict==='approve') decision='PROCEED';
  else if(!crit.length&&!conflicts.length) decision='REQUIRES_VERIFICATION';

  let stage='case';
  if(c.completed||(c.review&&c.review.done)) stage='review';
  else if(c.regulationVerified) stage='decision';
  else if((c.inspection&&c.inspection.done)||crit.length||conflicts.length) stage='check';
  else if((c.docs||[]).length) stage='documents';
  else if(Object.keys(c.answers||{}).length) stage='evidence';
  else stage='intake';
  const known=ev.filter(e=>e.status==='verified'||e.status==='declared').length;
  return {ev,gaps,conflicts,deps,primary,secondary,decision,stage,crit,known,total:ev.length};
}

function top(title,extra=''){const save=state.lastSave?`✓ Αποθηκεύτηκε πριν ${Math.max(1,Math.round((Date.now()-state.lastSave)/1000))}s`:'';return `<div class="top"><div class="brand">AI Senior Engineer<small>${title}</small></div><div style="text-align:right">${extra}<div class="save-ind">${save}</div></div></div>`}

function render(){
  const root=document.getElementById('app');
  let html='';
  if(state.screen==='home') html=viewHome();
  else if(state.screen==='pick') html=viewPick();
  else if(state.screen==='new') html=viewNew();
  else if(state.screen==='intake') html=viewIntake();
  else if(state.screen==='case') html=viewCase();
  else if(state.screen==='inspection') html=viewInspection();
  else if(state.screen==='review') html=viewReview();
  else if(state.screen==='audit') html=viewAudit();
  root.innerHTML=html+(state.toast?`<div class="toast">${state.toast}</div>`:'');
  bind();
}

function bind(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.screen=b.dataset.go;render()});
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{state.currentId=b.dataset.open;state.screen='case';state.tab='overview';render()});
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{state.draft={process:b.dataset.pick};state.screen='new';render()});
  document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{state.draft.subtype=b.dataset.sub;render()});
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});
  document.querySelectorAll('[data-go-intake]').forEach(b=>b.onclick=()=>{state.qIndex=0;state.screen='intake';render()});

  ['customer','phone','address','request'].forEach(id=>{
    const el=document.getElementById(id); if(!el) return;
    el.oninput=e=>{state.draft[id]=e.target.value;const ok=state.draft.customer&&state.draft.address&&state.draft.process;const btn=document.querySelector('[data-create]');if(btn)btn.disabled=!ok};
  });

  const create=document.querySelector('[data-create]');
  if(create) create.onclick=()=>{
    if(!(state.draft.customer&&state.draft.address&&state.draft.process)) return;
    const id=uid(state.draft.process);
    const c={id,customer:state.draft.customer.trim(),phone:(state.draft.phone||'').trim(),address:state.draft.address.trim(),
      request:(state.draft.request||'').trim(),process:state.draft.process,subtype:state.draft.subtype||'',
      answers:{},docs:[],confirmations:{},inspection:{},review:{},regulationVerified:false,completed:false,
      createdAt:Date.now(),updatedAt:Date.now(),audit:[]};
    if(c.subtype) c.answers.topo_subtype=c.subtype;
    log(c,'CASE CREATED · '+c.process+(c.subtype?' · '+c.subtype:''));
    state.cases.push(c);persist();state.currentId=id;state.qIndex=0;state.screen='intake';state.draft={};toast(id);render();
  };

  const ans=document.getElementById('ans');
  if(ans) ans.oninput=e=>{const c=cur();if(!c)return;const list=nextQuestions(c);c.answers=c.answers||{};c.answers[list[state.qIndex].id]=e.target.value;autosave(c);const btn=document.querySelector('[data-next-q]');if(btn)btn.disabled=!e.target.value.trim()};
  document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{
    const c=cur();if(!c)return;const list=nextQuestions(c);const qid=list[state.qIndex].id;
    c.answers=c.answers||{};c.answers[qid]=b.dataset.opt;
    if(qid==='topo_subtype') c.subtype=b.dataset.opt;
    log(c,'INTAKE · '+qid+'='+b.dataset.opt);autosave(c);render();
  });
  const nq=document.querySelector('[data-next-q]');
  if(nq) nq.onclick=()=>{const c=cur();if(!c)return;const list=nextQuestions(c);if(state.qIndex<list.length-1){state.qIndex++;render()}else{log(c,'INTAKE COMPLETE');state.screen='case';state.tab='overview';toast('Workspace');render()}};
  const bq=document.querySelector('[data-back-q]');
  if(bq) bq.onclick=()=>{if(state.qIndex>0){state.qIndex--;render()}else{state.screen='case';render()}};

  document.querySelectorAll('[data-conf]').forEach(b=>b.onclick=()=>{const c=cur();if(!c)return;c.confirmations=c.confirmations||{};c.confirmations[b.dataset.conf]=b.dataset.to;log(c,'EVIDENCE · '+b.dataset.conf+'→'+b.dataset.to);autosave(c);render()});
  const fi=document.getElementById('fileInput');
  if(fi) fi.onchange=e=>{const c=cur();if(!c)return;Array.from(e.target.files||[]).forEach(f=>{let kind='File';if(/\.pdf$/i.test(f.name))kind='PDF';else if(/\.(jpe?g|png)$/i.test(f.name))kind='IMG';else if(/\.(dwg|dxf)$/i.test(f.name))kind='CAD';c.docs=c.docs||[];c.docs.push({name:f.name,kb:Math.max(1,Math.round(f.size/1024)),kind})});log(c,'DOCUMENT UPLOADED');autosave(c);toast('Upload');render()};
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const c=cur();if(!c)return;c.docs.splice(+b.dataset.rm,1);autosave(c);render()});
  const reg=document.querySelector('[data-reg]');
  if(reg) reg.onclick=()=>{const c=cur();if(!c)return;c.regulationVerified=true;log(c,'REGULATION VERIFIED');autosave(c);toast('Reg OK');render()};

  document.querySelectorAll('[data-chk]').forEach(el=>{el.onchange=()=>{const c=cur();if(!c)return;c.inspection=c.inspection||{checks:{}};c.inspection.checks=c.inspection.checks||{};c.inspection.checks[el.dataset.chk]=el.checked;autosave(c)}});
  const si=document.querySelector('[data-save-insp]');
  if(si) si.onclick=()=>{const c=cur();if(!c)return;const notes=(document.getElementById('inspNotes')||{}).value||'';const conflict=!!(document.getElementById('inspConflict')||{}).checked;c.inspection={done:true,notes,conflict,checks:{...(c.inspection&&c.inspection.checks||{})},at:new Date().toISOString()};log(c,'INSPECTION · conflict='+conflict);autosave(c);toast('Αυτοψία');render()};

  document.querySelectorAll('[data-verdict]').forEach(b=>b.onclick=()=>{const c=cur();if(!c)return;c.review=c.review||{};c.review.verdict=b.dataset.verdict;autosave(c);render()});
  const sr=document.querySelector('[data-save-review]');
  if(sr) sr.onclick=()=>{const c=cur();if(!c)return;c.review=c.review||{};c.review.done=true;c.review.rationale=(document.getElementById('rationale')||{}).value||'';c.review.at=new Date().toISOString();log(c,'SENIOR REVIEW · '+c.review.verdict);autosave(c);toast('Review');render()};
  const comp=document.querySelector('[data-complete]');
  if(comp) comp.onclick=()=>{const c=cur();if(!c)return;const d=compute(c);const ok=d.decision==='PROCEED'&&c.review&&c.review.verdict==='approve'&&!d.crit.length&&!d.conflicts.length&&c.regulationVerified;if(!ok){toast('Completion gate blocked');return}c.completed=true;log(c,'COMPLETED');autosave(c);toast('Ολοκληρώθηκε');render()};
  const exp=document.querySelector('[data-export]');
  if(exp) exp.onclick=()=>{const c=cur();if(!c)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({case:c,computed:compute(c)},null,2)],{type:'application/json'}));a.download=c.id+'.json';a.click()};
  const del=document.querySelector('[data-del]');
  if(del) del.onclick=()=>{if(!confirm('Διαγραφή;'))return;state.cases=state.cases.filter(x=>x.id!==state.currentId);persist();state.currentId=null;state.screen='home';render()};
}

load();render();
})();
</script>
</body>
</html>
