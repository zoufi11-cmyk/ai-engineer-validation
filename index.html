<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Senior Engineer — Demo v3</title>
<style>
:root{--paper:#F5F4EF;--ink:#23272B;--muted:#6B6B63;--line:#DBD6C9;--navy:#1D3557;--navy2:#2A466E;--green:#3A6B4C;--greenbg:#E7EFE8;--yellow:#A8791F;--yellowbg:#F5EEDC;--red:#A8412F;--redbg:#F5E4DF;--info:#EEF1F5;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#E4E0D4;color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
#app{min-height:100vh}
.topbar{height:58px;background:#FBFAF7;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20}
.brand{font-weight:800;color:var(--navy)}
.brand small{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.navbtn{border:1px solid var(--line);background:#fff;color:var(--muted);padding:8px 11px;font-size:12px;font-weight:700}
.navbtn.active{background:var(--navy);border-color:var(--navy);color:#fff}
.mobile{width:100%;max-width:430px;min-height:calc(100vh - 58px);margin:0 auto;background:var(--paper);border-left:1px solid var(--line);border-right:1px solid var(--line);display:flex;flex-direction:column}
.hero{padding:30px 20px 24px;background:var(--navy);color:#F5F4EF}
.hero h1{font-size:23px;margin:5px 0}
.hero p{font-size:13px;line-height:1.5;color:#C3CEDD;margin:5px 0}
.label{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;font-size:10px;color:var(--muted)}
.label.light{color:#9FB3CC}
.content{flex:1;padding:20px;overflow:auto}
.cardbtn{width:100%;display:flex;align-items:center;gap:12px;padding:16px;margin-bottom:20px;border:1px solid var(--navy);background:#fff;text-align:left;color:var(--ink);border-radius:10px}
.newicon{width:38px;height:38px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;border-radius:10px}
.recent{display:flex;justify-content:space-between;gap:8px;padding:16px;border:1px solid var(--line);background:#fff;border-radius:10px}
.titleblock{display:grid;grid-template-columns:2fr 1fr;border-bottom:1px solid var(--line);background:#FBFAF7}
.titlecase{padding:10px 16px;border-right:1px solid var(--line);min-width:0}
.titlestatus{padding:10px 12px}
.statusline{display:flex;gap:5px;align-items:center;font-size:10px;font-weight:700}
.dot{width:8px;height:8px;display:inline-block}
.back{border:0;background:none;color:var(--muted);font-size:13px;font-weight:700;padding:7px 0;margin-bottom:8px}
h2{font-size:18px;margin:10px 0 6px}
p{line-height:1.5}
.sub{font-size:12.5px;color:var(--muted);margin:0 0 18px}
.field{margin-bottom:12px}
.inputwrap{display:flex;align-items:center;padding:12px;border:1px solid var(--line);background:#fff;border-radius:8px}
.inputwrap input{width:100%;border:0;outline:0;background:none;color:var(--ink);font-size:14px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.types button{padding:11px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px;font-weight:700;border-radius:8px;text-align:left}
.types button.selected{border-color:var(--navy);background:var(--navy);color:#fff}
.footer{padding:16px 20px;border-top:1px solid var(--line);background:#FBFAF7}
.primary{width:100%;padding:14px;border:0;background:var(--navy);color:#fff;font-weight:700;border-radius:8px}
.primary:disabled{background:#C9C4B6}
.progress{display:flex;gap:6px;margin:16px 0 24px}
.progress span{height:3px;flex:1;background:var(--line);border-radius:999px}
.progress span.on{background:var(--navy)}
.reason{padding:10px 12px;margin-top:12px;background:#EFEDE4;border-left:2px solid var(--navy2);font-size:12px;color:#454540;border-radius:4px}
.biginput{width:100%;padding:12px;border:1px solid var(--line);background:#fff;outline:none;border-radius:8px}
.options{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.options button{display:flex;justify-content:space-between;padding:13px 16px;border:1px solid var(--line);background:#fff;text-align:left;font-weight:700;border-radius:8px}
.options button.selected{background:var(--navy);border-color:var(--navy);color:#fff}
@media(max-width:600px){.topbar{padding:0 10px}.brand{font-size:13px}.navbtn{font-size:10px;padding:7px 8px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
const root=document.getElementById('app');
let mode='app';
let state={screen:'home',caseData:{customer:'',address:'',workType:''},answers:{},qIndex:0,files:[]};

const esc=s=>String(s||'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#039;'}[m]));
const icon=n=>({plus:'＋',arrow:'→',back:'←',check:'✓',alert:'⚠'}[n]||'•');
const chip=(tone,text)=>`<span class="chip ${tone}"><i></i>${text}</span>`;

const workTypes=[
  ['Νέα Άδεια','Νέα οικοδομική άδεια και τεχνικός έλεγχος'],
  ['ΠΕΑ','Ενεργειακή επιθεώρηση και στοιχεία ακινήτου'],
  ['Αυτοψία','Οργάνωση αυτοψίας και τεκμηρίωσης'],
  ['Τοπογραφικό','Συλλογή στοιχείων για τοπογραφική εργασία'],
  ['Αυθαίρετο','Έλεγχος και οργάνωση αυθαίρετων κατασκευών'],
  ['Άλλο','Νέα τεχνική υπόθεση']
];

const qs=[
  {id:'year',text:'Ποιο είναι το έτος κατασκευής;',reason:'Το έτος αποτελεί αρχική πληροφορία. Δεν θεωρείται επιβεβαιωμένο μέχρι να ελεγχθεί σε διαθέσιμα έγγραφα ή άλλη αξιόπιστη πηγή.',type:'text',placeholder:'π.χ. 1972'},
  {id:'plans',text:'Υπάρχουν διαθέσιμα αρχιτεκτονικά σχέδια;',reason:'Η ύπαρξη σχεδίων βοηθά στον έλεγχο του φακέλου, αλλά από μόνη της δεν αποδεικνύει πλήρη τεκμηρίωση.',options:['Ναι','Όχι','Δεν γνωρίζω']},
  {id:'topo',text:'Υπάρχει τοπογραφικό;',reason:'Το τοπογραφικό είναι κρίσιμο για τη συσχέτιση του ακινήτου με το οικόπεδο και τον έλεγχο των βασικών στοιχείων.',options:['Ναι','Όχι','Δεν γνωρίζω']}
];

function topbar(){
  return `<div class="topbar"><div class="brand">AI Senior Engineer<small>Demo v3 · LinkedIn prototype</small></div><div class="topnav"><button class="navbtn ${mode==='app'?'active':''}" data-mode="app">Εφαρμογή</button><button class="navbtn ${mode==='arch'?'active':''}" data-mode="arch">v8 Core</button></div></div>`;
}
function titleBlock(name,status){
  const cfg=status==='red'?['var(--red)','ΕΚΚΡΕΜΟΤΗΤΑ']:status==='neutral'?['var(--muted)','ΝΕΑ ΥΠΟΘΕΣΗ']:['var(--yellow)','ΧΡΕΙΑΖΕΤΑΙ ΕΛΕΓΧΟ'];
  return `<div class="titleblock"><div class="titlecase"><div class="label">Υπόθεση</div><div>${esc(name)}</div></div><div class="titlestatus"><div class="label">Κατάσταση</div><div class="statusline"><span class="dot" style="background:${cfg[0]}"></span><span style="color:${cfg[0]}">${cfg[1]}</span></div></div></div>`;
}
function footerButton(text,action,disabled=false){return `<div class="footer"><button class="primary" data-action="${action}" ${disabled?'disabled':''}>${text} ${icon('arrow')}</button></div>`;}
function back(){return `<button class="back" data-action="back">${icon('back')} Πίσω</button>`;}
function ext(n){return (String(n||'').split('.').pop()||'').toUpperCase();}
function renderHome(){return `<div class="mobile"><div class="hero"><div class="label light">AI Senior Engineer</div><h1>Καλώς ήρθες.</h1><p>Οργάνωσε την υπόθεση. Εντόπισε τα κενά. Δες το επόμενο βήμα.</p></div><div class="content"><button class="cardbtn" data-action="new"><span class="newicon">${icon('plus')}</span><span><b>Νέα υπόθεση</b><small>Δημιουργία νέου τεχνικού φακέλου</small></span>${icon('arrow')}</button><div class="label">Πρόσφατες υποθέσεις</div><div class="recent"><div><b>Νέα Άδεια — Κατοικία</b><small>Έτος κατασκευής 1972</small></div>${chip('pending','ΧΡΕΙΑΖΕΤΑΙ ΕΛΕΓΧΟ')}</div></div></div>`;}
function renderNewCase(){const d=state.caseData,ok=d.customer.trim()&&d.address.trim()&&d.workType;return `<div class="mobile">${titleBlock('— νέος φάκελος —','neutral')}<div class="content">${back()}<h2>Νέα τεχνική εργασία</h2><p class="sub">Τα στοιχεία που εισάγεις εδώ αποτελούν αρχικές πληροφορίες και δεν θεωρούνται αυτόματα επιβεβαιωμένα.</p><div class="field"><div class="label">Πελάτης</div><div class="inputwrap"><input id="customer" value="${esc(d.customer)}" placeholder="Ονοματεπώνυμο"></div></div><div class="field"><div class="label">Διεύθυνση</div><div class="inputwrap"><input id="address" value="${esc(d.address)}" placeholder="Οδός, αριθμός, περιοχή"></div></div><div class="label">Τύπος εργασίας</div><div class="types">${workTypes.map(([n,dsc])=>`<button data-work="${esc(n)}" class="${d.workType===n?'selected':''}"><b>${n}</b><span>${dsc}</span></button>`).join('')}</div></div>${footerButton('Δημιουργία φακέλου','questions',!ok)}</div>`;}
function renderQuestions(){const q=qs[state.qIndex],val=state.answers[q.id]||'';return `<div class="mobile">${titleBlock(`${state.caseData.workType} — ${state.caseData.address}`,'pending')}<div class="content">${back()}<div class="progress">${qs.map((_,i)=>`<span class="${i<=state.qIndex?'on':''}"></span>`).join('')}</div><div class="label">Ερώτηση ${state.qIndex+1} από ${qs.length}</div><div class="question"><h2>${q.text}</h2><div class="reason">${q.reason}</div>${q.type==='text'?`<div style="margin-top:18px"><input class="biginput" id="answerText" value="${esc(val)}" placeholder="${q.placeholder}"></div>`:`<div class="options">${q.options.map(o=>`<button data-option="${o}" class="${val===o?'selected':''}"><span>${o}</span>${val===o?icon('check'):''}</button>`).join('')}</div>`}</div></div>${footerButton(state.qIndex<qs.length-1?'Επόμενο':'Οργάνωση φακέλου','advance',!val)}</div>`;}function compute(){
  const a=state.answers;
  const year=parseInt(a.year,10);
  const valid=!isNaN(year)&&year>=1800&&year<=new Date().getFullYear();
  const hasPlans=a.plans==='Ναι';
  const noPlans=a.plans==='Όχι';
  const hasTopo=a.topo==='Ναι';
  const pdfs=state.files.filter(f=>ext(f.name)==='PDF').length;
  const cads=state.files.filter(f=>['DWG','DXF'].includes(ext(f.name))).length;
  const images=state.files.filter(f=>['JPG','JPEG','PNG'].includes(ext(f.name))).length;
  const cats=[
    {name:'Στοιχεία ακινήτου',status:valid?'confirmed':'missing',note:valid?`Έτος κατασκευής ${year} (δήλωση χρήστη)`:'Δεν έχει δηλωθεί έτος',source:valid?'Δήλωση χρήστη':'—'},
    {name:'Αρχιτεκτονικά σχέδια',status:hasPlans?'confirmed':noPlans?'missing':'pending',note:hasPlans?'Υπάρχουν σχέδια — απαιτείται έλεγχος επικαιρότητας και πληρότητας.':noPlans?'Δεν υπάρχουν διαθέσιμα σχέδια. Απαιτείται αποτύπωση.':'Δεν γνωρίζουμε αν υπάρχουν σχέδια / άδειες',source:a.plans?'Δήλωση χρήστη':'—'},
    {name:'Τοπογραφικό',status:hasTopo?'confirmed':(a.topo==='Όχι'?'missing':'pending'),note:hasTopo?'Υπάρχει τοπογραφικό — απαιτείται έλεγχος περιεχομένου.':a.topo==='Όχι'?'Δεν έχει επιβεβαιωθεί διαθέσιμο τοπογραφικό.':'Δεν έχει δηλωθεί κατάσταση τοπογραφικού',source:a.topo?'Δήλωση χρήστη':'—'},
    {name:'PDF τεκμήρια',status:pdfs>0?'confirmed':'missing',note:pdfs>0?`Υπάρχουν ${pdfs} PDF αρχείο/α στο demo.`:'Δεν έχει προστεθεί PDF.',source:pdfs>0?'Upload':'—'},
    {name:'CAD σχέδια',status:cads>0?'confirmed':'missing',note:cads>0?`Υπάρχουν ${cads} CAD αρχείο/α (DWG/DXF).`:'Δεν έχει προστεθεί CAD αρχείο.',source:cads>0?'Upload':'—'},
    {name:'Εικόνες / φωτογραφίες',status:images>0?'confirmed':'pending',note:images>0?`Υπάρχουν ${images} εικόνα/ες.`:'Δεν έχουν προστεθεί φωτογραφίες ακόμη.',source:images>0?'Upload':'—'}
  ];
  const completion=Math.round(cats.reduce((s,c)=>s+(c.status==='confirmed'?1:c.status==='pending'?0.5:0),0)/cats.length*100);
  const overall=(cats.some(c=>c.status==='missing'))?'red':'pending';
  return {year,valid,hasPlans,noPlans,hasTopo,pdfs,cads,images,cats,completion,overall};
}
function renderFiles(){
  const x=compute();
  const missingPlans=state.answers.plans==='Όχι';
  const unknownPlans=state.answers.plans==='Δεν γνωρίζω';
  return `<div class="mobile">${titleBlock(`${state.caseData.workType} — ${state.caseData.address}`,x.overall)}<div class="content">${back()}<h2>Αρχεία & τεκμήρια</h2><p class="sub">Πρόσθεσε PDF, CAD ή εικόνες ώστε ο φάκελος να δείχνει τι υπάρχει πραγματικά<div class="field">
        <div class="label">Upload αρχείων</div>
        <div class="inputwrap" style="border-style:dashed">
          <input id="fileInput" type="file" multiple accept=".pdf,.dwg,.dxf,.jpg,.jpeg,.png">
        </div>
      </div>

      <div class="types" style="grid-template-columns:1fr 1fr 1fr">
        <button disabled class="selected">PDF ${x.pdfs}</button>
        <button disabled class="selected">CAD ${x.cads}</button>
        <button disabled class="selected">Images ${x.images}</button>
      </div>

      <div class="completion">
        <div class="between"><div class="label">Καταγεγραμμένη πληρότητα</div><b>${x.completion}/100</b></div>
        <div class="bar"><span style="width:${x.completion}%"></span></div>
        <small>Ο δείκτης δείχνει μόνο πόσα στοιχεία έχουν καταγραφεί. Δεν αποτελεί τεχνική κρίση.</small>
      </div>

      ${state.files.length ? state.files.map((f,i)=>`
        <div class="cardrow">
          <div class="cardmain">
            <b>${esc(f.name)}</b>
            <small>${Math.round(f.size/1024)} KB · ${ext(f.name)}</small>
            <em>Συσχετίζεται με τον τεχνικό φάκελο του demo</em>
          </div>
          ${chip('confirmed','ΠΡΟΣΤΕΘΗΚΕ')}
          <button data-remove="${i}" class="back" style="padding:0 0 0 10px">×</button>
        </div>
      `).join('') : '<div class="warning">Δεν έχει προστεθεί αρχείο ακόμα. Για το demo μπορείς να ανεβάσεις ένα PDF ή ένα CAD αρχείο.</div>'}

      ${missingPlans ? `
        <div class="warning">
          <b>Δεν υπάρχουν διαθέσιμα αρχιτεκτονικά σχέδια.</b><br>
          Η εφαρμογή δεν μαντεύει. Προτείνει αυτοψία, λήψη κρίσιμων αποστάσεων και δημιουργία/επικαιροποίηση κατόψεων και τομών.
        </div>
      ` : ''}

      ${unknownPlans ? `
        <div class="warning">
          <b>Αβεβαιότητα στα σχέδια.</b><br>
          Πρώτο βήμα: αναζήτηση φακέλου άδειας και διαθέσιμων σχεδίων. Αν δεν βρεθούν, ενεργοποιείται διαδικασία αυτοψίας και αποτύπωσης.
        </div>
      ` : ''}

      <div class="next">
        <div class="label navy">NEXT BEST ACTION</div>
        <b>${missingPlans ? 'Προγραμμάτισε αυτοψία και συλλογή πραγματικών μετρήσεων.' : 'Συνέχισε με έλεγχο πληρότητας και τεχνική αξιολόγηση.'}</b>
        <p>${missingPlans ? 'Συλλογή εξωτερικών διαστάσεων, εσωτερικών διαστάσεων, πάχους τοιχοποιιών, καθαρών υψών, θέσεων ανοιγμάτων, θέσεων κλιμάκων και βασικών δομικών στοιχείων.' : 'Το σύστημα προχωρά σε έλεγχο πληρότητας, συσχέτιση αρχείων και senior review.'}</p>
      </div>
    </div>
    ${footerButton('Τεχνικός φάκελος →','folder')}
  </div>`;
}
function renderFolder(){
  const x=compute();
  const old=x.valid&&x.year<1980;
  return `<div class="mobile">${titleBlock(`${state.caseData.workType} — ${state.caseData.address}`,x.overall)}<div class="content">${back()}<h2>Τεχνικός φάκελος</h2><p class="sub">Κάθε στοιχείο φέρει κατάσταση και πηγή. Τίποτα δεν θεωρείται επιβεβαιωμένο χωρίς τεκμηρίωση.</p>${old?`<div class="warning"><b>Σημείο προσοχής:</b> Παλαιότερο κτίριο. Η αυτοψία πρέπει να δώσει ιδιαίτερη προσοχή σε υγρασία, τοιχοποιίες, θερμικά χαρακτηριστικά και αποκλίσεις από τα διαθέσιμα σχέδια.</div>`:''}<div class="completion"><div class="between"><div class="label">Καταγεγραμμένη πληρότητα</div><b>${x.completion}/100</b></div><div class="bar"><span style="width:${x.completion}%"></span></div><small>Ο δείκτης δείχνει μόνο πόσα στοιχεία έχουν καταγραφεί. Δεν αποτελεί ένδειξη τεχνικής ορθότητας, νομιμότητας ή ετοιμότητας για παράδοση.</small></div>${x.cats.map(c=>`<div class="cardrow"><div class="cardmain"><b>${c.name}</b><small>${c.note}</small><em>Πηγή: ${c.source}</em></div>${chip(c.status,c.status==='confirmed'?'ΕΠΙΒΕΒΑΙΩΜΕΝΟ':c.status==='pending'?'ΧΡΕΙΑΖΕΤΑΙ ΕΛΕΓΧΟ':'ΛΕΙΠΕΙ')}</div>`).join('')}<div class="next"><div class="label navy">READINESS</div><b>${x.overall==='red'?'Χρειάζεται διόρθωση φακέλου πριν από παράδοση.':'Ο φάκελος μπορεί να περάσει σε senior review.'}</b><p>${x.overall==='red'?'Υπάρχουν κρίσιμα κενά σε σχέδια, τοπογραφικό ή τεκμήρια που πρέπει να κλείσουν.':'Το σύστημα έχει καταγεγραμμένα τα βασικά στοιχεία και μπορεί να προτείνει next best action.'}</p></div></div>${footerButton('Senior Review →','review')}</div>`;
}function renderReview(){
  const x=compute();
  const plansMissing=state.answers.plans==='Όχι';
  const noTopo=state.answers.topo==='Όχι'||!state.answers.topo;
  const axes=[
    ['ΠΛΗΡΟΤΗΤΑ ΦΑΚΕΛΟΥ',`${x.completion}/100`,x.completion>=70?'pending':'missing','Πόσα στοιχεία έχουν καταγραφεί'],
    ['ΑΡΧΙΤΕΚΤΟΝΙΚΑ ΣΧΕΔΙΑ',state.answers.plans==='Ναι'?'Υπάρχουν':state.answers.plans==='Όχι'?'Λείπουν':'Δεν έχει δηλωθεί',state.answers.plans==='Όχι'?'missing':'pending','Απαραίτητα για τεκμηρίωση και ανασύνθεση'],
    ['ΤΟΠΟΓΡΑΦΙΚΟ',state.answers.topo==='Ναι'?'Υπάρχει':state.answers.topo==='Όχι'?'Λείπει':'Δεν έχει δηλωθεί',noTopo?'missing':'pending','Κρίσιμο για συσχέτιση με το οικόπεδο'],
    ['PDF / CAD',x.pdfs+x.cads>0?'Υπάρχουν τεκμήρια':'Δεν υπάρχουν τεκμήρια',x.pdfs+x.cads>0?'pending':'missing','Βασικά ψηφιακά τεχνικά αρχεία'],
    ['SENIOR READINESS',x.overall==='red'?'Όχι ακόμη':'Προχωρά',x.overall==='red'?'missing':'pending','Εκτίμηση ετοιμότητας για επόμενο βήμα']
  ];
  const nextAction=plansMissing?'Προγραμμάτισε αυτοψία και συλλογή πραγματικών μετρήσεων.':noTopo?'Αναζήτησε ή επιβεβαίωσε το τοπογραφικό πριν συνεχίσεις.':'Συνέχισε με τεχνική αξιολόγηση και παράδοση φακέλου.';
  const nextDetail=plansMissing?'Συλλογή εξωτερικών διαστάσεων, εσωτερικών διαστάσεων, πάχους τοιχοποιιών, καθαρών υψών, θέσεων ανοιγμάτων, θέσεων κλιμάκων και βασικών δομικών στοιχείων.':noTopo?'Χωρίς τοπογραφικό, ο έλεγχος συσχέτισης του ακινήτου παραμένει ατελής.':'Το σύστημα έχει αρκετή πληροφορία για να προχωρήσει σε επόμενο στάδιο.';
  return `<div class="mobile">${titleBlock(`${state.caseData.workType} — ${state.caseData.address}`,x.overall)}<div class="content">${back()}<h2>◈ Senior Review</h2><p class="sub">Δεν σου λέω μόνο τι λείπει. Σου λέω τι κάνεις μετά.</p><div class="next"><div class="label navy">NEXT BEST ACTION</div><b>${nextAction}</b><p>${nextDetail}</p></div>${axes.map(a=>`<div class="axis"><div><div class="label">${a[0]}</div><b>${a[1]}</b><small>${a[3]}</small></div>${chip(a[2],a[2]==='missing'?'ΛΕΙΠΕΙ':'ΧΡΕΙΑΖΕΤΑΙ ΕΛΕΓΧΟ')}</div>`).join('')}<div class="quote">«Αυτά ξέρουμε. Αυτά δεν ξέρουμε. Αυτά πρέπει να ελέγξεις πριν προχωρήσεις.»</div>${state.answers.plans==='Όχι'?`<div class="warning"><b>Απουσία αρχιτεκτονικών σχεδίων → προτεινόμενη διαδικασία</b><br>1. Αυτοψία · 2. Λήψη ακριβών διαστάσεων · 3. Φωτογραφική τεκμηρίωση · 4. Δημιουργία/επικαιροποίηση κατόψεων · 5. Δημιουργία τομών · 6. Συσχέτιση με τα διαθέσιμα τεκμήρια.</div>`:''}</div><div class="footer"><button class="primary" data-action="restart">Νέα δοκιμή ✓</button></div></div>`;
}
function render(){
  root.innerHTML=topbar()+(mode==='app'?(state.screen==='home'?renderHome():state.screen==='new'?renderNewCase():state.screen==='questions'?renderQuestions():state.screen==='files'?renderFiles():state.screen==='folder'?renderFolder():renderReview()):renderArch());
  bind();
}
function renderArch(){
  return `<div class="arch"><div class="archinner"><div class="archnav"><div><b>AI Senior Engineer v8</b><div style="color:#b7c0d8;font-size:12px">Core Architecture Review</div></div><button data-mode="app">← Επιστροφή στην εφαρμογή</button></div><section class="archhero"><h1>v8 Core Validation Architecture Review</h1><p>Commit 1: canonical IDs, branded types, validation boundary, and testable domain isolation.</p><p>The application remains the user-facing workflow; the v8 Core protects the domain from malformed persisted data, unsafe IDs and corrupted state.</p></section><section class="archcard"><h2>Architecture Summary</h2><div class="archgrid"><div><span class="tag">unknown input</span><span class="tag">schema validation</span><span class="tag">canonical format</span><span class="tag">brandId()</span><span class="tag">Domain ID</span></div><div><p>The ID pipeline is intentionally simple: external input enters as <code>unknown</code>, passes structural validation and canonical ID validation, then reaches the single controlled branding boundary.</p></div></div></section><section class="archcard"><h2>Core Contract</h2><div class="code">unknown\n  ↓\nSchema / structural validation\n  ↓\ncanonical ID format validation\n  ↓\nbrandId()\n  ↓\nParseResult&lt;CaseId&gt;\n  ↓\nDomain Entity</div><p><b>Rule:</b> <code>brandId()</code> is not a validator. It is the final controlled boundary after validation succeeds.</p></section><section class="archcard"><h2>Commit 1 Scope</h2><div class="code">src/\n├── domain/\n│   └── valueObjects/\n│       └── ids.ts\n├── validation/\n│   └── ids/\n│       ├── brandId.ts\n│       ├── createIdParser.ts\n│       ├── parseCaseId.ts\n│       ├── parseFactId.ts\n│       ├── parseFactRecordId.ts\n│       ├── parseEvidenceId.ts\n│       ├── parseFileAssetId.ts\n│       ├── parseVerificationId.ts\n│       ├── parseContradictionId.ts\n│       └── parseAuditEventId.ts\n└── tests/\n    └── validation/\n        └── ids/\n            ├── parseCaseId.test.ts\n            ├── parseFactId.test.ts\n            ├── parseFactRecordId.test.ts\n            ├── brand-separation.test.ts\n            └── round-trip.test.ts</div></section></div></div>`;
}
function bind(){
  root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});
  root.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.action;
    if(a==='new')state.screen='new';
    else if(a==='back'){if(state.screen==='new')state.screen='home';else if(state.screen==='questions')state.screen='new';else if(state.screen==='files')state.screen='questions';else if(state.screen==='folder')state.screen='files';else if(state.screen==='review')state.screen='folder'}
    else if(a==='questions')state.screen='questions';
    else if(a==='advance'){if(state.qIndex<qs.length-1)state.qIndex++;else state.screen='files'}
    else if(a==='folder')state.screen='folder';
    else if(a==='review')state.screen='review';
    else if(a==='restart'){state={screen:'home',caseData:{customer:'',address:'',workType:''},answers:{},qIndex:0,files:[]}}
    render();
  });
  root.querySelectorAll('[data-work]').forEach(b=>b.onclick=()=>{state.caseData.workType=b.dataset.work;render()});
  const c=root.querySelector('#customer'); if(c)c.oninput=e=>{state.caseData.customer=e.target.value};
  const ad=root.querySelector('#address'); if(ad)ad.oninput=e=>{state.caseData.address=e.target.value};
  const ans=root.querySelector('#answerText'); if(ans)ans.oninput=e=>{state.answers[qs[state.qIndex].id]=e.target.value};
  root.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{state.answers[qs[state.qIndex].id]=b.dataset.option;render()});
  const fileInput=root.querySelector('#fileInput');
  if(fileInput) fileInput.onchange=e=>{state.files=[...state.files,...Array.from(e.target.files||[])];render()};
  root.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.files.splice(parseInt(b.dataset.remove,10),1);render()});
}
render();
})();
</script>
</body>
</html>
