<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="theme-color" content="#1D3557"/>
<title>AI Senior Engineer</title>
<style>
:root{
  --paper:#F5F4EF;--ink:#23272B;--muted:#6B6B63;--line:#DBD6C9;
  --navy:#1D3557;--soft:#2A466E;
  --ok:#3A6B4C;--okBg:#E7EFE8;--warn:#A8791F;--warnBg:#F5EEDC;
  --bad:#A8412F;--badBg:#F5E4DF;--info:#EEF1F5;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#e5e3db;color:var(--ink);min-height:100dvh;display:flex;justify-content:center}
#app{width:100%;max-width:430px;min-height:100dvh;background:var(--paper);box-shadow:0 0 40px rgba(0,0,0,.08);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:none;background:none}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);background:#fff;font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:#FBFAF7;position:sticky;top:0;z-index:5}
.brand{font-weight:800;color:var(--navy);font-size:14px}
.brand small{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.scroll{flex:1;overflow:auto;padding:16px 18px}
.foot{padding:14px 16px;border-top:1px solid var(--line);background:#FBFAF7}
.btn{width:100%;padding:14px;background:var(--navy);color:#fff;font-weight:700;border-radius:2px}
.btn.ghost{background:#fff;color:var(--muted);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--bad);border:1px solid var(--line)}
.card{border:1px solid var(--line);background:#fff;padding:14px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;font-size:10px;font-weight:700}
.label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.row{display:flex;gap:8px}
.muted{color:var(--muted);font-size:13px;line-height:1.45}
.h1{font-size:20px;font-weight:800;margin:6px 0 8px}
.h2{font-size:16px;font-weight:800;margin-bottom:6px}
.nsa{border:1px solid var(--navy);background:var(--info);padding:14px;margin:12px 0}
.nsa .t{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);font-weight:700;margin-bottom:6px}
.hero{background:var(--navy);color:#F5F4EF;padding:28px 18px 22px}
.hero p{color:#C3CEDD;font-size:13.5px;margin-top:8px;line-height:1.5}
.tabs{display:flex;gap:6px;margin:10px 0 14px;flex-wrap:wrap}
.tab{padding:8px 10px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:700;color:var(--muted)}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.choice{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);background:#fff;margin-bottom:8px;font-weight:600}
.choice.on{background:var(--navy);border-color:var(--navy);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{flex:1;padding:10px;border:1px solid var(--line);background:#FBFAF7;text-align:center;font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--navy);color:#fff;padding:10px 14px;font-size:13px;z-index:50;max-width:90%}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
const KEY='ai-senior-sim-v1';
const TYPES=['ΠΕΑ','Νέα Άδεια','Άδεια Μικρής Κλίμακας','Τοπογραφικό','Αυθαίρετο','ΗΤΚ'];

const Q={
'ΠΕΑ':[
  {id:'year',t:'Ποιο είναι το έτος κατασκευής;',type:'text',ph:'π.χ. 1972',why:'Δήλωση — επιβεβαιώνεται με έγγραφα/αυτοψία.'},
  {id:'plans',t:'Υπάρχουν διαθέσιμα αρχιτεκτονικά σχέδια;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Χωρίς κάτοψη αυξάνεται ο κίνδυνος λάθους.'},
  {id:'permit',t:'Υπάρχει οικοδομική άδεια;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Βασικό δικαιολογητικό για υφιστάμενο κτίριο.'},
  {id:'use',t:'Ποια είναι η χρήση του χώρου;',type:'choice',opts:['Κατοικία','Επαγγελματική','Μικτή','Δεν γνωρίζω'],why:'Επηρεάζει ενεργειακή κατάταξη και απαιτήσεις.'}
],
'Νέα Άδεια':[
  {id:'stage',t:'Σε ποιο στάδιο βρίσκεται το έργο;',type:'choice',opts:['Αρχική διερεύνηση','Έλεγχος οικοπέδου','Συγκέντρωση στοιχείων','Μελέτες','Υποβολή'],why:'Το στάδιο καθορίζει τι χρειάζεται τώρα.'},
  {id:'plot',t:'Το ακίνητο είναι οικόπεδο ή αγροτεμάχιο;',type:'choice',opts:['Οικόπεδο','Αγροτεμάχιο','Δεν γνωρίζω'],why:'Επηρεάζει πολεοδομικό καθεστώς.'},
  {id:'topo',t:'Υπάρχει διαθέσιμο τοπογραφικό;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Συχνά προαπαιτούμενο πριν τις μελέτες.'},
  {id:'titles',t:'Υπάρχουν τίτλοι ιδιοκτησίας;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Απαραίτητοι για ταυτοποίηση ακινήτου.'},
  {id:'arch',t:'Έχει ανατεθεί αρχιτεκτονική μελέτη;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Καθορίζει την επόμενη ανάθεση/συντονισμό.'}
],
'Άδεια Μικρής Κλίμακας':[
  {id:'work',t:'Τι είδους εργασία αφορά;',type:'choice',opts:['Αλλαγή διαρρύθμισης','Θερμομόνωση','Αλλαγή καυστήρα','Σκαλωσιές / χρωματισμοί','Άλλο'],why:'Καθορίζει δικαιολογητικά και εύρος.'},
  {id:'exist_permit',t:'Υπάρχει παλαιότερη άδεια / νομιμοποίηση;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Ελέγχεται η υφιστάμενη κατάσταση.'},
  {id:'plans',t:'Υπάρχουν σχέδια υφιστάμενης κατάστασης;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Βοηθούν πριν την αυτοψία.'},
  {id:'pea',t:'Απαιτείται / υπάρχει ΠΕΑ;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Συχνή σύνδεση με μικρές επεμβάσεις.'}
],
'Τοπογραφικό':[
  {id:'purpose',t:'Για ποιο σκοπό χρειάζεται το τοπογραφικό;',type:'choice',opts:['Συμβόλαιο','Οικοδομική άδεια','Κτηματολόγιο','Τακτοποίηση','Άλλο'],why:'Ο σκοπός καθορίζει τις απαιτήσεις.'},
  {id:'old',t:'Υπάρχει παλαιότερο διάγραμμα;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Μπορεί να μειώσει λάθη στα όρια.'},
  {id:'titles',t:'Υπάρχουν τίτλοι;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Κρίσιμοι για όρια/ιδιοκτησία.'},
  {id:'kaek',t:'Υπάρχει ΚΑΕΚ;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Σύνδεση με Κτηματολόγιο.'}
],
'default':[
  {id:'goal',t:'Τι θέλεις να πετύχεις με αυτή την υπόθεση;',type:'text',ph:'Σύντομη περιγραφή',why:'Βοηθά να οριστεί ο στόχος.'},
  {id:'docs',t:'Υπάρχουν διαθέσιμα έγγραφα;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Ο φάκελος ξεκινά από ό,τι υπάρχει.'},
  {id:'site',t:'Χρειάζεται αυτοψία;',type:'choice',opts:['Ναι','Όχι','Δεν γνωρίζω'],why:'Σημαντικό για επιβεβαίωση πραγματικότητας.'}
]
};

let state={screen:'home', cases:[], currentId:null, draft:{}, qIndex:0, tab:'overview', toast:null};

function uid(){return 'c_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function load(){try{const r=localStorage.getItem(KEY); if(r) state.cases=JSON.parse(r)||[]}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state.cases))}catch(e){}}
function cur(){return state.cases.find(c=>c.id===state.currentId)||null}
function qs(type){return Q[type]||Q.default}
function statusOf(v){
  if(v==='Ναι') return 'declared';
  if(v==='Όχι') return 'missing';
  if(v==='Δεν γνωρίζω') return 'needs_check';
  return v? 'declared':'missing';
}
function chip(s){
  const m={
    declared:{c:'var(--warn)',bg:'var(--warnBg)',t:'ΔΗΛΩΘΗΚΕ'},
    needs_check:{c:'var(--warn)',bg:'var(--warnBg)',t:'ΠΡΟΣ ΕΛΕΓΧΟ'},
    missing:{c:'var(--bad)',bg:'var(--badBg)',t:'ΛΕΙΠΕΙ'},
    not_done:{c:'var(--bad)',bg:'var(--badBg)',t:'ΔΕΝ ΕΧΕΙ ΓΙΝΕΙ'},
    verified:{c:'var(--ok)',bg:'var(--okBg)',t:'ΕΠΑΛΗΘΕΥΜΕΝΟ'},
    active:{c:'var(--navy)',bg:'var(--info)',t:'ΕΝΕΡΓΗ'},
    pending:{c:'var(--warn)',bg:'var(--warnBg)',t:'ΣΕ ΑΝΑΜΟΝΗ'}
  };
  const x=m[s]||m.needs_check;
  return `<span class="chip" style="background:${x.bg};color:${x.c}"><span style="width:6px;height:6px;background:${x.c};display:inline-block"></span>${x.t}</span>`;
}
function toast(msg){state.toast=msg; render(); setTimeout(()=>{state.toast=null; render()},1800)}

function compute(c){
  const a=c.answers||{};
  const docs=c.docs||[];
  const type=c.workType;
  const items=[];
  const gaps=[];
  const candidates=[];

  items.push({name:'Πελάτης', value:c.customer||'—', status:'declared'});
  items.push({name:'Διεύθυνση', value:c.address||'—', status:'declared'});
  items.push({name:'Τύπος', value:type||'—', status:'declared'});

  if(type==='Νέα Άδεια'){
    const stage=a.stage||'—';
    const topo=statusOf(a.topo);
    const titles=statusOf(a.titles);
    const arch=statusOf(a.arch);
    items.push({name:'Στάδιο έργου', value:stage, status:a.stage?'declared':'missing'});
    items.push({name:'Τοπογραφικό', value:a.topo||'—', status:topo});
    items.push({name:'Τίτλοι', value:a.titles||'—', status:titles});
    items.push({name:'Αρχιτεκτονική μελέτη', value:a.arch||'—', status:arch});
    if(topo==='missing'){gaps.push('Τοπογραφικό'); candidates.push({p:1,title:'Εξασφάλισε κατάλληλο τοπογραφικό', why:'Συχνά προαπαιτείται πριν τις μελέτες / υποβολή.'});}
    if(titles==='missing'){gaps.push('Τίτλοι'); candidates.push({p:2,title:'Συγκέντρωσε τίτλους ιδιοκτησίας', why:'Χρειάζονται για ταυτοποίηση ακινήτου.'});}
    if(arch==='missing'){candidates.push({p:3,title:'Ανάθεσε / επιβεβαίωσε αρχιτεκτονική μελέτη', why:'Επόμενο κρίσιμο deliverable.'});}
    if(!a.stage) candidates.push({p:1,title:'Όρισε το στάδιο του έργου', why:'Χωρίς στάδιο δεν προτεραιοποιούνται σωστά τα βήματα.'});
  } else if(type==='ΠΕΑ'){
    const plans=statusOf(a.plans);
    const permit=statusOf(a.permit);
    items.push({name:'Έτος', value:a.year||'—', status:a.year?'declared':'missing'});
    items.push({name:'Σχέδια', value:a.plans||'—', status:plans});
    items.push({name:'Άδεια', value:a.permit||'—', status:permit});
    items.push({name:'Χρήση', value:a.use||'—', status:a.use?statusOf(a.use==='Δεν γνωρίζω'?'Δεν γνωρίζω':'Ναι'):'missing'});
    if(plans==='missing'){gaps.push('Σχέδια'); candidates.push({p:1,title:'Συγκέντρωσε σχέδια ή προγραμμάτισε αποτύπωση', why:'Χωρίς κάτοψη αυξάνεται ο κίνδυνος.'});}
    if(permit==='missing'){gaps.push('Οικοδομική άδεια'); candidates.push({p:2,title:'Εντόπισε οικοδομική άδεια / νομιμοποίηση', why:'Βασικό στοιχείο φακέλου.'});}
    if(!a.year) candidates.push({p:2,title:'Καταχώρισε έτος κατασκευής', why:'Χρειάζεται για ενεργειακή αξιολόγηση.'});
  } else if(type==='Τοπογραφικό'){
    const old=statusOf(a.old);
    const titles=statusOf(a.titles);
    const kaek=statusOf(a.kaek);
    items.push({name:'Σκοπός', value:a.purpose||'—', status:a.purpose?'declared':'missing'});
    items.push({name:'Παλαιό διάγραμμα', value:a.old||'—', status:old});
    items.push({name:'Τίτλοι', value:a.titles||'—', status:titles});
    items.push({name:'ΚΑΕΚ', value:a.kaek||'—', status:kaek});
    if(old==='missing'){gaps.push('Παλαιό τοπογραφικό'); candidates.push({p:1,title:'Ζήτησε παλαιά διαγράμματα', why:'Μειώνει λάθη στα όρια.'});}
    if(titles==='missing'){gaps.push('Τίτλοι'); candidates.push({p:2,title:'Συγκέντρωσε τίτλους', why:'Απαραίτητοι για προσδιορισμό ορίων.'});}
  } else if(type==='Άδεια Μικρής Κλίμακας'){
    const plans=statusOf(a.plans);
    items.push({name:'Εργασία', value:a.work||'—', status:a.work?'declared':'missing'});
    items.push({name:'Παλαιά άδεια', value:a.exist_permit||'—', status:statusOf(a.exist_permit)});
    items.push({name:'Σχέδια', value:a.plans||'—', status:plans});
    if(plans==='missing'){gaps.push('Σχέδια'); candidates.push({p:1,title:'Συγκέντρωσε σχέδια υφιστάμενης κατάστασης', why:'Βοηθά πριν την αυτοψία και την υποβολή.'});}
    if(!a.work) candidates.push({p:1,title:'Όρισε το είδος εργασίας', why:'Καθορίζει το εύρος της άδειας.'});
  } else {
    items.push({name:'Στόχος', value:a.goal||'—', status:a.goal?'declared':'missing'});
    items.push({name:'Έγγραφα', value:a.docs||'—', status:statusOf(a.docs)});
  }

  items.push({name:'Έγγραφα στον φάκελο', value:docs.length? (docs.length+' αρχείο/α'):'Κανένα', status:docs.length?'declared':'missing'});
  items.push({name:'Αυτοψία', value:'Δεν έχει γίνει', status:'not_done'});

  if(docs.length===0) candidates.push({p:4,title:'Συγκέντρωσε διαθέσιμα έγγραφα', why:'Ο τεχνικός φάκελος προετοιμάζει την αυτοψία και μειώνει αβεβαιότητα.'});
  candidates.push({p:9,title:'Προγραμμάτισε αυτοψία όταν έχεις βασικά στοιχεία', why:'Η πραγματική κατάσταση επιβεβαιώνεται επιτόπου.'});

  candidates.sort((x,y)=>x.p-y.p);
  const primary=candidates[0]||{title:'Ο φάκελος μπορεί να προχωρήσει σε έλεγχο', why:'Δεν εντοπίζονται κρίσιμα κενά υψηλής προτεραιότητας.'};
  const secondary=candidates.slice(1,3);

  return {items, gaps, primary, secondary};
}

function top(title, right=''){
  return `<div class="top"><div class="brand">AI Senior Engineer<small>${title}</small></div><div>${right}</div></div>`;
}

function render(){
  const root=document.getElementById('app');
  let html='';
  if(state.screen==='home') html=viewHome();
  else if(state.screen==='new') html=viewNew();
  else if(state.screen==='intake') html=viewIntake();
  else if(state.screen==='case') html=viewCase();
  else if(state.screen==='files') html=viewFiles();
  else if(state.screen==='review') html=viewReview();
  root.innerHTML=html+(state.toast?`<div class="toast">${state.toast}</div>`:'');
  bind();
}

function viewHome(){
  const list=[...state.cases].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  return `<div class="hero"><div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9FB3CC">AI Senior Engineer</div>
  <div class="h1" style="color:#F5F4EF">Υποθέσεις</div>
  <p>Οργάνωσε τον φάκελο. Εντόπισε κενά. Δες το επόμενο ασφαλές βήμα.</p></div>
  <div class="scroll">
    <button data-go="new" class="card" style="width:100%;display:flex;gap:12px;align-items:center;border-color:var(--navy)">
      <div style="width:36px;height:36px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800">+</div>
      <div style="text-align:left"><div style="font-weight:800">Νέα υπόθεση</div><div class="muted">Όνομα · Διεύθυνση · Τηλέφωνο · Τύπος</div></div>
    </button>
    <div class="label" style="margin-top:8px">Αποθηκευμένες</div>
    ${list.length? list.map(c=>`<button data-open="${c.id}" class="card" style="width:100%;text-align:left">
      <div style="display:flex;justify-content:space-between;gap:8px">
        <div style="min-width:0"><div style="font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.customer||'Χωρίς όνομα'}</div>
        <div class="muted">${c.workType||'—'} · ${c.address||'—'}</div></div>
        ${chip('active')}
      </div></button>`).join('') : `<div class="card muted">Δεν υπάρχουν ακόμη υποθέσεις.</div>`}
  </div>`;
}

function viewNew(){
  const d=state.draft;
  const ok=d.customer&&d.address&&d.workType;
  return `${top('Νέα υπόθεση')}
  <div class="scroll">
    <button data-go="home" class="muted" style="font-weight:700;margin-bottom:10px">← Πίσω</button>
    <div class="h2">Δημιουργία φακέλου</div>
    <p class="muted" style="margin-bottom:14px">Η αρχειοθέτηση ξεκινά από εδώ. Ό,τι δηλώνεται θεωρείται δήλωση μέχρι να τεκμηριωθεί.</p>
    <div class="label">Πελάτης / Όνομα *</div>
    <input id="customer" value="${d.customer||''}" placeholder="Ονοματεπώνυμο"/>
    <div style="height:10px"></div>
    <div class="label">Τηλέφωνο</div>
    <input id="phone" value="${d.phone||''}" placeholder="Προαιρετικό"/>
    <div style="height:10px"></div>
    <div class="label">Διεύθυνση *</div>
    <input id="address" value="${d.address||''}" placeholder="Οδός, αριθμός, περιοχή"/>
    <div style="height:12px"></div>
    <div class="label">Τύπος πρώτης εργασίας *</div>
    <div class="grid2" style="margin-top:6px">${TYPES.map(t=>`<button data-type="${t}" class="choice ${d.workType===t?'on':''}" style="margin:0;font-size:12.5px">${t}</button>`).join('')}</div>
  </div>
  <div class="foot"><button data-create class="btn" ${ok?'':'disabled'}>Αποθήκευση & Smart Intake →</button></div>`;
}

function viewIntake(){
  const c=cur(); if(!c) return viewHome();
  const list=qs(c.workType);
  const q=list[state.qIndex];
  const val=(c.answers&&c.answers[q.id])||'';
  const can=q.type==='text'? !!String(val).trim() : !!val;
  return `${top(c.workType+' · Intake')}
  <div class="scroll">
    <button data-back-q class="muted" style="font-weight:700;margin-bottom:10px">← Πίσω</button>
    <div style="display:flex;gap:3px;margin-bottom:12px">${list.map((_,i)=>`<div style="flex:1;height:3px;background:${i<=state.qIndex?'var(--navy)':'var(--line)'}"></div>`).join('')}</div>
    <div class="label">Ερώτηση ${state.qIndex+1}/${list.length}</div>
    <div class="h2">${q.t}</div>
    <div class="card" style="background:#EFEDE4;border:none;border-left:2px solid var(--soft);font-size:12.5px;color:#454540">${q.why}</div>
    <div style="margin-top:14px">
      ${q.type==='text'
        ? `<input id="ans" value="${val}" placeholder="${q.ph||''}"/>`
        : q.opts.map(o=>`<button data-opt="${o}" class="choice ${val===o?'on':''}">${o}</button>`).join('')}
    </div>
  </div>
  <div class="foot"><button data-next-q class="btn" ${can?'':'disabled'}>${state.qIndex<list.length-1?'Επόμενο →':'Άνοιγμα φακέλου →'}</button></div>`;
}

function viewCase(){
  const c=cur(); if(!c) return viewHome();
  const d=compute(c);
  return `${top(c.customer||'Υπόθεση', chip('active'))}
  <div class="scroll">
    <button data-go="home" class="muted" style="font-weight:700;margin-bottom:8px">← Υποθέσεις</button>
    <div class="card">
      <div class="label">Τύπος</div><div style="font-weight:800">${c.workType}</div>
      <div class="label" style="margin-top:10px">Διεύθυνση</div><div>${c.address||'—'}</div>
      ${c.phone?`<div class="label" style="margin-top:10px">Τηλέφωνο</div><div>${c.phone}</div>`:''}
    </div>
    <div class="nsa">
      <div class="t">Next Safe Action</div>
      <div style="font-weight:800;font-size:15px;line-height:1.35">${d.primary.title}</div>
      <div class="muted" style="margin-top:6px">${d.primary.why}</div>
    </div>
    <div class="tabs">
      <button data-tab="overview" class="tab ${state.tab==='overview'?'on':''}">Επισκόπηση</button>
      <button data-tab="evidence" class="tab ${state.tab==='evidence'?'on':''}">Στοιχεία</button>
      <button data-go="files" class="tab">Έγγραφα</button>
      <button data-go="review" class="tab">Review</button>
    </div>
    ${state.tab==='overview'?`
      <div class="muted" style="margin-bottom:10px">Τι έχουμε τώρα · τι λείπει · τι πρέπει να γίνει μετά.</div>
      ${d.gaps.length?`<div class="card" style="background:var(--badBg);border-color:var(--bad)"><b style="color:var(--bad)">Κρίσιμα κενά:</b> ${d.gaps.join(' · ')}</div>`:''}
      <div class="card"><div class="label">Secondary actions</div>
        ${d.secondary.map(s=>`<div style="margin-top:8px"><b>${s.title}</b><div class="muted">${s.why}</div></div>`).join('')||'<div class="muted">—</div>'}
      </div>
      <div class="card" style="background:#EFEDE4;border:none;font-size:12.5px;line-height:1.5">Τα έγγραφα είναι τεχνικός φάκελος εργασίας. Δεν αντικαθιστούν την κρίση του μηχανικού.</div>
    `: `
      ${d.items.map(it=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px">
        <div><div style="font-weight:800">${it.name}</div><div>${it.value}</div></div>${chip(it.status)}
      </div></div>`).join('')}
    `}
  </div>
  <div class="foot row">
    <button data-del class="btn danger" style="width:auto;padding:12px 14px">Διαγραφή</button>
    <button data-go="files" class="btn">Έγγραφα →</button>
  </div>`;
}

function viewFiles(){
  const c=cur(); if(!c) return viewHome();
  const docs=c.docs||[];
  return `${top('Technical Folder')}
  <div class="scroll">
    <button data-go="case" class="muted" style="font-weight:700;margin-bottom:10px">← Υπόθεση</button>
    <div class="h2">Έγγραφα</div>
    <p class="muted" style="margin-bottom:12px">PDF, σχέδια, φωτογραφίες. Σκοπός: προετοιμασία πριν την αυτοψία — όχι αυτόματη «μαγική» ανάλυση.</p>
    <div class="card" style="text-align:center;border-style:dashed">
      <input type="file" id="fileInput" multiple accept=".pdf,.dwg,.dxf,.jpg,.jpeg,.png,.doc,.docx"/>
      <div class="muted" style="margin-top:8px">PDF · CAD · Εικόνες</div>
    </div>
    <div class="row" style="margin:12px 0">
      <div class="stat"><b>${docs.filter(d=>/\.pdf$/i.test(d.name)).length}</b><br>PDF</div>
      <div class="stat"><b>${docs.filter(d=>/\.(dwg|dxf)$/i.test(d.name)).length}</b><br>CAD</div>
      <div class="stat"><b>${docs.filter(d=>/\.(jpe?g|png)$/i.test(d.name)).length}</b><br>Εικόνες</div>
    </div>
    ${docs.length? docs.map((d,i)=>`<div class="card" style="display:flex;justify-content:space-between;gap:8px">
      <div style="min-width:0"><div style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${d.name}</div>
      <div class="muted">${d.kb} KB · ${d.kind}</div></div>
      <button data-rm="${i}" style="color:var(--muted)">×</button></div>`).join('')
      : `<div class="card" style="background:var(--warnBg)">Δεν έχουν προστεθεί αρχεία.</div>`}
  </div>
  <div class="foot"><button data-go="review" class="btn">Senior Review →</button></div>`;
}

function viewReview(){
  const c=cur(); if(!c) return viewHome();
  const d=compute(c);
  return `${top('Senior Review')}
  <div class="scroll">
    <button data-go="case" class="muted" style="font-weight:700;margin-bottom:10px">← Υπόθεση</button>
    <div class="h2">Senior Review</div>
    <p class="muted">Προτεραιοποιημένη σκέψη — όχι τελική τεχνική κρίση.</p>
    ${d.gaps.length?`<div class="card" style="background:var(--badBg);border-color:var(--bad)"><b style="color:var(--bad)">Κρίσιμα κενά: ${d.gaps.length}</b><div style="margin-top:4px">${d.gaps.join(' · ')}</div></div>`:''}
    <div class="nsa">
      <div class="t">Primary Next Safe Action</div>
      <div style="font-weight:800;font-size:15px">${d.primary.title}</div>
      <div class="muted" style="margin-top:6px">${d.primary.why}</div>
    </div>
    <div class="card"><div class="label">Επόμενα μετά από αυτό</div>
      ${d.secondary.map(s=>`<div style="margin:8px 0"><b>${s.title}</b><div class="muted">${s.why}</div></div>`).join('')||'<div class="muted">—</div>'}
    </div>
    <div class="card" style="border-color:var(--navy);background:var(--info);font-style:italic;line-height:1.5">
      «Αυτά γνωρίζουμε. Αυτά δεν γνωρίζουμε. Αυτά χρειάζονται απόδειξη. Αυτό είναι το επόμενο ασφαλές βήμα.»
    </div>
  </div>
  <div class="foot"><button data-go="home" class="btn">Λίστα υποθέσεων</button></div>`;
}

function bind(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.screen=b.dataset.go; if(b.dataset.go==='new') state.draft={}; render()});
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{state.currentId=b.dataset.open; state.screen='case'; state.tab='overview'; render()});
  document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{state.draft.workType=b.dataset.type; render()});
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab; render()});

  const c=document.getElementById('customer'); if(c) c.oninput=e=>{state.draft.customer=e.target.value; const ok=state.draft.customer&&state.draft.address&&state.draft.workType; const btn=document.querySelector('[data-create]'); if(btn){btn.disabled=!ok}};
  const p=document.getElementById('phone'); if(p) p.oninput=e=>{state.draft.phone=e.target.value};
  const a=document.getElementById('address'); if(a) a.oninput=e=>{state.draft.address=e.target.value; const ok=state.draft.customer&&state.draft.address&&state.draft.workType; const btn=document.querySelector('[data-create]'); if(btn){btn.disabled=!ok}};

  const create=document.querySelector('[data-create]');
  if(create) create.onclick=()=>{
    if(!(state.draft.customer&&state.draft.address&&state.draft.workType)) return;
    const id=uid(); const now=Date.now();
    state.cases.push({
      id, customer:state.draft.customer.trim(), phone:(state.draft.phone||'').trim(),
      address:state.draft.address.trim(), workType:state.draft.workType,
      answers:{}, docs:[], createdAt:now, updatedAt:now
    });
    save(); state.currentId=id; state.qIndex=0; state.screen='intake'; state.draft={}; toast('Η υπόθεση αποθηκεύτηκε'); render();
  };

  const ans=document.getElementById('ans');
  if(ans) ans.oninput=e=>{ const c=cur(); if(!c) return; c.answers=c.answers||{}; c.answers[qs(c.workType)[state.qIndex].id]=e.target.value; c.updatedAt=Date.now(); save(); const btn=document.querySelector('[data-next-q]'); if(btn) btn.disabled=!e.target.value.trim();};

  document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{
    const c=cur(); if(!c) return; c.answers=c.answers||{}; c.answers[qs(c.workType)[state.qIndex].id]=b.dataset.opt; c.updatedAt=Date.now(); save(); render();
  });

  const nq=document.querySelector('[data-next-q]');
  if(nq) nq.onclick=()=>{
    const c=cur(); if(!c) return; const list=qs(c.workType);
    if(state.qIndex<list.length-1){state.qIndex++; render()} else {state.screen='case'; state.tab='overview'; toast('Φάκελος έτοιμος'); render()}
  };
  const bq=document.querySelector('[data-back-q]');
  if(bq) bq.onclick=()=>{ if(state.qIndex>0){state.qIndex--; render()} else state.screen='case', render() };

  const fi=document.getElementById('fileInput');
  if(fi) fi.onchange=e=>{
    const c=cur(); if(!c) return;
    Array.from(e.target.files||[]).forEach(f=>{
      let kind='Άλλο';
      if(/\.pdf$/i.test(f.name)) kind='PDF';
      else if(/\.(dwg|dxf)$/i.test(f.name)) kind='CAD';
      else if(/\.(jpe?g|png)$/i.test(f.name)) kind='Εικόνα';
      c.docs.push({name:f.name, kb:Math.max(1,Math.round(f.size/1024)), kind});
    });
    c.updatedAt=Date.now(); save(); toast('Αρχεία προστέθηκαν στον φάκελο'); render();
  };
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const c=cur(); if(!c) return; c.docs.splice(+b.dataset.rm,1); c.updatedAt=Date.now(); save(); render()});
  const del=document.querySelector('[data-del]');
  if(del) del.onclick=()=>{ if(!confirm('Διαγραφή υπόθεσης;')) return; state.cases=state.cases.filter(x=>x.id!==state.currentId); save(); state.currentId=null; state.screen='home'; render(); };
}

load();
render();
})();
</script>
</body>
</html>
