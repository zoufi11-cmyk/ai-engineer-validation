<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#1D3557"/>
<title>AI Senior Engineer</title>
<style>
:root{--paper:#F5F4EF;--ink:#23272B;--muted:#6B6B63;--line:#DBD6C9;--navy:#1D3557;--soft:#2A466E;--ok:#3A6B4C;--okBg:#E7EFE8;--warn:#A8791F;--warnBg:#F5EEDC;--bad:#A8412F;--badBg:#F5E4DF;--info:#EEF1F5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#e5e3db;color:var(--ink);min-height:100dvh;display:flex;justify-content:center}
#root{width:100%;max-width:430px;min-height:100dvh;background:var(--paper);box-shadow:0 0 40px rgba(0,0,0,.08);display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
const T={paper:"#F5F4EF",ink:"#23272B",muted:"#6B6B63",line:"#DBD6C9",navy:"#1D3557",soft:"#2A466E",ok:"#3A6B4C",okBg:"#E7EFE8",warn:"#A8791F",warnBg:"#F5EEDC",bad:"#A8412F",badBg:"#F5E4DF",info:"#EEF1F5"};

let screen="home", caseData={customer:"",address:"",workType:""}, answers={}, files=[], qIndex=0;

const QUESTIONS={
  "ΠΕΑ":[
    {id:"year",text:"Ποιο είναι το έτος κατασκευής;",type:"text",ph:"π.χ. 1972",why:"Το καταγράφουμε ως δήλωση. Δεν θεωρείται επιβεβαιωμένο χωρίς έγγραφο."},
    {id:"plans",text:"Υπάρχουν διαθέσιμα αρχιτεκτονικά σχέδια;",type:"choice",opts:["Ναι","Όχι","Δεν γνωρίζω"],why:"Χωρίς κάτοψη ο φάκελος κινδυνεύει να επιστραφεί. Αν λείπουν, το επόμενο βήμα είναι αυτοψία."},
    {id:"permit",text:"Υπάρχει οικοδομική άδεια;",type:"choice",opts:["Ναι","Όχι","Δεν γνωρίζω"],why:"Βασικό δικαιολογητικό. Αν λείπει, σημειώνεται ως κρίσιμο κενό."},
    {id:"kaek",text:"Υπάρχει διαθέσιμος ΚΑΕΚ;",type:"choice",opts:["Ναι","Όχι","Δεν γνωρίζω"],why:"Συνδέει το ακίνητο με το Κτηματολόγιο."},
    {id:"insulation",text:"Υπάρχει μόνωση στην τοιχοποιία;",type:"choice",opts:["Ναι","Όχι","Δεν γνωρίζω"],why:"Σημαντικό για ενεργειακή αξιολόγηση. Επιβεβαιώνεται στην αυτοψία."}
  ],
  "Τοπογραφικό":[
    {id:"topo_purpose",text:"Για ποιο σκοπό χρειάζεται το τοπογραφικό;",type:"choice",opts:["Συμβόλαιο","Οικοδομική άδεια","Τακτοποίηση","Κτηματολόγιο","Άλλο"],why:"Ο σκοπός καθορίζει ποια στοιχεία είναι κρίσιμα."},
    {id:"old_topo",text:"Υπάρχει παλαιότερο τοπογραφικό διάγραμμα;",type:"choice",opts:["Ναι","Όχι","Δεν γνωρίζω"],why:"Ακόμα και παλιό διάγραμμα μειώνει λάθη."},
    {id:"titles",text:"Υπάρχουν διαθέσιμοι τίτλοι ιδιοκτησίας;",type:"choice",opts:["Ναι","Όχι","Δεν γνωρίζω"],why:"Απαραίτητοι για τον προσδιορισμό ορίων."},
    {id:"kaek",text:"Υπάρχει διαθέσιμος ΚΑΕΚ;",type:"choice",opts:["Ναι","Όχι","Δεν γνωρίζω"],why:"Κρίσιμο για σύνδεση με Κτηματολόγιο."}
  ],
  "Αυθαίρετο":[
    {id:"year",text:"Ποιο είναι το έτος κατασκευής;",type:"text",ph:"π.χ. 1985",why:"Βοηθά στον χαρακτηρισμό. Καταγράφεται ως δήλωση."},
    {id:"plans",text:"Υπάρχουν διαθέσιμα σχέδια;",type:"choice",opts:["Ναι","Όχι","Δεν γνωρίζω"],why:"Χωρίς σχέδια η αποτύπωση γίνεται απαραίτητη."},
    {id:"permit",text:"Υπάρχει οικοδομική άδεια;",type:"choice",opts:["Ναι","Όχι","Δεν γνωρίζω"],why:"Καθορίζει το πλαίσιο ελέγχου."},
    {id:"deviation",text:"Υπάρχουν εμφανείς αποκλίσεις;",type:"choice",opts:["Ναι","Όχι","Δεν γνωρίζω"],why:"Καταγράφουμε αυτό που φαίνεται. Δεν βγάζουμε τελική κρίση εδώ."}
  ],
  "default":[
    {id:"year",text:"Ποιο είναι το έτος κατασκευής;",type:"text",ph:"π.χ. 1972",why:"Το καταγράφουμε ως δήλωση."},
    {id:"plans",text:"Υπάρχουν διαθέσιμα αρχιτεκτονικά σχέδια;",type:"choice",opts:["Ναι","Όχι","Δεν γνωρίζω"],why:"Χωρίς κάτοψη αυξάνεται ο κίνδυνος επιστροφής φακέλου."},
    {id:"permit",text:"Υπάρχει οικοδομική άδεια;",type:"choice",opts:["Ναι","Όχι","Δεν γνωρίζω"],why:"Βασικό δικαιολογητικό."},
    {id:"kaek",text:"Υπάρχει διαθέσιμος ΚΑΕΚ;",type:"choice",opts:["Ναι","Όχι","Δεν γνωρίζω"],why:"Συνδέει με Κτηματολόγιο."}
  ]
};

function getQs(){return QUESTIONS[caseData.workType]||QUESTIONS["default"];}

function isYearValid(val){
  if(!val) return false;
  if(!/^\d{4}$/.test(val.trim())) return false;
  const y=parseInt(val.trim(),10);
  return y>=1800 && y<=new Date().getFullYear();
}

function build(){
  const yearStr=(answers.year||"").trim();
  const yearOk=isYearValid(yearStr);
  const year=yearOk?parseInt(yearStr,10):null;
  const old=yearOk&&year<1980;
  const isTopo=caseData.workType==="Τοπογραφικό";
  const pdfs=files.filter(f=>/\.pdf$/i.test(f.name)).length;
  const cads=files.filter(f=>/\.(dwg|dxf)$/i.test(f.name)).length;
  const images=files.filter(f=>/\.(jpe?g|png)$/i.test(f.name)).length;

  const facts=[];
  if(isTopo){
    facts.push(
      {name:"Σκοπός",value:answers.topo_purpose||"—",status:answers.topo_purpose?"declared":"missing"},
      {name:"Παλαιότερο τοπογραφικό",value:answers.old_topo||"—",status:answers.old_topo==="Ναι"?"declared":answers.old_topo==="Όχι"?"missing":"needs_check"},
      {name:"Τίτλοι ιδιοκτησίας",value:answers.titles||"—",status:answers.titles==="Ναι"?"declared":answers.titles==="Όχι"?"missing":"needs_check"},
      {name:"ΚΑΕΚ",value:answers.kaek||"—",status:answers.kaek==="Ναι"?"declared":answers.kaek==="Όχι"?"missing":"needs_check"},
      {name:"Αποτύπωση",value:"Δεν έχει γίνει",status:"not_done"}
    );
  }else{
    facts.push(
      {name:"Έτος κατασκευής",value:yearOk?String(year):"—",status:yearOk?"declared":"missing"},
      {name:"Αρχιτεκτονικά σχέδια",value:answers.plans||"—",status:answers.plans==="Ναι"?"declared":answers.plans==="Όχι"?"missing":"needs_check"},
      {name:"Οικοδομική άδεια",value:answers.permit||"—",status:answers.permit==="Ναι"?"declared":answers.permit==="Όχι"?"missing":"needs_check"},
      {name:"ΚΑΕΚ",value:answers.kaek||"—",status:answers.kaek==="Ναι"?"declared":answers.kaek==="Όχι"?"missing":"needs_check"},
      {name:"Αυτοψία",value:"Δεν έχει γίνει",status:"not_done"},
      {name:"Φωτογραφίες",value:images>0?`${images} αρχείο/α`:"Καμία",status:images>0?"declared":"not_done"}
    );
    if(answers.insulation) facts.push({name:"Μόνωση",value:answers.insulation,status:"needs_check"});
    if(answers.deviation) facts.push({name:"Αποκλίσεις",value:answers.deviation,status:"needs_check"});
  }
  if(pdfs>0) facts.push({name:"PDF τεκμήρια",value:`${pdfs} αρχείο/α`,status:"declared"});
  if(cads>0) facts.push({name:"CAD (DWG/DXF)",value:`${cads} αρχείο/α — απαιτείται έλεγχος περιεχομένου`,status:"needs_check"});

  const counts={
    declared:facts.filter(f=>f.status==="declared").length,
    needs:facts.filter(f=>f.status==="needs_check").length,
    missing:facts.filter(f=>f.status==="missing").length,
    notDone:facts.filter(f=>f.status==="not_done").length,
    total:facts.length
  };

  let overall="yellow";
  if(counts.missing>0) overall="red";
  else if(counts.needs===0&&counts.notDone===0) overall="green";

  let nba={title:"Πραγματοποίησε αυτοψία και τεκμηρίωσε με φωτογραφίες",reasons:["Δεν έχει επιβεβαιωθεί η πραγματική κατάσταση"]};
  if(isTopo){
    if(answers.old_topo==="Όχι"||!answers.old_topo) nba={title:"Ζήτησε τίτλους και παλαιά διαγράμματα",reasons:["Δεν υπάρχει διαθέσιμο τοπογραφικό","Αυξάνεται ο κίνδυνος λάθους στα όρια"]};
    else if(answers.titles==="Όχι") nba={title:"Ζήτησε τους τίτλους ιδιοκτησίας",reasons:["Απαραίτητοι για τον προσδιορισμό ορίων"]};
    else nba={title:"Προγραμμάτισε αποτύπωση",reasons:["Υπάρχουν βασικά στοιχεία"]};
  }else if(answers.plans==="Όχι"){
    nba={title:"Προγραμμάτισε αυτοψία + συλλογή διαστάσεων",reasons:["Δεν υπάρχει κάτοψη","Υψηλή πιθανότητα επιστροφής φακέλου"]};
  }else if(answers.permit==="Όχι"){
    nba={title:"Συγκέντρωσε την οικοδομική άδεια",reasons:["Βασικό δικαιολογητικό"]};
  }else if(answers.kaek==="Όχι"){
    nba={title:"Εντόπισε τον ΚΑΕΚ",reasons:["Συνδέει με το Κτηματολόγιο"]};
  }else if(cads>0){
    nba={title:"Έλεγξε το περιεχόμενο των CAD αρχείων",reasons:["Τα DWG/DXF χρειάζονται επαλήθευση"]};
  }else if(old){
    nba={title:"Αυτοψία με έμφαση σε τοιχοποιία & υγρασία",reasons:[`Κτίριο του ${year} (προ 1980)`]};
  }

  return {facts,counts,nba,old,year,overall,pdfs,cads,images};
}

function chip(s){
  const m={declared:{c:T.warn,bg:T.warnBg,t:"ΔΗΛΩΘΗΚΕ"},needs_check:{c:T.warn,bg:T.warnBg,t:"ΠΡΟΣ ΕΛΕΓΧΟ"},missing:{c:T.bad,bg:T.badBg,t:"ΛΕΙΠΕΙ"},not_done:{c:T.bad,bg:T.badBg,t:"ΔΕΝ ΕΧΕΙ ΓΙΝΕΙ"},confirmed:{c:T.ok,bg:T.okBg,t:"ΕΠΙΒΕΒΑΙΩΜΕΝΟ"}};
  const x=m[s]||m.needs_check;
  return `<span style="display:inline-flex;align-items:center;gap:5px;padding:3px 7px;background:${x.bg};color:${x.c};font-size:10px;font-weight:700"><span style="width:6px;height:6px;background:${x.c}"></span>${x.t}</span>`;
}

function title(title,status){
  const m={green:{c:T.ok,t:"ΣΩΣΤΗ ΠΟΡΕΙΑ"},red:{c:T.bad,t:"ΕΚΚΡΕΜΟΤΗΤΑ"},neutral:{c:T.muted,t:"ΝΕΑ ΥΠΟΘΕΣΗ"},yellow:{c:T.warn,t:"ΧΡΕΙΑΖΕΤΑΙ ΕΛΕΓΧΟ"}};
  const s=m[status]||m.yellow;
  return `<div style="display:grid;grid-template-columns:1fr auto;border-bottom:1px solid ${T.line};background:#FBFAF7"><div style="padding:10px 16px;border-right:1px solid ${T.line}"><div style="font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:${T.muted}">Υπόθεση</div><div style="font-weight:600;font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${title}</div></div><div style="padding:10px 12px"><div style="font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:${T.muted}">Κατάσταση</div><div style="display:flex;align-items:center;gap:5px;margin-top:2px"><span style="width:7px;height:7px;background:${s.c}"></span><span style="font-size:10px;font-weight:700;color:${s.c}">${s.t}</span></div></div></div>`;
}

function render(){
  const root=document.getElementById("root");
  if(screen==="home") root.innerHTML=home();
  else if(screen==="new") root.innerHTML=newCase();
  else if(screen==="questions") root.innerHTML=questions();
  else if(screen==="files") root.innerHTML=filesScreen();
  else if(screen==="folder") root.innerHTML=folder();
  else if(screen==="review") root.innerHTML=review();
  bind();
}

function home(){
  return `<div style="background:${T.navy};padding:36px 20px 28px"><div style="font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:#9FB3CC">AI Senior Engineer</div><h1 style="color:#F5F4EF;font-size:22px;font-weight:700;margin-top:8px">Καλώς ήρθες.</h1><p style="color:#C3CEDD;font-size:14px;margin-top:10px;line-height:1.55">Οργάνωσε την υπόθεση.<br>Εντόπισε τα κενά.<br>Δες το επόμενο ασφαλές βήμα.</p></div><div style="flex:1;padding:20px"><button data-go="new" style="width:100%;display:flex;align-items:center;gap:14px;padding:16px;border:1px solid ${T.navy};background:#fff"><div style="width:40px;height:40px;background:${T.navy};color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px">+</div><div style="text-align:left"><div style="font-weight:700;font-size:15px">Νέα υπόθεση</div><div style="font-size:12.5px;color:${T.muted};margin-top:2px">Ξεκίνα με τα βασικά</div></div></button></div>`;
}

function newCase(){
  const types=["ΠΕΑ","Τοπογραφικό","Αυθαίρετο","Νέα Άδεια","Αυτοψία"];
  const ok=caseData.customer.trim()&&caseData.address.trim()&&caseData.workType;
  return `${title("— νέος φάκελος —","neutral")}<div style="flex:1;padding:20px;overflow:auto"><button data-go="home" style="color:${T.muted};font-size:13px;font-weight:600;margin-bottom:8px">← Πίσω</button><h2 style="font-size:18px;font-weight:700;margin-top:6px">Νέα τεχνική εργασία</h2><p style="font-size:13px;color:${T.muted};margin:6px 0 16px">Ό,τι καταχωρείται θεωρείται δήλωση μέχρι να τεκμηριωθεί.</p><div style="margin-bottom:12px"><div style="font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:${T.muted}">Πελάτης</div><input id="customer" value="${caseData.customer}" placeholder="Ονοματεπώνυμο" style="width:100%;margin-top:6px;padding:12px;border:1px solid ${T.line};background:#fff;font-size:14px"></div><div style="margin-bottom:12px"><div style="font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:${T.muted}">Διεύθυνση</div><input id="address" value="${caseData.address}" placeholder="Οδός, αριθμός, περιοχή" style="width:100%;margin-top:6px;padding:12px;border:1px solid ${T.line};background:#fff;font-size:14px"></div><div style="font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:${T.muted}">Τύπος εργασίας</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">${types.map(t=>`<button data-type="${t}" style="padding:12px 8px;border:1px solid ${caseData.workType===t?T.navy:T.line};background:${caseData.workType===t?T.navy:"#fff"};color:${caseData.workType===t?"#fff":T.ink};font-weight:600;font-size:13px">${t}</button>`).join("")}</div></div><div style="padding:16px;border-top:1px solid ${T.line};background:#FBFAF7"><button data-go="questions" ${ok?"":"disabled"} style="width:100%;padding:14px;background:${ok?T.navy:"#C9C4B6"};color:#fff;font-weight:600">Συνέχεια →</button></div>`;
}

function questions(){
  const qs=getQs();
  const q=qs[qIndex];
  const val=(answers[q.id]||"").trim();
  const yearError=q.id==="year"&&val&&!isYearValid(val);
  const canNext=q.type==="text" ? (q.id==="year" ? isYearValid(val) : !!val) : !!val;

  return `${title(caseData.workType+" — "+caseData.address,"yellow")}<div style="flex:1;padding:20px;overflow:auto"><button data-back style="color:${T.muted};font-size:13px;font-weight:600;margin-bottom:8px">← Πίσω</button><div style="display:flex;gap:3px;margin:12px 0 16px">${qs.map((_,i)=>`<div style="flex:1;height:3px;background:${i<=qIndex?T.navy:T.line}"></div>`).join("")}</div><div style="font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:${T.muted}">Ερώτηση ${qIndex+1}/${qs.length}</div><h2 style="font-size:17px;font-weight:700;margin-top:8px;line-height:1.35">${q.text}</h2><div style="margin-top:12px;padding:10px 12px;background:#EFEDE4;border-left:2px solid ${T.soft};font-size:12.5px;color:#454540;line-height:1.5">${q.why}</div><div style="margin-top:20px">${q.type==="text"?`<input id="ans" value="${answers[q.id]||""}" placeholder="${q.ph}" style="width:100%;padding:12px;border:1px solid ${yearError?T.bad:T.line};background:#fff;font-size:15px">${yearError?`<p style="font-size:12px;color:${T.bad};margin-top:6px">Βάλε έγκυρο έτος (π.χ. 1972)</p>`:""}`:`<div style="display:flex;flex-direction:column;gap:8px">${q.opts.map(o=>`<button data-opt="${o}" style="padding:13px 16px;border:1px solid ${val===o?T.navy:T.line};background:${val===o?T.navy:"#fff"};color:${val===o?"#fff":T.ink};font-weight:600;text-align:left">${o}${val===o?" ✓":""}</button>`).join("")}</div>`}</div></div><div style="padding:16px;border-top:1px solid ${T.line};background:#FBFAF7"><button data-next ${canNext?"":"disabled"} style="width:100%;padding:14px;background:${canNext?T.navy:"#C9C4B6"};color:#fff;font-weight:600">${qIndex<qs.length-1?"Επόμενο →":"Αρχεία →"}</button></div>`;
}

function filesScreen(){
  const d=build();
  return `${title(caseData.workType+" — "+caseData.address,d.overall)}<div style="flex:1;padding:20px;overflow:auto"><button data-go="questions" style="color:${T.muted};font-size:13px;font-weight:600;margin-bottom:8px">← Πίσω</button><h2 style="font-size:18px;font-weight:700;margin-top:6px">Αρχεία</h2><p style="font-size:13px;color:${T.muted};margin:4px 0 14px">PDF, CAD (DWG/DXF), φωτογραφίες. Τα CAD χρειάζονται έλεγχο περιεχομένου.</p><div style="border:1px dashed ${T.line};padding:16px;background:#fff;text-align:center;margin-bottom:14px"><input type="file" id="fileInput" multiple accept=".pdf,.dwg,.dxf,.jpg,.jpeg,.png"><p style="font-size:12px;color:${T.muted};margin-top:8px">PDF · DWG/DXF · JPG/PNG</p></div><div style="display:flex;gap:8px;margin-bottom:14px"><div style="flex:1;padding:10px;border:1px solid ${T.line};background:#FBFAF7;text-align:center;font-size:12px"><b>${d.pdfs}</b><br>PDF</div><div style="flex:1;padding:10px;border:1px solid ${T.line};background:#FBFAF7;text-align:center;font-size:12px"><b>${d.cads}</b><br>CAD</div><div style="flex:1;padding:10px;border:1px solid ${T.line};background:#FBFAF7;text-align:center;font-size:12px"><b>${d.images}</b><br>Εικόνες</div></div>${files.length===0?`<div style="padding:12px;background:${T.warnBg};font-size:13px">Δεν έχει προστεθεί αρχείο.</div>`:files.map((f,i)=>`<div style="display:flex;justify-content:space-between;padding:12px;border:1px solid ${T.line};background:#fff;margin-bottom:6px"><div><div style="font-weight:600;font-size:13px">${f.name}</div><div style="font-size:11px;color:${T.muted}">${Math.round(f.size/1024)} KB</div></div><button data-remove="${i}" style="color:${T.muted}">×</button></div>`).join("")}${d.cads>0?`<div style="margin-top:12px;padding:12px;background:${T.warnBg};font-size:12.5px"><b>CAD:</b> Απαιτείται έλεγχος περιεχομένου πριν θεωρηθούν επαρκή.</div>`:""}</div><div style="padding:16px;border-top:1px solid ${T.line};background:#FBFAF7"><button data-go="folder" style="width:100%;padding:14px;background:${T.navy};color:#fff;font-weight:600">Τεχνικός φάκελος →</button></div>`;
}

function folder(){
  const d=build();
  return `${title(caseData.workType+" — "+caseData.address,d.overall)}<div style="flex:1;padding:20px;overflow:auto"><button data-go="files" style="color:${T.muted};font-size:13px;font-weight:600;margin-bottom:8px">← Πίσω</button><h2 style="font-size:18px;font-weight:700;margin-top:6px">Τεχνικός φάκελος</h2><p style="font-size:13px;color:${T.muted};margin:4px 0 14px">Τι έχουμε, τι λείπει, τι θέλει έλεγχο.</p><div style="padding:14px;border:1px solid ${T.line};background:#FBFAF7;margin-bottom:14px"><div style="display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13.5px"><span>Δηλωμένα</span><strong>${d.counts.declared}/${d.counts.total}</strong><span>Προς έλεγχο</span><strong>${d.counts.needs}/${d.counts.total}</strong><span>Λείπουν</span><strong style="color:${T.bad}">${d.counts.missing}/${d.counts.total}</strong><span>Δεν έχουν γίνει</span><strong style="color:${T.bad}">${d.counts.notDone}/${d.counts.total}</strong></div></div>${d.facts.map(f=>`<div style="padding:12px;border:1px solid ${T.line};background:#fff;margin-bottom:6px;display:flex;justify-content:space-between;gap:10px"><div><div style="font-weight:700;font-size:13.5px">${f.name}</div><div style="font-size:13px;margin-top:2px">${f.value}</div></div>${chip(f.status)}</div>`).join("")}</div><div style="padding:16px;border-top:1px solid ${T.line};background:#FBFAF7"><button data-go="review" style="width:100%;padding:14px;background:${T.navy};color:#fff;font-weight:600">Senior Review →</button></div>`;
}

function review(){
  const d=build();
  return `${title(caseData.workType+" — "+caseData.address,d.overall)}<div style="flex:1;padding:20px;overflow:auto"><button data-go="folder" style="color:${T.muted};font-size:13px;font-weight:600;margin-bottom:8px">← Πίσω</button><h2 style="font-size:18px;font-weight:700;margin-top:6px">Senior Review</h2><p style="font-size:13px;color:${T.muted};margin:4px 0 14px">Στόχος: να μην ξεχάσεις κάτι κρίσιμο πριν καταθέσεις τον φάκελο.</p><div style="padding:16px;border:1px solid ${T.navy};background:${T.info};margin-bottom:14px"><div style="font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:${T.navy};margin-bottom:8px">Επόμενο κρίσιμο βήμα</div><div style="font-size:15px;font-weight:700;line-height:1.35;margin-bottom:8px">${d.nba.title}</div><ul style="padding-left:18px;margin:0;font-size:13px;color:#3A4555">${d.nba.reasons.map(r=>`<li style="margin-bottom:4px">${r}</li>`).join("")}</ul></div><div style="padding:14px;border:1px solid ${T.line};background:#FBFAF7;margin-bottom:14px"><div style="display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13.5px"><span>Δηλωμένα</span><strong>${d.counts.declared}/${d.counts.total}</strong><span>Προς έλεγχο</span><strong>${d.counts.needs}/${d.counts.total}</strong><span>Λείπουν</span><strong style="color:${T.bad}">${d.counts.missing}/${d.counts.total}</strong><span>Δεν έχουν γίνει</span><strong style="color:${T.bad}">${d.counts.notDone}/${d.counts.total}</strong></div></div>${d.old?`<div style="padding:12px;background:${T.warnBg};margin-bottom:14px;font-size:12.5px"><b>Προσοχή:</b> Κτίριο του ${d.year}. Έλεγχος τοιχοποιίας & υγρασίας.</div>`:""}<div style="padding:14px;border:1px solid ${T.navy};background:${T.info};font-size:13.5px;font-style:italic;line-height:1.5">«Αυτά γνωρίζουμε. Αυτά δεν γνωρίζουμε. Αυτά χρειάζονται απόδειξη. Αυτό είναι το επόμενο ασφαλές βήμα.»</div></div><div style="padding:16px;border-top:1px solid ${T.line};background:#FBFAF7;display:flex;gap:8px"><button data-restart style="padding:14px 18px;border:1px solid ${T.line};color:${T.muted}">↺ Νέα</button><button data-go="home" style="flex:1;padding:14px;background:${T.navy};color:#fff;font-weight:600">Home</button></div>`;
}

function bind(){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{if(b.dataset.go==="questions")qIndex=0;screen=b.dataset.go;render()});
  document.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{caseData.workType=b.dataset.type;render()});
  const c=document.getElementById("customer");if(c)c.oninput=e=>caseData.customer=e.target.value;
  const a=document.getElementById("address");if(a)a.oninput=e=>caseData.address=e.target.value;

  // FIX: για το έτος (και γενικά text) κάνουμε render σε κάθε αλλαγή
  const ans=document.getElementById("ans");
  if(ans){
    ans.oninput=e=>{
      const qs=getQs();
      answers[qs[qIndex].id]=e.target.value;
      render(); // ← αυτό διορθώνει το "κολλάει"
    };
  }

  document.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{answers[getQs()[qIndex].id]=b.dataset.opt;render()});
  const next=document.querySelector("[data-next]");if(next)next.onclick=()=>{const qs=getQs();if(qIndex<qs.length-1){qIndex++;render()}else{screen="files";render()}};
  const back=document.querySelector("[data-back]");if(back)back.onclick=()=>{if(qIndex>0){qIndex--;render()}else{screen="new";render()}};
  const fi=document.getElementById("fileInput");if(fi)fi.onchange=e=>{files=[...files,...Array.from(e.target.files||[])];render()};
  document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{files.splice(+b.dataset.remove,1);render()});
  const r=document.querySelector("[data-restart]");if(r)r.onclick=()=>{screen="home";caseData={customer:"",address:"",workType:""};answers={};files=[];qIndex=0;render()};
}
render();
})();
</script>
</body>
</html>
