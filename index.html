<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="theme-color" content="#0B1C2E"/>
<title>AI Senior Engineer — Case OS v2</title>
<style>
:root{
  --bg:#F2F4F7;--card:#fff;--ink:#152033;--muted:#64748B;--line:#E2E8F0;
  --navy:#0B1C2E;--blue:#2563EB;--soft:#EFF6FF;
  --ok:#059669;--okBg:#ECFDF5;--warn:#D97706;--warnBg:#FFFBEB;
  --bad:#DC2626;--badBg:#FEF2F2;--grey:#94A3B8;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;display:flex;justify-content:center}
#app{width:100%;max-width:440px;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:none;background:none}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--blue);outline-offset:0}

.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{font-weight:800;font-size:13px;color:var(--navy);line-height:1.25}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.scroll{flex:1;overflow:auto;padding:16px 16px 28px}
.foot{padding:12px 16px;border-top:1px solid var(--line);background:#fff;position:sticky;bottom:0}

.btn{width:100%;padding:14px;background:var(--navy);color:#fff;font-weight:700;border-radius:12px;font-size:15px}
.btn.ghost{background:#fff;color:var(--muted);border:1px solid var(--line)}
.btn.ok{background:var(--ok)}
.btn.warn{background:var(--warn);color:#fff}
.btn.sm{padding:9px 12px;font-size:13px;width:auto;border-radius:10px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:11px}
.card.tap{cursor:pointer}
.card.tap:active{border-color:var(--blue)}
.h1{font-size:21px;font-weight:800;margin-bottom:4px}
.h2{font-size:16px;font-weight:800;margin-bottom:6px}
.muted{color:var(--muted);font-size:13px;line-height:1.5}
.label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}

.four{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.four .q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px}
.four .q .k{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.four .q .v{font-size:13px;font-weight:700;margin-top:4px;line-height:1.35}

.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.chip.ok{background:var(--okBg);color:var(--ok)}
.chip.warn{background:var(--warnBg);color:var(--warn)}
.chip.bad{background:var(--badBg);color:var(--bad)}
.chip.info{background:var(--soft);color:var(--blue)}
.chip.grey{background:#F1F5F9;color:var(--grey)}

.choice{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;font-weight:600;font-size:14px}
.choice.on{background:var(--navy);border-color:var(--navy);color:#fff}
.choice.inline{display:inline-block;width:auto;padding:8px 12px;margin:0 6px 6px 0;font-size:13px}

.nsa{background:var(--soft);border:1px solid #BFDBFE;border-radius:var(--r);padding:14px;margin:10px 0}
.nsa .t{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--blue);margin-bottom:5px}
.nsa .a{font-weight:800;font-size:15px;line-height:1.35}
.nsa .why{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.45}

.senior{background:#F8FAFC;border:1px solid var(--line);border-radius:var(--r);padding:13px;margin:10px 0}
.senior .t{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.senior p{font-size:13.5px;line-height:1.5;color:#334155}

.hero{background:var(--navy);color:#F8FAFC;padding:26px 18px 22px}
.hero .tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#93A4B8;font-weight:700}
.hero h1{font-size:20px;font-weight:800;margin:8px 0 6px}
.hero p{color:#A8B8CC;font-size:13.5px;line-height:1.5}

.item{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.4}
.item:last-child{border-bottom:none}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.back{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:12px;display:inline-flex}
.warnbox{background:var(--warnBg);border:1px solid #FCD34D;border-radius:var(--r);padding:13px;margin:10px 0;font-size:13.5px;line-height:1.45}
.warnbox b{color:var(--warn)}
.okbox{background:var(--okBg);border:1px solid #A7F3D0;border-radius:var(--r);padding:13px;margin:10px 0;font-size:13.5px;line-height:1.45}
.badbox{background:var(--badBg);border:1px solid #FECACA;border-radius:var(--r);padding:13px;margin:10px 0;font-size:13.5px;line-height:1.45}
.critbox{background:#1e1b4b;color:#e0e7ff;border-radius:var(--r);padding:13px;margin:10px 0;font-size:13.5px;line-height:1.5}
.critbox b{color:#c7d2fe}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;z-index:50;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.steps{display:flex;gap:3px;margin-bottom:14px}
.steps i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--navy)}
.steps i.done{background:var(--ok)}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.check input{width:18px;height:18px;margin-top:2px;flex-shrink:0}
.mem-tag{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:4px;margin-right:6px}
.mem-tag.confirmed{background:var(--okBg);color:var(--ok)}
.mem-tag.reported{background:#EEF2FF;color:#4F46E5}
.mem-tag.observed{background:#ECFEFF;color:#0E7490}
.mem-tag.missing{background:#F1F5F9;color:var(--grey)}
.mem-tag.conflict{background:var(--warnBg);color:var(--warn)}
.mem-tag.risk{background:var(--badBg);color:var(--bad)}
.mem-tag.decision{background:var(--navy);color:#fff}
.phase{font-size:12px;color:var(--muted);line-height:1.55}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
const mem={};
const store=(function(){
  try{const k='__t';localStorage.setItem(k,'1');localStorage.removeItem(k);return localStorage;}
  catch(e){return{getItem:k=>mem[k]??null,setItem:(k,v)=>{mem[k]=String(v)},removeItem:k=>{delete mem[k]}};}
})();
const KEY='ase-v2';

let S={screen:'home',cases:[],cur:null,draft:{},comm:{},assets:{},toast:null};

function uid(){return 'c_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function load(){try{const r=store.getItem(KEY);if(r){const p=JSON.parse(r);S.cases=p.cases||[]}}catch(e){}}
function save(){try{store.setItem(KEY,JSON.stringify({cases:S.cases}))}catch(e){}}
function cur(){return S.cases.find(c=>c.id===S.cur)||null}
function toast(m){S.toast=m;render();setTimeout(()=>{S.toast=null;render()},1800)}
function go(sc){S.screen=sc;render()}
function openCase(id){S.cur=id;S.screen='case';render()}

/* ========== CASE MEMORY + SENIOR ENGINE ========== */
function detectRiskKeywords(text){
  if(!text) return [];
  const t=text.toLowerCase();
  const hits=[];
  const map=[
    [/natura|νατούρα|φύση 2000/,'Natura / προστατευόμενη περιοχή'],
    [/διατηρητ|listed/,'Διατηρητέο'],
    [/αρχαιολογ/,'Αρχαιολογικός χώρος'],
    [/παραδοσιακ/,'Παραδοσιακός οικισμός'],
    [/αιγιαλ|παραλ/,'Αιγιαλός / παραλία'],
    [/δασικ|forest/,'Δασική έκταση'],
    [/εκτ[οό]ς\s*σχεδ/,'Εκτός σχεδίου'],
    [/ρ[εέ]μα|stream/,'Ρέμα'],
    [/αυθα[ιί]ρ/,'Αυθαίρετο'],
    [/αλλαγ[ήη]\s*χρ[ήη]σ/,'Αλλαγή χρήσης'],
    [/ρυμοτομ/,'Ρυμοτομία'],
    [/ρωγμ|καθ[ιί]ζησ/,'Ρωγμές / καθίζηση'],
    [/υγρασ/,'Υγρασία'],
    [/εστ[ιί]ασ|εστιατ[οό]ρ/,'Χώρος εστίασης']
  ];
  map.forEach(([re,lab])=>{if(re.test(t)) hits.push(lab)});
  return hits;
}

function buildMemory(c){
  const confirmed=[],reported=[],observed=[],missing=[],conflicts=[],risks=[],decisions=[];
  if(c.clientName) confirmed.push('Πελάτης: '+c.clientName);
  if(c.region) confirmed.push('Περιοχή: '+c.region);
  if(c.workType) confirmed.push('Εργασία: '+c.workType);
  if(c.purpose) confirmed.push('Σκοπός: '+c.purpose);

  if(c.statement){
    reported.push(c.statement.slice(0,120)+(c.statement.length>120?'…':''));
  }

  const assets=c.assets||{};
  const labels={title:'Τίτλος',kaek:'ΚΑΕΚ',topo:'Τοπογραφικό',permit:'Οικοδομική άδεια',plans:'Σχέδια',e9:'Ε9'};
  Object.keys(labels).forEach(k=>{
    if(assets[k]==='HAS') confirmed.push(labels[k]+' — δηλωμένο διαθέσιμο (όχι ακόμη verified περιεχόμενο)');
    else if(assets[k]==='DOES_NOT_HAVE') missing.push(labels[k]);
    else if(assets[k]==='UNKNOWN') missing.push(labels[k]+' (UNKNOWN)');
    else if(c.statement) missing.push(labels[k]+' (δεν ρωτήθηκε)');
  });

  if(c.fieldNotes){
    observed.push(c.fieldNotes.slice(0,140)+(c.fieldNotes.length>140?'…':''));
    const fl=c.fieldNotes.toLowerCase();
    if(/διαφορ|απ[οό]κλι|δεν\s*συμφων|αλλαγή\s*χρ[ήη]σ|παράθυρ/.test(fl))
      conflicts.push('Σχέδια ↔ υφιστάμενη κατάσταση (αυτοψία)');
    if(/υγρασ/.test(fl)){
      observed.push('Υγρασία / επιχρίσματα');
      risks.push({obs:'Υγρασία',cause:'πιθανή διαρροή / εγκατάσταση (ΥΠΟΘΕΣΗ)',status:'REVIEW_REQUIRED'});
    }
    if(/ρωγμ/.test(fl))
      risks.push({obs:'Ρωγμές',cause:'πιθανή καθίζηση (ΥΠΟΘΕΣΗ)',status:'REVIEW_REQUIRED'});
  }

  detectRiskKeywords((c.statement||'')+' '+(c.region||'')+' '+(c.fieldNotes||'')).forEach(r=>risks.push({obs:r,cause:'λέξη-κλειδί υψηλού κινδύνου',status:'ELEVATED_REVIEW'}));

  if(c.statement){
    const low=c.statement.toLowerCase();
    if(/νομ[ιί]μ/.test(low)&&/πιστε[υύ]|νομ[ιί]ζω|θα\s*ε[ιί]ναι/.test(low))
      risks.push({obs:'Δήλωση νομιμότητας από πελάτη',cause:'Reported ≠ Confirmed',status:'VERIFY'});
  }

  if(c.finding) observed.push('Finding: '+c.finding);
  if(c.decision) decisions.push(c.decision);

  if((c.docs||[]).length) confirmed.push((c.docs.length)+' αρχείο/α στον φάκελο (upload ≠ verified)');

  return{confirmed,reported,observed,missing,conflicts,risks,decisions};
}

function buildHome(c){
  const m=buildMemory(c);
  let stage='Νέα υπόθεση';
  let next='Επικοινωνία με πελάτη — κατανόηση στόχου';
  let nextWhy='Πρώτα Case Context. Όχι βομβαρδισμός τεχνικών ερωτήσεων.';
  let mode='NORMAL'; // NORMAL | REVIEW | CRITICAL
  let protect=null;
  let parallel=[];

  if(c.statement && !Object.keys(c.assets||{}).length){
    stage='Case intake · επικοινωνία';
    next='Συλλογή διαθέσιμων στοιχείων (έχει / δεν έχει / δεν γνωρίζει)';
    nextWhy='Document-first: ταξινόμησε τι φέρνει ο πελάτης πριν ζητήσεις τα πάντα.';
  }
  if(Object.keys(c.assets||{}).length){
    stage='Existing information';
    next='Οργάνωση εγγράφων στον τεχνικό φάκελο';
    nextWhy='Μελέτησε τα υπάρχοντα πριν ζητήσεις νέα. Gap analysis μετά.';
    parallel=['Συλλογή στοιχείων επικοινωνίας','Προκαταρκτική ανάγνωση τίτλου'];
  }
  if((c.docs||[]).length){
    stage='Documents στον φάκελο';
    next='Αυτοψία με στοχευμένο φύλλο ελέγχου';
    nextWhy='Existing condition first. Field confirms — δεν αντικαθιστά η δήλωση.';
  }
  if(c.fieldDone){
    stage='Observed · gap analysis';
    next='Finding & απόφαση μηχανικού όπου χρειάζεται';
    nextWhy='Παρατήρηση ≠ διάγνωση. Conflict ≠ winner.';
    if(m.conflicts.length||m.risks.length) mode='REVIEW';
  }
  if(c.decision){
    stage='Decision καταχωρήθηκε';
    next='Έλεγχος completion gates · ενημέρωση τεχνικού φακέλου';
    nextWhy='DONE μόνο όταν στοιχεία + έλεγχοι + παραδοτέο + φάκελος.';
  }
  if(c.completed){
    stage='Ολοκληρωμένη · Technical Folder ενημερωμένος';
    next='—';
    nextWhy='Reusable knowledge για επόμενη εργασία (π.χ. ΠΕΑ → ΗΤΚ).';
  }

  /* New building premature protection */
  if(c.workType==='Νέα οικοδομή' && c.prematureDesign && !c.placementValidated){
    mode='CRITICAL';
    protect='Σταμάτα εδώ για λίγο. Μπορείς να συνεχίσεις concept design για συζήτηση με τον πελάτη, αλλά όχι οριστικό τεχνικό σχεδιασμό (ξυλότυποι/οπλισμοί) πριν κλείσουν αρτιότητα, γραμμές, Δ, κάλυψη, ΣΔ, ύψος και ειδικοί περιορισμοί.';
    next='Κλείσιμο πολεοδομικών περιορισμών / θέση κτιρίου';
    nextWhy='Hard gate. Parallel: concept OK · final design όχι.';
  }

  if(m.risks.some(r=>r.status==='ELEVATED_REVIEW') && mode==='NORMAL') mode='REVIEW';

  return{stage,next,nextWhy,mode,protect,parallel,memory:m};
}

function seniorMsg(c,h){
  if(c.completed) return 'Η εργασία έκλεισε σωστά μόνο αν τα gates πληρώθηκαν. Ο τεχνικός φάκελος είναι πλέον μνήμη για την επόμενη εργασία στο ίδιο ακίνητο.';
  if(h.protect) return h.protect;
  if(h.mode==='CRITICAL') return 'Critical mode: μην προχωρήσεις σε εξαρτημένη εργασία. Κλείσε πρώτα το hard gate.';
  if(h.mode==='REVIEW') return 'Αυξημένος έλεγχος. Υπάρχουν conflicts ή λέξεις υψηλού κινδύνου. Διασταύρωσε — μην πανικοβάλλεσαι.';
  if(!c.statement) return 'Δεν χρειάζεται να θυμάσαι όλη τη διαδικασία. Ξεκίνα από τον πελάτη και τον στόχο. Εγώ κρατάω την υπόθεση.';
  if(!Object.keys(c.assets||{}).length) return 'Κατέγραψα statement ως Reported. Επόμενο: τι έχει ήδη; Όχι 20 ερωτήσεις — λίγες, στοχευμένες.';
  if(h.memory.conflicts.length) return 'Ασυμφωνία πηγών. Δεν επιλέγω νικητή. Χρειάζεται ο έλεγχός σου.';
  return 'Παρακολουθώ την υπόθεση. Parallel όπου είναι ασφαλές · hard gates όπου όχι. Εσύ αποφασίζεις.';
}

function phaseLabel(c){
  if(c.completed) return 'Close · Technical Folder';
  if(c.decision) return 'Final verification / gates';
  if(c.fieldDone) return 'Verification · Findings';
  if((c.docs||[]).length) return 'Inspection prep';
  if(Object.keys(c.assets||{}).length) return 'Existing information';
  if(c.statement) return 'Intake · gap setup';
  return 'Case intake';
}

function stepsIdx(c){
  if(c.completed) return 6;
  if(c.decision) return 5;
  if(c.fieldDone) return 4;
  if((c.docs||[]).length) return 3;
  if(Object.keys(c.assets||{}).length) return 2;
  if(c.statement) return 1;
  return 0;
}

/* ========== RENDER ========== */
function render(){
  const root=document.getElementById('app');
  let html='';
  if(S.screen==='home') html=viewHome();
  else if(S.screen==='new') html=viewNew();
  else if(S.screen==='comm') html=viewComm();
  else if(S.screen==='assets') html=viewAssets();
  else if(S.screen==='case') html=viewCase();
  else if(S.screen==='docs') html=viewDocs();
  else if(S.screen==='field') html=viewField();
  else if(S.screen==='review') html=viewReview();
  else if(S.screen==='done') html=viewDone();
  else if(S.screen==='folder') html=viewFolder();
  else if(S.screen==='about') html=viewAbout();
  root.innerHTML=html+(S.toast?`<div class="toast">${S.toast}</div>`:'');
  bind();
}

function top(title,right=''){return `<div class="top"><div class="brand">AI Senior Engineer<small>${title}</small></div><div>${right}</div></div>`}

function viewHome(){
  const list=[...S.cases].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  return `<div class="hero">
    <div class="tag">Case Operating System · v2</div>
    <h1>Senior δίπλα σου</h1>
    <p>Checklist + Experience + Case Memory + Coordination + Gates.<br>Δεν θυμάσαι τα πάντα — η υπόθεση θυμάται.</p>
  </div>
  <div class="scroll">
    <button data-go="new" class="card tap" style="border-color:var(--navy);width:100%;display:flex;gap:12px;align-items:center">
      <div style="width:42px;height:42px;background:var(--navy);color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800">+</div>
      <div style="text-align:left"><div style="font-weight:800">Νέα υπόθεση</div><div class="muted">Case Context πρώτα · μετά workflow</div></div>
    </button>
    <button data-seed-pea class="btn ghost" style="margin-bottom:8px">Demo: ΠΕΑ Παπαδόπουλος</button>
    <button data-seed-build class="btn ghost" style="margin-bottom:12px">Demo: Νέα οικοδομή (πρόωροι ξυλότυποι)</button>
    <div class="sec">Υποθέσεις</div>
    ${list.length?list.map(c=>{
      const h=buildHome(c);
      const chip=c.completed?'ok':(h.mode==='CRITICAL'?'bad':(h.mode==='REVIEW'?'warn':'info'));
      const lab=c.completed?'DONE':(h.mode==='CRITICAL'?'GATE':(h.mode==='REVIEW'?'REVIEW':'ACTIVE'));
      return `<button data-open="${c.id}" class="card tap" style="width:100%;text-align:left">
        <div class="row">
          <div style="min-width:0">
            <div style="font-weight:800">${c.clientName||'—'}</div>
            <div class="muted">${c.workType} · ${c.region||'—'}</div>
            <div class="muted" style="margin-top:3px">${h.stage}</div>
          </div>
          <span class="chip ${chip}">${lab}</span>
        </div>
        ${h.next!=='—'?`<div class="muted" style="margin-top:8px">→ ${h.next}</div>`:''}
      </button>`;
    }).join(''):`<div class="empty">Καμία υπόθεση ακόμη.</div>`}
    <button data-go="about" class="card tap" style="width:100%"><div style="font-weight:700;font-size:13px">Φιλοσοφία v2</div><div class="muted">Senior · Memory · Gates · Quiet UI</div></button>
  </div>`;
}

function viewNew(){
  const d=S.draft;
  const ok=d.clientName&&d.workType;
  const types=['ΠΕΑ','ΗΤΚ','ΕΕΔΜΚ','Τοπογραφικό','Νέα οικοδομή','Ιδιοκτησιακό','Άλλο'];
  return `${top('Νέα υπόθεση')}
  <div class="scroll">
    <button data-go="home" class="back">← Υποθέσεις</button>
    <div class="h2">Case Context</div>
    <p class="muted" style="margin-bottom:12px">Όχι τεχνικός βομβαρδισμός. Πρώτα πελάτης, ακίνητο, στόχος.</p>
    <div class="label">Πελάτης *</div>
    <input id="fName" value="${d.clientName||''}" placeholder="Ονοματεπώνυμο"/>
    <div style="height:8px"></div>
    <div class="label">Τηλέφωνο</div>
    <input id="fPhone" value="${d.phone||''}"/>

/* ========== BIND ========== */
function bind(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    if(b.dataset.go==='new') S.draft={};
    if(b.dataset.go==='comm') S.comm={text:(cur()||{}).statement||'',purpose:(cur()||{}).purpose||''};
    if(b.dataset.go==='assets') S.assets=Object.assign({},(cur()||{}).assets||{});
    go(b.dataset.go);
  });
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openCase(b.dataset.open));
  document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{S.draft.workType=b.dataset.type;render()});

  const fName=document.getElementById('fName');
  if(fName) fName.oninput=e=>{S.draft.clientName=e.target.value;const btn=document.querySelector('[data-create]');if(btn)btn.disabled=!(S.draft.clientName&&S.draft.workType)};
  const fPhone=document.getElementById('fPhone');
  if(fPhone) fPhone.oninput=e=>{S.draft.phone=e.target.value};
  const fRegion=document.getElementById('fRegion');
  if(fRegion) fRegion.oninput=e=>{S.draft.region=e.target.value};

  const create=document.querySelector('[data-create]');
  if(create) create.onclick=()=>{
    if(!(S.draft.clientName&&S.draft.workType)) return;
    const id=uid(),now=Date.now();
    S.cases.push({
      id,clientName:S.draft.clientName.trim(),phone:(S.draft.phone||'').trim(),region:(S.draft.region||'').trim(),
      workType:S.draft.workType,purpose:'',statement:'',assets:{},docs:[],photos:[],
      fieldNotes:'',fieldChecks:{},fieldDone:false,finding:'',decision:'',
      completed:false,placementValidated:false,prematureDesign:false,createdAt:now,updatedAt:now
    });
    save();S.cur=id;S.draft={};S.comm={text:''};S.screen='comm';toast('Case δημιουργήθηκε');render();
  };

  const ct=document.getElementById('commText');
  if(ct) ct.oninput=e=>{S.comm.text=e.target.value;const btn=document.querySelector('[data-save-comm]');if(btn)btn.disabled=!e.target.value.trim()};
  const fp=document.getElementById('fPurpose');
  if(fp) fp.oninput=e=>{S.comm.purpose=e.target.value};
  const sc=document.querySelector('[data-save-comm]');
  if(sc) sc.onclick=()=>{
    const c=cur();if(!c) return;
    c.statement=(S.comm.text||'').trim();
    c.purpose=(S.comm.purpose||'').trim();
    c.updatedAt=Date.now();save();toast('Reported καταγράφηκε');openCase(c.id);
  };

  document.querySelectorAll('[data-asset]').forEach(b=>b.onclick=()=>{S.assets[b.dataset.asset]=b.dataset.val;render()});
  const sa=document.querySelector('[data-save-assets]');
  if(sa) sa.onclick=()=>{const c=cur();if(!c)return;c.assets=Object.assign({},S.assets);c.updatedAt=Date.now();save();toast('Availability OK');openCase(c.id)};

  const fi=document.getElementById('fileIn');
  if(fi) fi.onchange=e=>{
    const c=cur();if(!c) return;
    Array.from(e.target.files||[]).forEach(f=>{
      let kind='Άλλο';
      if(/\.pdf$/i.test(f.name)) kind='PDF';
      else if(/\.(dwg|dxf)$/i.test(f.name)) kind='CAD';
      else if(/\.(jpe?g|png)$/i.test(f.name)) kind='Εικόνα';
      c.docs=c.docs||[];c.docs.push({name:f.name,kb:Math.max(1,Math.round(f.size/1024)),kind});
    });
    c.updatedAt=Date.now();save();toast('Στον φάκελο');render();
  };
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const c=cur();if(!c)return;c.docs.splice(+b.dataset.rm,1);save();render()});

  document.querySelectorAll('[data-chk]').forEach(b=>b.onchange=e=>{const c=cur();if(!c)return;c.fieldChecks=c.fieldChecks||{};c.fieldChecks[b.dataset.chk]=e.target.checked});
  const fn=document.getElementById('fieldNotes');
  if(fn) fn.oninput=e=>{const c=cur();if(c)c.fieldNotes=e.target.value};
  const pi=document.getElementById('photoIn');
  if(pi) pi.onchange=e=>{const c=cur();if(!c)return;c.photos=c.photos||[];Array.from(e.target.files||[]).forEach(f=>c.photos.push({name:f.name}));save();toast('Φωτογραφίες');render()};
  const sf=document.querySelector('[data-save-field]');
  if(sf) sf.onclick=()=>{const c=cur();if(!c)return;c.fieldDone=true;c.updatedAt=Date.now();save();toast('Observed αποθηκεύτηκε');openCase(c.id)};

  const sd=document.querySelector('[data-save-dec]');
  if(sd) sd.onclick=()=>{
    const c=cur();if(!c) return;
    const t=(document.getElementById('decText')||{}).value||'';
    const f=(document.getElementById('findingText')||{}).value||'';
    if(!t.trim()){toast('Χρειάζεται αιτιολογία');return;}
    c.decision=t.trim();c.finding=(f||'').trim();c.updatedAt=Date.now();save();toast('Decision καταχωρήθηκε');openCase(c.id);
  };

  const cp=document.querySelector('[data-complete]');
  if(cp) cp.onclick=()=>{
    const c=cur();if(!c||!c.decision) return;
    if(c.workType==='Νέα οικοδομή'&&c.prematureDesign&&!c.placementValidated){toast('Hard gate');return;}
    c.completed=true;c.updatedAt=Date.now();save();toast('Ολοκληρώθηκε · φάκελος ενημερώθηκε');openCase(c.id);
  };

  const pr=document.querySelector('[data-premature]');
  if(pr) pr.onclick=()=>{const c=cur();if(!c)return;c.prematureDesign=true;c.updatedAt=Date.now();save();toast('Critical intervention');render()};
  const vp=document.querySelector('[data-validate-place]');
  if(vp) vp.onclick=()=>{const c=cur();if(!c)return;c.placementValidated=true;c.updatedAt=Date.now();save();toast('Hard gate άνοιξε');render()};

  const seedPea=document.querySelector('[data-seed-pea]');
  if(seedPea) seedPea.onclick=()=>{
    const id=uid(),now=Date.now();
    S.cases.push({
      id,clientName:'Κ. Παπαδόπουλος',phone:'6911111111',region:'Αχαρνές',
      workType:'ΠΕΑ',purpose:'Exoikonomo',
      statement:'Μονοκατοικία. Έχω παλιά σχέδια. Υπάρχει υγρασία γύρω από το μπάνιο.',
      assets:{},docs:[],photos:[],fieldNotes:'',fieldChecks:{},fieldDone:false,finding:'',decision:'',
      completed:false,placementValidated:false,prematureDesign:false,createdAt:now,updatedAt:now
    });
    save();openCase(id);toast('Demo ΠΕΑ');
  };
  const seedBuild=document.querySelector('[data-seed-build]');
  if(seedBuild) seedBuild.onclick=()=>{
    const id=uid(),now=Date.now();
    S.cases.push({
      id,clientName:'Νέο έργο · πελάτης',phone:'',region:'Οικόπεδο 1000 m²',
      workType:'Νέα οικοδομή',purpose:'Κατοικία 2 όροφοι',
      statement:'Ο πελάτης θέλει μπαλκόνια, πισίνα, γκαζόν, parking.',
      assets:{title:'HAS',kaek:'UNKNOWN',topo:'HAS',permit:'DOES_NOT_HAVE',plans:'DOES_NOT_HAVE',e9:'UNKNOWN'},
      docs:[],photos:[],fieldNotes:'',fieldChecks:{},fieldDone:false,finding:'',decision:'',
      completed:false,placementValidated:false,prematureDesign:false,createdAt:now,updatedAt:now
    });
    save();openCase(id);toast('Demo Νέα οικοδομή');
  };
}

load();
render();
})();
</script>
