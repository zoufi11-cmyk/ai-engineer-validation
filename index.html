<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Senior Engineer — Demo v3</title>
<style>
:root{--paper:#F5F4EF;--ink:#23272B;--muted:#6B6B63;--line:#DBD6C9;--navy:#1D3557;--navy2:#2A466E;--green:#3A6B4C;--greenbg:#E7EFE8;--yellow:#A8791F;--yellowbg:#F5EEDC;--red:#A8412F;--redbg:#F5E4DF;--info:#EEF1F5;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#E4E0D4;color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
#app{min-height:100vh}

.topbar{height:58px;background:#FBFAF7;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20}
.brand{font-weight:800;color:var(--navy)}
.brand small{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.navbtn{border:1px solid var(--line);background:#fff;color:var(--muted);padding:8px 11px;font-size:12px;font-weight:700}
.navbtn.active{background:var(--navy);border-color:var(--navy);color:#fff}

.mobile{width:100%;max-width:430px;min-height:calc(100vh - 58px);margin:0 auto;background:var(--paper);border-left:1px solid var(--line);border-right:1px solid var(--line);display:flex;flex-direction:column}
.hero{padding:30px 20px 24px;background:var(--navy);color:#F5F4EF}
.hero h1{font-size:23px;margin:5px 0}
.hero p{font-size:13px;line-height:1.5;color:#C3CEDD;margin:5px 0}

.label{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;font-size:10px;color:var(--muted)}
.label.light{color:#9FB3CC}

.content{flex:1;padding:20px;overflow:auto}
.cardbtn{width:100%;display:flex;align-items:center;gap:12px;padding:16px;margin-bottom:20px;border:1px solid var(--navy);background:#fff;text-align:left;color:var(--ink);border-radius:10px}
.newicon{width:38px;height:38px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;border-radius:10px}
.recent{display:flex;justify-content:space-between;gap:8px;padding:16px;border:1px solid var(--line);background:#fff;border-radius:10px}

.titleblock{display:grid;grid-template-columns:2fr 1fr;border-bottom:1px solid var(--line);background:#FBFAF7}
.titlecase{padding:10px 16px;border-right:1px solid var(--line);min-width:0}
.titlestatus{padding:10px 12px}
.statusline{display:flex;gap:5px;align-items:center;font-size:10px;font-weight:700}
.dot{width:8px;height:8px;display:inline-block}

.back{border:0;background:none;color:var(--muted);font-size:13px;font-weight:700;padding:7px 0;margin-bottom:8px}
h2{font-size:18px;margin:10px 0 6px}
p{line-height:1.5}
.sub{font-size:12.5px;color:var(--muted);margin:0 0 18px}

.field{margin-bottom:12px}
.inputwrap{display:flex;align-items:center;padding:12px;border:1px solid var(--line);background:#fff;border-radius:8px}
.inputwrap input{width:100%;border:0;outline:0;background:none;color:var(--ink);font-size:14px}

.types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.types button{padding:11px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px;font-weight:700;border-radius:8px;text-align:left}
.types button.selected{border-color:var(--navy);background:var(--navy);color:#fff}

.footer{padding:16px 20px;border-top:1px solid var(--line);background:#FBFAF7}
.primary{width:100%;padding:14px;border:0;background:var(--navy);color:#fff;font-weight:700;border-radius:8px}
.primary:disabled{background:#C9C4B6}

.progress{display:flex;gap:6px;margin:16px 0 24px}
.progress span{height:3px;flex:1;background:var(--line);border-radius:999px}
.progress span.on{background:var(--navy)}

.reason{padding:10px 12px;margin-top:12px;background:#EFEDE4;border-left:2px solid var(--navy2);font-size:12px;color:#454540;border-radius:4px}
.biginput{width:100%;padding:12px;border:1px solid var(--line);background:#fff;outline:none;border-radius:8px}
.options{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.options button{display:flex;justify-content:space-between;padding:13px 16px;border:1px solid var(--line);background:#fff;text-align:left;font-weight:700;border-radius:8px}
.options button.selected{background:var(--navy);border-color:var(--navy);color:#fff}

.completion{margin:18px 0}
.between{display:flex;justify-content:space-between}
.bar{height:5px;background:var(--line);margin:7px 0;border-radius:999px}
.bar span{display:block;height:100%;background:var(--yellow);border-radius:999px}
.completion small{font-size:11px;color:var(--muted)}

.cardrow{display:flex;gap:12px;padding:12px;border:1px solid var(--line);background:#fff;margin-bottom:8px;border-radius:8px}
.cardmain{flex:1}
.cardmain b,.cardmain small,.cardmain em{display:block}
.cardmain b{font-size:13.5px}
.cardmain small{font-size:11.5px;color:var(--muted);margin-top:2px}
.cardmain em{font-size:11px;color:var(--navy2);font-style:normal;margin-top:3px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;font-size:10px;font-weight:800;white-space:nowrap;height:max-content;border-radius:999px}
.chip i{width:7px;height:7px;display:inline-block;border-radius:50%}
.confirmed{color:var(--green);background:var(--greenbg)} .confirmed i{background:var(--green)}
.pending{color:var(--yellow);background:var(--yellowbg)} .pending i{background:var(--yellow)}
.missing{color:var(--red);background:var(--redbg)} .missing i{background:var(--red)}

.next{padding:14px;border:1px solid var(--navy);background:var(--info);margin:16px 0;border-radius:8px}
.next b{display:block;font-size:14px}
.next p{font-size:12.5px;margin:6px 0 0;color:#3A4555}

.axis{display:flex;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);background:#fff;margin-bottom:8px;border-radius:8px}
.axis b,.axis small{display:block}
.axis b{font-size:14px}
.axis small{font-size:11.5px;color:var(--muted);margin-top:3px}

.warning{padding:12px;background:var(--yellowbg);font-size:12px;margin:12px 0;border-radius:8px}
.quote{padding:14px;border:1px solid var(--navy);background:var(--info);font-style:italic;font-size:12.5px;border-radius:8px}

.arch{min-height:calc(100vh - 58px);background:linear-gradient(180deg,#0b1020,#090d18);color:#e8ecf7;padding:34px 18px 70px}
.archinner{max-width:1050px;margin:auto}
.archhero,.archcard{background:rgba(17,24,51,.88);border:1px solid #243052;border-radius:16px;padding:24px;margin-bottom:18px}
.archhero h1{font-size:30px;margin:0 0 8px}
.archhero p,.archcard p{color:#b7c0d8}
.archgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.tag{display:inline-block;padding:4px 9px;border:1px solid #243052;border-radius:999px;color:#6ea8fe;margin:0 5px 7px 0;font-size:12px}
.code{background:#0a0f1d;border:1px solid #243052;border-radius:12px;padding:16px;overflow:auto;color:#d7def0;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.55}
.table{width:100%;border-collapse:collapse}
.table th,.table td{border:1px solid #243052;padding:10px;text-align:left;vertical-align:top}
.table th{background:rgba(110,168,254,.12)}
.ok{color:#7ee787}
.warn{color:#ffcc66}
.archnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.archnav button{padding:9px 12px;border:1px solid #243052;background:#111833;color:#e8ecf7;font-weight:700;border-radius:8px}

@media(max-width:600px){
  .topbar{padding:0 10px}
  .brand{font-size:13px}
  .navbtn{font-size:10px;padding:7px 8px}
  .archhero h1{font-size:24px}
  .arch{padding:20px 12px 50px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
const root=document.getElementById('app');
let mode='app';
let state={screen:'home',caseData:{customer:'',address:'',workType:''},answers:{},qIndex:0,files:[]};

const esc=s=>String(s||'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));
const icon=n=>({plus:'＋',arrow:'→',back:'←',check:'✓',alert:'⚠'}[n]||'•');
const chip=(tone,text)=>`<span class="chip ${tone}"><i></i>${text}</span>`;

const workTypes=[
  ['Νέα Άδεια','Νέα οικοδομική άδεια και τεχνικός έλεγχος'],
  ['ΠΕΑ','Ενεργειακή επιθεώρηση και στοιχεία ακινήτου'],
  ['Αυτοψία','Οργάνωση αυτοψίας και τεκμηρίωσης'],
  ['Τοπογραφικό','Συλλογή στοιχείων για τοπογραφική εργασία'],
  ['Αυθαίρετο','Έλεγχος και οργάνωση αυθαίρετων κατασκευών'],
  ['Άλλο','Νέα τεχνική υπόθεση']
];

const qs=[
  {id:'year',text:'Ποιο είναι το έτος κατασκευής;',reason:'Το έτος αποτελεί αρχική πληροφορία. Δεν θεωρείται επιβεβαιωμένο μέχρι να ελεγχθεί σε διαθέσιμα έγγραφα ή άλλη αξιόπιστη πηγή.',type:'text',placeholder:'π.χ. 1972'},
  {id:'plans',text:'Υπάρχουν διαθέσιμα αρχιτεκτονικά σχέδια;',reason:'Η ύπαρξη σχεδίων βοηθά στον έλεγχο του φακέλου, αλλά από μόνη της δεν αποδεικνύει πλήρη τεκμηρίωση.',options:['Ναι','Όχι','Δεν γνωρίζω']},
  {id:'topo',text:'Υπάρχει τοπογραφικό;',reason:'Το τοπογραφικό είναι κρίσιμο για τη συσχέτιση του ακινήτου με το οικόπεδο και τον έλεγχο των βασικών στοιχείων.',options:['Ναι','Όχι','Δεν γνωρίζω']}
];

function topbar(){
  return `<div class="topbar"><div class="brand">AI Senior Engineer<small>Demo v3 · LinkedIn prototype</small></div><div class="topnav"><button class="navbtn ${mode==='app'?'active':''}" data-mode="app">Εφαρμογή</button><button class="navbtn ${mode==='arch'?'active':''}" data-mode="arch">v8 Core</button></div></div>`;
}
function titleBlock(name,status){
  const cfg=status==='red'?['var(--red)','ΕΚΚΡΕΜΟΤΗΤΑ']:status==='neutral'?['var(--muted)','ΝΕΑ ΥΠΟΘΕΣΗ']:['var(--yellow)','ΧΡΕΙΑΖΕΤΑΙ ΕΛΕΓΧΟ'];
  return `<div class="titleblock"><div class="titlecase"><div class="label">Υπόθεση</div><div>${esc(name)}</div></div><div class="titlestatus"><div class="label">Κατάσταση</div><div class="statusline"><span class="dot" style="background:${cfg[0]}"></span><span style="color:${cfg[0]}">${cfg[1]}</span></div></div></div>`;
}
function footerButton(text,action,disabled=false){return `<div class="footer"><button class="primary" data-action="${action}" ${disabled?'disabled':''}>${text} ${icon('arrow')}</button></div>`;}
function back(){return `<button class="back" data-action="back">${icon('back')} Πίσω</button>`;}
function ext(n){return (String(n||'').split('.').pop()||'').toUpperCase();}

function renderHome(){return `<div class="mobile"><div class="hero"><div class="label light">AI Senior Engineer</div><h1>Καλώς ήρθες.</h1><p>Οργάνωσε την υπόθεση. Εντόπισε τα κενά. Δες το επόμενο βήμα.</p></div><div class="content"><button class="cardbtn" data-action="new"><span class="newicon">${icon('plus')}</span><span><b>Νέα υπόθεση</b><small>Δημιουργία νέου τεχνικού φακέλου</small></span>${icon('arrow')}</button><div class="label">Πρόσφατες υποθέσεις</div><div class="recent"><div><b>Νέα Άδεια — Κατοικία</b><small>Έτος κατασκευής 1972</small></div>${chip('pending','ΧΡΕΙΑΖΕΤΑΙ ΕΛΕΓΧΟ')}</div></div></div>`;}
function renderNewCase(){const d=state.caseData,ok=d.customer.trim()&&d.address.trim()&&d.workType;return `<div class="mobile">${titleBlock('— νέος φάκελος —','neutral')}<div class="content">${back()}<h2>Νέα τεχνική εργασία</h2><p class="sub">Τα στοιχεία που εισάγεις εδώ αποτελούν αρχικές πληροφορίες και δεν θεωρούνται αυτόματα επιβεβαιωμένα.</p><div class="field"><div class="label">Πελάτης</div><div class="inputwrap"><input id="customer" value="${esc(d.customer)}" placeholder="Ονοματεπώνυμο"></div></div><div class="field"><div class="label">Διεύθυνση</div><div class="inputwrap"><input id="address" value="${esc(d.address)}" placeholder="Οδός, αριθμός, περιοχή"></div></div><div class="label">Τύπος εργασίας</div><div class="types">${workTypes.map(([n,dsc])=>`<button data-work="${esc(n)}" class="${d.workType===n?'selected':''}"><b>${n}</b><span>${dsc}</span></button>`).join('')}</div></div>${footerButton('Δημιουργία φακέλου','questions',!ok)}</div>`;}
function renderQuestions(){const q=qs[state.qIndex],val=state.answers[q.id]||'';return `<div class="mobile">${titleBlock(`${state.caseData.workType} — ${state.caseData.address}`,'pending')}<div class="content">${back()}<div class="progress">${qs.map((_,i)=>`<span class="${i<=state.qIndex?'on':''}"></span>`).join('')}</div><div class="label">Ερώτηση ${state.qIndex+1} από ${qs.length}</div><div class="question"><h2
</script>
</body>
</html>
