<!DOCTYPE html>

<html lang="el">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

<title>AI Senior Engineer v8 — Unified Prototype</title>

<style>

:root{

  --paper:#F5F4EF;--ink:#23272B;--muted:#6B6B63;--line:#DBD6C9;

  --navy:#1D3557;--navy2:#2A466E;--green:#3A6B4C;--greenbg:#E7EFE8;

  --yellow:#A8791F;--yellowbg:#F5EEDC;--red:#A8412F;--redbg:#F5E4DF;

  --info:#EEF1F5;--dark:#0b1020;--darkpanel:#111833;--darkline:#243052;

}

*{box-sizing:border-box}

html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#E4E0D4;color:var(--ink)}

button,input{font:inherit}button{cursor:pointer}

#app{min-height:100vh}

button:disabled{cursor:not-allowed}

.shell{min-height:100vh}

.topbar{height:58px;background:#FBFAF7;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20}

.brand{font-weight:800;color:var(--navy);letter-spacing:-.02em}

.brand small{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}

.topnav{display:flex;gap:8px}

.navbtn{border:1px solid var(--line);background:#fff;color:var(--muted);padding:8px 11px;font-size:12px;font-weight:700}

.navbtn.active{background:var(--navy);border-color:var(--navy);color:#fff}

.product{min-height:calc(100vh - 58px);display:flex;justify-content:center;background:var(--paper)}

.mobile{width:100%;max-width:430px;min-height:calc(100vh - 58px);background:var(--paper);border-left:1px solid var(--line);border-right:1px solid var(--line);display:flex;flex-direction:column}

.hero{padding:30px 20px 24px;background:var(--navy);color:#F5F4EF}

.hero h1{font-size:23px;margin:5px 0}.hero p{font-size:13px;line-height:1.5;color:#C3CEDD;margin:5px 0}

.label{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;font-size:10px;color:var(--muted)}

.label.light{color:#9FB3CC}.label.navy{color:var(--navy)}

.content{flex:1;padding:20px;overflow:auto}

.newcase{width:100%;display:flex;align-items:center;gap:12px;padding:16px;margin-bottom:20px;border:1px solid var(--navy);background:#fff;text-align:left;color:var(--ink)}

.newicon{width:38px;height:38px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}

.newcase span:nth-child(2){flex:1}.newcase b,.newcase small{display:block}.newcase small{font-size:11.5px;color:var(--muted);margin-top:2px}

.recent{display:flex;justify-content:space-between;gap:8px;padding:16px;border:1px solid var(--line);background:#fff}

.recent b,.recent small{display:block}.recent small{font-size:11.5px;color:var(--muted);margin-top:3px}

.titleblock{display:grid;grid-template-columns:2fr 1fr;border-bottom:1px solid var(--line);background:#FBFAF7}

.titlecase{padding:10px 16px;border-right:1px solid var(--line);min-width:0}.titlecase div:last-child{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.titlestatus{padding:10px 12px}.statusline{display:flex;gap:5px;align-items:center;font-size:10px;font-weight:700}

.dot{width:8px;height:8px;display:inline-block}

.back{border:0;background:none;color:var(--muted);font-size:13px;font-weight:700;padding:7px 0}

h2{font-size:18px;margin:10px 0 6px}p{line-height:1.5}

.sub{font-size:12.5px;color:var(--muted);margin:0 0 18px}

.field{margin-bottom:12px}.inputwrap{display:flex;align-items:center;padding:12px;border:1px solid var(--line);background:#fff}

.inputwrap input{width:100%;border:0;outline:0;background:none;color:var(--ink);font-size:14px}

.types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.types button{padding:11px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px;font-weight:700}.types button.selected{border-color:var(--navy);background:var(--navy);color:#fff}

.footer{padding:16px 20px;border-top:1px solid var(--line);background:#FBFAF7}.primary{width:100%;padding:14px;border:0;background:var(--navy);color:#fff;font-weight:700}.primary:disabled{background:#C9C4B6}

.progress{display:flex;gap:6px;margin:16px 0 24px}.progress span{height:3px;flex:1;background:var(--line)}.progress span.on{background:var(--navy)}

.question{margin-top:20px}.question h2{line-height:1.35}.reason{padding:10px 12px;margin-top:12px;background:#EFEDE4;border-left:2px solid var(--navy2);font-size:12px;color:#454540}

.biginput{width:100%;padding:12px;border:1px solid var(--line);background:#fff;outline:none}.options{display:flex;flex-direction:column;gap:8px;margin-top:12px}.options button{display:flex;justify-content:space-between;padding:13px 16px;border:1px solid var(--line);background:#fff;text-align:left;font-weight:700}.options button.selected{background:var(--navy);border-color:var(--navy);color:#fff}

.completion{margin:18px 0}.between{display:flex;justify-content:space-between}.bar{height:5px;background:var(--line);margin:7px 0}.bar span{display:block;height:100%;background:var(--yellow)}.completion small{font-size:11px;color:var(--muted)}

.cardrow{display:flex;gap:12px;padding:12px;border:1px solid var(--line);background:#fff;margin-bottom:8px}.cardmain{flex:1}.cardmain b,.cardmain small,.cardmain em{display:block}.cardmain b{font-size:13.5px}.cardmain small{font-size:11.5px;color:var(--muted);margin-top:2px}.cardmain em{font-size:11px;color:var(--navy2);font-style:normal;margin-top:3px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;font-size:10px;font-weight:800;white-space:nowrap;height:max-content}.chip i{width:7px;height:7px;display:inline-block}.confirmed{color:var(--green);background:var(--greenbg)}.confirmed i{background:var(--green)}.pending{color:var(--yellow);background:var(--yellowbg)}.pending i{background:var(--yellow)}.missing{color:var(--red);background:var(--redbg)}.missing i{background:var(--red)}

.next{padding:14px;border:1px solid var(--navy);background:var(--info);margin:16px 0}.next b{display:block;font-size:14px}.next p{font-size:12.5px;margin:6px 0 0;color:#3A4555}

.axis{display:flex;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);background:#fff;margin-bottom:8px}.axis b,.axis small{display:block}.axis b{font-size:14px}.axis small{font-size:11.5px;color:var(--muted);margin-top:3px}

.warning{padding:12px;background:var(--yellowbg);font-size:12px;margin:12px 0}.quote{padding:14px;border:1px solid var(--navy);background:var(--info);font-style:italic;font-size:12.5px}

.arch{min-height:calc(100vh - 58px);background:linear-gradient(180deg,var(--dark),#090d18);color:#e8ecf7;padding:34px 18px 70px}.archinner{max-width:1050px;margin:auto}.archhero,.archcard{background:rgba(17,24,51,.88);border:1px solid var(--darkline);border-radius:16px;padding:24px;margin-bottom:18px}.archhero h1{font-size:30px;margin:0 0 8px}.archhero p,.archcard p{color:#b7c0d8}.archgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.tag{display:inline-block;padding:4px 9px;border:1px solid var(--darkline);border-radius:999px;color:#6ea8fe;margin:0 5px 7px 0;font-size:12px}.code{background:#0a0f1d;border:1px solid var(--darkline);border-radius:12px;padding:16px;overflow:auto;color:#d7def0;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.55}.arch ul{margin:10px 0;padding-left:20px}.arch li{margin:6px 0;color:#d7def0}.ok{color:#7ee787}.warn{color:#ffcc66}.table{width:100%;border-collapse:collapse}.table th,.table td{border:1px solid var(--darkline);padding:10px;text-align:left;vertical-align:top}.table th{background:rgba(110,168,254,.12)}.archnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.archnav button{padding:9px 12px;border:1px solid var(--darkline);background:#111833;color:#e8ecf7;font-weight:700}

@media(max-width:600px){.topbar{padding:0 10px}.brand{font-size:13px}.topnav .navbtn{font-size:10px;padding:7px 8px}.archhero h1{font-size:24px}.arch{padding:20px 12px 50px}}

</style>

</head>

<body>

<div id="app"></div>

<script>

(function(){

const root=document.getElementById('app');

let mode='app';

let state={screen:'home',caseData:{customer:'',address:'',workType:''},answers:{},qIndex:0};



const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));

const icon=n=>({plus:'＋',arrow:'→',back:'←',check:'✓',alert:'⚠',shield:'◈'}[n]||'•');

const chip=(tone,text)=>`<span class="chip ${tone}"><i></i>${text||({confirmed:'ΕΠΙΒΕΒΑΙΩΜΕΝΟ',pending:'ΧΡΕΙΑΖΕΤΑΙ ΕΛΕΓΧΟ',missing:'ΛΕΙΠΕΙ'}[tone]||'')}</span>`;



function topbar(){

 return `<div class="topbar"><div class="brand">AI Senior Engineer<small>v8 unified prototype</small></div>

 <div class="topnav"><button class="navbtn ${mode==='app'?'active':''}" data-mode="app">Εφαρμογή</button><button class="navbtn ${mode==='arch'?'active':''}" data-mode="arch">v8 Core</button></div></div>`;

}

function titleBlock(name,status){

 let cfg=status==='red'?['var(--red)','ΕΚΚΡΕΜΟΤΗΤΑ']:status==='neutral'?['var(--muted)','ΝΕΑ ΥΠΟΘΕΣΗ']:['var(--yellow)','ΧΡΕΙΑΖΕΤΑΙ ΕΛΕΓΧΟ'];

 return `<div class="titleblock"><div class="titlecase"><div class="label">Υπόθεση</div><div>${esc(name)}</div></div><div class="titlestatus"><div class="label">Κατάσταση</div><div class="statusline"><span class="dot" style="background:${cfg[0]}"></span><span style="color:${cfg[0]}">${cfg[1]}</span></div></div></div>`;

}

function footerButton(text,action,disabled=false){return `<div class="footer"><button class="primary" data-action="${action}" ${disabled?'disabled':''}>${text} ${icon('arrow')}</button></div>`}

function back(){return `<button class="back" data-action="back">${icon('back')} Πίσω</button>`}



const qs=[

 {id:'year',text:'Ποιο είναι το έτος κατασκευής;',reason:'Το έτος αποτελεί αρχική πληροφορία. Δεν θεωρείται επιβεβαιωμένο μέχρι να ελεγχθεί σε διαθέσιμα έγγραφα ή άλλη αξιόπιστη πηγή.',type:'text',placeholder:'π.χ. 1972'},

 {id:'plans',text:'Υπάρχουν διαθέσιμα αρχιτεκτονικά σχέδια;',reason:'Η ύπαρξη σχεδίων βοηθά στον έλεγχο του φακέλου, αλλά από μόνη της δεν αποδεικνύει πλήρη νομιμότητα.',options:['Ναι','Όχι','Δεν γνωρίζω']},

 {id:'insulation',text:'Υπάρχει μόνωση στην τοιχοποιία;',reason:'Η απάντηση καταγράφεται ως δήλωση και παραμένει μη επιβεβαιωμένη μέχρι την αυτοψία ή την τεκμηρίωση.',options:['Ναι','Όχι','Δεν γνωρίζω']}

];



function compute(){

 const a=state.answers, year=parseInt(a.year,10), valid=!isNaN(year)&&year>=1800&&year<=new Date().getFullYear();

 const cats=[

  {name:'Στοιχεία ακινήτου',status:valid?'pending':'missing',note:valid?'Έτος κατασκευής '+year+' (δήλωση χρήστη)':'Δεν έχει δηλωθεί έτος',source:valid?'Δήλωση χρήστη':'—'},

  {name:'Νομιμότητα',status:a.plans==='Όχι'?'missing':'pending',note:a.plans==='Ναι'?'Δηλώθηκαν σχέδια — δεν επαρκούν για πλήρη νομιμότητα':a.plans==='Όχι'?'Λείπουν αρχιτεκτονικά σχέδια':'Δεν γνωρίζουμε αν υπάρχουν σχέδια / άδειες',source:a.plans?'Δήλωση χρήστη':'—'},

  {name:'Τεχνικά χαρακτηριστικά',status:'pending',note:a.insulation==='Ναι'?'Δηλώθηκε ύπαρξη μόνωσης — απαιτεί επιβεβαίωση':a.insulation==='Όχι'?'Δηλώθηκε απουσία μόνωσης — προτεραιότητα ελέγχου':'Δεν έχει δηλωθεί κατάσταση μόνωσης',source:'Δήλωση χρήστη — μη επιβεβαιωμένο'},

  {name:'Αυτοψία',status:'missing',note:'Δεν έχει πραγματοποιηθεί',source:'—'},

  {name:'Φωτογραφική τεκμηρίωση',status:'missing',note:'Καμία φωτογραφία',source:'—'}

 ];

 const weights={pending:.4,missing:0}, completion=Math.round(cats.reduce((s,c)=>s+(weights[c.status]||0),0)/cats.length*100);

 return {cats,completion,year,valid,overall:cats.some(c=>c.status==='missing')?'red':'pending'};

}



function appScreen(){

 let body='';

 if(state.screen==='home') body=`<div class="hero"><div class="label light">AI Senior Engineer</div><h1>Καλώς ήρθες.</h1><p>Οργάνωσε την υπόθεση. Εντόπισε τα κενά. Δες το επόμενο βήμα.</p></div>

 <div class="content"><button class="newcase" data-action="new"><span class="newicon">${icon('plus')}</span><span><b>Νέα υπόθεση</b><small>Δημιουργία νέου τεχνικού φακέλου</small></span>${icon('arrow')}</button>

 <div class="label">Πρόσφατες υποθέσεις</div><div class="recent"><div><b>ΠΕΑ — Κατοικία Αιγάλεω</b><small>Έτος κατασκευής 1972</small></div>${chip('pending','ΧΡΕΙΑΖΕΤΑΙ ΕΛΕΓΧΟ')}</div></div>`;

 if(state.screen==='new'){

  const d=state.caseData,types=['ΠΕΑ','ΗΤΚ','Αυθαίρετο','Αυτοψία'],ok=d.customer.trim()&&d.address.trim()&&d.workType;

  body=titleBlock('— νέος φάκελος —','neutral')+`<div class="content">${back()}<h2>Νέα τεχνική εργασία</h2><p class="sub">Τα στοιχεία που εισάγεις εδώ αποτελούν αρχικές πληροφορίες και δεν θεωρούνται αυτόματα επιβεβαιωμένα.</p>

  <div class="field"><div class="label">Πελάτης</div><div class="inputwrap"><input id="customer" value="${esc(d.customer)}" placeholder="Ονοματεπώνυμο"></div></div>

  <div class="field"><div class="label">Διεύθυνση</div><div class="inputwrap"><input id="address" value="${esc(d.address)}" placeholder="Οδός, αριθμός, περιοχή"></div></div>

  <div class="label">Τύπος εργασίας</div><div class="types">${types.map(w=>`<button data-work="${w}" class="${d.workType===w?'selected':''}">${w}</button>`).join('')}</div></div>`+footerButton('Δημιουργία φακέλου','questions',!ok);

 }

 if(state.screen==='questions'){

  const q=qs[state.qIndex],val=state.answers[q.id]||'';

  body=titleBlock(`${state.caseData.workType} — ${state.caseData.address}`,'pending')+`<div class="content">${back()}<div class="progress">${qs.map((_,i)=>`<span class="${i<=state.qIndex?'on':''}"></span>`).join('')}</div>

  <div class="label">Ερώτηση ${state.qIndex+1} από ${qs.length}</div><div class="question"><h2>${q.text}</h2><div class="reason">${q.reason}</div>

  ${q.type==='text'?`<div style="margin-top:18px"><input class="biginput" id="answerText" value="${esc(val)}" placeholder="${q.placeholder}"></div>`:`<div class="options">${q.options.map(o=>`<button data-option="${o}" class="${val===o?'selected':''}"><span>${o}</span>${val===o?icon('check'):''}</button>`).join('')}</div>`}

  </div></div>${footerButton(state.qIndex<qs.length-1?'Επόμενο':'Οργάνωση φακέλου','advance',!val)}`;

 }

 if(state.screen==='folder'){

  const x=compute();body=titleBlock(`${state.caseData.workType} — ${state.caseData.address}`,x.overall)+`<div class="content">${back()}<h2>Τεχνικός φάκελος</h2><p class="sub">Κάθε στοιχείο φέρει κατάσταση και πηγή. Τίποτα δεν θεωρείται επιβεβαιωμένο χωρίς τεκμηρίωση.</p>

  <div class="completion"><div class="between"><div class="label">Καταγεγραμμένη πληρότητα</div><b>${x.completion}/100</b></div><div class="bar"><span style="width:${x.completion}%"></span></div><small>Ο δείκτης δείχνει μόνο πόσα στοιχεία έχουν καταγραφεί. Δεν αποτελεί ένδειξη τεχνικής ορθότητας, νομιμότητας ή ετοιμότητας για παράδοση.</small></div>

  ${x.cats.map(c=>`<div class="cardrow"><div class="cardmain"><b>${c.name}</b><small>${c.note}</small><em>Πηγή: ${c.source}</em></div>${chip(c.status)}</div>`).join('')}</div>${footerButton('Senior Review','review')}`;

 }

 if(state.screen==='review'){

  const x=compute(),a=state.answers,old=x.valid&&x.year<1980;

  const axes=[

   ['ΠΛΗΡΟΤΗΤΑ ΦΑΚΕΛΟΥ',`${x.completion}/100`,x.completion>=60?'pending':'missing','Πόσα στοιχεία έχουν καταγραφεί'],

   ['ΝΟΜΙΜΟΤΗΤΑ',a.plans==='Όχι'?'Λείπουν σχέδια':'Δεν έχει αξιολογηθεί πλήρως',a.plans==='Όχι'?'missing':'pending','Απαιτείται έλεγχος αδειών & σχεδίων'],

   ['ΑΥΤΟΨΙΑ','Δεν πραγματοποιήθηκε','missing','Κρίσιμη για επιβεβαίωση'],

   ['ΦΩΤΟΓΡΑΦΙΚΗ ΤΕΚΜΗΡΙΩΣΗ','Δεν υπάρχει','missing','Απαραίτητη'],

   ['ΕΤΟΙΜΟΤΗΤΑ ΠΑΡΑΔΟΣΗΣ','Όχι','missing','Ο φάκελος δεν είναι έτοιμος']

  ];

  body=titleBlock(`${state.caseData.workType} — ${state.caseData.address}`,x.overall)+`<div class="content">${back()}<h2>◈ Senior Review</h2><p class="sub">Δεν γίνεται συνολική βαθμολογία. Εμφανίζονται τα κενά και το επόμενο βήμα.</p>

  <div class="next"><div class="label navy">NEXT BEST ACTION</div><b>Πραγματοποίησε αυτοψία και ανέβασε τουλάχιστον 8 φωτογραφίες.</b><p>Προτεινόμενες λήψεις: κύριες όψεις, τοιχοποιία, ανοίγματα, σημεία υγρασίας, στέγη/δώμα και οποιεσδήποτε αποκλίσεις από τα δηλωθέντα.</p></div>

  ${axes.map(z=>`<div class="axis"><div><div class="label">${z[0]}</div><b>${z[1]}</b><small>${z[3]}</small></div>${chip(z[2])}</div>`).join('')}

  ${old?`<div class="warning"><b>${icon('alert')} Σημείο προσοχής</b><p>Κτίριο του ${x.year}. Απαιτείται ιδιαίτερος έλεγχος τοιχοποιίας, υγρασίας και θερμικών χαρακτηριστικών κατά την αυτοψία.</p></div>`:''}

  <div class="quote">«Αυτά ξέρουμε. Αυτά δεν ξέρουμε. Αυτά πρέπει να ελέγξεις πριν προχωρήσεις.»</div></div>

  <div class="footer"><button class="primary" data-action="restart">Νέα δοκιμή ✓</button></div>`;

 }

 return `<div class="mobile">${body}</div>`;

}



function architecture(){

return `<div class="arch"><div class="archinner"><div class="archnav"><div><b>AI Senior Engineer v8</b><div style="color:#b7c0d8;font-size:12px">Core Architecture Review</div></div><button data-mode="app">← Επιστροφή στην εφαρμογή</button></div>

<section class="archhero"><h1>v8 Core Validation Architecture Review</h1><p>Commit 1: canonical IDs, branded types, validation boundary, and testable domain isolation.</p><p>This layer is the technical foundation underneath the product UI. The application remains the user-facing workflow; the v8 Core protects the domain from malformed persisted data, unsafe IDs and corrupted state.</p></section>

<section class="archcard"><h2>Architecture Summary</h2><div class="archgrid"><div><span class="tag">unknown input</span><span class="tag">schema validation</span><span class="tag">canonical format</span><span class="tag">brandId()</span><span class="tag">Domain ID</span></div><div><p>The ID pipeline is intentionally simple: external input enters as <code>unknown</code>, passes structural validation and canonical ID validation, then reaches the single controlled branding boundary.</p></div></div></section>

<section class="archcard"><h2>Core Contract</h2><div class="code">unknown

  ↓

Schema / structural validation

  ↓

canonical ID format validation

  ↓

brandId()

  ↓

ParseResult&lt;CaseId&gt;

  ↓

Domain Entity</div><p><b>Rule:</b> <code>brandId()</code> is not a validator. It is the final controlled boundary after validation succeeds.</p></section>

<section class="archcard"><h2>Commit 1 Scope</h2><div class="code">src/

├── domain/

│   └── valueObjects/

│       └── ids.ts

├── validation/

│   └── ids/

│       ├── brandId.ts

│       ├── createIdParser.ts

│       ├── parseCaseId.ts

│       ├── parseFactId.ts

│       ├── parseFactRecordId.ts

│       ├── parseEvidenceId.ts

│       ├── parseFileAssetId.ts

│       ├── parseVerificationId.ts

│       ├── parseContradictionId.ts

│       └── parseAuditEventId.ts

└── tests/

    └── validation/

        └── ids/

            ├── parseCaseId.test.ts

            ├── parseFactId.test.ts

            ├── parseFactRecordId.test.ts

            ├── brand-separation.test.ts

            └── round-trip.test.ts</div></section>

<section class="archcard"><h2>Success Criteria</h2><ul>

<li class="ok">CaseId, FactId, FactRecordId and other branded IDs are compile-time incompatible.</li>

<li class="ok">Invalid IDs are rejected at runtime.</li>

<li class="ok">Wrong prefixes are rejected.</li>

<li class="ok">Empty and whitespace-only IDs are rejected.</li>

<li class="ok">Canonical IDs parse deterministically.</li>

<li class="ok">parse → serialize → parse is stable.</li>

<li class="ok">No <code>as CaseId</code> outside the validation boundary.</li>

<li class="ok">The domain does not know validation libraries, React or persistence.</li>

<li class="ok">Legacy IDs are handled only by migration logic.</li>

<li class="ok">No RootState, reducer or UI coupling in Commit 1.</li>

</ul></section>

<section class="archcard"><h2>Assessment So Far</h2><table class="table"><tr><th>Area</th><th>Status</th><th>Comment</th></tr>

<tr><td>ID boundary</td><td class="ok">Strong</td><td>Single controlled branding point keeps the architecture auditable.</td></tr>

<tr><td>Domain isolation</td><td class="ok">Strong</td><td>The domain stays independent from validation and persistence concerns.</td></tr>

<tr><td>Normalization readiness</td><td class="ok">Strong</td><td>The plan fits a flat entity model with selectors deriving views later.</td></tr>

<tr><td>Type safety proof</td><td class="warn">Partial</td><td>Runtime tests are good, but type-level tests are still needed for compile-time guarantees.</td></tr>

<tr><td>Product completeness</td><td class="warn">Early</td><td>Entities, invariants, ValidatedRootState, reducer and selectors are not implemented yet.</td></tr></table></section>

<section class="archcard"><h2>Next Commit Direction</h2><ul><li>Case, Fact, FactRecord.</li><li>Referential integrity.</li><li>ValidatedRootState.</li><li>Typed actions.</li><li>Pure reducer.</li></ul><p>The architecture is strong enough to start building the actual v8 core. The next value comes from entities and invariants, not from more ID theory.</p></section>

<section class="archcard"><h2>Engineering Verdict</h2><p>This is a clean and defensible design for a validation-heavy TypeScript application. It combines explicit parsing boundaries, stable branded types and a normalized state model that remains auditable.</p><p><b>Product layer:</b> New Case → Smart Questions → Technical Folder → Senior Review.</p><p><b>Core layer:</b> validated IDs → entities → integrity → ValidatedRootState → reducer → selectors → engines.</p></section>

</div></div>`;

}



function render(){

 root.innerHTML=topbar()+(mode==='app'?`<div class="product">${appScreen()}</div>`:architecture());

 bind();

}

function bind(){

 root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});

 root.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{

  const a=b.dataset.action;

  if(a==='new')state.screen='new';

  else if(a==='back'){if(state.screen==='new')state.screen='home';else if(state.screen==='questions')state.screen='new';else if(state.screen==='folder')state.screen='questions';else if(state.screen==='review')state.screen='folder'}

  else if(a==='questions')state.screen='questions';

  else if(a==='advance'){if(state.qIndex<qs.length-1)state.qIndex++;else state.screen='folder'}

  else if(a==='review')state.screen='review';

  else if(a==='restart'){state={screen:'home',caseData:{customer:'',address:'',workType:''},answers:{},qIndex:0}}

  render();

 });

 const c=root.querySelector('#customer'),ad=root.querySelector('#address'),ans=root.querySelector('#answerText');

 if(c)c.oninput=e=>{state.caseData.customer=e.target.value;render();const x=root.querySelector('#customer');x.focus();x.setSelectionRange(x.value.length,x.value.length)};

 if(ad)ad.oninput=e=>{state.caseData.address=e.target.value;render();const x=root.querySelector('#address');x.focus();x.setSelectionRange(x.value.length,x.value.length)};

 if(ans)ans.oninput=e=>{state.answers[qs[state.qIndex].id]=e.target.value;render();const x=root.querySelector('#answerText');x.focus();x.setSelectionRange(x.value.length,x.value.length)};

 root.querySelectorAll('[data-work]').forEach(b=>b.onclick=()=>{state.caseData.workType=b.dataset.work;render()});

 root.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{state.answers[qs[state.qIndex].id]=b.dataset.option;render()});

}

render();

})();

</script>
