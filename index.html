<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="theme-color" content="#0B1C2E"/>
<title>AI Senior Engineer — Complete Vision</title>
<style>
:root{
  --bg:#F3F5F8;--card:#fff;--ink:#152033;--muted:#64748B;--line:#E2E8F0;
  --navy:#0B1C2E;--blue:#2563EB;--soft:#EFF6FF;
  --ok:#059669;--okBg:#ECFDF5;--warn:#D97706;--warnBg:#FFFBEB;
  --bad:#DC2626;--badBg:#FEF2F2;--grey:#94A3B8;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;display:flex;justify-content:center}
#app{width:100%;max-width:440px;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:none;background:none}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--blue);outline-offset:0}

.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{font-weight:800;font-size:13px;color:var(--navy);line-height:1.25}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.scroll{flex:1;overflow:auto;padding:16px 16px 28px}
.foot{padding:12px 16px;border-top:1px solid var(--line);background:#fff;position:sticky;bottom:0}

.btn{width:100%;padding:14px;background:var(--navy);color:#fff;font-weight:700;border-radius:12px;font-size:15px}
.btn.ghost{background:#fff;color:var(--muted);border:1px solid var(--line)}
.btn.ok{background:var(--ok)}
.btn.warn{background:var(--warn);color:#fff}
.btn.sm{padding:9px 12px;font-size:13px;width:auto;border-radius:10px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:11px}
.card.tap{cursor:pointer}
.card.tap:active{border-color:var(--blue)}
.h1{font-size:21px;font-weight:800;margin-bottom:4px}
.h2{font-size:16px;font-weight:800;margin-bottom:6px}
.muted{color:var(--muted);font-size:13px;line-height:1.5}
.label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}

.mantra{background:var(--navy);color:#E2E8F0;border-radius:var(--r);padding:14px 16px;margin-bottom:14px;font-size:13px;line-height:1.5;text-align:center}
.mantra strong{color:#fff;letter-spacing:.04em}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.grid .q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px}
.grid .q .k{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.grid .q .v{font-size:13px;font-weight:700;margin-top:4px;line-height:1.35}

.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.chip.ok{background:var(--okBg);color:var(--ok)}
.chip.warn{background:var(--warnBg);color:var(--warn)}
.chip.bad{background:var(--badBg);color:var(--bad)}
.chip.info{background:var(--soft);color:var(--blue)}
.chip.grey{background:#F1F5F9;color:var(--grey)}

.choice{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;font-weight:600;font-size:14px}
.choice.on{background:var(--navy);border-color:var(--navy);color:#fff}
.choice.inline{display:inline-block;width:auto;padding:8px 12px;margin:0 6px 6px 0;font-size:13px}

.nsa{background:var(--soft);border:1px solid #BFDBFE;border-radius:var(--r);padding:14px;margin:10px 0}
.nsa .t{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--blue);margin-bottom:5px}
.nsa .a{font-weight:800;font-size:15px;line-height:1.35}
.nsa .why{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.45}

.senior{background:#F8FAFC;border:1px solid var(--line);border-radius:var(--r);padding:13px;margin:10px 0}
.senior .t{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.senior p{font-size:13.5px;line-height:1.5;color:#334155}

.hero{background:var(--navy);color:#F8FAFC;padding:26px 18px 22px}
.hero .tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#93A4B8;font-weight:700}
.hero h1{font-size:20px;font-weight:800;margin:8px 0 6px}
.hero p{color:#A8B8CC;font-size:13.5px;line-height:1.5}

.item{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.4}
.item:last-child{border-bottom:none}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.back{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:12px;display:inline-flex}
.warnbox{background:var(--warnBg);border:1px solid #FCD34D;border-radius:var(--r);padding:13px;margin:10px 0;font-size:13.5px;line-height:1.45}
.okbox{background:var(--okBg);border:1px solid #A7F3D0;border-radius:var(--r);padding:13px;margin:10px 0;font-size:13.5px;line-height:1.45}
.badbox{background:var(--badBg);border:1px solid #FECACA;border-radius:var(--r);padding:13px;margin:10px 0;font-size:13.5px;line-height:1.45}
.critbox{background:#1e1b4b;color:#e0e7ff;border-radius:var(--r);padding:13px;margin:10px 0;font-size:13.5px;line-height:1.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;z-index:50;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.steps{display:flex;gap:3px;margin-bottom:14px}
.steps i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--navy)}
.steps i.done{background:var(--ok)}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.check input{width:18px;height:18px;margin-top:2px;flex-shrink:0}
.tag{font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:2px 6px;border-radius:4px;margin-right:6px}
.tag.c{background:var(--okBg);color:var(--ok)}
.tag.r{background:#EEF2FF;color:#4F46E5}
.tag.o{background:#ECFEFF;color:#0E7490}
.tag.m{background:#F1F5F9;color:var(--grey)}
.tag.x{background:var(--warnBg);color:var(--warn)}
.tag.k{background:var(--badBg);color:var(--bad)}
.tag.d{background:var(--navy);color:#fff}
.wf{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wf span{font-size:11px;font-weight:700;padding:4px 8px;border-radius:8px;background:#F1F5F9;color:var(--muted)}
.wf span.on{background:var(--soft);color:var(--blue)}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
const mem={};
const store=(function(){
  try{const k='__t';localStorage.setItem(k,'1');localStorage.removeItem(k);return localStorage;}
  catch(e){return{getItem:k=>mem[k]??null,setItem:(k,v)=>{mem[k]=String(v)},removeItem:k=>{delete mem[k]}};}
})();
const KEY='ase-complete-v1';

let S={screen:'home',cases:[],cur:null,draft:{},comm:{},assets:{},toast:null,pathAnswers:{}};

function uid(){return 'c_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function load(){try{const r=store.getItem(KEY);if(r){const p=JSON.parse(r);S.cases=p.cases||[]}}catch(e){}}
function save(){try{store.setItem(KEY,JSON.stringify({cases:S.cases}))}catch(e){}}
function cur(){return S.cases.find(c=>c.id===S.cur)||null}
function toast(m){S.toast=m;render();setTimeout(()=>{S.toast=null;render()},1800)}
function go(sc){S.screen=sc;render()}
function openCase(id){S.cur=id;S.screen='case';render()}

/* ========== PATH ENGINE (bathroom / generic) ========== */
function classifyBathroom(path){
  // path: {bearing, newOpening, hvac, layout, demolition}
  if(!path||!Object.keys(path).length) return {proc:'UNKNOWN',note:'Χρειάζονται απαντήσεις για να ταξινομηθεί η διαδικασία.'};
  if(path.bearing==='yes'||path.newOpening==='yes')
    return {proc:'Πιθανή Οικοδομική άδεια / ειδικός έλεγχος',note:'Επέμβαση σε φέροντα ή νέο άνοιγμα → δεν υποθέτουμε ΕΕΔΜΚ.'};
  if(path.layout==='yes'||path.demolition==='yes'||path.hvac==='yes')
    return {proc:'Πιθανή ΕΕΔΜΚ (προς επαλήθευση)',note:'Καθαιρέσεις / διαρρύθμιση / Η-Μ — έλεγχος άρθρου 30 & ισχύουσας νομοθεσίας.'};
  if(path.layout==='no'&&path.demolition==='no'&&path.bearing==='no')
    return {proc:'Πιθανά χωρίς διοικητική πράξη / Άρθρο 30',note:'Απλές εργασίες — επιβεβαίωση ότι δεν εμπίπτουν σε ΕΕΔΜΚ/άδεια.'};
  return {proc:'REVIEW',note:'Μικτές απαντήσεις — στοχευμένος έλεγχος.'};
}

function buildState(c){
  const confirmed=[],reported=[],observed=[],missing=[],conflicts=[],risks=[],decisions=[];
  if(c.clientName) confirmed.push('Πελάτης: '+c.clientName);
  if(c.region) confirmed.push('Περιοχή: '+c.region);
  if(c.workType) confirmed.push('Αίτημα: '+c.workType);
  if(c.purpose) confirmed.push('Σκοπός: '+c.purpose);
  if(c.statement) reported.push(c.statement.slice(0,140)+(c.statement.length>140?'…':''));

  const assets=c.assets||{};
  const L={title:'Τίτλος',kaek:'ΚΑΕΚ',topo:'Τοπογραφικό',permit:'Άδεια',plans:'Σχέδια',e9:'Ε9'};
  Object.keys(L).forEach(k=>{
    if(assets[k]==='HAS') confirmed.push(L[k]+' διαθέσιμο (πηγή προς έλεγχο)');
    else if(assets[k]==='DOES_NOT_HAVE') missing.push(L[k]);
    else if(assets[k]==='UNKNOWN') missing.push(L[k]+' · UNKNOWN');
    else if(c.statement) missing.push(L[k]+' · δεν ρωτήθηκε');
  });

  if(c.fieldNotes){
    observed.push(c.fieldNotes.slice(0,120)+(c.fieldNotes.length>120?'…':''));
    const fl=c.fieldNotes.toLowerCase();
    if(/υγρασ/.test(fl)) risks.push({obs:'Υγρασία',cause:'διαρροή / στεγάνωση / συμπύκνωση / εγκατάσταση (ΥΠΟΘΕΣΕΙΣ)',status:'CHECK'});
    if(/ρωγμ/.test(fl)) risks.push({obs:'Ρωγμές',cause:'πιθανή καθίζηση (ΥΠΟΘΕΣΗ)',status:'CHECK'});
    if(/διαφορ|απ[οό]κλι|δεν\s*συμφων/.test(fl)) conflicts.push('Σχέδια ↔ υφιστάμενη κατάσταση');
  }

  // Risk signals are not conclusions. They only activate REVIEW so the Senior can
  // tell the engineer what needs targeted verification.
  const signalText=(c.workType+' '+(c.statement||'')+' '+(c.fieldNotes||'')).toLowerCase();
  const riskSignals=[
    [/natura/, 'Natura / περιβαλλοντικός περιορισμός', 'Απαιτείται έλεγχος εφαρμοζόμενων περιορισμών και επίσημων πηγών.'],
    [/δασικ/, 'Δασικό σήμα', 'Απαιτείται έλεγχος χαρακτηρισμού και εφαρμοζόμενων περιορισμών.'],
    [/ρέμα/, 'Ρέμα / υδατόρεμα', 'Απαιτείται στοχευμένος έλεγχος θέσης και περιορισμών.'],
    [/αιγιαλ/, 'Αιγιαλός / παραλία', 'Απαιτείται στοχευμένος έλεγχος ορίων και περιορισμών.'],
    [/αρχαιολογ/, 'Αρχαιολογικός περιορισμός', 'Απαιτείται έλεγχος εφαρμοζόμενων αρχαιολογικών απαιτήσεων.'],
    [/αυθαίρε|αυθαιρε/, 'Σήμα αυθαίρετης κατασκευής', 'Δεν θεωρείται νόμιμη/παράνομη από το σήμα μόνο· απαιτείται έλεγχος evidence και ισχύουσας διαδικασίας.'],
    [/διατηρητέ/, 'Διατηρητέο', 'Απαιτείται ειδικός έλεγχος περιορισμών πριν προχωρήσει η εργασία.'],
    [/παραδοσιακ/, 'Παραδοσιακός οικισμός / κτίριο', 'Απαιτείται ειδικός έλεγχος περιορισμών πριν οριστικοποίηση.'],
    [/επέκταση μπαλκον/, 'Επέμβαση σε εξωτερικό/δομικό στοιχείο', 'Απαιτείται στοχευμένος έλεγχος πριν θεωρηθεί απλή εργασία.']
  ];
  for(const [rx,obs,cause] of riskSignals){
    if(rx.test(signalText) && !risks.some(r=>r.obs===obs)) risks.push({obs,cause,status:'REVIEW'});
  }

  if(c.workType&&/μπάνιο|ανακαίνισ/i.test(c.workType+' '+(c.statement||''))){
    const cls=classifyBathroom(c.pathAnswers||{});
    if(cls.proc!=='UNKNOWN') confirmed.push('Προσωρινή ταξινόμηση: '+cls.proc);
  }

  if(c.finding) observed.push('Finding: '+c.finding);
  if(c.decision) decisions.push(c.decision);
  if((c.docs||[]).length) confirmed.push(c.docs.length+' έγγραφο/α (upload ≠ verified)');

  // workflows active
  const wfs=c.workflows||[c.workType];
  return{confirmed,reported,observed,missing,conflicts,risks,decisions,wfs};
}

function buildHome(c){
  const m=buildState(c);
  let stage='PROBLEM · Case intake';
  let now='Κατανόηση αιτήματος πελάτη';
  let why='Path δυναμικό — δεν υποθέτουμε διαδικασία πριν το context.';
  let next='Επικοινωνία / τι θέλει πραγματικά';
  let mode='NORMAL';
  let protect=null;

  if(c.statement && !Object.keys(c.assets||{}).length){
    stage='PATH · understanding';
    now='Συλλογή διαθέσιμων στοιχείων';
    why='Document-first: τι υπάρχει πριν ρωτήσουμε τα πάντα.';
    next='HAS / DOES_NOT_HAVE / UNKNOWN';
  }
  if(Object.keys(c.assets||{}).length){
    stage='EVIDENCE · existing info';
    now='Οργάνωση εγγράφων · εξαγωγή';
    why='Source weight: συμβόλαιο ≠ Ε9 ≠ δήλωση.';
    next='Upload / ταξινόμηση φακέλου';
  }
  if((c.docs||[]).length){
    stage='PATH · field prep';
    now='Αυτοψία όπου χρειάζεται';
    why='Observed ≠ diagnosis. Field confirms.';
    next='Στοχευμένο φύλλο επιθεώρησης';
  }
  if(c.fieldDone){
    stage='REVIEW · gaps';
    now='Conflicts / risks / classification';
    why='Δεν επιλέγουμε νικητή πηγών αυτόματα.';
    next='Finding & Engineer Decision';
    if(m.conflicts.length||m.risks.length) mode='REVIEW';
  }
  if(c.pathAnswers && Object.keys(c.pathAnswers).length && /μπάνιο|ανακαίνισ/i.test(c.workType+' '+(c.statement||''))){
    const cls=classifyBathroom(c.pathAnswers);
    if(cls.proc.includes('άδεια')||cls.proc.includes('ΕΕΔΜΚ')) mode=mode==='NORMAL'?'REVIEW':mode;
  }
  if(c.decision){
    stage='GATES · pre-completion';
    now='Senior Review πριν DONE';
    why='Completeness · consistency · decisions · deliverable.';
    next='Completion checklist';
  }
  if(c.completed){
    stage='COMPLETION · Technical File';
    now='—';
    why='Reusable memory για επόμενο workflow στο ίδιο ακίνητο.';
    next='—';
  }
  if(c.workType==='Νέα οικοδομή'&&c.prematureDesign&&!c.placementValidated){
    mode='CRITICAL';
    protect='Critical gate: concept OK · final design (ξυλότυποι) όχι πριν πολεοδομικούς περιορισμούς & θέση.';
    stage='GATE · blocked';
    now='Κλείσιμο αρτιότητας / γραμμών / ΣΔ / ύψους';
    next='Validation πριν οριστική μελέτη';
  }
  return{stage,now,why,next,mode,protect,m};
}

function seniorGuidance(c,h){
  const text=(c.workType+' '+(c.statement||'')).toLowerCase();
  const m=h.m||buildState(c);

  if(h.protect) return {
    title:'Σταματάμε εδώ — και είναι σωστό.',
    body:'Δεν θέλω να σε αφήσω να προχωρήσεις σε ενέργεια που εξαρτάται από κάτι που δεν έχει ακόμη επιβεβαιωθεί. Δεν είναι αποτυχία· είναι σωστό engineering control.',
    steps:['Κλείσε πρώτα την τεχνική προϋπόθεση που μπλοκάρει το επόμενο βήμα.','Κατέγραψε τι έχει επιβεβαιωθεί και τι παραμένει UNKNOWN.','Μην παράγεις οριστικό παραδοτέο πάνω στο ανοικτό θέμα.','Όταν κλείσει το gate, επιστρέφουμε εδώ και συνεχίζουμε από το ίδιο σημείο.']
  };

  if(!c.statement) return {
    title:'Πάμε μαζί από την αρχή.',
    body:'Πες μου με δικά σου λόγια τι ζήτησε ο πελάτης. Δεν χρειάζεται να ξέρεις ακόμη ποια διαδικασία θα ακολουθήσουμε.',
    steps:['Κατέγραψε το αίτημα όσο πιο κοντά γίνεται στα λόγια του πελάτη.','Σημείωσε σκοπό, ακίνητο και βασικό πλαίσιο μόνο αν είναι γνωστά.','Μην μετατρέψεις ακόμη το αίτημα σε νομικό συμπέρασμα.','Μετά θα σου πω ποιο είναι το πρώτο ασφαλές πράγμα που αξίζει να ελέγξουμε.']
  };

  if(m.conflicts.length) return {
    title:'Έχουμε διαφωνία στοιχείων. Πάμε να τη λύσουμε χωρίς να μαντέψουμε.',
    body:'Δεν θα διαλέξω εγώ ποια πηγή είναι σωστή. Θα σε βοηθήσω να βρεις ποιο evidence μπορεί να ξεκαθαρίσει τη διαφορά και ποιος πρέπει να το επιβεβαιώσει.',
    steps:['Άνοιξε τις δύο πηγές και γράψε ακριβώς τι διαφέρει.','Σημείωσε ποια πηγή είναι πρωτογενής/κατάλληλη για το συγκεκριμένο γεγονός.','Βρες το επόμενο evidence που μπορεί να επιβεβαιώσει τη διαφορά.','Αν δεν λύνεται, κράτησε το conflict ανοικτό και ζήτησε review.']
  };

  if(m.risks.length) return {
    title:'Καλή παρατήρηση. Τώρα θέλω να την ελέγξουμε, όχι να τη βαφτίσουμε.',
    body:'Το σύμπτωμα είναι χρήσιμο. Η αιτία είναι ακόμη υπόθεση. Πάμε βήμα-βήμα ώστε να μην παρουσιάσουμε διάγνωση χωρίς evidence.',
    steps:['Κράτησε την παρατήρηση ως Observed.','Κατέγραψε πιθανές αιτίες μόνο ως hypotheses.','Στο πεδίο έλεγξε ό,τι μπορείς πραγματικά να επιβεβαιώσεις.','Αν χρειάζεται ειδικός έλεγχος, σημείωσέ τον ως επόμενο ασφαλές βήμα.']
  };

  if(/μπάνιο|ανακαίνισ/.test(text) && !(c.pathAnswers&&Object.keys(c.pathAnswers).length)) return {
    title:'Μην κυνηγήσεις ακόμη την ονομασία της διαδικασίας.',
    body:'Εδώ θα σε βοηθήσω να σπάσεις την εργασία στα τεχνικά της κομμάτια. Μόλις καταλάβουμε τι αλλάζει, τότε εξετάζουμε ποια διαδικασία μπορεί να εφαρμόζεται.',
    steps:['Ρώτησε τι ακριβώς αλλάζει στη διαρρύθμιση.','Ξεκαθάρισε αν υπάρχουν καθαιρέσεις ή νέα ανοίγματα.','Αν υπάρχει αμφιβολία για φέροντα, κράτησέ το UNKNOWN — δεν το μαντεύουμε.','Έλεγξε αν αλλάζουν υδραυλικά / ηλεκτρολογικά.','Μετά ξαναγυρίζουμε μαζί στο Path και ελέγχουμε την προσωρινή ταξινόμηση.']
  };

  if(/πέα/.test(text)) return {
    title:'Πάμε σαν να είμαι δίπλα σου στην πρώτη αυτοψία.',
    body:'Για ΠΕΑ δεν χρειάζεται να θυμάσαι τα πάντα απ’ έξω. Πρώτα χτίζουμε το κέλυφος και τα συστήματα από evidence και αυτοψία και μετά κλείνουμε τα κενά.',
    steps:['Μάζεψε/έλεγξε σχέδια, στοιχεία ακινήτου και διαθέσιμα προηγούμενα στοιχεία.','Στην αυτοψία κατέγραψε κέλυφος, ανοίγματα και συστήματα θέρμανσης/ψύξης/ΖΝΧ όπως πραγματικά υπάρχουν.','Ό,τι δεν γνωρίζεις το κρατάμε UNKNOWN — δεν συμπληρώνουμε από υπόθεση.','Σύγκρινε σχέδια με υφιστάμενη κατάσταση και άνοιξε conflict αν διαφέρουν.','Μόνο όταν κλείσουν τα κρίσιμα κενά προχωράς στο παραδοτέο.']
  };

  if(/ητκ/.test(text)) return {
    title:'Στην ΗΤΚ θέλω να δουλεύουμε σαν έλεγχο φακέλου, όχι σαν συμπλήρωση πεδίων.',
    body:'Πρώτα διασταυρώνουμε τίτλους, σχέδια, άδεια/νομιμοποιήσεις και πραγματική κατάσταση. Αν κάτι δεν συμφωνεί, δεν το «διορθώνουμε» μόνοι μας.',
    steps:['Συγκέντρωσε τίτλους, σχέδια, άδεια/νομιμοποιήσεις και διαθέσιμα στοιχεία.','Σύγκρινε εμβαδά, χρήση και πραγματική κατάσταση.','Σημείωσε κάθε απόκλιση ως conflict/finding.','Ζήτησε το κατάλληλο evidence πριν θεωρήσεις κάτι επιβεβαιωμένο.','Μετά γράψε τη δική σου τεχνική απόφαση με αιτιολογία.']
  };

  if(/τοπογραφ/.test(text)) return {
    title:'Πάμε να το πιάσουμε από τη βάση: τι ακριβώς πρέπει να αποδεικνύει το τοπογραφικό;',
    body:'Δεν ξεκινάμε σχεδιάζοντας CAD στα τυφλά. Πρώτα κλειδώνουμε τίτλο, θέση, όρια, διαθέσιμα δεδομένα και τους περιορισμούς που μπορεί να επηρεάσουν την εργασία.',
    steps:['Έλεγξε τίτλους και διαθέσιμα τοπογραφικά/κτηματολογικά στοιχεία.','Κατέγραψε τι είναι γνωστό και τι αμφισβητείται.','Έλεγξε τα όρια και τις πηγές που τα στηρίζουν.','Αν υπάρχει conflict, μην επιλέξεις αυτόματα μία εκδοχή.','Μετά ορίζουμε ακριβώς τι πρέπει να αποτυπωθεί/ελεγχθεί στο πεδίο.']
  };

  if(/νέα οικοδομή/.test(text)) return {
    title:'Εδώ θα σε προστατέψω από το να τρέξεις μπροστά από τη σειρά των ελέγχων.',
    body:'Σε νέα οικοδομή πρώτα κλείνουμε τα πολεοδομικά και γεωμετρικά δεδομένα που επηρεάζουν τη μελέτη. Μετά χτίζουμε την οριστική λύση.',
    steps:['Κλείσε θέση, όρια, αρτιότητα/οικοδομησιμότητα και βασικούς όρους που επηρεάζουν τη μελέτη.','Σημείωσε ρητά όσα παραμένουν UNKNOWN.','Μην προχωρήσεις σε τελική εξαρτημένη μελέτη αν προηγούμενο gate είναι ανοικτό.','Μόλις κλείσει το gate, επιστρέφουμε στο ίδιο Case και συνεχίζουμε.']
  };

  if(/εεδμκ/.test(text)) return {
    title:'Δεν ξεκινάμε από το έντυπο. Ξεκινάμε από το τι πραγματικά θα γίνει στο ακίνητο.',
    body:'Θέλω πρώτα να περιγράψεις τις εργασίες και τις τεχνικές επιπτώσεις τους. Μετά ελέγχουμε την εφαρμοζόμενη διαδικασία και τις απαιτήσεις της.',
    steps:['Σπάσε τις εργασίες σε διακριτές τεχνικές ενέργειες.','Έλεγξε αν υπάρχει φέρων οργανισμός, νέο άνοιγμα, αλλαγή χρήσης ή άλλη κρίσιμη μεταβολή.','Κράτησε UNKNOWN όπου δεν έχεις evidence.','Έλεγξε την ισχύουσα και επαληθευμένη πηγή πριν οριστικοποιήσεις διαδικασία.','Μετά φτιάχνουμε τη λίστα ενεργειών/δικαιολογητικών που πραγματικά απαιτούνται.']
  };

  if(m.missing.length) return {
    title:'Δεν χρειάζεται να έχεις όλο τον φάκελο για να ξεκινήσεις.',
    body:'Θα ξεχωρίσουμε τι λείπει, τι είναι πραγματικά κρίσιμο και ποιο από αυτά μπορείς να αποκτήσεις πρώτο. Δεν θα σε αφήσω να κυνηγάς 15 πράγματα ταυτόχρονα.',
    steps:['Δες ποια missing στοιχεία επηρεάζουν άμεσα το επόμενο βήμα.','Ζήτησε πρώτα αυτά από τον πελάτη ή την κατάλληλη πηγή.','Όσα δεν είναι κρίσιμα τα αφήνουμε για αργότερα.','Μόλις έρθει νέο evidence, επιστρέφεις στο Case και συνεχίζουμε από εδώ.']
  };

  if(c.fieldDone && !c.decision) return {
    title:'Έχεις πλέον εικόνα από το πεδίο. Τώρα ας τη μετατρέψουμε σε τεχνικό συμπέρασμα.',
    body:'Δεν χρειάζεται να βιαστείς να αποφασίσεις. Πρώτα ξεχώρισε finding από decision και σύνδεσέ τα με τα στοιχεία του φακέλου.',
    steps:['Κατέγραψε τι βρήκες.','Σύνδεσέ το με τα διαθέσιμα σχέδια / έγγραφα.','Σημείωσε τι παραμένει αβέβαιο.','Μετά γράψε τη δική σου απόφαση και το σκεπτικό της.']
  };

  if(c.decision) return {
    title:'Ωραία. Τώρα κάνουμε μαζί τον τελευταίο έλεγχο πριν το κλείσιμο.',
    body:'Δεν κοιτάμε αν «συμπληρώθηκαν όλα». Κοιτάμε αν η απόφαση στηρίζεται στα διαθέσιμα στοιχεία και αν υπάρχει ανοικτό κρίσιμο θέμα.',
    steps:['Έλεγξε ανοικτά conflicts και risks.','Έλεγξε ότι τα κρίσιμα evidence είναι επαρκή ή έχουν σαφώς καταγραφεί ως εκκρεμότητα.','Έλεγξε ότι η απόφαση είναι αιτιολογημένη.','Μόνο τότε προχωράμε σε completion.']
  };

  return {
    title:'Είμαι εδώ μαζί σου — δεν χρειάζεται να ξέρεις από πριν όλη τη διαδρομή.',
    body:'Πάμε ένα βήμα τη φορά. Αν κολλήσεις, πάτα «Δεν ξέρω πώς → δείξε μου» και θα σου δώσω πρακτικό επόμενο βήμα, όχι άλλη θεωρία.',
    steps:[h.next||'Διάλεξε το επόμενο ασφαλές βήμα.']
  };
}
function seniorLine(c,h){
  const g=seniorGuidance(c,h);
  return `<strong>${g.title}</strong> ${g.body}`;
}
function stepIdx(c){
  if(c.completed) return 6;
  if(c.decision) return 5;
  if(c.fieldDone) return 4;
  if((c.docs||[]).length) return 3;
  if(Object.keys(c.assets||{}).length) return 2;
  if(c.statement) return 1;
  return 0;
}

/* ========== RENDER ========== */
function render(){
  const root=document.getElementById('app');
  let html='';
  const map={
    home:viewHome,new:viewNew,comm:viewComm,assets:viewAssets,case:viewCase,
    docs:viewDocs,field:viewField,path:viewPath,review:viewReview,done:viewDone,
    folder:viewFolder,about:viewAbout
  };
  html=(map[S.screen]||viewHome)();
  root.innerHTML=html+(S.toast?`<div class="toast">${S.toast}</div>`:'');
  bind();
}

function top(title,right=''){return `<div class="top"><div class="brand">AI Senior Engineer<small>${title}</small></div><div>${right}</div></div>`}

function viewHome(){
  const list=[...S.cases].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  return `<div class="hero">
    <div class="tag">Case Operating System · Complete Vision</div>
    <h1>PROBLEM → PATH → COMPLETION</h1>
    <p>Ψηφιακός Senior δίπλα στον νέο μηχανικό.<br>Όχι chatbot. Όχι fake DONE.</p>
  </div>
  <div class="scroll">
    <button data-go="new" class="card tap" style="border-color:var(--navy);width:100%;display:flex;gap:12px;align-items:center">
      <div style="width:42px;height:42px;background:var(--navy);color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800">+</div>
      <div style="text-align:left"><div style="font-weight:800">Νέα υπόθεση</div><div class="muted">Αίτημα → Path · όχι «ποια άδεια;»</div></div>
    </button>
    <button data-seed-bath class="btn ghost" style="margin-bottom:8px">Demo: Ανακαίνιση μπάνιου</button>
    <button data-seed-pea class="btn ghost" style="margin-bottom:8px">Demo: ΠΕΑ</button>
    <button data-seed-build class="btn ghost" style="margin-bottom:12px">Demo: Νέα οικοδομή + ξυλότυποι</button>
    <div class="sec">Υποθέσεις</div>
    ${list.length?list.map(c=>{
      const h=buildHome(c);
      const chip=c.completed?'ok':(h.mode==='CRITICAL'?'bad':(h.mode==='REVIEW'?'warn':'info'));
      const lab=c.completed?'DONE':h.mode;
      return `<button data-open="${c.id}" class="card tap" style="width:100%;text-align:left">
        <div class="row">
          <div style="min-width:0">
            <div style="font-weight:800">${c.clientName||'—'}</div>
            <div class="muted">${c.workType} · ${c.region||'—'}</div>
            <div class="muted" style="margin-top:3px">${h.stage}</div>
          </div>
          <span class="chip ${chip}">${lab}</span>
        </div>
        <div class="muted" style="margin-top:8px">→ ${h.next}</div>
      </button>`;
    }).join(''):`<div class="empty">Καμία υπόθεση.</div>`}
    <button data-go="about" class="card tap" style="width:100%"><div style="font-weight:700;font-size:13px">Όραμα προϊόντος</div><div class="muted">Senior Engine · multi-workflow Case</div></button>
  </div>`;
}

function viewNew(){
  const d=S.draft;
  const ok=d.clientName&&d.workType;
  const types=['Ανακαίνιση μπάνιου','ΠΕΑ','ΗΤΚ','ΕΕΔΜΚ','Τοπογραφικό','Νέα οικοδομή','Άλλο'];
  return `${top('Νέα υπόθεση')}
  <div class="scroll">
    <button data-go="home" class="back">← Υποθέσεις</button>
    <div class="mantra"><strong>PROBLEM → PATH → COMPLETION</strong><br>Τι θέλει να πετύχει — όχι ποια άδεια.</div>
    <div class="label">Πελάτης *</div>
    <input id="fName" value="${d.clientName||''}" placeholder="Ονοματεπώνυμο"/>
    <div style="height:8px"></div>
    <div class="label">Περιοχή</div>
    <input id="fRegion" value="${d.region||''}" placeholder="π.χ. Αθήνα"/>
    <div style="height:10px"></div>
    <div class="label">Email πελάτη</div>
    <input id="fEmail" type="email" value="${d.email||''}" placeholder="π.χ. client@email.gr"/>
    <div style="height:10px"></div>
    <div class="label">Τι θέλει ο πελάτης; *</div>
    ${types.map(t=>`<button data-type="${t}" class="choice ${d.workType===t?'on':''}">${t}</button>`).join('')}
    <div class="senior"><div class="t">Senior · δίπλα σου</div><p>Δεν χρειάζεται να ξέρεις από τώρα όλη τη διαδικασία. Θα ξεκινήσουμε από το αίτημα, θα βρούμε μαζί τι πρέπει να ελεγχθεί και μετά θα διαλέξουμε το σωστό μονοπάτι.</p></div>
  </div>
  <div class="foot"><button data-create class="btn" ${ok?'':'disabled'}>Δημιουργία Case →</button></div>`;
}

function viewComm(){
  const c=cur();if(!c) return viewHome();
  const text=S.comm.text!=null?S.comm.text:(c.statement||'');
  return `${top('Επικοινωνία')}
  <div class="scroll">
    <button data-open="${c.id}" class="back">← Υπόθεση</button>
    <div class="h2">Τι θέλει πραγματικά;</div>
    <p class="muted" style="margin-bottom:10px">Reported ≠ Confirmed. Context-aware — όχι άκαμπτο questionnaire.</p>
    <textarea id="commText" rows="5" placeholder="π.χ. Θέλω να μεγαλώσω το μπάνιο παίρνοντας χώρο από την αποθήκη…">${text}</textarea>
    <div class="label" style="margin-top:10px">Σκοπός (αν γνωστός)</div>
    <input id="fPurpose" value="${S.comm.purpose!=null?S.comm.purpose:(c.purpose||'')}" placeholder="μεταβίβαση, Exoikonomo, ιδιοκατοίκηση…"/>
    <div class="senior" style="margin-top:12px"><div class="t">Senior · δίπλα σου</div><p>Κράτα το αίτημα όσο πιο κοντά γίνεται στα λόγια του πελάτη. Μετά θα το μετατρέψουμε μαζί σε τεχνικά ερωτήματα — όχι σε πρόωρη απόφαση.</p></div>
  </div>
  <div class="foot"><button data-save-comm class="btn" ${String(text).trim()?'':'disabled'}>Αποθήκευση →</button></div>`;
}

function seniorCard(c, title='Senior · δίπλα σου'){
  const h=buildHome(c), g=seniorGuidance(c,h);
  return `<div class="senior"><div class="t">${title}</div><p>${seniorLine(c,h)}</p><button data-senior-help class="btn ghost sm" style="margin-top:10px">Δεν ξέρω πώς → δείξε μου</button></div><div id="seniorHelp" class="card" style="display:none"></div>`;
}

function viewPath(){
  const c=cur();if(!c) return viewHome();
  const p=Object.assign({},c.pathAnswers||{},S.pathAnswers||{});
  const qs=[
    ['layout','Θα αλλάξει διαρρύθμιση / ενσωμάτωση χώρου;'],
    ['demolition','Θα γίνουν καθαιρέσεις τοίχων;'],
    ['bearing','Θίγεται ή ελέγχεται φέρων οργανισμός;'],
    ['newOpening','Νέο άνοιγμα σε τοίχο;'],
    ['hvac','Αλλαγή υδραυλικών / ηλεκτρολογικών;']
  ];
  const filled=qs.every(([k])=>p[k]);
  const cls=classifyBathroom(p);
  return `${top('Path · ταξινόμηση')}
  <div class="scroll">
    <button data-open="${c.id}" class="back">← Υπόθεση</button>
    <div class="h2">Πριν πούμε «ΕΕΔΜΚ»</div>
    <p class="muted" style="margin-bottom:12px">Σπάμε την εργασία. Μετά ταξινομούμε διαδικασία.</p>
    ${qs.map(([k,lab])=>`
      <div class="card">
        <div style="font-weight:700;margin-bottom:8px;font-size:14px">${lab}</div>
        <button data-pq="${k}" data-val="yes" class="choice inline ${p[k]==='yes'?'on':''}">Ναι</button>
        <button data-pq="${k}" data-val="no" class="choice inline ${p[k]==='no'?'on':''}">Όχι</button>
        <button data-pq="${k}" data-val="unknown" class="choice inline ${p[k]==='unknown'?'on':''}">Δεν ξέρω</button>
      </div>`).join('')}
    ${filled?`<div class="nsa"><div class="t">Προσωρινή ταξινόμηση</div><div class="a">${cls.proc}</div><div class="why">${cls.note} Engineer decision ακόμα NULL.</div></div>`:''}
    ${seniorCard(c)}
  </div>
  <div class="foot"><button data-save-path class="btn" ${filled?'':'disabled'}>Αποθήκευση Path →</button></div>`;
}

function viewAssets(){
  const c=cur();if(!c) return viewHome();
  const a=S.assets;
  const keys=[['title','Τίτλος'],['kaek','ΚΑΕΚ'],['topo','Τοπογραφικό'],['permit','Άδεια'],['plans','Σχέδια'],['e9','Ε9']];
  const filled=keys.every(([k])=>a[k]);
  return `${top('Διαθέσιμα')}
  <div class="scroll">
    <button data-open="${c.id}" class="back">← Υπόθεση</button>
    ${seniorCard(c)}
    <div class="h2">Document-first</div>
    <p class="muted" style="margin-bottom:12px">HAS · DOES_NOT_HAVE · UNKNOWN. Source weight μετά.</p>
    ${keys.map(([k,lab])=>`
      <div class="card">
        <div style="font-weight:700;margin-bottom:8px">${lab}</div>
        <button data-asset="${k}" data-val="HAS" class="choice inline ${a[k]==='HAS'?'on':''}">Έχει</button>
        <button data-asset="${k}" data-val="DOES_NOT_HAVE" class="choice inline ${a[k]==='DOES_NOT_HAVE'?'on':''}">Δεν έχει</button>
        <button data-asset="${k}" data-val="UNKNOWN" class="choice inline ${a[k]==='UNKNOWN'?'on':''}">UNKNOWN</button>
      </div>`).join('')}
  </div>
  <div class="foot"><button data-save-assets class="btn" ${filled?'':'disabled'}>Αποθήκευση →</button></div>`;
}

function viewCase(){
  const c=cur();if(!c) return viewHome();
  const h=buildHome(c);
  const m=h.m;
  const idx=stepIdx(c);
  const modeChip=h.mode==='CRITICAL'?'bad':(h.mode==='REVIEW'?'warn':'info');
  const needPath=/μπάνιο|ανακαίνισ/i.test(c.workType+' '+(c.statement||'')) && !(c.pathAnswers&&Object.keys(c.pathAnswers).length);
  return `${top(c.clientName||'Case',`<span class="chip ${modeChip}">${h.mode}</span>`)}
  <div class="scroll">
    <button data-go="home" class="back">← Υποθέσεις</button>
    <div class="steps">${[0,1,2,3,4,5,6].map(i=>`<i class="${i<idx?'done':(i===idx?'on':'')}"></i>`).join('')}</div>
    <div class="mantra"><strong>${h.stage}</strong></div>

    <div class="card">
      <div class="label">Case · multi-workflow ready</div>
      <div style="font-weight:800">${c.workType}${c.purpose?' · '+c.purpose:''}</div>
      <div class="muted" style="margin-top:4px">${c.region||'—'}${c.email?' · '+c.email:''}</div>
      <div class="wf">${(c.workflows||[c.workType]).map(w=>`<span class="on">${w}</span>`).join('')}</div>
    </div>

    <div class="grid">
      <div class="q"><div class="k">Πού είμαι</div><div class="v">${h.stage}</div></div>
      <div class="q"><div class="k">Τι κάνω τώρα</div><div class="v">${h.now}</div></div>
      <div class="q"><div class="k">Τι έχω</div><div class="v">${m.confirmed.length+m.reported.length+m.observed.length}</div></div>
      <div class="q"><div class="k">Τι λείπει / ρίσκο</div><div class="v">${m.missing.length+m.conflicts.length+m.risks.length}</div></div>
    </div>

    ${h.protect?`<div class="critbox"><b>Hard gate</b><br>${h.protect}</div>`:''}

    <div class="nsa">
      <div class="t">NOW · WHY · NEXT</div>
      <div class="a">${h.now}</div>
      <div class="why"><b>Γιατί:</b> ${h.why}<br><b>Μετά:</b> ${h.next}</div>
    </div>

    <div class="senior"><div class="t">Senior · δίπλα σου</div><p>${seniorLine(c,h)}</p><button data-senior-help class="btn ghost sm" style="margin-top:10px">Δεν ξέρω πώς → δείξε μου</button></div>
    <div id="seniorHelp" class="card" style="display:none"></div>

    ${m.reported.length?`<div class="card"><div class="label"><span class="tag r">Reported</span></div>${m.reported.map(x=>`<div class="item">${x}</div>`).join('')}</div>`:''}
    ${m.confirmed.length?`<div class="card"><div class="label"><span class="tag c">Confirmed / διαθέσιμο</span></div>${m.confirmed.map(x=>`<div class="item">🟢 ${x}</div>`).join('')}</div>`:''}
    ${m.observed.length?`<div class="card"><div class="label"><span class="tag o">Observed</span></div>${m.observed.map(x=>`<div class="item">👁 ${x}</div>`).join('')}</div>`:''}
    ${m.missing.length?`<div class="card"><div class="label"><span class="tag m">Missing</span></div>${m.missing.map(x=>`<div class="item">⚪ ${x}</div>`).join('')}</div>`:''}
    ${m.conflicts.length?`<div class="card" style="background:var(--warnBg)"><div class="label"><span class="tag x">Conflict</span></div>${m.conflicts.map(x=>`<div class="item">⚠️ ${x}</div>`).join('')}</div>`:''}
    ${m.risks.length?`<div class="card" style="background:var(--badBg)"><div class="label"><span class="tag k">Risk</span></div>${m.risks.map(r=>`<div class="item"><b>${r.obs}</b><br><span class="muted">${r.cause} · ${r.status}</span></div>`).join('')}</div>`:''}
    ${m.decisions.length?`<div class="card"><div class="label"><span class="tag d">Decision</span></div>${m.decisions.map(x=>`<div class="item">${x}</div>`).join('')}</div>`:''}

    <div class="sec">Ενέργειες</div>
    ${!c.statement?`<button data-go="comm" class="btn" style="margin-bottom:8px">Επικοινωνία</button>`:''}
    ${needPath?`<button data-go="path" class="btn" style="margin-bottom:8px">Χτίσιμο Path (μπάνιο)</button>`:''}
    ${c.statement&&!Object.keys(c.assets||{}).length?`<button data-go="assets" class="btn" style="margin-bottom:8px">Διαθέσιμα στοιχεία</button>`:''}
    <button data-go="docs" class="btn ghost" style="margin-bottom:8px">Έγγραφα</button>
    <button data-go="field" class="btn ghost" style="margin-bottom:8px">Αυτοψία</button>

function bind(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    if(b.dataset.go==='new') S.draft={};
    if(b.dataset.go==='comm') S.comm={text:(cur()||{}).statement||'',purpose:(cur()||{}).purpose||''};
    if(b.dataset.go==='assets') S.assets=Object.assign({},(cur()||{}).assets||{});
    if(b.dataset.go==='path') S.pathAnswers=Object.assign({},(cur()||{}).pathAnswers||{});
    go(b.dataset.go);
  });
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openCase(b.dataset.open));
  document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{S.draft.workType=b.dataset.type;render()});

  const fName=document.getElementById('fName');
  if(fName) fName.oninput=e=>{S.draft.clientName=e.target.value;const btn=document.querySelector('[data-create]');if(btn)btn.disabled=!(S.draft.clientName&&S.draft.workType)};
  const fRegion=document.getElementById('fRegion');

      placementValidated:false,prematureDesign:false,createdAt:now,updatedAt:now
    });

  };

  const ct=document.getElementById('commText');

  const fp=document.getElementById('fPurpose');
  if(fp) fp.oninput=e=>{S.comm.purpose=e.target.value};

  if(sc) sc.onclick=()=>{
    const c=cur();if(!c)return;
    c.statement=(S.comm.text||'').trim();c.purpose=(S.comm.purpose||'').trim();

    const c=cur();if(!c)return;

      let kind='Άλλο';
      if(/\.pdf$/i.test(f.name)) kind='PDF';

  };

  const cp=document.querySelector('[data-complete]');
  if(cp) cp.onclick=()=>{
    const c=cur();if(!c||!c.decision)return;

    c.completed=true;c.updatedAt=Date.now();save();toast('DONE · φάκελος');openCase(c.id);

  const pr=document.querySelector('[data-premature]');
  if(pr) pr.onclick=()=>{const c=cur();if(!c)return;c.prematureDesign=true;c.updatedAt=Date.now();save();toast('Critical');render()};
  const vp=document.querySelector('[data-validate]');

    const c={id:'test-'+id,clientName:'Test '+id,email:'test'+id+'@example.gr',region:'Αθήνα',workType,purpose:'End-to-end',statement:'',assets:{},docs:[],photos:[],pathAnswers:{},fieldNotes:'',fieldChecks:{},fieldDone:false,finding:'',decision:'',completed:false,placementValidated:false,prematureDesign:false};
    const errors=[],stage=[];
    const check=(name,condition,detail)=>{stage.push({name,pass:!!condition});if(!condition)errors.push(detail||name)};
    S.cases=[c];S.cur=c.id;S.screen='case';
    try{
      // 1. Intake / communication
      check('case-intake',viewCase().includes('Senior · δίπλα σου') && viewCase().includes(helpPhrase),'Senior missing at intake');
      c.statement=statement;c.updatedAt=Date.now();
      check('communication',viewComm().includes('Reported ≠ Confirmed'),'communication screen lost epistemic guard');

      // 2. Path where applicable
      if(path){
        c.pathAnswers=path;
        const pv=viewPath();
        check('path-guidance',pv.includes(helpPhrase) && pv.includes('Senior'),'Path has no Senior guidance');
        const cls=classifyBathroom(path);
        check('path-classification',cls.proc!=='UNKNOWN','Path remained unclassified');
      }

      // 3. Availability/evidence entry
      c.assets={title:'HAS',kaek:'HAS',topo:'HAS',permit:'HAS',plans:'HAS',e9:'HAS'};
      const av=viewAssets();
      check('availability-guidance',av.includes(helpPhrase),'Availability screen has no practical Senior help');

      // 4. Documents
      c.docs=[{name:'evidence.pdf',kb:1,kind:'PDF',status:'UPLOADED'}];
      const dv=viewDocs();
      check('documents-guidance',dv.includes(helpPhrase),'Documents screen has no Senior help');

      // 5. Field
      c.fieldNotes=statement;
      if(flag==='conflict') c.fieldNotes+=' Δεν συμφωνούν οι πηγές.';
      if(flag==='risk' && !/υγρασία|ρωγμές/i.test(statement)) c.fieldNotes+=' Υπάρχει ειδικός περιορισμός προς έλεγχο.';
      c.fieldDone=true;
      const fv=viewField();
      check('field-guidance',fv.includes(helpPhrase),'Field screen has no Senior help');

      // 6. Review / decision
      const rh=viewReview();
      check('review-guidance',rh.includes(helpPhrase),'Decision screen has no Senior help');
      c.finding='Observed facts separated from hypotheses.';
      c.decision='Engineer decision recorded with evidence, limits and unresolved items.';

      // 7. Risk/conflict semantics
      const m=buildState(c),h=buildHome(c);
      if(flag==='conflict') check('conflict',m.conflicts.length>0,'Expected conflict not surfaced');
      if(flag==='risk') check('risk',m.risks.length>0 || /Natura|Δασικό|Ρέμα|Αιγιαλός|Αρχαιολογία|Αυθαίρετη|Διατηρητέο|Παραδοσιακό|υγρασία|ρωγμ/i.test(statement),'Expected risk not surfaced');
      if(flag==='critical'){
        c.prematureDesign=true;
        const ch=buildHome(c);
        check('critical-stop',ch.mode==='CRITICAL' && !!ch.protect,'Critical stop not activated');
        const before=viewDone();
        check('critical-completion-block',before.includes('COMPLETION BLOCKED'),'Critical case not blocked');
        c.placementValidated=true;
      }

      // 8. Senior must be contextual, not generic fallback
      const finalGuidance=seniorGuidance(c,buildHome(c));
      check('contextual-senior',finalGuidance.body.length>80,'Senior guidance too shallow');
      check('help-content',seniorCard(c).includes(helpPhrase),'Help action unavailable');

      // 9. Completion
      const done=viewDone();
      check('completion-review',/Engineer decision|Senior Review/i.test(done) && done.includes(helpPhrase),'Completion screen lost Senior review/help');
      const blocked=c.workType==='Νέα οικοδομή'&&c.prematureDesign&&!c.placementValidated;
      check('completion-allowed',!!c.decision&&!blocked,'Completion remained blocked unexpectedly');
      c.completed=true;
      check('done-state',buildHome(c).stage.includes('COMPLETION'),'Case did not reach completion state');
    }catch(e){errors.push('exception: '+e.message)}
    results.push({id,ok:errors.length===0,errors,stages:stage,mode:buildHome(c).mode,seniorTitle:seniorGuidance(c,buildHome(c)).title});
  }
  const passed=results.filter(x=>x.ok).length,failed=results.length-passed;
  const failures=results.filter(x=>!x.ok);
  document.body.innerHTML=`<div style="font-family:system-ui;padding:24px;max-width:1100px;margin:auto"><h1>AI Senior Engineer — 50 Case End-to-End Senior Regression</h1><p><b>${passed}/50 passed</b> · ${failed} failed</p><p style="color:#64748b">Κάθε case πέρασε intake → communication → (Path) → availability → documents → field → review/decision → completion, με έλεγχο του «Δεν ξέρω πώς → δείξε μου» και των κρίσιμων gates.</p><table border="1" cellpadding="6" cellspacing="0" style="border-collapse:collapse;width:100%;font-size:13px"><tr><th>ID</th><th>OK</th><th>Mode</th><th>Senior</th><th>Failures</th></tr>${results.map(r=>`<tr><td>${r.id}</td><td>${r.ok?'PASS':'FAIL'}</td><td>${r.mode}</td><td>${r.seniorTitle}</td><td>${r.errors.join('; ')}</td></tr>`).join('')}</table>${failures.length?`<h2 style="margin-top:24px">Failures</h2>${failures.map(r=>`<pre>${JSON.stringify(r,null,2)}</pre>`).join('')}`:''}</div>`;
  window.__suiteResults=results;
}

load();
render();
if(new URLSearchParams(location.search).get("suite")==="50") runCaseSuite50();
})();
</script>
</body>
</html>
