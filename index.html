<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AI Senior Engineer — Demo v2</title>
<style>
:root{--paper:#f5f4ef;--white:#fff;--ink:#23272b;--muted:#6b6b63;--line:#dbd6c9;--navy:#1d3557;--green:#3a6b4c;--greenbg:#e7efe8;--amber:#a8791f;--amberbg:#f5eedc;--red:#a8412f;--redbg:#f5e4df;--bluebg:#eef1f5}
*{box-sizing:border-box}html,body{margin:0;background:#e4e0d4;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1050px;min-height:100vh;margin:auto;background:var(--paper)}
.top{background:#fbfaf7;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px;position:sticky;top:0;z-index:10}.brand{font-weight:800}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:500;margin-top:2px}.top button{border:1px solid var(--line);background:#fff;padding:9px 12px;font-weight:700;color:var(--navy)}
main{padding:28px}.hero{background:var(--navy);color:#f5f4ef;padding:30px;border-radius:18px;margin-bottom:22px}.hero h1{margin:0 0 9px;font-size:30px}.hero p{margin:0;color:#cbd5e2;max-width:750px;line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}.panel h2{font-size:18px;margin:0 0 7px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.metric{font-size:26px;font-weight:800;color:var(--navy)}.label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.primary{background:var(--navy);color:#fff;border:0;padding:13px 17px;font-weight:750;border-radius:8px}.secondary{background:#fff;color:var(--navy);border:1px solid var(--line);padding:12px 16px;font-weight:700;border-radius:8px}.danger{background:var(--redbg);color:var(--red);border:1px solid #e8c5bc;padding:8px 10px;border-radius:8px;font-weight:700}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.back{background:none;border:0;color:var(--muted);font-weight:700;padding:4px 0;margin-bottom:16px}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.type{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left}.type.selected{border:2px solid var(--navy);background:#f2f5f8}.type b{display:block;margin-bottom:4px}.type span{font-size:12px;color:var(--muted)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-top:13px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);background:#fff;border-radius:8px;outline:none}.field textarea{min-height:82px;resize:vertical}
.stepbar{display:flex;gap:5px;margin:14px 0 22px}.stepbar span{height:4px;flex:1;background:var(--line);border-radius:3px}.stepbar span.on{background:var(--navy)}
.drop{border:1.5px dashed #9ba7b8;background:#fafbfc;border-radius:12px;padding:22px;text-align:center;margin-top:12px}.drop input{display:none}.drop label{display:inline-block;background:var(--navy);color:#fff;padding:10px 14px;border-radius:7px;font-weight:700}.files{display:grid;gap:8px;margin-top:12px}.file{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);padding:11px;border-radius:8px}.file .ext{font-size:10px;font-weight:800;color:var(--navy);background:var(--bluebg);padding:5px 7px;border-radius:5px}.file small{display:block;color:var(--muted);margin-top:2px}
.notice{padding:14px;border-left:3px solid var(--navy);background:var(--bluebg);margin-top:14px;border-radius:4px}.warning{padding:14px;border-left:3px solid var(--amber);background:var(--amberbg);margin-top:14px}.success{padding:14px;border-left:3px solid var(--green);background:var(--greenbg);margin-top:14px}
.status{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;font-size:10px;font-weight:800;border-radius:5px}.s-green{color:var(--green);background:var(--greenbg)}.s-amber{color:var(--amber);background:var(--amberbg)}.s-red{color:var(--red);background:var(--redbg)}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border:1px solid var(--line);background:#fff;padding:14px;border-radius:9px;margin-top:9px}.row b{font-size:14px}.row p{margin:4px 0 0;color:var(--muted);font-size:12px;line-height:1.45}.row>div:first-child{flex:1}
.review{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.bigaction{background:var(--navy);color:#fff;border-radius:14px;padding:20px}.bigaction h2{margin:4px 0 8px}.bigaction p{color:#d5deea;line-height:1.5;font-size:13px}.score{font-size:42px;font-weight:850}.footer{padding:22px 28px;color:var(--muted);font-size:11px;text-align:center}
@media(max-width:720px){main{padding:16px}.grid,.types,.formgrid,.review{grid-template-columns:1fr}.hero h1{font-size:24px}.top{padding:12px 16px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const root=document.getElementById('root');
const state={screen:'home',case:{customer:'',address:'',workType:'',year:'',hasPlans:'',hasTopo:'',notes:''},files:[]};
const workTypes=[['ΠΕΑ','Ενεργειακή επιθεώρηση και συλλογή στοιχείων'],['ΗΤΚ','Ηλεκτρονική Ταυτότητα Κτιρίου'],['Αυθαίρετο','Έλεγχος και οργάνωση αυθαίρετων κατασκευών'],['Αυτοψία','Οργάνωση αυτοψίας και τεχνικής τεκμηρίωσης'],['Τοπογραφικό','Συλλογή στοιχείων για τοπογραφική εργασία'],['Άλλο','Νέα τεχνική υπόθεση']];
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function ext(n){return(n.split('.').pop()||'').toUpperCase()}
function st(c,t){return'<span class="status '+c+'">'+t+'</span>'}
function top(){return'<header class="top"><div class="brand">AI Senior Engineer<small>Demo v2 · Engineering Case Intelligence</small></div><button onclick="goHome()">Αρχική</button></header>'}
function home(){return`<main><section class="hero"><div class="label" style="color:#aebed2">DIGITAL SENIOR ENGINEER</div><h1>Από τη νέα υπόθεση μέχρι το επόμενο σωστό βήμα.</h1><p>Το demo δείχνει πώς ο μηχανικός δημιουργεί φάκελο, συλλέγει στοιχεία και αρχεία, εντοπίζει τι λείπει και παίρνει στοχευμένη καθοδήγηση πριν προχωρήσει.</p><div class="actions"><button class="primary" onclick="newCase()">+ Νέα υπόθεση</button></div></section><div class="grid"><div class="panel"><div class="label">01 · Capture</div><h2>Συλλογή</h2><p class="muted">Στοιχεία ακινήτου, τύπος εργασίας, σχέδια και τεχνικά αρχεία.</p></div><div class="panel"><div class="label">02 · Understand</div><h2>Έλεγχος</h2><p class="muted">Διάκριση ανάμεσα σε δηλωμένα, επιβεβαιωμένα και ελλιπή στοιχεία.</p></div><div class="panel"><div class="label">03 · Act</div><h2>Next Best Action</h2><p class="muted">Ο μηχανικός βλέπει τι πρέπει να κάνει πρώτα και γιατί.</p></div></div><section class="panel"><h2>Τι θέλουμε να αποδείξει το demo</h2><div class="grid"><div><div class="metric">PDF</div><div class="muted">Έγγραφα και τεχνικές μελέτες</div></div><div><div class="metric">CAD</div><div class="muted">DWG / DXF ως τεχνικά σχέδια</div></div><div><div class="metric">AI</div><div class="muted">Εντοπισμός κενών και προτεινόμενα επόμενα βήματα</div></div></div></section></main>`}
function newCase(){return`<main><button class="back" onclick="goHome()">← Πίσω</button><section class="panel"><div class="label">ΝΕΑ ΥΠΟΘΕΣΗ · ΒΗΜΑ 1</div><h2>Πες μου πρώτα τι υπόθεση ανοίγεις.</h2><p class="muted">Η επιλογή αλλάζει τις ερωτήσεις και τον φάκελο που θα οργανωθεί.</p><div class="types">${workTypes.map(([n,d])=>`<button class="type ${state.case.workType===n?'selected':''}" onclick="setWork('${n}')"><b>${n}</b><span>${d}</span></button>`).join('')}</div><div class="formgrid"><div class="field"><label>Πελάτης / Εντολέας</label><input value="${esc(state.case.customer)}" oninput="state.case.customer=this.value" placeholder="Ονοματεπώνυμο"></div><div class="field"><label>Διεύθυνση ακινήτου</label><input value="${esc(state.case.address)}" oninput="state.case.address=this.value" placeholder="Οδός, αριθμός, περιοχή"></div></div><div class="actions"><button class="primary" onclick="state.screen='questions';render()" ${state.case.workType?'':'disabled style="opacity:.45;cursor:not-allowed"'}>Συνέχεια →</button></div></section></main>`}
function questions(){return`<main><button class="back" onclick="state.screen='new';render()">← Πίσω</button><section class="panel"><div class="label">ΝΕΑ ΥΠΟΘΕΣΗ · ΒΗΜΑ 2</div><h2>Χτίζουμε τον αρχικό τεχνικό φάκελο.</h2><p class="muted">Δεν ζητάμε όλα από την αρχή. Ξεκινάμε με τα κρίσιμα στοιχεία που επηρεάζουν την επόμενη ενέργεια.</p><div class="stepbar"><span class="on"></span><span class="on"></span><span></span><span></span></div><div class="formgrid"><div class="field"><label>Έτος κατασκευής</label><input type="number" value="${esc(state.case.year)}" oninput="state.case.year=this.value" placeholder="π.χ. 1972"></div><div class="field"><label>Υπάρχουν αρχιτεκτονικά σχέδια;</label><select onchange="state.case.hasPlans=this.value;render()"><option value="">Επίλεξε</option><option ${state.case.hasPlans==='Ναι'?'selected':''}>Ναι</option><option ${state.case.hasPlans==='Όχι'?'selected':''}>Όχι</option><option ${state.case.hasPlans==='Δεν γνωρίζω'?'selected':''}>Δεν γνωρίζω</option></select></div><div class="field"><label>Υπάρχει τοπογραφικό;</label><select onchange="state.case.hasTopo=this.value"><option value="">Επίλεξε</option><option ${state.case.hasTopo==='Ναι'?'selected':''}>Ναι</option><option ${state.case.hasTopo==='Όχι'?'selected':''}>Όχι</option><option ${state.case.hasTopo==='Δεν γνωρίζω'?'selected':''}>Δεν γνωρίζω</option></select></div><div class="field"><label>Σύντομη σημείωση</label><textarea oninput="state.case.notes=this.value" placeholder="Τι γνωρίζεις ήδη για την υπόθεση;">${esc(state.case.notes)}</textarea></div></div>${state.case.hasPlans==='Όχι'?'<div class="warning"><b>Δεν υπάρχουν διαθέσιμα αρχιτεκτονικά σχέδια.</b><br>Το σύστημα προτείνει αυτοψία, λήψη κρίσιμων αποστάσεων και δημιουργία/επικαιροποίηση κατόψεων και τομών πριν από ασφαλή τεχνική αξιολόγηση.</div>':''}${state.case.hasPlans==='Δεν γνωρίζω'?'<div class="notice"><b>Αβεβαιότητα στα σχέδια.</b><br>Πρώτο βήμα: αναζήτηση φακέλου άδειας και διαθέσιμων σχεδίων. Αν δεν βρεθούν, ενεργοποιείται διαδικασία αυτοψίας και αποτύπωσης.</div>':''}<div class="actions"><button class="primary" onclick="state.screen='files';render()">Συνέχεια στα αρχεία →</button></div></section></main>`}
function files(){return`<main><button class="back" onclick="state.screen='questions';render()">← Πίσω</button><section class="panel"><div class="label">ΝΕΑ ΥΠΟΘΕΣΗ · ΒΗΜΑ 3</div><h2>Φέρε μέσα τον πραγματικό τεχνικό φάκελο.</h2><p class="muted">Στο demo δείχνουμε την εμπειρία αποδοχής βασικών τεχνικών αρχείων. Σε πραγματική έκδοση, τα αρχεία θα περνούν από ασφαλή ingestion, parsing και validation pipeline.</p><div class="drop"><p><b>Έγγραφα & σχέδια</b><br><span class="muted">PDF, DWG, DXF και άλλα υποστηριζόμενα τεχνικά αρχεία</span></p><label for="fileInput">+ Προσθήκη αρχείων</label><input id="fileInput" type="file" multiple accept=".pdf,.dwg,.dxf,.jpg,.jpeg,.png" onchange="addFiles(this.files)"></div><div class="files">${state.files.length?state.files.map((f,i)=>`<div class="file"><span class="ext">${ext(f.name)}</span><div style="flex:1"><b>${esc(f.name)}</b><small>${Math.round(f.size/1024)} KB · Προστέθηκε στο demo</small></div><button class="danger" onclick="removeFile(${i})">×</button></div>`).join(''):'<div class="notice">Δεν έχει προστεθεί αρχείο ακόμα. Για το demo μπορείς να ανεβάσεις ένα PDF ή ένα CAD αρχείο από τη συσκευή σου.</div>'}</div><div class="grid" style="margin-top:16px"><div class="panel" style="margin:0"><div class="label">PDF</div><b>Έλεγχος εγγράφων</b><p class="muted">Άδειες, τοπογραφικά, σχέδια, δηλώσεις και λοιπά τεκμήρια.</p></div><div class="panel" style="margin:0"><div class="label">CAD</div><b>Τεχνικά σχέδια</b><p class="muted">DWG/DXF ως πηγή για σχέδια που θα πρέπει να ελεγχθούν και να συσχετιστούν.</p></div><div class="panel" style="margin:0"><div class="label">TOPO</div><b>Τοπογραφικό</b><p class="muted">${state.case.hasTopo==='Ναι'?'Δηλώθηκε ότι υπάρχει. Απαιτείται έλεγχος περιεχομένου και επικαιρότητας.':'Δεν έχει επιβεβαιωθεί η ύπαρξη.'}</p></div></div><div class="actions"><button class="primary" onclick="state.screen='folder';render()">Οργάνωση τεχνικού φακέλου →</button></div></section></main>`}
function folder(){const old=state.case.year&&Number(state.case.year)<1980,mp=state.case.hasPlans==='Όχι',nt=state.case.hasTopo!=='Ναι',pdf=state.files.some(f=>ext(f.name)==='PDF'),cad=state.files.some(f=>['DWG','DXF'].includes(ext(f.name)));const cats=[['Στοιχεία ακινήτου',state.case.year?st('s-amber','ΔΗΛΩΘΗΚΕ'):st('s-red','ΛΕΙΠΕΙ'),state.case.year?'Έτος '+state.case.year+' · χρειάζεται επιβεβαίωση':'Δεν έχει καταγραφεί έτος κατασκευής'],['Αρχιτεκτονικά σχέδια',mp?st('s-red','ΛΕΙΠΕΙ'):state.case.hasPlans==='Ναι'?st('s-amber','ΧΡΕΙΑΖΕΤΑΙ ΕΛΕΓΧΟ'):st('s-amber','ΑΒΕΒΑΙΟ'),mp?'Δεν υπάρχουν διαθέσιμα σχέδια. Απαιτείται αποτύπωση.':'Η ύπαρξη δεν σημαίνει ότι τα σχέδια είναι επαρκή ή επίκαιρα.'],['Τοπογραφικό',nt?st('s-red','ΕΚΚΡΕΜΕΙ'):st('s-amber','ΧΡΕΙΑΖΕΤΑΙ ΕΛΕΓΧΟ'),nt?'Δεν έχει επιβεβαιωθεί διαθέσιμο τοπογραφικό.':'Υπάρχει δήλωση ύπαρξης — απαιτείται έλεγχος.'],['PDF τεκμήρια',pdf?st('s-green','ΠΡΟΣΤΕΘΗΚΕ'):st('s-red','ΛΕΙΠΕΙ'),pdf?'Υπάρχει τουλάχιστον ένα PDF στον φάκελο.':'Δεν έχει προστεθεί PDF.'],['CAD σχέδια',cad?st('s-green','ΠΡΟΣΤΕΘΗΚΕ'):st('s-red','ΛΕΙΠΕΙ'),cad?'Υπάρχει DWG/DXF στον φάκελο.':'Δεν έχει προστεθεί CAD αρχείο.'],['Αυτοψία / αποτύπωση',mp?st('s-red','ΑΠΑΡΑΙΤΗΤΗ'):st('s-amber','ΕΚΚΡΕΜΕΙ'),mp?'Χρειάζεται επί τόπου συλλογή διαστάσεων για κάτοψη/τομές.':'Δεν έχει πραγματοποιηθεί ή τεκμηριωθεί.']];return`<main><button class="back" onclick="state.screen='files';render()">← Πίσω</button><section class="panel"><div class="label">ΤΕΧΝΙΚΟΣ ΦΑΚΕΛΟΣ</div><h2>${esc(state.case.workType)} · ${esc(state.case.address)||'Νέα υπόθεση'}</h2><p class="muted">Η εφαρμογή δεν παρουσιάζει απλώς μια λίστα. Δείχνει τι γνωρίζουμε, τι λείπει και ποιο στοιχείο χρειάζεται επαλήθευση.</p>${old?'<div class="warning"><b>Σημείο προσοχής:</b> Παλαιότερο κτίριο. Η αυτοψία πρέπει να δώσει ιδιαίτερη προσοχή σε υγρασία, τοιχοποιίες, θερμικά χαρακτηριστικά και αποκλίσεις από τα διαθέσιμα σχέδια.</div>':''}${cats.map(c=>`<div class="row"><div><b>${c[0]}</b><p>${c[2]}</p></div>${c[1]}</div>`).join('')}<div class="actions"><button class="primary" onclick="state.screen='review';render()">Senior Review →</button><button class="secondary" onclick="state.screen='files';render()">+ Προσθήκη αρχείου</button></div></section></main>`}
function review(){const mp=state.case.hasPlans==='Όχι',up=state.case.hasPlans==='Δεν γνωρίζω'||!state.case.hasPlans,nt=state.case.hasTopo!=='Ναι',pdf=!state.files.some(f=>ext(f.name)==='PDF'),cad=!state.files.some(f=>['DWG','DXF'].includes(ext(f.name)));let action=mp?'Πρώτη προτεραιότητα: αυτοψία και αποτύπωση του ακινήτου.':up?'Πρώτη προτεραιότητα: αναζήτηση διαθέσιμων αρχιτεκτονικών σχεδίων και φακέλου άδειας.':'Πρώτη προτεραιότητα: έλεγχος επάρκειας και αντιστοίχισης των διαθέσιμων σχεδίων.';let detail=mp?'Κατά την αυτοψία συλλέγονται οι κρίσιμες διαστάσεις για δημιουργία/επικαιροποίηση κατόψεων και τομών, μαζί με φωτογραφική τεκμηρίωση.':'Το σύστημα δεν θεωρεί την ύπαρξη ενός αρχείου από μόνη της απόδειξη τεχνικής επάρκειας.';return`<main><button class="back" onclick="state.screen='folder';render()">← Πίσω</button><div class="review"><section><div class="panel"><div class="label">SENIOR REVIEW</div><h2>Δεν σου λέω μόνο τι λείπει. Σου λέω τι κάνεις μετά.</h2><p class="muted">Η αξιολόγηση είναι ενδεικτική του demo και δεν αποτελεί τεχνική ή νομική κρίση.</p><div class="bigaction"><div class="label" style="color:#b9c7d8">NEXT BEST ACTION</div><h2>${action}</h2><p>${detail}</p></div>${mp?'<div class="warning"><b>Απουσία αρχιτεκτονικών σχεδίων → προτεινόμενη διαδικασία</b><br>1. Αυτοψία · 2. Λήψη ακριβών αποστάσεων · 3. Φωτογραφική τεκμηρίωση · 4. Δημιουργία/επικαιροποίηση κατόψεων · 5. Δημιουργία τομών · 6. Συσχέτιση με τα διαθέσιμα τεκμήρια.</div>':''}</div><div class="panel"><h2>Τι γνωρίζουμε / τι δεν γνωρίζουμε</h2>${state.case.year?`<div class="row"><div><b>Έτος κατασκευής</b><p>${esc(state.case.year)} · δήλωση χρήστη</p></div>${st('s-amber','ΜΗ ΕΠΙΒΕΒΑΙΩΜΕΝΟ')}</div>`:''}<div class="row"><div><b>Αρχιτεκτονικά σχέδια</b><p>${state.case.hasPlans||'Δεν έχει δηλωθεί'}</p></div>${mp?st('s-red','ΛΕΙΠΟΥΝ'):st('s-amber','ΕΛΕΓΧΟΣ')}</div><div class="row"><div><b>Τοπογραφικό</b><p>${state.case.hasTopo||'Δεν έχει δηλωθεί'}</p></div>${nt?st('s-red','ΕΚΚΡΕΜΕΙ'):st('s-amber','ΕΛΕΓΧΟΣ')}</div><div class="row"><div><b>PDF</b><p>${pdf?'Δεν υπάρχει PDF':'Υπάρχει PDF'}</p></div>${pdf?st('s-red','ΛΕΙΠΕΙ'):st('s-green','ΠΡΟΣΤΕΘΗΚΕ')}</div><div class="row"><div><b>CAD</b><p>${cad?'Δεν υπάρχει DWG/DXF':'Υπάρχει CAD'}</p></div>${cad?st('s-amber','ΕΚΚΡΕΜΕΙ'):st('s-green','ΠΡΟΣΤΕΘΗΚΕ')}</div></div></section><aside><div class="panel"><div class="label">READINESS</div><div class="score">${mp?'35':'55'}%</div><p class="muted">Ενδεικτική ετοιμότητα φακέλου για το demo.</p></div><div class="panel"><div class="label">DEMO PRINCIPLE</div><h2>«Αυτά ξέρουμε. Αυτά δεν ξέρουμε. Αυτά πρέπει να ελέγξεις.»</h2><p class="muted">Η εφαρμογή δεν αντικαθιστά την κρίση του μηχανικού. Οργανώνει τη σκέψη και μειώνει τα παραλειπόμενα.</p></div></aside></div><div class="actions"><button class="primary" onclick="newCase()">Ολοκλήρωση demo · Νέα υπόθεση</button></div></main>`}
function newCase(){state.screen='new';state.case={customer:'',address:'',workType:'',year:'',hasPlans:'',hasTopo:'',notes:''};state.files=[];render()}
