<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1D3557" />
  <title>AI Senior Engineer — Validation</title>
  <style>
    :root {
      --paper: #F5F4EF; --ink: #23272B; --muted: #6B6B63; --line: #DBD6C9;
      --navy: #1D3557; --soft: #2A466E;
      --ok: #3A6B4C; --okBg: #E7EFE8;
      --warn: #A8791F; --warnBg: #F5EEDC;
      --bad: #A8412F; --badBg: #F5E4DF;
      --info: #EEF1F5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #e5e3db; color: var(--ink);
      min-height: 100dvh; display: flex; justify-content: center;
    }
    #root {
      width: 100%; max-width: 430px; min-height: 100dvh;
      background: var(--paper); box-shadow: 0 0 40px rgba(0,0,0,.07);
      display: flex; flex-direction: column;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    input, textarea { font-family: inherit; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
  </style>
</head>
<body>
<div id="root"></div>

<script>
(function () {
  const T = {
    paper: "#F5F4EF", ink: "#23272B", muted: "#6B6B63", line: "#DBD6C9",
    navy: "#1D3557", soft: "#2A466E",
    ok: "#3A6B4C", okBg: "#E7EFE8",
    warn: "#A8791F", warnBg: "#F5EEDC",
    bad: "#A8412F", badBg: "#F5E4DF",
    info: "#EEF1F5"
  };

  const L = {
    fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
    letterSpacing: ".07em", textTransform: "uppercase", fontSize: "10px", color: T.muted
  };

  // ========== STATE ==========
  let screen = "home";
  let caseData = { customer: "", address: "", workType: "" };
  let answers = {};
  let files = [];
  let qIndex = 0;

  // ========== QUESTIONS ==========
  const CORE = [
    { id: "year", text: "Ποιο είναι το έτος κατασκευής;", type: "text", ph: "π.χ. 1972",
      why: "Δεν χρειάζεται να το γνωρίζεις με απόλυτη βεβαιότητα τώρα. Το καταγράφουμε ως δήλωση και το επιβεβαιώνουμε αργότερα." },
    { id: "plans", text: "Υπάρχουν διαθέσιμα αρχιτεκτονικά σχέδια;", type: "choice", opts: ["Ναι", "Όχι", "Δεν γνωρίζω"],
      why: "Ακόμα και αν υπάρχουν σχέδια, δεν σημαίνει αυτόματα ότι όλα είναι εντάξει. Τα καταγράφουμε και τα ελέγχουμε στο σωστό στάδιο." },
    { id: "permit", text: "Υπάρχει οικοδομική άδεια;", type: "choice", opts: ["Ναι", "Όχι", "Δεν γνωρίζω"],
      why: "Είναι σημαντικό στοιχείο, αλλά αν δεν το γνωρίζεις ακόμα, το σημειώνουμε ως «προς έλεγχο»." }
  ];

  const ENGINES = {
    "ΠΕΑ": [
      { id: "insulation", text: "Υπάρχει μόνωση στην τοιχοποιία;", type: "choice", opts: ["Ναι", "Όχι", "Δεν γνωρίζω"],
        why: "Σε παλαιότερα κτίρια η θερμομόνωση μπορεί να διαφέρει. Το καταγράφουμε ως προς έλεγχο και το επιβεβαιώνουμε στην αυτοψία." }
    ],
    "Τοπογραφικό": [
      { id: "topo_purpose", text: "Για ποιο σκοπό χρειάζεται το τοπογραφικό;", type: "choice",
        opts: ["Συμβόλαιο", "Οικοδομική άδεια", "Τακτοποίηση", "Κτηματολόγιο", "Άλλο", "Δεν γνωρίζω ακόμη"],
        why: "Ο σκοπός καθορίζει ποια στοιχεία είναι πραγματικά κρίσιμα." },
      { id: "old_topo", text: "Υπάρχει παλαιότερο τοπογραφικό διάγραμμα;", type: "choice", opts: ["Ναι", "Όχι", "Δεν γνωρίζω"],
        why: "Ακόμα και ένα παλιό διάγραμμα μπορεί να βοηθήσει. Αν δεν υπάρχει, απλώς αλλάζει το επόμενο βήμα." },
      { id: "titles_topo", text: "Υπάρχουν διαθέσιμοι τίτλοι ιδιοκτησίας;", type: "choice", opts: ["Ναι", "Όχι", "Δεν γνωρίζω"],
        why: "Οι τίτλοι βοηθούν στον προσδιορισμό ορίων." }
    ],
    "Αυθαίρετο": [
      { id: "deviation", text: "Υπάρχουν εμφανείς αποκλίσεις από τυχόν άδεια;", type: "choice", opts: ["Ναι", "Όχι", "Δεν γνωρίζω"],
        why: "Καταγράφουμε αυτό που φαίνεται ή δηλώνεται, χωρίς να βγάζουμε τελική κρίση εδώ." }
    ]
  };

  function getQuestions(type) {
    if (type === "Τοπογραφικό") return ENGINES["Τοπογραφικό"] || [];
    return [...CORE, ...(ENGINES[type] || [])];
  }

  // ========== ENGINE ==========
  function build() {
    const yearStr = (answers.year || "").trim();
    const yearOk = /^\d{4}$/.test(yearStr) && +yearStr >= 1800 && +yearStr <= new Date().getFullYear();
    const year = +yearStr;
    const old = yearOk && year < 1980;
    const isTopo = caseData.workType === "Τοπογραφικό";

    const pdfs = files.filter(f => f.name.toLowerCase().endsWith(".pdf")).length;
    const cads = files.filter(f => /\.(dwg|dxf)$/i.test(f.name)).length;
    const images = files.filter(f => /\.(jpe?g|png)$/i.test(f.name)).length;

    let facts = [];
    if (isTopo) {
      facts = [
        { name: "Σκοπός τοπογραφικού", value: answers.topo_purpose || "—", source: answers.topo_purpose ? "Δήλωση χρήστη" : "—", status: answers.topo_purpose ? "declared" : "missing" },
        { name: "Παλαιότερο τοπογραφικό", value: answers.old_topo || "—", source: answers.old_topo ? "Δήλωση χρήστη" : "—", status: answers.old_topo === "Ναι" ? "declared" : answers.old_topo === "Όχι" ? "missing" : "needs_check" },
        { name: "Τίτλοι ιδιοκτησίας", value: answers.titles_topo || "—", source: answers.titles_topo ? "Δήλωση χρήστη" : "—", status: answers.titles_topo === "Ναι" ? "declared" : answers.titles_topo === "Όχι" ? "missing" : "needs_check" },
        { name: "Αποτύπωση / μετρήσεις", value: "Δεν έχουν πραγματοποιηθεί", source: "—", status: "not_done" }
      ];
    } else {
      facts = [
        { name: "Έτος κατασκευής", value: yearOk ? String(year) : "—", source: yearOk ? "Δήλωση χρήστη" : "—", status: yearOk ? "declared" : "missing" },
        { name: "Αρχιτεκτονικά σχέδια", value: answers.plans || "—", source: answers.plans ? "Δήλωση χρήστη" : "—", status: answers.plans === "Ναι" ? "declared" : answers.plans === "Όχι" ? "missing" : "needs_check" },
        { name: "Οικοδομική άδεια", value: answers.permit || "—", source: answers.permit ? "Δήλωση χρήστη" : "—", status: answers.permit === "Ναι" ? "declared" : answers.permit === "Όχι" ? "missing" : "needs_check" },
        { name: "Αυτοψία", value: "Δεν πραγματοποιήθηκε", source: "—", status: "not_done" },
        { name: "Φωτογραφική τεκμηρίωση", value: images > 0 ? `${images} αρχείο/α` : "Καμία", source: images > 0 ? "Upload" : "—", status: images > 0 ? "declared" : "not_done" }
      ];
      if (answers.insulation) facts.push({ name: "Μόνωση τοιχοποιίας", value: answers.insulation, source: "Δήλωση χρήστη", status: "needs_check" });
      if (answers.deviation) facts.push({ name: "Αποκλίσεις από άδεια", value: answers.deviation, source: "Δήλωση χρήστη", status: "needs_check" });
    }

    // Files as facts
    if (pdfs > 0) facts.push({ name: "PDF τεκμήρια", value: `${pdfs} αρχείο/α`, source: "Upload", status: "declared" });
    if (cads > 0) facts.push({ name: "CAD σχέδια", value: `${cads} αρχείο/α`, source: "Upload", status: "declared" });

    const counts = {
      declared: facts.filter(f => f.status === "declared").length,
      needs: facts.filter(f => f.status === "needs_check").length,
      missing: facts.filter(f => f.status === "missing").length,
      notDone: facts.filter(f => f.status === "not_done").length,
      total: facts.length
    };

    let overall = "yellow";
    if (counts.missing > 0) overall = "red";
    else if (counts.needs === 0 && counts.notDone === 0) overall = "green";

    // Next Best Action
    let nba = { title: "Πραγματοποίησε αυτοψία και τεκμηρίωσε με φωτογραφίες", reasons: ["Δεν έχει επιβεβαιωθεί η πραγματική κατάσταση", "Δεν υπάρχει επαρκής φωτογραφική τεκμηρίωση"] };

    if (isTopo) {
      if (answers.old_topo === "Όχι" || !answers.old_topo) {
        nba = {
          title: "Ζήτησε τίτλους και ό,τι παλαιό διάγραμμα διαθέτει ο πελάτης",
          reasons: ["Δεν υπάρχει διαθέσιμο τοπογραφικό αρχείο", "Ο σκοπός είναι: " + (answers.topo_purpose || "μη καθορισμένος"), "Πριν ξεκινήσεις νέα αποτύπωση, συγκέντρωσε τα υπάρχοντα στοιχεία"]
        };
      } else if (answers.titles_topo === "Όχι") {
        nba = { title: "Ζήτησε τους τίτλους ιδιοκτησίας πριν προχωρήσεις", reasons: ["Οι τίτλοι βοηθούν στον προσδιορισμό ορίων", "Χωρίς τίτλους αυξάνεται ο κίνδυνος λάθους"] };
      } else {
        nba = { title: "Προγραμμάτισε αυτοψία / αποτύπωση", reasons: ["Υπάρχουν βασικά στοιχεία", "Απαιτείται επιτόπια μέτρηση"] };
      }
    } else if (answers.plans === "Όχι" || answers.permit === "Όχι") {
      nba = {
        title: "Συγκέντρωσε οικοδομική άδεια και διαθέσιμα σχέδια",
        reasons: ["Η κατάσταση δεν μπορεί να αξιολογηθεί χωρίς τα βασικά έγγραφα", "Η αυτοψία γίνεται πιο αποτελεσματική με υλικό σύγκρισης"]
      };
    } else if (old) {
      nba = {
        title: "Κάνε αυτοψία με έμφαση σε τοιχοποιία και υγρασία",
        reasons: [`Κτίριο του ${year} (προ του 1980)`, "Η κατάσταση μόνωσης δεν έχει επιβεβαιωθεί"]
      };
    }

    return { facts, counts, nba, old, year, overall, pdfs, cads, images };
  }

  // ========== UI HELPERS ==========
  function chip(status) {
    const map = {
      declared: { c: T.warn, bg: T.warnBg, t: "ΔΗΛΩΘΗΚΕ" },
      needs_check: { c: T.warn, bg: T.warnBg, t: "ΠΡΟΣ ΕΛΕΓΧΟ" },
      missing: { c: T.bad, bg: T.badBg, t: "ΛΕΙΠΕΙ" },
      not_done: { c: T.bad, bg: T.badBg, t: "ΔΕΝ ΕΧΕΙ ΓΙΝΕΙ" },
      confirmed: { c: T.ok, bg: T.okBg, t: "ΕΠΙΒΕΒΑΙΩΜΕΝΟ" }
    };
    const s = map[status] || map.needs_check;
    return `<span style="display:inline-flex;align-items:center;gap:5px;padding:3px 7px;background:${s.bg};color:${s.c};font-size:10px;font-weight:700;white-space:nowrap">
      <span style="width:6px;height:6px;background:${s.c}"></span>${s.t}</span>`;
  }

  function titleBlock(title, status) {
    const map = {
      green: { c: T.ok, t: "ΣΩΣΤΗ ΠΟΡΕΙΑ" },
      red: { c: T.bad, t: "ΕΚΚΡΕΜΟΤΗΤΑ" },
      neutral: { c: T.muted, t: "ΝΕΑ ΥΠΟΘΕΣΗ" },
      yellow: { c: T.warn, t: "ΧΡΕΙΑΖΕΤΑΙ ΕΛΕΓΧΟ" }
    };
    const s = map[status] || map.yellow;
    return `<div style="display:grid;grid-template-columns:1fr auto;border-bottom:1px solid ${T.line};background:#FBFAF7">
      <div style="padding:10px 16px;border-right:1px solid ${T.line}">
        <div style="font-family:ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;font-size:10px;color:${T.muted}">Υπόθεση</div>
        <div style="font-weight:600;font-size:13px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${title}</div>
      </div>
      <div style="padding:10px 12px">
        <div style="font-family:ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;font-size:10px;color:${T.muted}">Κατάσταση</div>
        <div style="display:flex;align-items:center;gap:5px;margin-top:2px">
          <span style="width:7px;height:7px;background:${s.c}"></span>
          <span style="font-size:10px;font-weight:700;color:${s.c}">${s.t}</span>
        </div>
      </div>
    </div>`;
  }

  // ========== SCREENS ==========
  function render() {
    const root = document.getElementById("root");
    if (screen === "home") root.innerHTML = renderHome();
    else if (screen === "new") root.innerHTML = renderNew();
    else if (screen === "questions") root.innerHTML = renderQuestions();
    else if (screen === "files") root.innerHTML = renderFiles();
    else if (screen === "folder") root.innerHTML = renderFolder();
    else if (screen === "review") root.innerHTML = renderReview();
    bind();
  }

  function renderHome() {
    return `
      <div style="background:${T.navy};padding:36px 20px 28px">
        <div style="font-family:ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;font-size:10px;color:#9FB3CC">AI Senior Engineer</div>
        <h1 style="color:#F5F4EF;font-size:22px;font-weight:700;margin-top:8px">Καλώς ήρθες.</h1>
        <p style="color:#C3CEDD;font-size:14px;margin-top:10px;line-height:1.55">Οργάνωσε την υπόθεση.<br>Εντόπισε τα κενά.<br>Δες το επόμενο ασφαλές βήμα.</p>
      </div>
      <div style="flex:1;padding:20px;overflow:auto">
        <button data-go="new" style="width:100%;display:flex;align-items:center;gap:14px;padding:16px;border:1px solid ${T.navy};background:#fff;margin-bottom:20px">
          <div style="width:40px;height:40px;background:${T.navy};color:#F5F4EF;display:flex;align-items:center;justify-content:center;font-size:22px">+</div>
          <div style="text-align:left"><div style="font-weight:700;font-size:15px">Νέα υπόθεση</div><div style="font-size:12.5px;color:${T.muted};margin-top:2px">Ξεκίνα με τα βασικά</div></div>
        </button>
        <div style="font-family:ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;font-size:10px;color:${T.muted};margin-bottom:10px">Demo</div>
        <div style="padding:14px 16px;border:1px solid ${T.line};background:#fff;margin-bottom:8px">
          <div style="font-weight:700;font-size:13.5px">ΠΕΑ — Κατοικία Αιγάλεω</div>
          <div style="font-size:12px;color:${T.muted};margin-top:3px">Κτίριο 1972 · Μερικά στοιχεία λείπουν</div>
        </div>
      </div>`;
  }

  function renderNew() {
    const types = ["ΠΕΑ", "ΗΤΚ", "Αυθαίρετο", "Αυτοψία", "Τοπογραφικό"];
    const ok = caseData.customer.trim() && caseData.address.trim() && caseData.workType;
    return `
      ${titleBlock("— νέος φάκελος —", "neutral")}
      <div style="flex:1;padding:20px;overflow:auto">
        <button data-go="home" style="color:${T.muted};font-size:13px;font-weight:600;margin-bottom:8px">← Πίσω</button>
        <h2 style="font-size:18px;font-weight:700;margin-top:6px">Νέα τεχνική εργασία</h2>
        <p style="font-size:13px;color:${T.muted};margin:6px 0 18px">Ό,τι καταχωρείται θεωρείται αρχική δήλωση μέχρι να τεκμηριωθεί.</p>
        <div style="margin-bottom:14px">
          <div style="font-family:ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;font-size:10px;color:${T.muted}">Πελάτης</div>
          <input id="customer" value="${caseData.customer}" placeholder="Ονοματεπώνυμο" style="width:100%;margin-top:6px;padding:12px 14px;border:1px solid ${T.line};background:#fff;font-size:14px">
        </div>
        <div style="margin-bottom:14px">
          <div style="font-family:ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;font-size:10px;color:${T.muted}">Διεύθυνση / περιοχή</div>
          <input id="address" value="${caseData.address}" placeholder="Οδός, αριθμός, περιοχή" style="width:100%;margin-top:6px;padding:12px 14px;border:1px solid ${T.line};background:#fff;font-size:14px">
        </div>
        <div style="font-family:ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;font-size:10px;color:${T.muted}">Τύπος εργασίας</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
          ${types.map(t => `<button data-type="${t}" style="padding:12px 8px;border:1px solid ${caseData.workType===t?T.navy:T.line};background:${caseData.workType===t?T.navy:"#fff"};color:${caseData.workType===t?"#F5F4EF":T.ink};font-weight:600;font-size:13px">${t}</button>`).join("")}
        </div>
      </div>
      <div style="padding:16px;border-top:1px solid ${T.line};background:#FBFAF7">
        <button data-go="questions" ${ok?"":"disabled"} style="width:100%;padding:14px;background:${ok?T.navy:"#C9C4B6"};color:#F5F4EF;font-weight:600;font-size:14px">Συνέχεια →</button>
      </div>`;
  }

  function renderQuestions() {
    const qs = getQuestions(caseData.workType);
    const q = qs[qIndex];
    const val = (answers[q.id] || "").trim();
    const yearError = q.id === "year" && val && !/^\d{4}$/.test(val);

    return `
      ${titleBlock(caseData.workType + " — " + caseData.address, "yellow")}
      <div style="flex:1;padding:20px;overflow:auto">
        <button data-back style="color:${T.muted};font-size:13px;font-weight:600;margin-bottom:8px">← Πίσω</button>
        <div style="display:flex;gap:3px;margin:14px 0 18px">
          ${qs.map((_, i) => `<div style="flex:1;height:3px;background:${i<=qIndex?T.navy:T.line}"></div>`).join("")}
        </div>
        <div style="font-family:ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;font-size:10px;color:${T.muted}">Ερώτηση ${qIndex+1} από ${qs.length}</div>
        <h2 style="font-size:17px;font-weight:700;margin-top:8px;line-height:1.35">${q.text}</h2>
        <div style="display:flex;gap:8px;padding:10px 12px;margin-top:12px;background:#EFEDE4;border-left:2px solid ${T.soft}">
          <span style="color:${T.soft};font-weight:700">?</span>
          <p style="font-size:12.5px;color:#454540;line-height:1.5">${q.why}</p>
        </div>
        <div style="margin-top:22px">
          ${q.type === "text" ? `
            <input id="ans" value="${answers[q.id]||""}" placeholder="${q.ph}" style="width:100%;padding:12px 14px;border:1px solid ${yearError?T.bad:T.line};background:#fff;font-size:15px">
            ${yearError ? `<p style="font-size:12px;color:${T.bad};margin-top:6px">Βάλε ένα έγκυρο έτος (π.χ. 1972)</p>` : ""}
          ` : `
            <div style="display:flex;flex-direction:column;gap:8px">
              ${q.opts.map(o => `<button data-opt="${o}" style="display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border:1px solid ${val===o?T.navy:T.line};background:${val===o?T.navy:"#fff"};color:${val===o?"#F5F4EF":T.ink};font-weight:600;font-size:14px">${o}${val===o?" ✓":""}</button>`).join("")}
            </div>
          `}
        </div>
      </div>
      <div style="padding:16px;border-top:1px solid ${T.line};background:#FBFAF7">
        <button data-next ${(!val || yearError) ? "disabled" : ""} style="width:100%;padding:14px;background:${(!val||yearError)?"#C9C4B6":T.navy};color:#F5F4EF;font-weight:600;font-size:14px">
          ${qIndex < qs.length-1 ? "Επόμενο →" : "Αρχεία & τεκμήρια →"}
        </button>
      </div>`;
  }

  function renderFiles() {
    const d = build();
    return `
      ${titleBlock(caseData.workType + " — " + caseData.address, d.overall)}
      <div style="flex:1;padding:20px;overflow:auto">
        <button data-go="questions" style="color:${T.muted};font-size:13px;font-weight:600;margin-bottom:8px">← Πίσω</button>
        <h2 style="font-size:18px;font-weight:700;margin-top:6px">Αρχεία & τεκμήρια</h2>
        <p style="font-size:13px;color:${T.muted};margin:4px 0 16px">Πρόσθεσε PDF, CAD ή φωτογραφίες. Τα αρχεία καταγράφονται ως δηλωμένα στοιχεία.</p>
        
        <div style="border:1px dashed ${T.line};padding:16px;background:#fff;margin-bottom:16px;text-align:center">
          <input type="file" id="fileInput" multiple accept=".pdf,.dwg,.dxf,.jpg,.jpeg,.png" style="font-size:13px">
          <p style="font-size:12px;color:${T.muted};margin-top:8px">PDF · DWG/DXF · JPG/PNG</p>
        </div>

        <div style="display:flex;gap:8px;margin-bottom:16px">
          <div style="flex:1;padding:10px;border:1px solid ${T.line};background:#FBFAF7;text-align:center;font-size:12px"><b>${d.pdfs}</b><br>PDF</div>
          <div style="flex:1;padding:10px;border:1px solid ${T.line};background:#FBFAF7;text-align:center;font-size:12px"><b>${d.cads}</b><br>CAD</div>
          <div style="flex:1;padding:10px;border:1px solid ${T.line};background:#FBFAF7;text-align:center;font-size:12px"><b>${d.images}</b><br>Εικόνες</div>
        </div>

        ${files.length === 0 ? `<div style="padding:12px;background:${T.warnBg};font-size:13px;color:#3E3323">Δεν έχει προστεθεί αρχείο ακόμα.</div>` : 
          files.map((f,i) => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid ${T.line};background:#fff;margin-bottom:6px">
              <div>
                <div style="font-weight:600;font-size:13px">${f.name}</div>
                <div style="font-size:11px;color:${T.muted}">${Math.round(f.size/1024)} KB</div>
              </div>
              <button data-remove="${i}" style="color:${T.muted};font-size:16px">×</button>
            </div>
          `).join("")
        }
      </div>
      <div style="padding:16px;border-top:1px solid ${T.line};background:#FBFAF7">
        <button data-go="folder" style="width:100%;padding:14px;background:${T.navy};color:#F5F4EF;font-weight:600;font-size:14px">Τεχνικός φάκελος →</button>
      </div>`;
  }

  function renderFolder() {
    const d = build();
    return `
      ${titleBlock(caseData.workType + " — " + caseData.address, d.overall)}
      <div style="flex:1;padding:20px;overflow:auto">
        <button data-go="files" style="color:${T.muted};font-size:13px;font-weight:600;margin-bottom:8px">← Πίσω</button>
        <h2 style="font-size:18px;font-weight:700;margin-top:6px">Τεχνικός φάκελος</h2>
        <p style="font-size:13px;color:${T.muted};margin:4px 0 16px">Κάθε στοιχείο έχει τιμή, πηγή και κατάσταση.</p>

        <div style="padding:14px;border:1px solid ${T.line};background:#FBFAF7;margin-bottom:16px">
          <div style="font-family:ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;font-size:10px;color:${T.muted};margin-bottom:8px">Κατάσταση στοιχείων</div>
          <div style="display:grid;grid-template-columns:1fr auto;gap:5px 16px;font-size:13.5px">
            <span>Δηλωμένα</span><strong>${d.counts.declared}/${d.counts.total}</strong>
            <span>Προς έλεγχο</span><strong>${d.counts.needs}/${d.counts.total}</strong>
            <span>Λείπουν</span><strong style="color:${T.bad}">${d.counts.missing}/${d.counts.total}</strong>
            <span>Δεν έχουν γίνει</span><strong style="color:${T.bad}">${d.counts.notDone}/${d.counts.total}</strong>
          </div>
        </div>

        ${d.facts.map(f => `
          <div style="padding:12px 14px;border:1px solid ${T.line};background:#fff;margin-bottom:8px">
            <div style="display:flex;justify-content:space-between;gap:12px">
              <div>
                <div style="font-weight:700;font-size:13.5px">${f.name}</div>
                <div style="font-size:13px;margin-top:2px">${f.value}</div>
                <div style="font-size:11.5px;color:${T.muted};margin-top:3px">Πηγή: ${f.source}</div>
              </div>
              ${chip(f.status)}
            </div>
          </div>
        `).join("")}
      </div>
      <div style="padding:16px;border-top:1px solid ${T.line};background:#FBFAF7">
        <button data-go="review" style="width:100%;padding:14px;background:${T.navy};color:#F5F4EF;font-weight:600;font-size:14px">Senior Review →</button>
      </div>`;
  }

  function renderReview() {
    const d = build();
    return `
      ${titleBlock(caseData.workType + " — " + caseData.address, d.overall)}
      <div style="flex:1;padding:20px;overflow:auto">
        <button data-go="folder" style="color:${T.muted};font-size:13px;font-weight:600;margin-bottom:8px">← Πίσω</button>
        <h2 style="font-size:18px;font-weight:700;margin-top:6px">Senior Review</h2>
        <p style="font-size:13px;color:${T.muted};margin:4px 0 16px">Δεν γίνεται βαθμολογία. Εμφανίζονται τα κενά και το επόμενο ασφαλές βήμα.</p>

        <div style="padding:16px;border:1px solid ${T.navy};background:${T.info};margin-bottom:16px">
          <div style="font-family:ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;font-size:10px;color:${T.navy};margin-bottom:8px">ΕΠΟΜΕΝΟ ΚΡΙΣΙΜΟ ΒΗΜΑ</div>
          <div style="font-size:15px;font-weight:700;line-height:1.35;margin-bottom:10px">${d.nba.title}</div>
          <div style="font-size:13px;color:#3A4555">
            <div style="font-weight:600;margin-bottom:4px">Γιατί;</div>
            <ul style="padding-left:18px;margin:0">
              ${d.nba.reasons.map(r => `<li style="margin-bottom:4px">${r}</li>`).join("")}
            </ul>
          </div>
        </div>

        <div style="padding:14px;border:1px solid ${T.line};background:#FBFAF7;margin-bottom:16px">
          <div style="font-family:ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;font-size:10px;color:${T.muted};margin-bottom:8px">Σύνοψη</div>
          <div style="display:grid;grid-template-columns:1fr auto;gap:5px 16px;font-size:13.5px">
            <span>Δηλωμένα</span><strong>${d.counts.declared}/${d.counts.total}</strong>
            <span>Προς έλεγχο</span><strong>${d.counts.needs}/${d.counts.total}</strong>
            <span>Λείπουν</span><strong style="color:${T.bad}">${d.counts.missing}/${d.counts.total}</strong>
            <span>Δεν έχουν γίνει</span><strong style="color:${T.bad}">${d.counts.notDone}/${d.counts.total}</strong>
          </div>
        </div>

        ${d.old ? `
          <div style="display:flex;gap:10px;padding:12px;background:${T.warnBg};margin-bottom:16px">
            <span style="color:${T.warn};font-weight:700">!</span>
            <div>
              <div style="font-size:12px;font-weight:700;color:${T.warn};margin-bottom:3px">Σημείο προσοχής</div>
              <p style="font-size:12.5px;color:#3E3323;line-height:1.45">Κτίριο του ${d.year}. Απαιτείται ιδιαίτερος έλεγχος τοιχοποιίας και υγρασίας.</p>
            </div>
          </div>
        ` : ""}

        <div style="padding:14px;border:1px solid ${T.navy};background:${T.info}">
          <p style="font-size:13.5px;font-style:italic;line-height:1.55">«Αυτά γνωρίζουμε. Αυτά δεν γνωρίζουμε. Αυτά χρειάζονται απόδειξη. Αυτό είναι το επόμενο ασφαλές βήμα.»</p>
        </div>
      </div>
      <div style="padding:16px;border-top:1px solid ${T.line};background:#FBFAF7;display:flex;gap:8px">
        <button data-restart style="padding:14px 18px;border:1px solid ${T.line};color:${T.muted}">↺ Νέα</button>
        <button data-go="home" style="flex:1;padding:14px;background:${T.navy};color:#F5F4EF;font-weight:600">Home</button>
      </div>`;
  }

  // ========== BIND ==========
  function bind() {
    document.querySelectorAll("[data-go]").forEach(btn => {
      btn.onclick = () => {
        const target = btn.dataset.go;
        if (target === "questions") qIndex = 0;
        screen = target;
        render();
      };
    });

    document.querySelectorAll("[data-type]").forEach(btn => {
      btn.onclick = () => {
        caseData.workType = btn.dataset.type;
        render();
      };
    });

    const cust = document.getElementById("customer");
    if (cust) cust.oninput = e => { caseData.customer = e.target.value; };

    const addr = document.getElementById("address");
    if (addr) addr.oninput = e => { caseData.address = e.target.value; };

    const ans = document.getElementById("ans");
    if (ans) ans.oninput = e => { answers[getQuestions(caseData.workType)[qIndex].id] = e.target.value; };

    document.querySelectorAll("[data-opt]").forEach(btn => {
      btn.onclick = () => {
        answers[getQuestions(caseData.workType)[qIndex].id] = btn.dataset.opt;
        render();
      };
    });

    const nextBtn = document.querySelector("[data-next]");
    if (nextBtn) {
      nextBtn.onclick = () => {
        const qs = getQuestions(caseData.workType);
        if (qIndex < qs.length - 1) {
          qIndex++;
          render();
        } else {
          screen = "files";
          render();
        }
      };
    }

    const backBtn = document.querySelector("[data-back]");
    if (backBtn) {
      backBtn.onclick = () => {
        if (qIndex > 0) {
          qIndex--;
          render();
        } else {
          screen = "new";
          render();
        }
      };
    }

    const fileInput = document.getElementById("fileInput");
    if (fileInput) {
      fileInput.onchange = e => {
        files = [...files, ...Array.from(e.target.files || [])];
        render();
      };
    }

    document.querySelectorAll("[data-remove]").forEach(btn => {
      btn.onclick = () => {
        files.splice(+btn.dataset.remove, 1);
        render();
      };
    });

    const restart = document.querySelector("[data-restart]");
    if (restart) {
      restart.onclick = () => {
        screen = "home";
        caseData = { customer: "", address: "", workType: "" };
        answers = {};
        files = [];
        qIndex = 0;
        render();
      };
    }
  }

  render();
})();
</script>
</body>
</html>
